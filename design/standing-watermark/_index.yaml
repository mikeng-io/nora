---
type: design_index
title: "Standing Watermark — event-driven roll, not a window"
description: >
  Standing currently folds the LAST 40 rows of a conversation (the reply
  path's window). If a conversation exceeds 40 messages between tags, the
  middle is lost — the position cannot inherit context it never saw. This
  bundle replaces the window read with a row-id watermark: every fold reads
  `since(last_folded_row_id)`, capped at 200, and the fold is triggered
  EVENT-DRIVEN from the ingest path (every message, tagged or not), not by a
  background loop. Cold start rolls up: repeated folds of 200 until caught
  up, each fold's position carrying the previous one forward.
status: proposed
governance: pre-governance-input
timestamp: '2026-09-01'
origin: >
  Operator observation 2026-08-31: a conversation with 60/80/100 messages
  and no tag in between loses all context past the 40-row window. Standing
  must be a watermark that picks up the untagged conversation, not a window
  that clips it. Operator decisions: event-driven check on message arrival
  (no background loop); cap 200; cold start rolls up in batches; new read
  including Nora's own rows; watermark column on the standing row.
