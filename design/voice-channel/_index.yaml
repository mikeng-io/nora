kind: design_index
title: "Voice Channel — TTS, Ducking & Wake Word"
description: >
  Nora speaks into a Discord voice channel in Cantonese (MiniMax CN,
  speech-2.8-turbo, Cantonese_CuteGirl) and ducks the music underneath her while
  she talks (the Siri behaviour).
  landable stages: TTS playback with an explicit mix/duck, voice-channel
  receive, then a trained Cantonese wake word gating that receive. TTS is
  built first because it is the only stage that needs neither a receive path
  nor a model; the wake word is last because it is the only stage carrying an
  unresolved acoustic question. All of it rides existing ports — a `Speaker`
  port mirroring `Transcriber`, and a `DuckSource` generalising the
  already-shipped `CrossfadeSource` mixing mechanic.
status: proposed
governance: pre-governance-input
timestamp: '2026-09-14'
origin: "brainstorming session with miles, 2026-09-14 (thread: Discord music bot → Siri-style voice control)"
