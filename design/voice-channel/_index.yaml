scope:
  v1:
    - "Nora speaks a turn's answer into the voice channel as Cantonese TTS (MiniMax CN, speech-2.8-turbo, Cantonese_CuteGirl)"
    - "Music under the voice ducks to a configurable gain for the duration of speech, then restores"
    - "`Speaker` port in domain/ports.py mirroring `Transcriber`; `SpeakResult` fail-closed like `SttResult`"
    - "`MiniMaxTtsSpeaker` in infra/, wired in app/composition.py, gated on `[speech.tts].enabled`"
    - "`DuckSource` generalising CrossfadeSource's two-source mixing to attenuate-and-restore"
    - "Voice-channel receive (discord.py sink) turning speech into text — the wake word's prerequisite"
  deferred:
    - "Wake word itself (stage 3) — the model is not trained and the synthetic-to-real gap is unmeasured"
    - "Live STT of arbitrary voice-channel speech (path C) — REJECTED by Miles 2026-09-14, do not re-propose"
    - "Barge-in / interrupting Nora mid-sentence"
    - "Local (non-cloud) TTS provider"
    - "Per-speaker voice selection / voice cloning"
