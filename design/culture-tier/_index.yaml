open_questions:
  - "OPERATOR — DEC-181: the key. `room_portrait` used `scope_id`, `note` uses `workspace`, `standing` uses `(platform, conversation_id)`. Three keys for three tiers is what #202 already cost once. This must be settled before the first line of code, not after"
  - "OPERATOR — whether `standing` is repaired in place or superseded. This bundle says repaired, separately, and does not do it"
  - "UNMEASURED — whether a cheap model at `reasoning_effort = none` can reliably emit the three-section body at all. Three sections is a guess at its ceiling, not a reading"
  - "UNMEASURED — the whole of 02-measurement. Every threshold in it is a placeholder until the gate's verdicts are attributable to a room, which today they are not"
  - "PHASE 2 — 04-phase-two-note is deliberately not executable. It waits on Phase 1's instruments"
