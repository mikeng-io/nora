kind: design_index
title: "The Culture Tier — a Dreamer adaptor that synthesises an account of a room across the stores Nora already holds"
description: >
  The Relevance Gate admitted one window in 149 over four days. It is not
  mistuned: it is a reasoning-less classifier holding a taxonomy where the room
  needed a baseline. The layer that would supply one is an account of how a
  room works and why — which is what you get by asking a model to write prose
  over a room's own messages, and NOT a property of any memory endpoint: Honcho
  does not scope at the layer this needs (00-overview §4, DEC-182). So the tier
  is a Dreamer adaptor that writes the account itself, once a day, keeps every
  answer, and lets the chain of answers be the evolution a single call cannot
  express. NARROWED 2026-09-17: DEC-182 killed the CACHE shape, not the use of
  memory — the batch the runtime hands it is ONE input among several, beside
  the account written last time, the room's `standing`, what the room has open,
  and what memory holds about the people in it (01-the-adaptor §1.2). The
  bundle also states a measurement for "act" that is not a model agreeing with
  its own instruction.
status: proposed
origin: >
  Working session with miles, 2026-09-12/13, opened by a finding written against
  Ora's copy of `participation.md`. Three corrections shaped the result: the
  operator caught the first draft re-inventing the memory system at room and
  workspace scope; caught it importing `standing`'s retirement lifecycle into a
  thing that evolves rather than sunsets; and named the distinction the whole
  design turns on - a chronicle of what happened is not a culture. A live probe
  then falsified the first draft's own headline numbers. Every measurement in
  00-overview was read off norty; the Honcho behaviour in section 4 was probed
  against the live instance, not read from docs. Tree at 434282db.
