kind: design_index
title: "The Culture Tier — what is normally true in a room, and where she stands in it"
description: >
  The Relevance Gate has judged 35 quiet windows in production and admitted
  zero. Not one. It is not mistuned: it is a reasoning-less classifier being
  asked a question its input cannot ground, holding a taxonomy of five shapes
  where the room needed a baseline. This bundle names the layer that is
  missing between `standing` (volatile, per-turn, keeps nothing) and Honcho
  (accurate, per-person, unaffordable per window): a slow, per-room and
  per-workspace record of what is normally true here and where she stands in
  it. It also states, for the first time, a measurement for "act" that is not
  a model agreeing with its own instruction.
status: proposed
origin: >
  Working session with miles, 2026-09-12, opened by a finding written against
  Ora's copy of `participation.md` and closed somewhere else entirely. Every
  number in 00-overview §1 was read live off norty during that session —
  Prometheus counters, `decision_log`, `note`, `standing`, `room_portrait` and
  `config.toml`. The operator's framing is the spine of the bundle: you cannot
  define when Nora should intervene, so stop trying to; give her the baseline
  and let the deviation speak. Grounded on reads of the tree at 434282db.
