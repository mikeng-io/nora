governance:
  reviewed_by: >
    Three adversarial Opus reviews of the FIRST draft, 2026-09-12 - architecture,
    measurement and data model. The measurement review falsified 00-overview's
    headline numbers and was right; most of the data-model findings are moot
    because the schema they attacked is deleted. The architecture review's
    central finding (a third block is forbidden) was itself wrong and is
    recorded as correction 3 in 03-decisions. THIS revision has had no review.
  measured: >
    00-overview sections 1 and 4 are measurement, read off the live deploy and the
    live Honcho instance 2026-09-12/13. Everything else is design and is NOT
    measured. **Those readings are now historical**: #215, #261 and #262 all
    landed against the participation path after them, so nothing here is a
    current reading of production and re-taking the baseline is step 0 of
    implementation.
  synced_with: >
    The #219/#220 block-abstraction session, 2026-09-13 - it owns the block
    vocabulary, corrected this bundle's cache reasoning, and confirmed the row
    renderer does not open the gate's block set. Its `BlockKey` field was added
    in response to this bundle's cache question.
open_questions:
  - "WITHDRAWN 2026-09-13 - DEC-181 was not a choice. The key follows from which scheduler hands it: Dreamer-written stores key primary_id, ingest/tag-written stores key (platform, conversation_id). GLOSSARY carries the rule (PR #230); the latent divergence is #229"
  - "OPERATOR - whether `standing` is repaired (#222) or superseded. HOLDING's second arm depends on it and does not compute today. STILL OPEN 2026-09-16"
  - "OPERATOR - which consumer the decision check is spent on, and at what scope. It is affordable ONCE; the price is in 02-measurement section 6 and ranges 1.5h to ~36h of live calls depending on the suite"
  - "UNMEASURED - whether the gate should ever read culture. Owned by the gate, sequenced last, with #144/#147 and #216 as evidence against assuming it"
  - "UNMEASURED - every threshold in 02-measurement. None can be measured until the gate metric carries a conversation_id, which is this bundle's own step 1 (was #221, folded in). NOT BUILT as of 2026-09-16: metric_specs.py still declares nora_relevance_gate_total with labels (verdict, platform)"
  - "CORRECTED 2026-09-16 - an earlier version of this line said the decision check needs n=20 per arm and is affordable as a ship gate. Both halves are wrong; see 02-measurement section 6 and correction 8. Power at n=20/arm is 0.14-0.18 for a 0.20 difference, 80% needs ~86, and the price was quoted for 5 cases when the check is specified over a suite"
  - "STALE - EVERY live number in this bundle predates three changes that landed against this exact path: #215 (memory reaches the participation turn, 2026-09-15), #262 (R-97, 2026-09-16), #261 (the gate's own timeout ceiling, 2026-09-16). The admission rate, the 4-of-5 false-speak reading and the once-ever turn count must all be re-taken before any of them is quoted as current"
  - "CLOSED 2026-09-16 - #216 (PR #262, R-97) and #210 (PR #215). Both were cited here as open; both are marked in place. Neither was re-measured"
  - "SETTLED 2026-09-13 - the block is `placement=turn`, `key=room`. #219/#220 added `key` after this bundle asked the question; the rule it encodes is that anything keyed narrower than `global` belongs in `turn`, whatever its cadence"
  - "PHASE 2 - 04-phase-two-note is not executable and waits on Phase 1's instruments. Its #210 dependency landed 2026-09-15 and is unobserved in production"
  - "DECIDED 2026-09-17 - 00-overview §4.2's operator question is taken: synthesise across the stores, INCLUDING memory. Per-room Honcho workspaces stay unrouted; DEC-182 is narrowed to the cache shape it actually killed"
  - "OPEN 2026-09-17 - whether `standing` and the note index reach the fold as rendered INPUTS (the `note_candidates` precedent, no grant) or as TOOLS through an `AdaptorGrant` (correction 14). Inputs first; 01-the-adaptor §1.2 carries the sequencing and 02-measurement §5 owns the order"
  - "NOT WIRED 2026-09-17 - `AdaptorGrant.home_room` resolves through `home_rooms[workspace]` and the runtime passes `workspace=None` for a scope-keyed adaptor, so a home-room grant for culture takes the loud closed branch today. The mechanism exists; the scope-keyed resolution does not. Correction 14"
  - "STALE 2026-09-17 - `nora/language/culture.py`'s module docstring still says the tier `asks nothing of the memory system (DEC-182)`, which is the pre-narrowing reading. Design-only change; the docstring is not touched here"
