scope:
  v1:
    - "Delete ToolRegistry.capability() and its render helpers (live_only_tools, web_tier_tools)"
    - "Delete the `when` field from NativeTool/ToolSpec (no consumer remains after capability() dies)"
    - "Remove `kind: capability` from the doctrine tier order (DERIVED_KINDS, AUTHORITY_TERMINALS, constraints.md/identity.md/conduct.md authority chains)"
    - "Move the closed-world rule and the sourcing nudge into conduct.md as behavioural rules"
    - "Merge the 2-3 genuinely incremental when-clauses into their docstrings (recall_lookups doubted/guessed trigger, create_event genuinely-NEW)"
    - "Update every test that pins capability content (test_tool_registry, test_reminder_tools, test_prefill, test_doctrine_loader, test_config)"
  deferred:
    - "A future MCP tool (spec §7/§11) whose schema cannot carry a docstring — out of scope until it lands"
    - "Re-measuring prompt size after the change (expected saving ~1.2-1.6k tokens of when-clauses; the two moved rules cost a few hundred)"
