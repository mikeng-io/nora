kind: design_index
title: "The Ambient Loop — Nora's Second Backbone"
description: >
  Nora has two backbones. The tag path answers when she is called. The ambient
  loop is how she is present when she is not: one observe–orient–decide–act
  loop whose stages are the ingest path, the memory layer, two deciders
  (participation and proactive) and the shared fire path. The loop already
  exists in the tree and had only ever been named as the proactive adaptor's;
  four components each correct on their own terms failed at their seams, and no
  suite could see it. This bundle names the loop as the system's, writes the
  contract on each seam, states the one save/don't-save rule all stages share,
  and lists the six cross-stage cases that do not exist.
status: proposal
origin: >
  Working session with miles, 2026-09-11, after a day of merging and re-verifying
  every open issue against the tree. Three issues the operator was asked to
  decide (#161, #186, #173) turned out to be three seams of one loop, and the
  operator's framing — participation mode, the proactive adaptor, the note tier
  and the memory layer are four parts that must lubricate each other, and today
  each is 各自為政 — is what this bundle writes down. Grounded on reads of the
  code at 0a5933b4 and on the 2026-09-11 gate-transport measurement.
