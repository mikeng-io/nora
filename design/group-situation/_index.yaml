title: "Group situation: Nora reasons with where the room is, unasked"
description: >
  A planning reply treated the district most of the room lives in as a detour.
  The members' usual places were derived and one tool call away; the turn's
  input carried a place for the caller only. Step 1 of three: render the room's
  usual places into the tag turn, measured by replaying recorded planning turns
  with and without the block. Steps 2 (place identity, then the time-anchored
  forecast) and 3 (a proactive pass that wakes on time anchors and world
  changes) follow in their own nodes.
