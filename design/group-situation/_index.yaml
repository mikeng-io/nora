title: "Group situation: Nora reasons with where the room is, unasked"
description: >
  A planning reply framed one district as a detour when it was not one for
  this group. The members' usual places were derived and one tool call away; the
  turn's input carried a place for the caller only, and the afternoon plan had
  fallen out of the room's Standing three minutes earlier. Step 1 of three:
  render the room's usual places into the tag turn, measured by replaying
  recorded planning turns with and without the block. Result: no effect
  detected; not built. Steps 2 (place identity, then the time-anchored
  forecast) and 3 (a proactive pass that wakes on time anchors and world
  changes) follow in their own nodes.
