scope:
  v1:
    - "EditTarget on NormalizedMessage, emitted by all four parsers"
    - "message_edit table; messages.platform_message_id (backfilled) and messages.mentions_json"
    - "fold in recent/since: latest body at the original position, TranscriptRow.edit = (ts, was, raw_json)"
    - "edited/was attributes on the m element; group_transcript describes them"
    - "Honcho: a framed correction under the speaker's peer"
    - "engage only when the edit newly addresses Nora"
  not_in_scope:
    - "deletes/unsends (operator, 2026-09-23)"
    - "re-answering an edited question already answered (operator, 2026-09-23)"
    - "relinking edits already stored as their own rows"
