kind: design_index
title: "Message Edits — one edit event, recorded beside its original, folded at read"
description: >
  A member can edit a message on all four networks. Before this bundle Signal
  and WhatsApp ingested an edit as an unlinked new row (a duplicate the model
  could not tell from a repetition, and a fresh tag), and Instagram and Discord
  dropped it. Every parser now emits one edit shape; ingest records it in a
  message_edit table pointing at its original; recent()/since() fold the latest
  text onto the original's position with when it changed and what it first
  said; Honcho is fed a framed correction; and an edit opens a turn only when it
  newly addresses Nora.
status: built
governance: draft
timestamp: '2026-09-23'
origin: >
  operator session 2026-09-23 — «one of the things we didn't capture is the
  edit … how exactly do we reflect or update that back to Nora, like in either
  honcho or the transcript?»; recommendation accepted the same day («yes»).
