kind: design_index
title: "Media Read Lane — parallel chunks, audible video, a third provider, and the timeout that was already too small"
description: >
  Four changes to how Nora reads video and audio, decided together because they
  interact: chunk reads become concurrent, the video path stops discarding the
  audio track, a third describer provider (OpenCode Go, direct) is added for
  MiMo v2.6 Flash, and the derived per-call vision budget is raised because
  measured video latency already exceeds it. Operator directive 2026-09-22:
  «四個同步做» — do all four in one change, and «audio 亦都 enable 佢啦，直接
  啟動佢 override 之前個 decision».
status: proposed
governance: pre-governance-input
timestamp: '2026-09-22'
revision: 'unreleased — bundle drafted from the 2026-09-22 benchmark; adversarial review not yet dispatched.'
origin: "operator session 2026-09-22 — Miles challenged a router-based benchmark («are you bypassing omniroute?»), which invalidated the first verdict and produced the corrected measurement set this bundle is built on. Measurements + raw JSON: ~/workspace/nora-bench/."
