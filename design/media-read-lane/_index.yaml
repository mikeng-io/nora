kind: design_index
title: "Media Read Lane — parallel chunks, audible video, a third provider, and the timeout that was already too small"
description: >
  Four changes to how Nora reads video and audio, decided together because they
  interact: chunk reads become concurrent, the video path stops discarding the
  audio track, a third describer provider (OpenCode Go, direct) is added for
  MiMo v2.6 Flash, and the derived per-call vision budget is raised because
  measured video latency already exceeds it. Operator directive 2026-09-22:
  «四個同步做» — do all four in one change, and «audio 亦都 enable 佢啦，直接
  啟動佢 override 之前個 decision».
status: proposed
governance: pre-governance-input
timestamp: '2026-09-22'
revision: '2026-09-23 — SETTLED after the timeout measurement closed: vision_timeout_seconds → 120, [llm].timeout_seconds 240 → 360, media_fetch budget HELD at 4 (04 §3c). The earlier budget 4 → 3 recommendation is withdrawn: the budget counts MEDIA, not model calls, and lowering it makes a four-video post unreadable — the exact defect this bundle removes. The egress blocker was PARKED by operator direction (findings: ~/workspace/nora-bench/spikes/pii-layer/), and the concurrent-tool-use question was answered by design/tool-concurrency/ (DEC-196). || 2026-09-22 — adversarial review round 1 dispatched (Codex CLI, read-only) and returned REQUEST CHANGES: 2 BLOCKING, 5 MAJOR, 3 MINOR. All findings addressed in place with the original text retained so the correction is visible. Substantive corrections: the timeout proof was over model calls rather than tool invocations (04 §3a); the recommended 48 s sits below this bundle''s own measured latencies and the 90 s production window was never measured (04 §3b); the egress blocker had the wrong question — the screen runs, but egress.py deliberately skips bare digit runs, and DEC-114 clause (3) is a SAFETY decision the bundle had mislabelled as scope (02 §5, 05 §2); there are TWO prompt families and the automatic one is where Instagram media is read (02 §6); already-comprehended media is never re-read (02 §8); a pre-existing coverage defect where a middle gap is described as "watched the first N" (01 §5a); a per-read semaphore bounds nothing across the 4 concurrent ingest jobs (01 §3); and create_client has no header seam for the mandatory session header (03 §3). Measurement obligations added as a first-class section (05 §4).'
origin: "operator session 2026-09-22 — Miles challenged a router-based benchmark («are you bypassing omniroute?»), which invalidated the first verdict and produced the corrected measurement set this bundle is built on. Measurements + raw JSON: ~/workspace/nora-bench/."
