scope:
  v1:
    - "Chunk reads run concurrently (`asyncio.gather`) instead of a sequential for-loop, with order preserved"
    - "The video path keeps its audio track; `-an` is removed for the describer lane"
    - "`[media.describe.audio]` enabled — the previous «no verbatim transcript» decision is overridden by operator direction"
    - "A third describer provider `\"opencode-go\"`: direct client to zen/go/v1, mandatory `x-opencode-session` header"
    - "`[media.describe.video]` model → MiMo v2.6 Flash; `vision_max_tokens` 1024 → 4096"
    - "Per-call vision budget raised where it binds and the loop raised with it: `vision_timeout_seconds` → 120, `[llm].timeout_seconds` 240 → 360, `media_fetch` budget **stays 4** (operator 2026-09-23 — lowering it would break the four-videos-in-one-post case; see 04 §3c)"
    - "⛔ **BLOCKED IN EFFECT (2026-09-23)** — independent review round 2 found these settled settings do NOT take effect as stated: `derive_vision_timeout` still caps the configured 120 at **54 s** (B1), and the numbers do not compose against the 360 s loop (4 × 3 waves × 120 s = 1,440 s), where the loop firing causes SILENT turn death via `invoke.py:171-179` (B2). Operator decision needed on the derivation + the loop product. See `06-review-round-2.md`."
    - "Audio/video prompt reworked so verbatim speech is IN SCOPE, with the egress screen still applying"
  deferred:
    - "Concurrent `media_fetch` tool calls inside one agent turn — **ANSWERED as of 2026-09-23: they DO parallelise, and already have** (seven real batches with 2–3 media reads in one model turn, Langfuse). The ceiling on how many run at once is **design/tool-concurrency/ (DEC-196)**, not this bundle — but note DEC-196 **queues** rather than refuses, so it bounds concurrency, not wall-clock; it does NOT answer this bundle's latency-budget question (see 06-review-round-2 §M2)."
    - "Per-modality chunk geometry (audio-bearing clips may want a different chunk than silent ones)"
    - "Instagram Reels/Story retrieval itself — that is design/instagram-adoption/, not this bundle"
    - "Local/offline audio transcription — the shipped `stt` service is a separate lane (voice-note ingest)"
    - "Speaker diarisation or per-speaker identification"
