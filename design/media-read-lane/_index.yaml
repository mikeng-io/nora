scope:
  v1:
    - "Chunk reads run concurrently (`asyncio.gather`) instead of a sequential for-loop, with order preserved"
    - "The video path keeps its audio track; `-an` is removed for the describer lane"
    - "`[media.describe.audio]` enabled — the previous «no verbatim transcript» decision is overridden by operator direction"
    - "A third describer provider `\"opencode-go\"`: direct client to zen/go/v1, mandatory `x-opencode-session` header"
    - "`[media.describe.video]` model → MiMo v2.6 Flash; `vision_max_tokens` 1024 → 4096"
    - "Per-call vision budget raised: `media_fetch` budget 4 → 3, `vision_timeout_seconds` → 90 (derived 48 s)"
    - "Audio/video prompt reworked so verbatim speech is IN SCOPE, with the egress screen still applying"
  deferred:
    - "Concurrent `media_fetch` tool calls inside one agent turn (whether Strands parallelises multiple tool_use blocks is UNTESTED)"
    - "Per-modality chunk geometry (audio-bearing clips may want a different chunk than silent ones)"
    - "Instagram Reels/Story retrieval itself — that is design/instagram-adoption/, not this bundle"
    - "Local/offline audio transcription — the shipped `stt` service is a separate lane (voice-note ingest)"
    - "Speaker diarisation or per-speaker identification"
