# The composer's unit inventory (design/context-plan/14 §3, sequence step 2).
#
# Everything a tag turn's model input carries, as units. `floor: true` is never a
# decision; every other unit is decided per turn by the composer model.
# `tokens` is node 09's median first-call estimate (200 live tag turns,
# 2026-10-12 fit), or `~` where node 09 did not split it out; `present` is how
# often it rendered in those 200 when it is conditional today.
# `source` is where the text comes from. `cache` is the key the text varies on
# today (prefill.py `_BLOCKS`): a unit keyed `unit`/`room` is stable across a
# room's turns, `turn`/`person` changes per turn.
#
# Operator 2026-10-12: everything injected is selectable except one or two of
# the most critical doctrines; latency under 2 s, ideally under 1 s; accuracy
# first.

