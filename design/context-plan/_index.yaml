description: "A per-turn selection over the block table the context-assembly track already made declarative, evaluated against the repo. The measurement says the token lever is single-digit percent (doctrine is 72% of the prompt), the selector's own substrate costs more input tokens than the blocks it removes, and on this host every local decision model runs on CPU at 6-33s per plan while the JEV/Laya class the operator had in mind is not reachable through Ollama cloud or through OmniRoute."
