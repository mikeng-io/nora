kind: design_index
title: "Discord Integration — Bot Presence + Portal SSO"
description: >
  Discord as Nora's second platform: a DiscordAdapter giving her ambient+tag
  presence in explicitly allowlisted channels (parity with Signal), and Discord
  OAuth as the login mechanism for a future web portal, gated to people already
  known in identity.toml. First sub-project of a four-part portal initiative
  (Discord, PWA chat surface, STT/TTS, real-time map); this bundle covers only
  Discord. 1:1 DMs (Signal or Discord) are explicitly out of scope for v1.
status: design
governance: pre-governance-input
timestamp: '2026-08-14'
origin: "brainstorming session with miles, 2026-08-14"
members:
