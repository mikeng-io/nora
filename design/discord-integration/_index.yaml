scope:
  v1:
    - "Discord bot ambient+tag presence in explicitly allowlisted channels"
    - "Discord Gateway listener with RESUME + REST-history backfill resilience"
    - "policy.toml schema extension for platform-qualified rooms"
    - "Discord OAuth login gated to known identity.toml people"
    - "Separate portal auth service (aiohttp, shared Postgres)"
  deferred:
    - "Discord 1:1 DMs"
    - "Signal 1:1 DMs"
    - "Self-service identity provisioning (unknown Discord accounts)"
    - "Portal conversational chat UI (sub-project 2)"
    - "STT/TTS (sub-project 3)"
    - "Real-time WebSocket presence map (sub-project 4)"
    - "Signal SSE-replay-on-reconnect verification (pre-existing gap, unrelated follow-up)"
