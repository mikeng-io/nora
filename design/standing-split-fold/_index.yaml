kind: design_index
title: "Standing Split-Fold — Two Calls, One Position (issue #78 Phase 2)"
description: >
  The debrief fold currently produces standing revision and groundedness
  verdict from ONE model completion. The single completion makes the model
  write a position and then judge itself in the same breath — the structural
  source of both live symptoms: third-person recap rows (observer cast) and
  21/21 grounded=true (self-judgement bias). This bundle splits the fold into
  two parallel completions: Call A revises the standing position (first
  person), Call B judges the turn's sourcing (impartial, sees the whole turn
  including its own outcome). Latency does not increase — the calls are
  independent and run via asyncio.gather. The ratchet (keep-its-wording) and
  the consolidation tiebreak (room-said outranks synthesis) are re-tied so
  inherited third-person text cannot survive and position-shaped content wins.
status: proposed
governance: pre-governance-input
timestamp: '2026-08-29'
origin: >
  issue #78, operator directive 2026-08-29. Phase 1 (person contract) shipped
  at fe3301bd; the falsifier declared in DEC-149 fired on the first post-deploy
  fold — the row was still a third-person event list. Operator chose the
  trust-the-model practice: design-bundle -> implement + verify + audit.
