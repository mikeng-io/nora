kind: design_index
title: "Evaluation — one Nora, many inputs (a delete and rebuild, not a refactor)"
description: >
  Every component the eval layer builds is built SMALLER than production builds
  it, measured by AST over the call sites: FirePath 36 -> 21 (missing media_join,
  decisions, self_card_conclusions, people_in_window_*, tool_call_log_store and
  nine more), DreamerRuntime 12 -> 9 and 12 -> 11, RelevanceGate 9 -> 8 while
  ADDING capabilities that production deliberately dropped, RegistryToolSource
  11 -> 9, LiveAgentRunner 5 -> 4. Seven places build a Nora and none is
  build_dependencies, which is what the deployment runs. Nothing guards it:
  test_assembler_parity compares composition.py against offline.py, which both
  pass FirePath(36), so it is green while eval_support.py's FirePath(21) goes
  unwatched. Hence a DELETE and rebuild rather than a refactor — there is no
  target shape the current code is an imperfect version of. The boundary is
  clean-code/DDD: the eval layer depends on Nora, Nora depends on nothing in it,
  the eval layer assembles nothing, and a suite is cases. Step 0 can withdraw the
  whole bundle.
status: proposed
origin: >
  Operator session 2026-09-17, opened by one question — "your measurement, what
  is it actually measuring?" — after four sessions of measurement discipline had
  been applied to an instrument that did not bind to its subject. A first
  attempt at the requirement (PR #307) was written and withdrawn the same day
  after two adversarial Opus reviews; its failure is recorded in 00-overview §1
  because the shape of the failure is why this bundle is shaped differently. The
  operator's correction is the design: take Nora as she is, add the thing under
  test, and there is nothing left to assemble. Findings and the six properties
  any convention must satisfy are on #311. Tree at b3c21686.
