decisions:
  reserved: "NONE CLAIMED. No decision is taken by this bundle; 01-the-runner section 3 is the first one to make, and it is the operator's"
  index: null
governance:
  reviewed_by: >
    NOT REVIEWED. The prior attempt at this subject (PR #307) passed its own
    author's gate and was then refuted on two independent adversarial reviews,
    so an unreviewed state is worth naming loudly here rather than assumed.
  measured: >
    00-overview section 2 and 01-the-runner sections 1-2 are measurement, read
    off the tree at b3c21686 — the eight driver functions and their line
    numbers, the five composition sites, the ~90 build_dependencies calls in
    tests/test_composition.py, and the import boundary in
    tests/test_boundaries.py. Everything else is design and is NOT measured.
    In particular the claim that every driver difference is expressible as an
    entry point plus input (00-overview section 3) is ASSERTED and is the thing
    to attack.
  synced_with: >
    #292 (the prompt-assembly session) — its injector work is validated by a
    corpus that strips the framing it is about, which is this bundle's problem
    seen from the other side. #311 carries the findings.
open_questions:
  - "OPERATOR — 01-the-runner section 3: move the integration harness into nora.testing (A), widen the evals import boundary (B), or keep two builders behind a full parity gate (C). A matches the bundle's sentence; its cost is unsized"
  - "UNSIZED and it gates everything — how much of tests/integration/harness.py can move into nora.testing without dragging pytest-only machinery with it. 01-the-runner section 6 says size this before building anything"
  - "ASSERTED, NOT DECIDED — that relevance_gate fits as an entry point rather than a special case (00-overview section 4.1). If it does not, the shape is refuted; it is the cleanest instrument in the repo and a taxonomy that cannot hold it is wrong"
  - "OPEN — what happens to the four reconstruction suites. Rebuilt on the runner, kept under an honest name as doctrine-wording probes, or deleted. A cheap probe has a use; a probe whose number reads like production does not"
  - "OPEN — where the model sits. It is substituted routinely (--model, --effort, _ALWAYS_SENDS) and appeared on neither list in the withdrawn attempt. Presumably part of the subject with the override as declared input, but that is asserted"
  - "OPEN — absorption order. relevance_gate is closest to the shape, adversarial is furthest. The test that the bundle is working is that every absorbed driver DELETES a _run_* function; if the count does not fall, the runner became a ninth builder"
  - "NOT IN THIS BUNDLE — the convention itself. 00-overview section 7: build the runner, absorb the drivers, write the convention LAST describing what exists. A convention written first describes eight variations and legitimises them, which is the mistake already made once"
