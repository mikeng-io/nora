kind: design_index
title: "Evaluation — one Nora, one runner, a suite is input"
description: >
  Eight bespoke drivers each compose their own subject, and one of them drifted
  into a bare model on doctrine text with no prefill, no framing, no tools and
  no guards — reported as her behaviour for as long as it existed. The drift is
  the symptom: nothing contradicted it because there was no shared subject to
  contradict it with. This bundle proposes the inverse of the requirement
  document withdrawn on 2026-09-17 (PR #307): not a list of seams a suite may
  substitute, but a shape in which a suite substitutes nothing. Build Nora once;
  a suite is input, an expectation, and which entry point the input enters at.
  01-the-runner answers the first open question with a measurement — the
  production composition root IS drivable (`tests/test_composition.py` calls it
  ~90 times) and the second builder exists because of an import rule, not a
  technical limit.
status: proposed
origin: >
  Operator session 2026-09-17, opened by one question — "your measurement, what
  is it actually measuring?" — after four sessions of measurement discipline had
  been applied to an instrument that did not bind to its subject. A first
  attempt at the requirement (PR #307) was written and withdrawn the same day
  after two adversarial Opus reviews; its failure is recorded in 00-overview §1
  because the shape of the failure is why this bundle is shaped differently. The
  operator's correction is the design: take Nora as she is, add the thing under
  test, and there is nothing left to assemble. Findings and the six properties
  any convention must satisfy are on #311. Tree at b3c21686.
members:
