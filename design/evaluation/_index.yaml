governance:
  reviewed_by: >
    NOT REVIEWED. The prior attempt at this subject (PR #307) passed its own
    author's gate and was then refuted on two independent adversarial reviews,
    so an unreviewed state is worth naming loudly here rather than assumed.
  measured: >
    00-overview section 2 and 00-overview section 1 and 01-boundaries section 4 are measurement, read
    off the tree at b3c21686 — the eight driver functions and their line
    numbers, the seven composition sites, the ~90 build_dependencies calls in
    tests/test_composition.py, and the import boundary in
    tests/test_boundaries.py. Everything else is design and is NOT measured.
    In particular the claim that every driver difference is expressible as an
    entry point plus input (01-boundaries sections 2 and 3.1) is ASSERTED and is the thing
    to attack.
  synced_with: >
    #292 (the prompt-assembly session) — its injector work is validated by a
    corpus that strips the framing it is about, which is this bundle's problem
    seen from the other side. #311 carries the findings.
open_questions:
  - "STEP 0 — RUN 2026-09-17, refutation did NOT fire (03-step0-results). RelevanceGate: 539 vs 559 bytes, eval loses the canonical name and the media description, an image-only message reads as an empty body and its row is dropped. FirePath: three prompt blocks empty or absent from three ints defaulting to 0, and <people_in_window> is not rendered at all (fire.py:1122). ALL SEVEN now checked: four reach the model (RelevanceGate, FirePath, RegistryToolSource, build_offline_pipeline), three come back EMPTY (both DreamerRuntimes are inert because the note-candidates adaptor declares no tools and store_timeout_seconds' default equals the configured 15.0; LiveAgentRunner's missing arg is a metric sink). The empty results are the sharpest evidence: which four mattered was unknowable in advance, media_join is load-bearing in three of the four, and every answer was derived by hand"
  - "DECIDED 2026-09-17 — option 1, name the slot: a new layer above nora.app INSIDE the nora root package so the contracts can see it (01-boundaries section 6). Probed before recording: the layer holds (lint-imports 0, 6 kept) and the reverse nora.app -> it is correctly refused (1 broken). THREE edits, two found only by probing — the layers list; the 'only app and __main__ read config' contract, whose source_modules is explicit so a new package is unconstrained BY DEFAULT; and EVALS_ALLOWED_NORA_PACKAGES in tests/test_boundaries.py. The probe also established which evals gate binds: lint-imports reported KEPT while evals/ imported the new package (allow_indirect_imports, documented at pyproject.toml:268) and only the boundary TEST caught it. Working name nora.harness is OPEN and collides with two things it replaces"
  - "REFUTES 01-boundaries IF FALSE — that the entry point can be a PORT rather than a taxonomy. Try relevance_gate (a real component, no turn) and participation (a full turn) through one runner first; they are deliberately the least alike. Unresolved against it: four things that need code and fit none of the three ports named — note_candidates' samples_per_fire, the gate's capabilities experiment, adversarial judge_samples/judge_model, and proactive_act's room fixtures. Also unconstructed: ONE Outcome shape over four disjoint frozen dataclasses (GateProbeResult, NoteCandidatesDrive, ProactiveDecideDrive, ProactiveActDrive)"
  - "WITHDRAWN 2026-09-17 — this bundle no longer rests on any count from design/09-decision-index.md. Those counts were measured three times by the author and produced three answers, and two independent reviews produced two more that disagreed with each other. The underlying concern (behavioural rules guarded by tests that establish the code is wired) is real and belongs on #311, stated with numbers somebody can reproduce or not stated"
  - "PRICED 2026-09-17 AND THE OBJECTION WAS FALSE — build_dependencies costs 61-84ms per case (median 64ms) against ONE session-scoped container and a template clone, not a container per case; tests/conftest.py's pg_url does CREATE DATABASE ... TEMPLATE, 'one connection and a version check instead of 27 revisions'. Both reviews and this bundle's earlier drafts said 'a fresh Postgres per call' and none had checked. So 'one Nora per case' is affordable and a case can be plain data"
  - "UNADDRESSED — what happens to #227's and #158's open findings during the rebuild. Section 2.1's retraction de-evidences a live safety reading (being_contradicted.yaml records 0/5 on the never-grounded control, 'R-83's own carve-out failing in the direction it was written to prevent') and the bundle names no owner, replacement or date for it"
  - "SUPERSESSION UNSTATED — design/05-evaluation.md is the repo's existing evaluation node, live and cited by design/00-overview.md and by decision-index rows A8, A11, A12. This bundle proposes deleting the layer that implements it and never mentions it"
  - "OPEN, AND IT BOUNDS THE METHOD — which eval clients bypass the gateway cache is a divergence from production that a kwarg diff CANNOT SEE, because it is a header (03-step0-results section 2.7). NO_CACHE_HEADERS is on the SDK gate arm, GateProbe and the judge; build_live_runner and build_live_participation_runner pass no default_headers, so the REPLY subject is not cache-bypassed. For a suite with sample: 5 the effective n is unverifiable from the outputs alone — 0/5 and 5/5 are exactly the shape a cache produces. Nothing audits the split and the run logs carry no per-sample elapsed time, so it needs a re-run with timing on the case line. Found by the culture-tier session. Section 1's table is therefore a FLOOR on the divergence, not a measurement of it"
  - "NOT IN THIS BUNDLE — the convention. Step 6, describing what exists. Written first it describes the variations and legitimises them, attempted 2026-09-17 (PR #307) and withdrawn the same day"
