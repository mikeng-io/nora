governance:
  reviewed_by: >
    NOT REVIEWED. The prior attempt at this subject (PR #307) passed its own
    author's gate and was then refuted on two independent adversarial reviews,
    so an unreviewed state is worth naming loudly here rather than assumed.
  measured: >
    00-overview section 2 and 01-the-runner sections 1-2 are measurement, read
    off the tree at b3c21686 — the eight driver functions and their line
    numbers, the five composition sites, the ~90 build_dependencies calls in
    tests/test_composition.py, and the import boundary in
    tests/test_boundaries.py. Everything else is design and is NOT measured.
    In particular the claim that every driver difference is expressible as an
    entry point plus input (00-overview section 3) is ASSERTED and is the thing
    to attack.
  synced_with: >
    #292 (the prompt-assembly session) — its injector work is validated by a
    corpus that strips the framing it is about, which is this bundle's problem
    seen from the other side. #311 carries the findings.
open_questions:
  - "STEP 0, AND IT CAN WITHDRAW THIS BUNDLE — nobody has ever compared what two eval subjects send to the model. Same input, each of the six paths, diff the assembled prompt. If they agree, the six are one Nora wearing six coats and the delete is unjustified. If they differ, the diff IS the specification. One script, before anything is deleted"
  - "OPERATOR, AND IT IS THE FIRST REAL ONE — where the single subject function lives. The layer contract refuses nora.testing, probed 2026-09-17: -> nora.app breaks 2 contracts (a REVERSE import, which is what layers exist to prevent), -> nora.infra 1, -> nora.config 2. nora/app/offline.py sits in the application package only because evals/ may import nora.app and may not import tests/. If no location is legal, the contract is the thing to change and that is a larger decision than this bundle"
  - "REFUTES 01-boundaries IF FALSE — that the entry point can be a PORT rather than a taxonomy. Try relevance_gate (a real component, no turn) and participation (a full turn) through one runner before building the rest; they are deliberately the least alike. A previous attempt had a binary that could not hold relevance_gate and graded it with a third answer its own rule did not contain (PR #307, withdrawn)"
  - "CORRECTED 2026-09-17 AND FLAGGED AS JUDGEMENT — 00-overview section 3 first said 52 behavioural rules are guarded by wiring tests. Reading them: 8 are DEPRECATED/RETIRED/REVERSED (mechanically counted) and ~30 are genuinely settled by a mechanism (a lock, a PRIMARY KEY, a registry, a startup gate). The population needing a behavioural instrument is closer to 13. That is a judgement from reading, not a measurement"
  - "NOT DECIDED — what replaces the reconstruction suites. A bare model on doctrine text is a cheap and useful probe of WORDING; under this boundary it is not an evaluation of Nora and cannot use the runner. Whether it survives as a separately named tool is open"
  - "DISCIPLINE WHILE THIS RUNS, not a question — until step 5, no number from the old layer may be quoted as behaviour without naming its subject. That is what #310's subject= provenance token was added for"
  - "NOT IN THIS BUNDLE — the convention. Step 6, describing what exists. Written first it describes the six variations and legitimises them, which was attempted on 2026-09-17 (PR #307) and withdrawn the same day after two adversarial reviews"
