kind: design_index
title: "Evaluation — the chain from a design decision to a thing that can refute it"
description: >
  250 decision and rule rows in design/09-decision-index.md; 10 cite an evals/
  instrument, 196 cite a unit test only, 44 cite nothing. Five of the ten point
  at a corpus that drives a bare model on doctrine text rather than Nora. Cut to
  the R-* rules, which are behavioural by construction: 92 of them, 4 with an
  eval, 52 guarded by a test that measures WIRING, 36 with nothing. So the
  decision index's test column answers "is the code wired" while AGENTS.md
  presents it as the answer to "does she behave as designed". This bundle is
  about that chain — decision, the behaviour it claims, an evaluation that can
  refute it, driven against the real Nora — and about nothing else. The test
  layer is explicitly out of scope: unit, integration and e2e are solved outside
  this repo and want standard practice rather than a bespoke convention. What
  has no industry answer is whether an LLM agent behaves as designed, and that
  is the only thing here.
status: proposed
origin: >
  Operator session 2026-09-17, opened by one question — "your measurement, what
  is it actually measuring?" — after four sessions of measurement discipline had
  been applied to an instrument that did not bind to its subject. A first
  attempt at the requirement (PR #307) was written and withdrawn the same day
  after two adversarial Opus reviews; its failure is recorded in 00-overview §1
  because the shape of the failure is why this bundle is shaped differently. The
  operator's correction is the design: take Nora as she is, add the thing under
  test, and there is nothing left to assemble. Findings and the six properties
  any convention must satisfy are on #311. Tree at b3c21686.
