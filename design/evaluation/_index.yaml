kind: design_index
title: "Evaluation — one Nora, many inputs (a delete and rebuild, not a refactor)"
description: >
  One invariant: different evaluation suites, different input, ONE Nora. Measured
  2026-09-17, there are SIX — evals/harness.py:612 build_offline_pipeline(14),
  eval_support.py:1109 DreamerRuntime(9), eval_support.py:1359
  DreamerRuntime(11, and not the same object), eval_support.py:980
  RelevanceGate(8), eval_support.py:1303 RegistryToolSource(9), run.py:665
  Agent(5) — and none of them is build_dependencies, which is what the
  deployment runs. So four numbers this layer has produced (#227's 67/53/42,
  #158's proactive recall, note_candidates' sampling, #221's 35/35) are about
  four different objects and none is about her. This is therefore a DELETE and
  rebuild, not a refactor: there is no target shape the current code is an
  imperfect version of. The boundary is clean-code/DDD — the eval layer depends
  on Nora, Nora depends on nothing in it, and the eval layer assembles nothing;
  a suite is cases, and if adding one needs code the boundary has leaked. Step 0
  is a check that can withdraw the whole bundle.
status: proposed
origin: >
  Operator session 2026-09-17, opened by one question — "your measurement, what
  is it actually measuring?" — after four sessions of measurement discipline had
  been applied to an instrument that did not bind to its subject. A first
  attempt at the requirement (PR #307) was written and withdrawn the same day
  after two adversarial Opus reviews; its failure is recorded in 00-overview §1
  because the shape of the failure is why this bundle is shaped differently. The
  operator's correction is the design: take Nora as she is, add the thing under
  test, and there is nothing left to assemble. Findings and the six properties
  any convention must satisfy are on #311. Tree at b3c21686.
