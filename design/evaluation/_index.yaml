governance:
  reviewed_by: >
    NOT REVIEWED. The prior attempt at this subject (PR #307) passed its own
    author's gate and was then refuted on two independent adversarial reviews,
    so an unreviewed state is worth naming loudly here rather than assumed.
  measured: >
    00-overview section 2 and 00-overview section 1 and 01-boundaries section 4 are measurement, read
    off the tree at b3c21686 — the eight driver functions and their line
    numbers, the seven composition sites, the ~90 build_dependencies calls in
    tests/test_composition.py, and the import boundary in
    tests/test_boundaries.py. Everything else is design and is NOT measured.
    In particular the claim that every driver difference is expressible as an
    entry point plus input (01-boundaries sections 2 and 3.1) is ASSERTED and is the thing
    to attack.
  synced_with: >
    #292 (the prompt-assembly session) — its injector work is validated by a
    corpus that strips the framing it is about, which is this bundle's problem
    seen from the other side. #311 carries the findings.
open_questions:
  - "ANCHORED BY THE OPERATOR 2026-09-18, AND IT IS THE BUNDLE'S BIGGEST MISS — the suite is to be built on strands-agents-evals, and that is to be ENFORCED rather than restated. Measured: a grep for strands_evals across all 1,601 lines of this bundle returns ZERO hits, so the SDK was never adopted, never rejected and never reasoned about; the locked decision predates this bundle and the OLD layer never implemented it either (NoraOutputEvaluator and NoraTrajectoryEvaluator were defined and never once called, which their own docstring stated). Three of 01-boundaries section 2's four primitives already ship: Case, Experiment.run_evaluations, EvaluationData/EvaluationOutput — 1,037 of the rebuilt layer's 2,267 lines. The SUBJECT is the one that is ours. Two blocking reasons were checked and are FALSE (a task function may return a dict, so the subject need not be a Strands Agent; and evaluators take model: Model | str, so OpenAIModel against OmniRoute's nora-judge works exactly as production already does at nora/agent/factory.py:128). One is TRUE and small: EvaluationOutput.test_pass is a bool with no third state, so REVIEW must ride in label. 07-sdk-native carries the investigation, the corpus mapping and the three enforcement layers. NOTHING HAS BEEN RUN — section 8 of that node is the falsification to execute"
  - "STEP 0 — RUN 2026-09-17, refutation did NOT fire (03-step0-results). RelevanceGate: 539 vs 559 bytes, eval loses the canonical name and the media description, an image-only message reads as an empty body and its row is dropped. FirePath: three prompt blocks empty or absent from three ints defaulting to 0, and <people_in_window> is not rendered at all (fire.py:1122). ALL SEVEN now checked: four reach the model (RelevanceGate, FirePath, RegistryToolSource, build_offline_pipeline), three come back EMPTY (both DreamerRuntimes are inert because the note-candidates adaptor declares no tools and store_timeout_seconds' default equals the configured 15.0; LiveAgentRunner's missing arg is a metric sink). The empty results are the sharpest evidence: which four mattered was unknowable in advance, media_join is load-bearing in three of the four, and every answer was derived by hand"
  - "DECIDED 2026-09-17 — option 1, name the slot: a new layer above nora.app INSIDE the nora root package so the contracts can see it (01-boundaries section 6). Probed before recording: the layer holds (lint-imports 0, 6 kept) and the reverse nora.app -> it is correctly refused (1 broken). THREE edits, two found only by probing — the layers list; the 'only app and __main__ read config' contract, whose source_modules is explicit so a new package is unconstrained BY DEFAULT; and EVALS_ALLOWED_NORA_PACKAGES in tests/test_boundaries.py. The probe also established which evals gate binds: lint-imports reported KEPT while evals/ imported the new package (allow_indirect_imports, documented at pyproject.toml:268) and only the boundary TEST caught it. Working name nora.harness is OPEN and collides with two things it replaces"
  - "RUN 2026-09-17, DID NOT REFUTE — the entry point IS a port. relevance_gate (a component, no turn), participation (a turn, no gate), tag (Dispatcher.on_message) and dreamer all go through ONE runner with one Case and one Outcome, held by tests/architecture/test_the_entry_point_is_a_port.py (four pins, all falsified before being trusted). What it cost is the finding: NEITHER of the first two was reachable — RelevanceGate lived only at ParticipationTrigger._gate and FirePath only at ._speak, while every other entry point was already a field on Dependencies. Two fields close that, no new object and no behaviour change, and that they were missing is most of the mechanism behind seven assemblies"
  - "FOUND BY BUILDING IT — four missing seams in nora.app, all the same shape: the deployed graph could not be ASKED for something it does, so each driver built its own. Two are closed (relevance_gate, fire_path as Dependencies fields). Two are not: there is NO CLOCK SEAM (composition.py builds the proactive adaptor with clock=lambda: datetime.now(UTC), a literal with no config path), which refuses 21 proactive cases; and no Honcho WRITE seam (Honcho derives a conclusion from messages), which refuses 2 participation cases. Both refusals are ERROR, never PASS. RETRACTED 2026-09-18 — BOTH seams were closed and NO case is refused today: rooms and standing became seedable (GOAL step 1) and conclude() is production's own Honcho write lane (commit 177301b4). Measured: 11 cases still carry metadata.row but they enter at proactive_act while the guard lives in the dreamer entry point, so it cannot fire for any case in the tree"
  - "MEASURED 2026-09-17, AND IT IS THE SHARPEST RESULT IN THIS BUNDLE — with no provider reachable, THREE of the four entry points returned a VERDICT rather than an error. The gate fails closed to no_go; a failed turn writes no row, which reads as silence; Dispatcher.on_message returns None and swallows the turn into a background task. Each needed its own fail-closed signal and there is no shared one, because the deployment does not offer one (04-the-convention section 5.1). Without them a suite scores an un-run case, and for the silence-expecting half of a corpus EVERY ONE PASSES"
  - "WITHDRAWN 2026-09-17 — this bundle no longer rests on any count from design/09-decision-index.md. Those counts were measured three times by the author and produced three answers, and two independent reviews produced two more that disagreed with each other. The underlying concern (behavioural rules guarded by tests that establish the code is wired) is real and belongs on #311, stated with numbers somebody can reproduce or not stated"
  - "PRICED 2026-09-17 AND THE OBJECTION WAS FALSE — build_dependencies costs 61-84ms per case (median 64ms) against ONE session-scoped container and a template clone, not a container per case; tests/conftest.py's pg_url does CREATE DATABASE ... TEMPLATE, 'one connection and a version check instead of 27 revisions'. Both reviews and this bundle's earlier drafts said 'a fresh Postgres per call' and none had checked. So 'one Nora per case' is affordable and a case can be plain data"
  - "UNADDRESSED — what happens to #227's and #158's open findings during the rebuild. Section 2.1's retraction de-evidences a live safety reading (being_contradicted.yaml records 0/5 on the never-grounded control, 'R-83's own carve-out failing in the direction it was written to prevent') and the bundle names no owner, replacement or date for it"
  - "SUPERSESSION UNSTATED — design/05-evaluation.md is the repo's existing evaluation node, live and cited by design/00-overview.md and by decision-index rows A8, A11, A12. This bundle proposes deleting the layer that implements it and never mentions it"
  - "OPEN, AND IT BOUNDS THE METHOD — which eval clients bypass the gateway cache is a divergence from production that a kwarg diff CANNOT SEE, because it is a header (03-step0-results section 2.7). NO_CACHE_HEADERS is on the SDK gate arm, GateProbe and the judge; build_live_runner and build_live_participation_runner pass no default_headers, so the REPLY subject is not cache-bypassed. For a suite with sample: 5 the effective n is unverifiable from the outputs alone — 0/5 and 5/5 are exactly the shape a cache produces. Nothing audits the split and the run logs carry no per-sample elapsed time, so it needs a re-run with timing on the case line. Found by the culture-tier session. Section 1's table is therefore a FLOOR on the divergence, not a measurement of it"
  - "STEP 5 DONE 2026-09-18 — `nora/app/eval_support.py`, `nora/app/offline.py` and every old `evals/*.py` are gone from where they were; `evals/` is now `__init__.py`, `rebuilt/` and the corpora. 8,187 lines deleted outright and three files RE-HOMED into `tests/`, which is what «not an eval module» meant: each was in `nora/` solely because `evals/` may import `nora.app` and `nora.testing` only, so a shared TEST helper had to live inside the application to be reachable from both sides. Once `evals/` had no harness that reason was gone. COST — CORRECTED 2026-09-18 by 07-sdk-native section 4.1: the ROUTING tier IS recoverable, strands-agents-evals ships ToolCalled, ToolSelectionAccuracyEvaluator, ToolParameterAccuracyEvaluator and TrajectoryEvaluator in the version already pinned, so DEC-76 and DEC-84 can be re-enforced. Only live parity is genuinely gone; it died with the layer it compared against — the gate arm was compared once and found a real defect, the other four entry points never were"
  - "RUN 2026-09-17, AND IT DISAGREED — 05-live-parity. Old 10/10, new 9/10 on the same ten cases against the DEPLOYED nora-gate alias over a tunnel. The divergence was systematic (go 5/5 vs no_go 5/5) and was NOT a plumbing bug: eval_support._gate_records rotated three speakers 180s apart and the corpus never said so, while the participation corpus's identical syntax meant every line from one member 60s apart. One syntax, two meanings, one per driver — and a byte-for-byte re-homing check PASSED the whole time, because the strings are identical. The corpus now states its speakers and spacing; agreement is 15/16. The residual is a borderline case the corpus header itself describes, reported by the determinism control"
  - "SUPERSEDED by the STEP 5 DONE entry above — WRITTEN 2026-09-17 — the convention is 04-the-convention.md, last as planned, describing what exists and naming in section 6 what does not. Step 5 (the delete) is NOT done and is the one remaining step: evals/*.py is still where a live number comes from, and removing it before the replacement has driven a LIVE run would be this bundle repeating its own finding rather than fixing it"
