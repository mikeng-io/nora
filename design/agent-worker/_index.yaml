kind: design_index
title: "Agent worker: Nora hands computer work to an existing coding harness, behind two switchable ports"
description: >
  Nora's computer tools make Nora herself the coding harness: each
  computer_run, read, write and edit is one model round of hers, through
  computerd in the sbx microVM. A coding task of many steps reinvents what Pi,
  Hermes, Claude Code and Codex already do well. This bundle adds an
  AGENT WORKER port, shaped on the Agent Client Protocol's session semantics
  (start, prompt, stream updates, permission requests, cancel), with a Pi
  adapter first and an ACP adapter for the rest, so the harness is
  switchable. The worker runs INSIDE the sandbox, which needs the
  SandboxRuntime port to gain a long-lived streamed process, and that reshape
  is what makes the VM switchable later (sbx today; Cloudflare, other microVM
  services after). Model calls leave the VM only through a scoped relay, so
  no key enters it. The sub-agent stays Nora (Strands) and is the one caller.
  Proposal, not built.
status: proposal
governance: operator-directed
timestamp: '2026-10-25'
origin: >
  Operator, 2026-10-25: «for computer use, I don't expect to build another
  harness … is it possible to build an adapter so I can adapt the Pi agent, or
  others like the Hermes agent»; «my preference would be the Pi agent because
  it's cleaner and more abstracted for harnessing»; «we should make it an
  adapter, because in the future we might want to switch … a Hermes agent, or
  if possible, maybe ACP»; «in the future, not right now, I want the VM to
  also become an adapter so it's switchable … the Perplexity VM, the
  Cloudflare VM, or microVM sandboxes»; «a sub-agent is more like requesting
  Nora to work behind the scenes, so it's still Nora».
