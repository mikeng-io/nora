scope:
  v1:
    - "<presence>: generated per-turn block replacing _where_line; this room, this unit's other rooms with transport state, and other units per D1"
    - "_PLATFORM_NAMES gains WhatsApp and Instagram"
    - "my_rooms, room_activity, read_room, each with its own disclosure tier; R-27 statuses, no ids (R-18), read_room output untrusted (R-13)"
    - "social_fetch split by action into social_profile / social_story / social_posts / social_post / social_search over one SocialRouter and one allowlist"
    - "Instagram wiring fix ahead of the split: story and profile routed to the bridge's /accounts/* (PR #387)"
  deferred:
    - "Instagram posts/reels LIST — no backend can serve it (Go library's full query registry has none; OpenCLI's user returns Instagram's HTML shell). The verb ships as unavailable for Instagram"
    - "Threads — a backend row in SocialRouter when a backend exists; no model-facing change"
    - "social_post on Instagram via FetchMedia — never tried on a real post"
  not_in_scope:
    - "Editing identity.md. Its not_here rule is kept, not relaxed"
    - "A generated capability block — the tool catalogue is that layer (DEC-150)"
    - "Any new tool before the tool catalogue lands"
