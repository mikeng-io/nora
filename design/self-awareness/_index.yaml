kind: design_index
title: "Self-Awareness — who she is, where she is, what she can do"
description: >
  Nora is on four networks in several rooms across more than one unit, and is
  told only which NETWORK a turn is on (`_where_line`, added after she answered
  a Discord tag saying she was on Signal, 2026-08-14). She cannot say which
  rooms she is in, which transports are up, or what she can do. Doctrine
  cannot carry it: identity.md forbids concrete instances because a copy goes
  stale in silence. So self-awareness is generated per turn from the system
  that knows each fact, in three layers: WHO (identity.md, unchanged), WHERE
  (a generated <presence> block from the room table and AdapterHealth, plus
  two room tools, room_list and room_read, split where content starts), WHAT (the tool catalogue,
  which already is the capability layer). Social fetching (Instagram and the
  per-network split) is a separate topic and lives in design/instagram-adoption/.
status: proposed
governance: draft
timestamp: '2026-09-23'
origin: >
  design conversation with miles, 2026-09-22/23 — opened from the Instagram
  social-fetch capability table ("what can Nora actually get from Instagram"),
  widened by miles to "the docs tell her how to behave but not who she is or
  what she has", and to room awareness ("which channels, which groups, which
  one has conversation — one tool cannot do all of it").
