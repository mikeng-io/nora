scope:
  v1:
    - "<presence>: generated per-turn block replacing _where_line; this room, this unit's other rooms with transport state, and other units per D1"
    - "_PLATFORM_NAMES gains WhatsApp and Instagram"
    - "Her own handles (@nora.000 on Signal; @noraexample on WhatsApp, X, Instagram, Threads) as a line in <presence>, read live from each adapter's self report; a config table only for X and Threads (no adapter); never in identity.md, whose not_here forbids addresses"
    - "<presence> is a ContextBlock row in prefill._BLOCKS (key turn) and replaces proactive's home_room row (D2)"
    - "room_list (existence + activity, one boundary under D1 = B) and room_read (content), named to ADR 0015; R-27 statuses, no ids (R-18), read_room output untrusted (R-13)"
  not_in_scope:
    - "Editing identity.md. Its not_here rule is kept, not relaxed"
    - "A generated capability block — the tool catalogue is that layer (DEC-150)"
    - "Any new tool before the tool catalogue lands"
    - "Social fetching (social_fetch, its per-network split, Instagram wiring) — design/instagram-adoption/"
    - "Her profile on each network (avatar, display name, bio) — a separate bundle; appearance for drawing herself is design/self-reference/ (DEC-193)"
operator_decisions:
