kind: design_index
title: "Observability — four signals, one boundary rule"
description: >
  Nora's observability is already built: a Prometheus/Langfuse/logs/Sentry
  split governed by one measured rule (R-76 — a trace reaches the collector
  when the work under it can contain a model call), a sampler and a
  span/generation helper contract in nora/obs/tracing.py, a redaction
  obligation forced by the layered-import contract into nora.agent.security,
  and an alerting stack that watches for absences rather than exceptions.
  docs/observability.md is the living how-to for all of this and is not
  duplicated here. This bundle records why the architecture has the shape it
  has, grounded in the measurements that forced each boundary, and holds the
  decisions that are still open or made-but-unwired in one place, so a future
  session does not re-derive settled tradeoffs or re-flag settled boundaries
  as defects.
status: checkpoint
