governance:
  reviewed_by: >
    Five-agent Opus audit, 2026-09-19 (architecture/sampler correctness,
    redaction/Sentry correctness, coverage/completeness, devil's advocate,
    cross-file consistency), run against the first-draft bundle at c7d3ca0a.
    Verdicts ranged LAND WITH FIXES to MISLEADING. Confirmed findings, applied
    in this revision: the first draft's "nothing here duplicates
    docs/observability.md" was false (whole sections restated verbatim, now
    cut to pointers); "four raw chat.completions.create paths" was stale by
    one refactor (actually two, the debrief/standing fold moved to the SDK
    transport in 4448c737); "would create a real Python import cycle" (the
    layering rebuttal) overstated a layered-contract violation as an
    unavoidable ImportError, and rebutted a port-injection alternative that
    was never actually addressed; the draft's own include_local_variables
    claim contradicted itself across two of its own files because it was
    grounded one commit before the fix it was documenting; metrics and
    nora/obs/health.py were entirely uncovered despite the bundle's own table
    and alerting section depending on them; the Sentry test "passes" claim
    was unverified against the actually-skipped default test run. All fixed
    in this revision (see git history for the pre-audit text). Not
    independently re-reviewed after these fixes.
