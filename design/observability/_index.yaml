kind: design_index
title: "Observability — four signals, one boundary rule"
description: >
  Nora's tracing and error-reporting are already built: a Langfuse/Sentry
  split governed by one measured rule (R-76 — a trace reaches the collector
  when the work under it can contain a model call), a sampler and a
  span/generation helper contract in nora/obs/tracing.py, and a redaction
  obligation the layered-import contract pushes onto the caller rather than
  the helper. This bundle covers those two signals (and, by pointer only,
  metrics/logs/health/config — see 00-overview.md §2's scope boundary) at
  design-record depth: why the architecture has the shape it has, grounded in
  measurements it borrows from docs/observability.md rather than re-deriving,
  and the decisions that are still open or made-but-unwired, so a future
  session does not re-derive settled tradeoffs or re-flag settled boundaries
  as defects. "checkpoint" means built, with real decisions still outstanding
  (02-open-decisions.md) — not that the architecture itself is still moving.
status: checkpoint
origin: >
  Written 2026-09-19 after a UACP-governed TRIAGE→PROPOSE→PLAN run on this
  same scope was fully reverted (adoption commit 0534002b, revert 7e036c12) at
  the operator's instruction, which deleted every governance artifact the run
  had produced. Some of that run's findings survive here because they were
  re-verified directly against the code rather than carried over from memory:
  the architecture-layering question (00-overview.md §4) was re-read against
  nora/obs/tracing.py and nora/agent/security.py, and the claimed missing
  trace_safe call sites (01-implementation.md §3) were re-checked and found not
  to pass raw content to a span at all. Where a prior finding could not be
  re-verified against current code, it was not reused. Grounded on reads of
  nora/obs/tracing.py, nora/obs/errors.py, nora/obs/logging.py,
  nora/obs/metrics.py, nora/obs/metric_specs.py, nora/obs/health.py,
  nora/agent/security.py, nora/ingest/relevance_gate.py,
  nora/ingest/comprehension.py, nora/app/composition.py,
  nora/infra/vision/client.py, docs/observability.md,
  design/13-trace-content-and-redaction.md, config.example.toml, and
  nora/__main__.py, re-anchored to b8f69093/c7d3ca0a after the first draft
  (grounded at 7e036c12) was found stale against its own Sentry fix — see
  governance.reviewed_by.
