kind: design_index
title: "The Cognition Loop — Nora's other half, one OODA loop per unit"
description: >
  Cognition is Nora's other half: one observe-orient-decide-act loop per unit
  that acts when nobody asked, her subconscious beside the conscious turns that
  answer when called. Code observes (Record, Rollup, durable stimuli) and wakes
  one session per unit; the session orients against memory and the notebook
  with every read Nora has, updates its understanding, decides whether anything
  is worth doing and when, and acts only through reminders the conscious fire
  turn re-examines and through its own wakes. Code owns observation, what is
  shown first, validation of every write, act guards and budgets; the model
  owns judgement. 00-intent is the entry point and says which node owns each
  part; 30 is the session contract; 18 owns execution and time; 20, 22, 25 and
  60 own observation; 05, 10, 12 and 55 own the data model and tiers; 70 and
  80 are history and prior art.
status: proposed
governance: operator-directed
timestamp: '2026-11-11'
origin: >
  Operator 2026-09-27/28 founded the bundle: centralise the clocked dreamers
  into one event-driven agent loop that orients, decides and acts in one
  context ("there won't be any context lost"), so Nora stops being passive.
  Operator 2026-11-11 restated it as one OODA loop, much simpler than the
  design had grown, and had the entry point rewritten around it. The
  founding decisions D1-D12, the three-step topology and their amendments are
  in git history and 70-migration.
