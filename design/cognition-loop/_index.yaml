kind: design_index
title: "The Cognition Loop — one agent that orients, decides and acts on what code observes"
description: >
  Nora's ambient loop (DEC-176) exists as a name, not as a shape: its orient
  and act steps are scattered over four clocked Dreamer adaptors, the Standing
  debrief and fold, a participation gate and the proactive adaptor (the fifth
  Dreamer adaptor), each re-reading the same messages on its own clock and
  none able to see what the others just concluded. The symptom is a passive
  Nora: a plan moves from one restaurant to another in untagged chat and her
  event still says the first, because an event is written only when someone
  tells her. This bundle makes the loop one thing. OBSERVE is code: ingestion
  of messages, presence, the social stream (stories, posts and reels, tags,
  members only), play (Steam, Discord) and perception (what a photo shows,
  whose face it is), stored as the RECORD and raising durable wake stimuli;
  code then computes the ROLLUP (episodes such as co-location, outing,
  daybook; aggregates such as place, rhythm and tie) as a pure, replayable
  projection of the Record, generalising what design 27 began for presence.
  The Dreamer runtime hosts four adaptors split by timescale: Cognition
  (fast, per unit), Character and Lessons (slow reflection, each the sole
  writer of its tier) and Assess (reports only); the adaptors are her
  subconscious and the speaking turns her conscious. In Cognition, ORIENT,
  DECIDE and ACT are ONE agent session per unit per wake, woken by a code
  evaluator on stimuli or on a self-wake it requested: an agenda
  whose items each bind a room, the read tools that room permits, typed write
  verbs whose every call code validates, and one act verb, remind, whose rows
  the fire path composes inside the target room under its guards. It fixes
  the layers, the tiers and their words so nothing overlaps: the RECORD
  layer (what was observed), the ROLLUP layer (what it adds up to,
  computed), and the Notebook's tiers REGISTER (the unit's affairs: note,
  memo, event), CHARACTER (what an entity is like), LESSONS (what she has
  learned about how to act here), STANDING (where Nora stands). Every derived row carries its reasoning mode (computed, told,
  deduced, induced, abduced, said), its confidence, its lineage (a set of
  kind, subject and origin room, per field, which decides at assembly the
  rooms each field may reach) and its age; small indices are pushed into
  prompts and everything else is queried. Cognition is the loop, never a
  store; her identity is the slice of all state about her (doctrine's law given
  (DEC-291), Record done, Character digested, Lessons learned, Standing held), and she
  grows by revising her own blocks below doctrine she never changes, with
  any disagreement recorded as tension for the operator. Every store is
  append-only in system time, so Nora as of any past moment can be restored
  into an eval sandbox; memory (Honcho) is the exception. Every Register, Character, Lessons and Standing row is structured
  Markdown with a fixed schema in a revision chain; the Rollup is typed and
  rebuilt into versioned builds. Under all of it is one data model
  (05, operator 2026-10-01): five layers in one flow, each defined by who
  writes it, AUTHORED (humans) → RECORD (ingestion) → ROLLUP (code) →
  NOTEBOOK (the subconscious only, one writer per tier: Cognition for
  Register and Standing, the Character and Lessons adaptors for theirs; entries citing the Record and Rollup,
  never evidence) → VIEWS (per-reader slices assembled at read time through
  one path, never stored), with MEMORY (Honcho) beside the flow; the
  hierarchy Layer › Tier › Kind › Entry, a tier existing only inside the
  Notebook; no knowledge graph is built. The Dreamer runtime is kept and its scheduling half replaced; the
  proactive adaptor becomes the loop's act step.
status: proposed
governance: operator-directed
timestamp: '2026-09-28'
origin: >
  Operator 2026-09-27/28, one session. "We will end up with 9 or 10 dreamers …
  centralise this into one dynamic, adaptive, deep reasoning agent loop … not
  on a schedule: event-driven, adaptive, message-sensitive." "The current note
  is more like an idea … a note should be a real note." "Events should be
  derivable … we changed restaurants several times today … Nora will still
  assume we're going to the originally planned restaurant … She is supposed to
  be an AI agent." "The dreamer conductor will become the real proactive layer
  … the real cognition or decision engine … it will actually act." "Should it
  be a single agent to do the orient … within the same agent … there won't be
  any context lost." "I need an extremely clean separation between
  characters … whether we call it the cognition tier, the storage tier, or the
  memory tier, it has to be extremely clear." Stories, posts, reels and the
  social stream are ingested; face recognition is in scope now. Strands Agents
  SDK throughout. Supersedes the same session's first draft
  (design/dream-conductor, commit 0e060cf: a conductor planning separate
  specialist agents), which the operator's single-agent argument replaced.
  Revised the same day after four independent audits (architecture,
  terminology, grounding, privacy); the operator's decisions D1–D12 are in
  00-intent.
