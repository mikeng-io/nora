scope:
  v1:
    - "A custom `ToolExecutor` that wraps Strands' `ConcurrentToolExecutor` and bounds fan-out with one `asyncio.Semaphore`"
    - "Injected at BOTH `Agent(...)` construction sites (`create_agent`, `create_dream_agent`) — `factory.py:402` and `factory.py:496`"
    - "ONE shared limit across all tools (not per-tool), configurable"
    - "Sub-agents INHERIT the limit; they do not restate it"
    - "Ordering preserved: results returned in the input `tool_uses` order, as the concurrent executor already does"
    - "The existing per-tool budget ceiling (`CallLedger`) is untouched — the two ceilings compose, count vs concurrency"
  deferred:
    - "Whether Nora should PROMPT the model to batch more (or less) — this bundle bounds what already happens, it does not change what the model emits"
    - "Per-agent limits (a dream agent may later want a different bound than a tag turn)"
    - "A queue-depth or wait-time metric beyond the saturation counter in 04 §3"
    - "Any change to `media_fetch`'s own budget — that is design/media-read-lane/"
    - "The media read lane's per-invocation timeout arithmetic — see design/media-read-lane/04 §3a"
