kind: design_index
title: "Tool Concurrency — one shared, inheritable ceiling on how many tools run at once"
description: >
  Strands' default `ConcurrentToolExecutor` fans out EVERY tool_use block a model
  emits in one turn, with no ceiling of its own. Langfuse (51,452 observations,
  2026-07-12 → 2026-09-22) shows this is live, not theoretical: 26.2% of
  generations emit more than one tool call, 159 batches exceeded the media
  budget of four, and the largest single batch was 76 tool calls. Nora's
  reply-guard ledger (`nora/agent/call_ledger.py`) already closes the COUNT half
  of this hole — it reserves budget in-flight so a parallel batch cannot all pass
  the pre-batch check — but nothing anywhere caps how many of those admitted
  calls RUN AT THE SAME TIME. This bundle adds one shared, inheritable
  concurrency ceiling beneath the existing budget ceiling: a custom
  `ToolExecutor` wrapping Strands' concurrent one, injected at both `Agent(...)`
  construction sites, with one limit shared across every tool (operator decision,
  «所有 tools») rather than a per-tool allowance, and sub-agents inheriting the
  parent's limit rather than restating it.
status: proposed
governance: pre-governance-input
timestamp: '2026-09-23'
revision: '2026-09-23 — initial draft. Evidence gathered read-only against the live Langfuse ClickHouse store and the origin/master tree; no production code changed.'
origin: >
  Operator session 2026-09-23. While settling the media read lane's timeout
  arithmetic, Miles identified the executor gap directly: «係強制定係選擇先？因為以我
  所見，好似 Nora 從來冇選擇過 concurrent 嘅 execution，定係其實有？» and then
  «Maximum concurrency：我冇可能假設個 budget 之後 raise 到 10，佢就同我 10 個
  concurrent 一齊 run 㗎？». He asked for the claim to be checked against the
  original Langfuse traces rather than accepted from a code comment. The traces
  confirmed it, and the operator scoped the fix: «當然 per tools 我唔使，我覺得係
  所有 tools。我覺得兩樣啦：1. 一個係 shareable，一個係即係 inherit 囉可以 2.
  第二當然佢係要獨立 bundle».
