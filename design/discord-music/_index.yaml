kind: design_index
title: "Discord Music — Voice-Channel Music Bot"
description: >
  A Discord voice music bot on top of the existing DiscordAdapter: yt-dlp
  resolves a stream URL, ffmpeg transcodes it live into voice (no download,
  no RustFS), slash commands are the primary control surface, the whole
  session persists in Postgres and resumes on restart, and four Discord-only
  Nora agent tools (play/skip/stop/status) add conversational control on
  top of the same deterministic state machine. No saved playlists, no
  library, no SoundCloud yet — each deferred with an explicit evidence bar.
status: proposed
governance: pre-governance-input
