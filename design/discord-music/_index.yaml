scope:
  v1:
    - "Discord slash commands (/music play|skip|queue|pause|resume|stop|volume) as the primary control surface"
    - "yt-dlp resolves a direct stream URL; ffmpeg transcodes live into Discord voice — no disk, no RustFS"
    - "Per-guild MusicPlayer (voice connection, now-playing, loop, volume), persisted in Postgres and resumed on restart"
    - "Session queue persisted in a new Postgres table (music_queue), not Valkey"
    - "Auto-disconnect on empty voice channel or idle timeout"
    - "Discord-only Nora agent tools (play_music/skip_music/stop_music/music_status) for conversational control"
  deferred:
    - "Saved/named playlists"
    - "Persistent audio library / cache"
    - "SoundCloud (both the cheap yt-dlp flip and an official-API adapter)"
    - "Nora agent tools for pause/resume/volume (play/skip/stop/status are built; these stay slash-command-only)"
    - "Auto-resume after a Gateway-reconnect voice drop (distinct from the built restart-resume)"
    - "Containerizing the yt-dlp/ffmpeg subprocess (hardening pass, not a blocker)"
