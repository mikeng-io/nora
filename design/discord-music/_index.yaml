kind: design_index
title: "Discord Music — Voice-Channel Music Bot"
description: >
  A deterministic, non-agentic Discord voice music bot on top of the
  existing DiscordAdapter: yt-dlp resolves a stream URL, ffmpeg transcodes
  it live into voice (no download, no RustFS), slash commands are the sole
  control surface, and the session queue persists in Postgres. No saved
  playlists, no library, no Nora agent tools, no SoundCloud yet — each
  deferred with an explicit evidence bar.
status: proposed
governance: pre-governance-input
timestamp: '2026-08-23'
origin: "brainstorming session with miles, 2026-08-23"
