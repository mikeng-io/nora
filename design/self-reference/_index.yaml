kind: design_index
title: "Self-Reference — canonical visual identity for self-aware image generation"
description: >
  Nora gains a canonical visual identity: an on-demand image-generation
  skill (nora/skills/image-generation/, built 2026-09-23 in place of the
  designed appearance.md doctrine file) carrying her look, ONE canonical media
  asset marked provenance.role=self (v1 pins no operator asset — operator
  decision 2026-09-16), a narrow custody exemption so that handle resolves
  in any conversation, and doctrine-driven reference rules including a
  deterministic no-guess rule for ambiguous user photos — which is the sole
  cover for the operator-photo ambiguity class in v1, since no operator
  handle is pinned. Addresses the 2026-08-27 cow-avatar failure (Nora
  confused a 牛來 meme with Miles's avatar when asked to merge his photo
  into a rainy scene).
status: built
decisions:
  reserved: "DEC-193 — registered in design/09-decision-index.md; BUILT 2026-09-23 as an image-generation skill plus the resolver exemption and the operator ingest (06). Drafted as DEC-139, renumbered 141 -> 193 (master already held 141-144, the trace series)."
  index: null
governance: pre-governance-input
timestamp: '2026-08-27'
revision: '2026-08-27 — adversarial review (Hermes delegate) of the earlier single-file draft returned REQUEST CHANGES; all findings addressed: operator canonical asset added + deterministic no-guess rule (03), test_doctrine_assembly.py added to files-touched (04), authority fields specified (01), ingest-before-doctrine ordering + handle-pinning test (02, 04), resolver precedence pinned (02), 3-slot cap relabelled tool-surface convention (01), no-migration wording (02), appearance tag-only mirroring silence (04). Restructured from a single proposed/ document into this bundle (Miles: design bundle, not design document).'
revision_2026_09_16: 'Scope narrowed to self-only (operator: 「no need operator, just nora」) — the operator canonical asset is dropped from v1 and the operator-photo ambiguity class is carried by the ask rule alone; the canonical self image (assets/nora-canonical-self.png, 1024x1536, sha256 4b8825fe…) is accepted and the multi-panel sheet is reclassified as the descriptive source, not an asset.'
revision_2026_09_23_build: 'Built. Operator placed the content in an on-demand SKILL (nora/skills/image-generation/), not doctrine: her look is needed only when she makes an image. The skill leads with whether she herself is in the picture, then whose photo is whose, her appearance per 05, and per-model notes from xAI docs. Resolver exemption, URL refusal and ingest built with tests; 06 is the as-built record.'
revision_2026_09_23: 'Canon replaced by the mascot form (operator, 2026-09-23): new self asset (sha256 535e4da5…), new Mini Form sheet, the operator''s spec kept verbatim as 05, social avatar and banner added as reference-only. The human form is retired, not kept as an alternative.'
revision_2026_09_26: 'One identity, two representations (operator, 2026-09-26, 07): Mini Nora is the native form on every internet surface; Embodied Nora is a human-scale interface for spatial surfaces, not a human identity, so 05 and the 2026-09-23 retirement of the human-form canon stand. Three reference-only images added (nora-mini-icon, nora-mini-tpose, nora-embodied-tpose); nothing ingested, runtime unchanged. The repo-wide visual system is DESIGN.md.'
revision_2026_10_25: 'Approved Bauhinia human visual anchor (08), tracked in issue #245: one identity, human and Mini forms; human design may be 2D anime art or 3D, superseding the spatial-only framing in 07. Original PNG is reference-only, not ingested. Mini canon, public avatars and runtime remain unchanged; consistent modeling turnarounds and model/rig work remain future.'
revision_2026_10_26: 'Operator approved Mini option08 Balanced and requested refreshed art, an integrated inventory and matching procedural eyes. Human Bauhinia is unchanged; no runtime ingest, release, external publication or video rerender is performed.'
