type: design_index
title: "Self growth — Character for every entity, the self block, Lessons, then a doctrine that is only law"
description: >
  The cognition loop (design/cognition-loop) makes the doctrine Nora's law and
  gives her three places to grow below it: Character · Nora, Lessons and
  Standing (55-self §3, D6). Today the doctrine still carries her personality
  and practice, so any growth that disagrees with it would be refused or turned
  into tension rows, and every unit gets the same her. This bundle sequences
  the work that lets the doctrine shrink to law: (1) Character for every
  entity (room, unit, person, Nora), event-driven, one Dreamer agent-loop
  session per (unit, entity), writing through a validated write verb and
  injected through context assembly; (2) the self block; (3) classify the
  doctrine into law, practice and character without editing it, so the
  doctrine check reads law only; (4) Lessons, accumulated from closed response
  episodes, with an explicit-correction fast path; (5) cut the doctrine to
  law. Step (3) is built (DEC-291): every doctrine rule is sorted in a side table
  with the text byte-identical, 58 of 154 parts law, and the audit is for the
  operator to mark up. Step (1) is built (DEC-290, #744 and its review follow-ups): room, unit,
  person and Nora sessions, `character_revise`, the `<character>` and
  `<unit_culture>` blocks, and `character_read`. Step (2) is built (DEC-292):
  the `<self>` block renders Nora's own account first on tag, fire and
  Cognition turns and `self_card` is deleted; its before/after eval could not
  be run on the suite (see 20-self-block.md §5). Step (4) Lessons: L0 (the `ask` brief on a send) and L1 (the `lesson` store, `lesson_write` and `lesson_retire` behind citation, identifier, echo, no-re-learn and cap checks, and `nora lessons`, DEC-293) are built; L2 (the Lessons adaptor, its objective and its wake, DEC-297) is built behind `[lessons] enabled`, default off, and its labelled check of `unanswered` sends is not run; L3 (the doctrine check on the law of `core/` and `rooms/`, tension rows, DEC-298) is built and measured 96/96 on an author-written labelled set and 12/12 on the first live lessons; L4 and L5 are not. Step (5) is not built. Every threshold is
  sized from a read-back on the deploy host before code.
status: in-progress
governance: operator-directed
timestamp: '2026-10-07'
origin: >
  Operator 2026-10-05/07, one session. "I want the doctrine to become only its
  framework and law, instead of having too much personalisation." Build order,
  the operator's: "1. Complete all of the characters (some of these should be
  context-awareness injection, using the same context assembly and context
  injector). 2. Form the self-block. 3. The lesson. 4. The doctrine (at the
  end)." On Lessons: "I expect it will be event-driven, instead of refreshing on
  every new message or on a time schedule." On Character: "I expect it will be
  an agent loop instead of a one-shot LLM synthesis." Recommendations and the
  personalisation-as-skill question are parked.
