kind: design_index
title: "Live Threads — Nora Holds The Thread"
description: >
  Nora answers well and forgets. She is measurably correct about when to stay
  quiet (false-positive 0.02 over 105 samples) and measurably unable to act
  (recall 0.34 over 60): every proactive case that asks her to DO something
  fails. That is not a tuning problem. The doctrine says she is done when she
  has answered, the note tier only holds questions with closing conditions,
  nothing anywhere records whether a thing is moving, and her only way to act
  is to schedule an interruption. Four worked scenarios from the operator's own
  rooms fall outside all of it. This bundle redefines what a note is, what it
  is for, and what Nora is for — from the identity file down to the schema.
status: proposal
origin: >
  Working session with miles, 2026-09-10/11, after a night of audit fixes that
  raised the quiet-side numbers and moved the acting side not at all. Four
  scenarios the operator brought from his own groups — a wedding-gift-day
  dinner nobody planned, a game the room re-argues from zero every cycle, a
  recommendation with no event behind it, and a friend's sprained ankle —
  each of which the shipped design cannot represent. Grounded throughout on
  reads of the tree, not on recollection.
