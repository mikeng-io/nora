kind: design_index
title: "Room topology: a unit holds as many rooms as its people use, addressed by room, chosen from context"
description: >
  Historically DEC-105 limited a unit to one room per platform, and DEC-214
  made startup refuse a second. Step 3 removes that refusal in favour of
  unique room labels. The reason was addressing, not storage: `send_to`
  formerly named its destination by network, making a second room a guess. Every per-room store already keys on
  (platform, conversation_id), and every unit-level store on the unit. This
  bundle lifts the limit by changing the address: `send_to` names a ROOM, the
  model chooses it from the rooms of the unit using what each room is for
  (the operator's description), what it is like (its culture) and what is
  being passed on, and asks when two rooms fit. Room names become unique
  within a unit in place of the one-per-platform refusal. Cross-room shared
  state is the unit scope of design/standing-ledger/, not a transcript feed.
  Steps 1 and 2 are merged; step 3 removes the refusal and amends the decisions.
  Live policy admission remains the operator's config change.
status: proposal
governance: operator-directed
timestamp: '2026-10-25'
origin: >
  Operator, 2026-10-25: «allow a unit to have multiple rooms across different
  platforms … in Signal, a single unit could have multiple rooms»; «we need
  cross-room visibility, but rather than a passive feed, it should act more
  like a shared state»; «I need a clean topology and hierarchy between the
  platform, the room, and the unit»; and on addressing: «when we ask "send it
  to Signal", it will collect … the current situation, the purpose, and the
  culture and [character] of different rooms, select the proper room, and send
  into it. And when it doesn't know, it will ask … on Signal we have two
  rooms: one is general … the other is for dinner things.»
