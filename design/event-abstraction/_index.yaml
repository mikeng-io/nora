kind: design_index
title: "Event Abstraction — Reminder as scheduler, Event as the dispatched kind"
description: >
  Promotes fire.py's private Occasion type into a first-class, kind-dispatched
  Event, replacing a hardcoded factory call with a registry. Reminder stays
  the pure scheduler (Shape A: it produces Events, it is not merged into one),
  gaining only kind+payload columns. The existing gathering/RSVP module, which
  already owns the name Event, renames to Gathering and becomes the registry's
  first real consumer.
status: proposed
governance: pre-governance-input
timestamp: '2026-08-22'
revision: '2026-08-27 — adversarial review (Hermes delegate) REQUEST CHANGES; all findings addressed: platform="event" sentinel fix (05), Occasion layering boundary (04), registry scoped to reminder-derived kinds (04), rename surface completed + retained spec note (02), text/payload coexistence (03), payload-shape closed (03), batching accounting documented (04), per-kind payload validation (04). Open questions resolved (00).'
origin: "brainstorming session with miles, 2026-08-22"
