scope:
  v1:
    - "Occasion promoted to Event, still private-mechanics-unchanged, now a domain type"
    - "kind -> factory registry replacing FirePath.run's hardcoded reminder_occasion call"
    - "Reminder gains kind + payload columns (defaulted, additive migration)"
    - "Heartbeat batching key gains kind to prevent mixed-kind batch misrendering"
    - "Existing gathering/RSVP Event module renamed Gathering throughout"
    - "Gathering-notify becomes kind=\"gathering\" with a denormalized title payload"
  deferred:
    - "Any non-time-triggered Event kind (still out of scope — Reminder/due_at is the only trigger)"
    - "A revisit/note-tier reminder kind (explicitly rejected in the note-tier design)"
    - "Shape B (merging Reminder into a single unified Event/EventBus type/table)"
    - "gathering_occasion's actual header/body prose"
