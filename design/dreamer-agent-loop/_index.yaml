scope:
  v1:
    - "Transport: the Dreamer gets its own, verified against the wire rather than inherited"
    - "Trigger: an adaptor declares its condition and a floor between passes; the period is NOT fixed and the shape is event-driven; did-not-fire is a third outcome"
    - "Loop: termination is a structured act whose absence fails closed; partial progress survives a bounded run"
    - "State: knowable-before is an input, discovered-during is a tool; a tier contributes read access through the existing registry seam"
    - "Measurement: every seam ships its instrument, this bundle's own change first"
    - "Phase A gains tools, and must NOT deduplicate against existing candidates"
    - "Room access splits by key kind: scope-keyed proceeds, workspace-keyed is blocked"
    - "Doctrine becomes shape-aware; the audience field stops being decorative"
    - "Migrate room-language and room-exchange onto the runtime (Phase 3)"
  deferred:
    - "BLOCKED — everything, pending one measurement: does the transport honour tool calls and carry reasoning between turns, and which token ceiling actually binds"
    - "BLOCKED — workspace-keyed room access, pending a decision on R-49's second condition (answered twice, incompatibly)"
    - "BLOCKED — the migration landing, pending a chosen global concurrency bound"
    - "Language-tier supersession (a designed cost; reversing it needs its own argument)"
    - "Entity resolution (shared dependency of three tiers, owned by nobody)"
    - "What <facts> renders at reply time"
    - "Whether the instruction digest must cover the tool subset and budget"
    - "R-57's text and DEC-135's row, both reserved and undrafted"
    - "OUT OF SCOPE — the fact tier's store"
    - "OUT OF SCOPE — Standing and the debrief (tag path, separately owned; roadmap consolidated here by agreement)"
    - "OUT OF SCOPE — game-state tools (excluded fail-closed pending a classification surface)"
    - "OUT OF SCOPE — whether the Dreamer's model changes"
