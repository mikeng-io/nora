scope:
  v1:
    - "The loop is the deliverable: an adaptor with no tools is a completion, not an agent"
    - "Knowable-before-the-call is an input; discovered-during-reasoning must be a tool"
    - "A tier contributes read tools through the existing registry seam, not a bespoke mechanism"
    - "Room access splits by key kind: scope-keyed proceeds, workspace-keyed is blocked"
    - "The egress screen does not make a room read safe; the content class is what changes"
    - "Every fix ships its own measurement"
    - "Doctrine becomes shape-aware; the audience field stops being decorative"
    - "Migrate room-language and room-exchange onto the runtime (Phase 3)"
  deferred:
    - "BLOCKED — workspace-keyed room access, pending R-49's second condition on the fact path"
    - "BLOCKED — any budget sizing, pending a gateway probe on the per-call token ceiling"
    - "BLOCKED — the migration landing, pending a chosen global concurrency bound"
    - "Language-tier supersession (a designed cost; reversing it needs its own argument)"
    - "Entity resolution mechanism (shared dependency of both tiers)"
    - "Per-adaptor cadence"
    - "What <facts> renders at reply time"
    - "Whether the instruction digest must cover the tool subset"
    - "OUT OF SCOPE — the fact tier's store"
    - "OUT OF SCOPE — Standing and the debrief (tag path, separately owned)"
    - "OUT OF SCOPE — game-state tools (excluded fail-closed pending a classification surface)"
    - "OUT OF SCOPE — whether the Dreamer's model changes"
