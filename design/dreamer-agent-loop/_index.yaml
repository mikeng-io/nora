scope:
  v1:
    - "This is the KNOWLEDGE tier: write canonical entity ids, the one column four problems bottom out in"
    - "Transport: the Dreamer gets its own, verified against the wire rather than inherited"
    - "Trigger: an adaptor declares its condition and a floor between passes; the period is NOT fixed and the shape is event-driven; did-not-fire is a third outcome"
    - "Loop: termination is a structured act whose absence fails closed; partial progress survives a bounded run"
    - "State: knowable-before is an input, discovered-during is a tool; a tier contributes read access through the existing registry seam"
    - "Measurement: every seam ships its instrument, this bundle's own change first"
    - "Phase A gains GROUNDING as an INPUT between the two extraction calls (D32 amends D5's mechanism), and must NOT deduplicate against existing candidates"
    - "Room access splits by key kind: scope-keyed proceeds, workspace-keyed is blocked"
    - "Doctrine becomes shape-aware; the audience field stops being decorative"
    - "The language tier GETS supersession — D19 reverses D9's designed cost, which had already consumed 100% of the tier's output (16 §7)"
    - "What <facts> renders is DECIDED: both a block and a verb, and the block stops being a recency slice (16 §8, 19 §6)"
    - "Entity resolution HAS an owner: the matcher is vendored, the candidate query is ours (25 §4.1)"
    - "Migrate room-language and room-exchange onto the runtime (Phase 3)"
    - "This pipeline is BUILT, not bought: no dependency on graphiti-core; exactly two files vendored (the dedup prompt + the pure matcher, 521 lines). The line is drawn by 21 §6 — the object is always a literal and their edge has no literal form (D30)"
    - "No library solves this tier: it does recall for one user, this tier adjudicates in a group; warrants, three-state verdicts, asserters and the correction loop are ABSENT upstream, not merely different (20 §6.1)"
    - "The eval corpus precedes the prompt work — without it no prompt decision here is falsifiable (D33)"
    - "The batch renders body alone; 21 §7.1 confirmed by measurement (5 person-claims of 6, roster supplied), and the person-exclusion is REFUSED at the sink with a counter"
    - "The episode is a conversational chunk (D31)"
  deferred:
    - "BLOCKED — everything, pending one measurement: does the transport honour tool calls and carry reasoning between turns, and which token ceiling actually binds"
    - "BLOCKED — workspace-keyed room access, pending a decision on R-49's second condition (answered twice, incompatibly)"
    - "BLOCKED — the migration landing, pending a chosen global concurrency bound"
    - "BLOCKED — no graded eval corpus; three prompt questions reduce to it (16 §11)"
    - "UNMEASURED — the room's literal-object rate, the reading that would have caught the shape mismatch on day one (16 §10)"
    - "UNMEASURED — the person-claim rate with speakers ABSENT; decides whether the sink refusal is backstop or primary"
    - "UNMEASURED — whether the vendored entity prompt beats one we write, on our corpus"
    - "Whether the instruction digest must cover the tool subset and budget"
    - "R-57's text and DEC-135's row, both reserved and undrafted"
    - "OUT OF SCOPE — the fact tier's store"
    - "OUT OF SCOPE — Standing and the debrief (tag path, separately owned; roadmap consolidated here by agreement)"
    - "OUT OF SCOPE — game-state tools (excluded fail-closed pending a classification surface)"
    - "OUT OF SCOPE — whether the Dreamer's model changes"
