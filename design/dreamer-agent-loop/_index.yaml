kind: design_index
title: "The Dreamer Agent Loop — Revision Bundle"
description: >
  The Dreamer was designed as a read-only research agent and built as a
  pipeline. Four of five participants make a single completion call with no
  tools; the fifth has a real loop and can only look outward at the open web.
  This bundle is a revision layer over the three 2026-08-20 specs: it records
  what is live, what was designed and never shipped, and the decisions that
  close the gap. It supersedes their framing where it conflicts and defers the
  rest.
status: proposed
governance: pre-governance-input
timestamp: '2026-08-22'
origin: >
  Investigation session with miles, 2026-08-21/22, prompted by a repeating
  MaxTokensReachedException in fact-candidates. Six parallel read-only
  investigations against the running container, the live database, the
  application log and the full design corpus.
