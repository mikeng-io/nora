kind: design_index
title: "The Dreamer Agent Loop — Revision Bundle"
description: >
  The Dreamer was designed as a read-only research agent and built as a
  pipeline. Five seams — transport, trigger, loop, state, measurement — were
  each collapsed into something else: the transport inherited from the chat
  path, the trigger reduced to a side-effect of rendering a prompt, the loop
  absent for four of five participants, state pre-rendered by code, and
  measurement blind at nine independent layers. This bundle is a revision layer
  over the three 2026-08-20 specs and the four transfer documents: it records
  what is live, what was designed and never shipped, and the decisions that
  close the gap.
status: checkpoint
governance: pre-governance-input
timestamp: '2026-08-27'
origin: >
  Investigation session with miles, 2026-08-21/22, prompted by a repeating
  token-limit failure in the fact extractor. Six parallel read-only
  investigations against the running container, the live database, the
  application log and the full design corpus; a direct handoff from the session
  that owns Standing/debrief; a study of a sibling project's built agent loop;
  then four adversarial reviews (fact-check, coherence, design-quality,
  completeness) whose corrections are folded in.
