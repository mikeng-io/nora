kind: design_index
title: "Social reads per network: x_read, x_search, linkedin_read, linkedin_search, and social_fetch retired"
description: >
  `social_fetch` has read X only since P11 of the Instagram adoption. It is
  retired and replaced by the per-network convention design
  instagram-adoption/18 set: `x_read` and `x_search` for X, and
  `linkedin_read` and `linkedin_search` for LinkedIn, all over the existing
  host-side OpenCLI bridge and the one `SocialRouter`. X lands first and
  deletes `social_fetch` in the same PR. LinkedIn lands after, once the
  account's profile viewing is set to private. Threads is out of scope:
  OpenCLI 1.8.7 has no Threads site.
status: accepted
governance: operator-directed
timestamp: '2026-09-24'
origin: >
  Operator 2026-09-24: "The Instagram tools implementation has almost come to
  an end, so I'm wondering if we should begin the separation and sunset of
  social fetch, splitting it into xfetch, xread, linkedinfetch,
  linkedinread", corrected to "x_search and linkedin_search". The operator
  logged the social Chrome into a dedicated LinkedIn account the same day,
  and the probe in 00-intent §"What LinkedIn can do today" was run on it.
