scope:
  v1:
    - "Generate a one-line catalogue for all 54 tools at doctrine order 35, reusing ToolRegistry.capability_digest() rather than writing a second renderer"
    - "Repair where_is's first sentence (measured under-discrimination against where_been) and cap recall_lookups / set_music_volume"
    - "Gate every catalogue line at <=20 tokens and the block at <=1,400"
    - "Add the load_tools verb: budget 3, non-terminal, read_only, no source_tier; R-27 status shape with partial resolve as ok"
    - "Hold non-hot schemas out of Agent(tools=...) and return them in the tool_result body, preserving the 30,080-token cached prefix"
    - "Keep six tools resident: web_search, send_reply, note_read, web_fetch, now, search_memory (55.2% of calls, 2,606 tokens); send_reply is structural, not usage-based"
    - "Raise the shared turn ceiling by the expected load_tools count (~0.8/turn) so a per-tool budget is not inert under it"
    - "Add the DEC-28 counter: turns ending without a reply while the room named a catalogued capability"
  deferred:
    - "PARKED 2026-09-22 by operator decision — relocate 8,602 tokens of result-handling prose onto tool results via the output_contract seam. Measurement retained in 03-result-handling.md (-1,746 hand-measured on three tools, ~6,970 fleet projection); not built without a fresh decision. It carried the bundle's only non-selection quality risk (LongFuncEval: 7-91% accuracy loss as responses grow)"
    - "Phase 2 — lane/room scoping beyond today's Discord music filter; value shrinks once a cold tool costs a catalogue line rather than a schema"
    - "Doctrine compression (identity 973, conduct 3,893) — separate workstream, operator-owned files"
    - "Whether doctrine rules belong on tool results too (whitefish-c0 is moving one there from the Instagram side) — separate decision, separate owner"
  not_in_scope:
    - "Deleting any tool. Over 40 days only transit, parking_status, suggest_venue and note_create are uncalled; the rest are rare, not dead"
    - "Trimming parameters. DEC-24's minimize-parameters was over-applied to external-service tools once already and reversed 2026-08-06"
    - "Anthropic server-side tool_search — Nora is on DeepSeek via OmniRoute; strands-agents 1.50.2 ships only AgentCoreToolSearchPlugin, which needs Bedrock AgentCore Gateway"
gates:
  - "2a catalogue size <=1,400 tokens (measured today: 991) — cheap, run first"
  - "2b provider accepts a tool_call for a schema delivered in a tool_result but absent from the tools array — HIGHEST RISK, single probe, run before building"
  - "2c tool-selection accuracy no worse than baseline on confusable pairs, via PR #334's tag entry point, n>=3 per case"
  - "2d load_tools is actually reached for (the DEC-28 trap; invisible to a log grep, measure on the suite)"
  - "2e cache_read_input_tokens before/after across >=20 turns, split by whether load_tools fired"
decision: >
  No DEC number claimed. Per AGENTS.md a number is taken from
  design/09-decision-index.md at MERGE time, not at claim time. Highest
  allocated at time of writing: DEC-192.
