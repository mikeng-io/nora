kind: design_index
title: "Tool Catalogue — split a tool's text by the decision it serves"
description: >
  The prompt is tool-schema-heavy, not doctrine-heavy: 22,130 of 35,473 input
  tokens (62%) are 54 tool schemas, against 8,288 for the doctrine. A tool's
  text today fuses three things and pays all three for all 54 tools every
  turn — selection (does this exist), invocation (how do I call it) and
  reporting (what does `unavailable` mean, may I read the coordinate aloud).
  54% of description text (8,602 tokens) is the third. Measured over 574
  turns, a turn uses 2 tools of 54 and 1.09 outside the hot set. So: a
  generated one-line catalogue for all 54 (991 tokens, measured) stays
  resident and a `load_tools` verb fetches full schemas on demand. Projected
  mean input ~35,500 -> ~17,700. Break-even is 46 cold tools in one turn;
  observed max is 7. The third category (result-handling relocation) is
  PARKED by operator decision 2026-09-22 — its measurement is retained in
  03-result-handling.md, its implementation is not in scope.
status: proposed-reviewed-parked-phase3
governance: draft
timestamp: '2026-09-22'
revision: >
  2026-09-22 adversarial review #1 (Kimi 0.40.1, session
  88331a01-ebb9-4408-92cf-738828db2b81): 2 PASS, 2 FAIL, 1 mixed. Absorbed:
  (a) the cache cross-check validates the SUM, not the split — overclaim
  removed from 05 §1, and the cl100k-vs-DeepSeek limit stated; (b) the cost
  model was per-call and ignored both the extra round trip and fetched-schema
  persistence — 05 §3 now gates on per-turn tokens, calls-per-turn and
  end-to-end latency, with every per-call number demoted to diagnostic;
  (c) load_tools' names list was unbounded, so budget:3 capped calls but not
  tokens — capped at 4 names/call; (d) parking cost is ~240 tok/turn after
  phase 1, not ~6,970 — 03's header corrected, which strengthens the park;
  (e) per-turn registry isolation was unspecified — now explicit in 02/04 with
  a resident-tokens gauge. REJECTED, with evidence: the review's single
  most-likely-failure ("the deferred tool is never executable; Strands cannot
  dispatch a tool it never registered") is false on this stack —
  register_dynamic_tool (registry.py:562), get_all_tool_specs re-read per call
  (event_loop.py:152/523) and dynamic_tools-first dispatch (_executor.py:142),
  confirmed by spike. The review was nonetheless right that the DRAFTED
  mechanism (schemas as text in a tool_result body) would have dead-ended at
  _executor.py:449; the mechanism was rewritten rather than the objection
  dismissed. Review #2 (Codex) abandoned — it explored the repo instead of the
  bundle, the failure mode the scenarios-not-code rule exists to prevent.
origin: >
  design conversation with miles, 2026-09-22 — opened as doctrine compression
  ("even the simplest conversation hits over 30,000 input tokens"), redirected
  by measurement to the tool schemas, then redirected again by miles ("have you
  actually searched online for the proper convention?") to the published
  deferred-loading threshold, which Nora is 5x past on tool count and 2.2x on
  definition tokens.
