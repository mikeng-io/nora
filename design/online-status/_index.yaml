kind: design_index
title: "Online Status — digital activity state as a tool surface"
description: >
  Gives Nora a read-only tool that answers "who is online / who is playing /
  who is in voice" from Steam Web API and Discord gateway state. One tool, a
  closed `what` vocabulary, mirroring `where_been`'s shape. Consumers: the
  proactive decide turn (the #248 failure family), and eventually tag turns.
  Excludes spatial presence (`where_is`/`where_been` own that dimension).
status: proposed
governance: pre-governance-input
timestamp: '2026-09-15'
revision: '2026-09-15 — initial draft after operator direction in #nora thread; naming discussion narrowed to `online_now`/`now_playing` family (mechanism names steam_status/discord_status rejected).'
origin: "operator session 2026-09-15: Nora could have known the group was playing while a note said Blake was sick (#248)"
