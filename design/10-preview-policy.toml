# PREVIEW — proposed shape for policy.toml (design/10-identity-and-policy-schema.md).
# Not loaded by anything yet.
#
# WHAT IS ALLOWED. Separate from config.toml (deploy cadence) and identity.toml
# (changes when a human joins) because policy changes when TRUST changes — the
# same argument DEC-8 used to split config from identity. An allowlist buried
# among port numbers is an allowlist nobody reviews.
#
# Everything here refers to people by person_id from identity.toml, never by a
# phone number or a platform id. Adding Miles's Discord account to identity.toml
# therefore grants him access everywhere `miles` is already allowed — one edit,
# not one per room — and this file stays readable without knowing anyone's
# phone number.

# Deny by default. An empty file means nothing is allowed, and Nora REFUSES TO
# START rather than running mute: under R-5 she is silent when broken, so a
# silently-denied Nora is indistinguishable from a working one. A loud startup
# error is the only honest failure here.
default = "deny"

# ─────────────────────────────────────────────────────────────────────────────
# 1. PRINCIPALS — who may talk to Nora directly (DMs)
#
# A DM has no stable conversation id to allowlist; its identity IS the person.
# That is why this is its own list rather than a [[conversations]] entry with a
# synthetic id.
#
# FORWARD-LOOKING: nora/platform/signal/parser.py drops every non-group message
# today ("DM — out of scope in v2"). This section is parsed and validated now so
# the DM path has something to satisfy when it lands. Nora warns at startup if
# this is non-empty while DMs are still dropped, rather than silently doing
# nothing.
[dm]
persons = ["miles"]        # person_ids. [] means Nora accepts no DMs at all.

# ─────────────────────────────────────────────────────────────────────────────
# 2. CONVERSATIONS — which rooms Nora participates in, and who within them
#
# `id` is the canonical conversation_id, exactly as it appears in the audit DB:
#   signal    groupId, base64            -> `nora groups` prints it beside the name
#   telegram  chat.id, stringified int   -> negative for groups/supergroups
#   discord   "<guild_id>/<channel_id>"  -> the adapter flattens the hierarchy
#   whatsapp  group JID, ...@g.us

[[conversations]]
platform = "signal"
id       = "Q2hhdEdyb3VwSWRFeGFtcGxlQmFzZTY0PT0="
label    = "Family"                     # for humans reading this file.
                                        # NEVER matched on — group names are not
                                        # unique and are trivially changed.
persons  = ["miles", "ada"]              # only these two may trigger Nora here.
                                        # A new group member is ignored until
                                        # you add them. Safer default.

[[conversations]]
platform = "telegram"
id       = "-1001234567890"
also_ids = ["-987654321"]               # Telegram CHANGES chat.id when a group
                                        # is upgraded to a supergroup, reporting
                                        # the old id once via migrate_to_chat_id.
                                        # Without this the allowlist silently
                                        # stops matching and Nora goes quiet —
                                        # invisible under R-5.
label    = "Work"
persons  = "*"                          # anyone in this chat may trigger her.
                                        # Does NOT disable the room allowlist;
                                        # unmapped senders still get no Honcho
                                        # feed (D6), they are just not refused.

[[conversations]]
platform = "discord"
id       = "9876543210/1234567890"      # guild/channel. conversation_id stays a
                                        # FLAT string — it is the SQLite column,
                                        # its ts DESC index, R-3's send target
                                        # and the debounce key. The adapter
                                        # canonicalises; the domain never learns
                                        # about hierarchy.
label    = "#general in Ridgeline"
persons  = ["miles"]

# ─────────────────────────────────────────────────────────────────────────────
# NOT SUPPORTED, deliberately:
#
#   roles = ["family"]      -> arbitrary named roles exist only on Discord.
#   admins = true           -> would grant on membership status.
#
# Membership IS normalised in the domain to exactly two values, admin | member
# (owner/creator/superadmin all collapse into admin, because signal-cli cannot
# distinguish a group's creator from any other admin — a three-value set would
# ship a value that silently never matches on Signal).
#
# But policy does not GRANT on it, for two reasons:
#
#   - Hot-path I/O. "Is this sender an admin?" is a per-message platform lookup
#     on Telegram and often on Signal. Every ambient message would pay a round
#     trip on the path that must not stall the SSE reader.
#   - Delegation. Granting by membership hands authorisation to whoever can
#     promote a group admin, so this file would stop being a complete
#     description of who has access.
#
# Membership is carried for the control plane — `nora groups` showing
# "Family — 3 members, you are an admin". Adding `admins = true` later is a
# one-line change to the grant predicate; nothing here forecloses it.
