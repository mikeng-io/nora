kind: design_index
title: "Recommendations: likes from profiles, one ranker and recommendation types as data"
description: >
  Recommendations proposes ranked choices for a group and supports personalisation.
  The future code home is nora/recommend/. Likes is a read view of profile
  facts, traits and guesses, with cited evidence and uncertainty, not a second
  preference store. One ranker destination-filters inputs, computes features,
  applies group fairness and records reasons in a Standing decision.
  Recommendation types are data (venues and games). Learning from picks reads
  linked recommendation sends with tell/ask intent preserved. Replay freezes
  recorded-time revisions before the choice. Prompt items name their subjects
  and author by id under ADR 0029. Proposal only, not implemented.
status: proposal
governance: operator-directed
timestamp: '2026-10-25'
origin: >
  Operator, 2026-10-25: «making Nora a genuine AI member and assistant inside
  the room … most importantly, recommendations»; the game case («members
  frequently send gaming links on Instagram … search for similar titles, make
  recommendations») and the Halloween case («taking our locations,
  conversation, routes, and schedules into account»); «personalisation
  recommendation is still the same thing; it just has a different outcome»;
  «it should be an abstracted engine»; «social engagement also puts signal
  into the engine». Names settled by the operator on 2026-10-25: recommendations,
  likes, recommendation type and learning from picks; prompt identities follow ADR 0029.
