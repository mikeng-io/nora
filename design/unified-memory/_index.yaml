---
type: design_index
title: "Unified memory — one memory of her own, searched in one way"
description: >
  Retire Honcho and give Nora one memory system: every store stays its own
  table, and a memory graph (one node per item, a closed set of edge
  relations, citations written with their entries) indexes and connects them
  behind one retrieval service (scope, hybrid seed, graph expansion, optional
  rerank). Persona (ruled 2026-10-15) composes identity, character and
  abduced hypotheses into one account per actor (humans, Nora, other agents)
  and collective (rooms, units), widening the Character tier. Amended
  2026-10-15 on an audit: the unit is the read boundary (lineage stays off),
  a deleted message is hidden and nothing derived is withdrawn, graph
  expansion has adaptive depth with scope on every node, hypotheses are
  graded by a judge other than their writer, and shadow changes no prompt.
  Records the measured
  Honcho audit, the memory map, a retrieval-stack bake-off plan (trigram vs
  BM25; bge-m3, EmbeddingGemma 2, WeMM-Embedding; fusion; reranker) and
  October 2026 prior art. The Persona adaptor, the prompt switch and the
  index projection are built (steps 6 and 8); 70 prepares step 9, the Honcho
  cutover, which is not executed.
status: proposed
governance: operator-directed
timestamp: '2026-10-14'
origin: >
  Operator, 2026-10-14, after the public-release scrub: retire Honcho, make
  every state store one coherent, uniformly searchable memory covering people,
  rooms and the workspace, add abduction to the Dreamer, and do this before
  social engagement and personalisation.
