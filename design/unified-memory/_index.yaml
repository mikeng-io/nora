open_questions:
  - id: Q1
    question: "Answerability thresholds and question-set construction"
    status: decided
    decision: "Current bounded acceptance, frozen comparisons and grounding requirements are owned by 31-build-one-session.md §6; older fixed parity/sample formulas are historical."
  - id: Q2
    question: "Character session shape: pushed bundle or bounded tool-using session?"
    status: decided
    decision: "29-one-cognition-session.md owns the current single wake-session contract, with pushed context, bounded scoped tools and in-session admission/profile maintenance; no separate profile reasoning driver is introduced."
  - id: Q3
    question: "Source-rechecked Honcho explicit observations as seed readings, or measurement reference only?"
    status: decided
    decision: "Honcho observations are measurement references, never imported conclusions. Any future seed decision requires source rechecking and its own evidence; 31 §6 owns current acceptance."
  - id: Q4
    question: "Reading model and budget"
    status: decided
    decision: "The original extraction experiment selected DeepSeek V4.1 Flash and required measured input/output cost before budgeting. Current session settings and spend authorization follow the deployed configuration and 31, not a historical model name."
  - id: Q5
    question: "Reading granularity: per message or per batch with interleaved context as Honcho?"
    status: decided
    decision: "Understand batches in their conversation context, with every statement tied to its own source ids; 29 owns wake scheduling and source custody."
