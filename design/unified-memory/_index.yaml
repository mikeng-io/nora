open_questions:
  - id: Q1
    question: "Answerability thresholds and question-set construction"
    status: decided
    decision: "The question set is built and frozen before any run; it is not edited after the first answer is seen. Pass requires the new Views' answer to be judged blind as at least as good as Honcho's dialectic on ≥80% of questions, AND the new Views' error rate <5%. An error is an answer asserting something its sources do not support. Both must hold."
  - id: Q2
    question: "Character session shape: pushed bundle or bounded tool-using session?"
    status: decided
    decision: "The session follows Honcho's pattern: it is pushed the readings since its last session, has read tools over older readings and messages with a bounded number of iterations, and ends in one settle write (today `persona_write`). There is still one writer per tier; no new writer."
  - id: Q3
    question: "Source-rechecked Honcho explicit observations as seed readings, or measurement reference only?"
    status: decided
    decision: "Honcho's observations are used only as the measurement reference for the first measure (the Q1 gate and coverage comparisons). Nothing is imported. Whether to seed, only with each observation re-checked against its source message, is decided on that first measure's result."
  - id: Q4
    question: "Reading model and budget"
    status: decided
    decision: "The reading model is DeepSeek V4.1 Flash. The budget is not set now: the first deliverable of phase 2 is to measure real input/output tokens over one day of live messages, then fill in the existing formula C = (I × Pᵢ + O × Pₒ) / 1,000,000 and set the budget from that measurement."
  - id: Q5
    question: "Reading granularity: per message or per batch with interleaved context as Honcho?"
    status: decided
    decision: "Readings are per batch, with the surrounding conversation as context, as Honcho does: a reply like “me too” only means something in context, and this uses fewer calls. Every claim in a reading is still tied to its own source message ids, so per-message citation and the visibility retirement rule are unchanged."
