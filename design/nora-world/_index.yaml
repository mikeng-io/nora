kind: design_index
title: "Nora World — a 3D place that is a View of her Notebook"
description: >
  A shared 3D web world, reached from the portal with Discord sign-in, whose
  fixed hand-built base is filled and changed by Nora's judgement. The world
  is never a store of its own: it is a portal View (cognition-loop 05 §6),
  assembled per viewer from the Notebook and the Rollup under lineage and
  withdrawal, so nothing from the Record reaches it and a withdrawn entry
  takes its object with it. Nora decides what should exist by writing a
  short spec; a deferred-job pipeline turns the spec into a 3D item (library
  search, a picture on a stock object, or Hunyuan3D on Modal as the last
  resort), checks it with a vision model, and caches it. Avatars have two
  layers: the person's own body, which Nora never changes, and Nora's
  reading of them, which the person may hide. The first building is a shared
  venue for karaoke and concerts, where every WebRTC path is ours, so the
  backing track is a local file on every client and a singer's voice is
  aligned by song position, not by arrival time. Parked: the base, the
  avatars and the venue can be built now; the projection waits for the
  Notebook's kinds to converge on the entry.
status: proposed
governance: pre-governance-input
