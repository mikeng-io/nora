kind: design_index
title: "Standing Compact — the room's working state, one call, with a clock"
description: >
  Standing is repositioned as the COMPACT of Nora's work in a room: what she
  is holding open, what she has committed to, and what she found on a turn and
  has not yet given the room. The fold keeps its one job and loses the second
  call: the grounding verdict and the re-derivation it triggered are deleted,
  because in production the verdict never discriminated and the one time it
  fired in the sampled window it was wrong and cost the position. The fold's
  input gains what its judgement turns on — when the prior was written, and
  the tool results of the turn at a size that carries them — and its steps
  block says what it holds on THIS turn rather than asserting a reasoning the
  model may not have produced.
status: accepted
governance: operator-directed
timestamp: '2026-09-24'
origin: >
  Operator 2026-09-24, after reading back the last 20 engagement turns in
  Langfuse: "the judge is useless"; "can the leftover tool results be
  distilled into standing, like a compact — searches that found restaurants
  but did not send them all"; "the model no longer produces reasoning, so what
  is standing's position and coordination"; "make the reasoning part depend on
  whether there is reasoning". Related: #189 (tool results clipped
  uncounted — the clip is now counted, this bundle raises the bound), #222
  (standing repair — revision chain, TTL, trigger; NOT done here).
