kind: design_index
title: "The Dream Conductor — one event-driven Dreamer, many bounded specialists"
description: >
  The Dreamer grew one adaptor per job, each on its own clock: note-candidates,
  note-curation, note-merge, culture and proactive, beside the Standing folds
  and the participation gate that run off the clock. Two more jobs are wanted
  (an event pass that finds gatherings in the transcript, and a memo pass that
  keeps what the group settled), which would make seven clocked passes each
  re-reading the same new messages. This bundle replaces the clocks with ONE
  trigger seam fired by ingest, and puts ONE conductor per unit in front of
  the passes: it reads the change once, plans which specialists the change
  needs, and code dispatches them. The specialists are the existing adaptors,
  kept whole — objective, grant, budget, envelope, accept, commit and eval
  suite — so the refactor is of the RUNTIME around the adaptors, not of the
  adaptors. It also fixes the vocabulary the two new jobs need: a MEMO is a
  settled thing the group wants kept, a NOTE stays what it is (a thing the
  room must not drop, with a closing condition), and an IDEA is not a type.
status: proposed
governance: operator-directed
timestamp: '2026-09-27'
origin: >
  Operator 2026-09-27: "there is already quite a lot of dreamer runtime …
  what we are missing is the event dreamer"; "the current note is more like an
  idea (an open item), whereas a note should be a real note, jotting down what
  needs to be … remembered"; "if we add an event dreamer that repeats
  note-related operations … we will end up with 9 or 10 dreamers, which is
  very hard to manage. My goal is to centralise this into one dynamic,
  adaptive, deep reasoning agent loop … It should not run on a schedule:
  event-driven, adaptive, message-sensitive." Options compared in session
  (status quo / one agent / Strands Swarm / conductor + specialists); the
  operator chose the conductor ("I prefer D"), the Strands Agents SDK, and for
  the event pass: "by the dreamer, can be staged, proposed, or evicted".
  Builds on design/dreamer-agent-loop/06 (event-driven trigger, never built)
  and 43 (the passes are research loops).
