name: Bug report
description: Report a reproducible problem.
labels:
- bug
body:
- type: markdown
  attributes:
    value: Do not include credentials, private messages, account identifiers or location
      data. Report security vulnerabilities through SECURITY.md instead of a public
      issue.
- type: textarea
  id: description
  attributes:
    label: Description
    description: What went wrong?
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps to reproduce
    description: Give the smallest reproducible steps, using synthetic data.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    description: What should happen?
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior
    description: What happened instead? Include sanitized error output if useful.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Version and environment
    description: Nora version or commit, operating system and affected platform.
  validations:
    required: true
