name: Maintainers — Gap (freeform — proposing the decision)
description: "Maintainers only: Something is wrong or missing, and no design document has specified it yet. The issue is the candidate."
labels: ["freeform"]
body:
  - type: markdown
    attributes:
      value: |
        Stated as a fact about what is wrong, not as a task — and the title is
        `<Area>: <the gap>` (e.g. `Note tier: discharge pipeline — route settled
        note content on close`). The full reasoning behind every heading below
        lives in `docs/maintainers/conventions.md` §Issues.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which subsystem owns this gap? (Anchors the title prefix and grep — it is recorded in the body, it is not a label.)
      options:
        - agent (tag turn / tools / agent loop)
        - participation (ambient / proactive / decision log)
        - notes (write / retire / merge)
        - doctrine (voice / conduct / silence / constraints / version pins)
        - cognition (adaptors / schedules / prompts)
        - relevance-gate
        - discord (channels / voice / mentions / portal)
        - signal / whatsapp (platforms, signal-cli, bridges)
        - media (describe / image-gen / STT-TTS / custody)
        - presence-analytics (places / stays / dashboards)
        - portal (nora-app web)
        - search (exa / tavily / web tools)
        - memory (honcho / recall / prefill)
        - observability (tracing / logging / alerts / sentry)
        - release-and-version (release-please / build stamp / deploy)
        - skills (runtime skill library)
        - repo-hygiene (CONTRIBUTING / tests layout / gates / scripts)
        - design-only (a design bundle, no code change)
        - other (say what in the body — prefer an area above)
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What
      description: What is broken or missing today, with file:line references where they exist.
      placeholder: |
        e.g. `test_every_skill_stays_small` (tests/test_skill_content.py:81)
        counts non-blank LINES; a reflow buys budget with no content added.
    validations:
      required: true

  - type: textarea
    id: why-blocks
    attributes:
      label: Why the current shape blocks it
      description: The mechanism, not the annoyance — why nothing downstream can proceed as-is.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: Shape
      description: The proposed shape of the fix. "Undecided" is a valid answer — then this issue proposes the decision.
    validations:
      required: true

  - type: textarea
    id: decisions
    attributes:
      label: Decisions to record
      description: What must be decided before this is buildable; "#TBD" until it is.
    validations:
      required: true

  - type: textarea
    id: not-in-this-issue
    attributes:
      label: Not in this issue
      description: The adjacent thing the next reader will suggest folding in — scope it out here, in one line each.
    validations:
      required: true
