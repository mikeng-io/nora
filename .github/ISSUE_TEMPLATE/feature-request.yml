name: Feature request
description: Suggest an improvement.
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: Do not include credentials, private messages, account identifiers or location
      data. Report security vulnerabilities through SECURITY.md instead of a public
      issue.
- type: textarea
  id: problem
  attributes:
    label: Problem
    description: What are you trying to do, and what gets in the way?
  validations:
    required: true
- type: textarea
  id: solution
  attributes:
    label: Proposed solution
    description: Describe the outcome you would like. Implementation details are optional.
  validations:
    required: true
