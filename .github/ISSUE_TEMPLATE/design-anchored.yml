name: Maintainers — Gap (design-anchored — a design document already specified this)
description: "Maintainers only: The bundle and section exist; this issue tracks building to that spec."
title: "Area: "
labels: ["design-anchored"]
body:
  - type: markdown
    attributes:
      value: |
        Title is still `<Area>: <the gap>`. Every heading below is declared in
        `docs/maintainers/conventions.md` §Issues; the reasoning lives there.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which subsystem? Recorded in the body and mapped to existing area labels.
      options:
        - agent (tag turn / tools / agent loop)
        - participation (ambient / proactive / decision log)
        - notes (write / retire / merge)
        - doctrine (voice / conduct / silence / constraints / version pins)
        - cognition (adaptors / schedules / prompts)
        - relevance-gate
        - discord (channels / voice / mentions / portal)
        - signal / whatsapp (platforms, signal-cli, bridges)
        - media (describe / image-gen / STT-TTS / custody)
        - presence-analytics (places / stays / dashboards)
        - portal (nora-app web)
        - search (exa / tavily / web tools)
        - memory (honcho / recall / prefill)
        - observability (tracing / logging / alerts / sentry)
        - release-and-version (release-please / build stamp / deploy)
        - skills (runtime skill library)
        - repo-hygiene (CONTRIBUTING / tests layout / gates / scripts)
        - design-only (a design bundle, no code change)
        - other (say what in the body — prefer an area above)
    validations:
      required: true

  - type: input
    id: design
    attributes:
      label: Design anchor
      description: "`design/<bundle>/<NN-name>.md` §<n> — the section this issue builds."
      placeholder: design/culture-tier/01-the-adaptor.md §3
    validations:
      required: true

  - type: textarea
    id: what-it-covers
    attributes:
      label: What it covers
      description: One line on what the anchored section settles.
    validations:
      required: true

  - type: textarea
    id: gap
    attributes:
      label: The gap
      description: What is broken or missing today, with file:line references.
    validations:
      required: true

  - type: textarea
    id: specified
    attributes:
      label: "What's specified (decided, not open)"
      description: The settled shape, as bullets. Nothing here is up for re-deciding in this issue.
    validations:
      required: true

  - type: textarea
    id: not-built
    attributes:
      label: Not built
      description: What does not exist yet. "Nothing" is a valid answer — write it.
    validations:
      required: true

  - type: textarea
    id: depends
    attributes:
      label: Depends on / feeds
      description: Cross-issue dependencies; "#TBD" until the other issue exists.
    validations:
      required: true
