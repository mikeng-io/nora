name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      readers: ${{ steps.plan.outputs.readers }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      testmon: ${{ steps.plan.outputs.testmon }}
      release_eligible: ${{ steps.plan.outputs.release_eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 -m scripts.ci_plan

  python:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['python']) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 4 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen --extra evals
      - run: make lint typecheck imports
      - name: Changed documents follow docs/engineering/documents.md
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
          uv run python -m scripts.check_documents --base ${{ github.event.pull_request.base.sha }}

  contracts:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['contracts']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    env:
      NORA_TEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen --extra evals
      - name: Architecture and documentation contracts
        if: github.event_name == 'workflow_dispatch' && needs.classify.outputs.readers != '"ALL"' && needs.classify.outputs.docs_only != 'true' && needs.classify.result == 'success'
        run: >-
          uv run pytest -q
          tests/architecture/test_contribution_conventions.py
          tests/architecture/test_contribution_content.py
          tests/architecture/test_public_repository_settings.py
          tests/architecture/test_release_scope.py
          tests/architecture/test_release_config_matches_the_repo.py
          tests/architecture/test_release_plan.py
          tests/architecture/test_ci_plan.py
          tests/architecture/test_ci_backend_acceptance.py
          tests/architecture/test_ci_runs_the_plumbing_guards.py
          tests/architecture/test_pr_triage.py
          tests/architecture/test_commit_body_rule.py
          tests/architecture/test_dockerfile_bases_are_pinned.py
          tests/architecture/test_runtime_imports_are_runtime_dependencies.py
          tests/architecture/test_doc_references_resolve.py
          tests/architecture/test_documents.py
          tests/architecture/test_generated_docs.py
          tests/test_architecture_doc.py tests/test_docs.py
          tests/test_boundaries.py tests/test_deploy_assets.py
          tests/unit/test_release_deployment.py tests/unit/test_verify_deploy.py
      - name: Fast backend baseline
        if: github.event_name != 'workflow_dispatch'
        run: uv run python -m scripts.ci_fast_tests


  portal:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['portal']) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 4 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: npm ci --prefix app
      - run: npm run check --prefix app
      - run: npm run build --prefix app

  portal-browser:
    needs: classify
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['portal-browser']) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 90 || 15 }}
    permissions:
      contents: read
      actions: read
    env:
      NORA_TEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: uv sync --frozen --extra evals
      - run: npm ci --prefix app
      - name: Install the pinned Chromium the portal driver launches
        run: npm exec --prefix app -- playwright install --with-deps chromium
      - name: Pull the pinned journey images
        run: |
          docker pull "$(cat deploy/postgres/image)"
          docker pull oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
          docker pull oryd/keto:v26.2.0@sha256:bfdb8b9e283aedbd9e1d005c44eb1bbefd2096b2cb5b5aa0b7360b6e39c178d2
      - name: Scoped web retrieval browser journey
        env:
          NORA_TEST_CHROME_REQUIRED: '1'
        run: |
          export NORA_TEST_CHROME="$(node -e 'process.stdout.write(require("./app/node_modules/playwright").chromium.executablePath())')"
          uv run python -m scripts.pytest_gate tests/integration/test_web_browse_journey.py
      - name: Managed portal browser journey
        run: uv run python -m scripts.pytest_gate tests/integration/test_managed_portal_browser.py
      - name: Upload browser journey evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: portal-browser-evidence
          path: /tmp/nora-managed-intake/nor6-portal-browser
          if-no-files-found: ignore

  go:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['go']) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 4 }}
    strategy:
      matrix:
        module: [deploy/instagram-bridge, deploy/http-egress]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go test ./...
        working-directory: ${{ matrix.module }}

  dependency-review:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['dependency-review']) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 4 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
      - name: No PR dependency delta on baseline events
        if: github.event_name != 'pull_request'
        run: echo 'Dependency review applies to pull requests only'

  codeql-python:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['codeql-python']) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 4 }}
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: python
          build-mode: none
          config-file: ./.github/codeql/config.yml
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:python
          output: .codeql-results
      - name: Block high or critical findings on added PR lines
        run: python3 -m scripts.ci_plan codeql

  codeql-javascript:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['codeql-javascript']) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 4 }}
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/config.yml
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:javascript-typescript
          output: .codeql-results
      - name: Block high or critical findings on added PR lines
        run: python3 -m scripts.ci_plan codeql

  codeql-go:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['codeql-go']) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 4 }}
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      matrix:
        module: [deploy/instagram-bridge, deploy/http-egress]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: go
          build-mode: manual
          config-file: ./.github/codeql/config.yml
      - run: go build ./...
        working-directory: ${{ matrix.module }}
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:go/module:${{ matrix.module }}
          output: .codeql-results
      - name: Block high or critical findings on added PR lines
        run: python3 -m scripts.ci_plan codeql

  codeql-actions:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['codeql-actions']) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 4 }}
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: actions
          build-mode: none
          config-file: ./.github/codeql/config.yml
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:actions
          output: .codeql-results
      - name: Block high or critical findings on added PR lines
        run: python3 -m scripts.ci_plan codeql

  ory:
    needs: classify
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['ory']) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 90 || 5 }}
    permissions:
      contents: read
      actions: read
    env:
      NORA_TEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen --extra evals
      - name: Match the audited Periphery Compose CLI
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64 \
            -o "$RUNNER_TEMP/docker-compose"
          echo "c57ab918abd5b05ca7e7d0f275875dd1330a695074f309dc9eab1b49efafcd4b  $RUNNER_TEMP/docker-compose" | sha256sum --check
          install -m 755 "$RUNNER_TEMP/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - id: ory
        name: Start disposable pinned Ory services
        run: docker compose -p nora-ory-contract -f deploy/ory/compose.yaml up -d --wait --wait-timeout 90
      - name: Execute policy and production-client contracts
        run: |
          uv run python -m scripts.check_ory_policy --read-url http://127.0.0.1:4466 --write-url http://127.0.0.1:4467
          uv run python -m scripts.check_ory_clients --kratos-url http://127.0.0.1:4434 --keto-read-url http://127.0.0.1:4466 --keto-write-url http://127.0.0.1:4467
      - name: Managed identity contracts
        if: github.event_name != 'workflow_dispatch'
        run: >-
          uv run python -m scripts.pytest_gate
          --junit-dir backend-results
          tests/contract/test_binding_store_contract.py
          tests/contract/test_authority_backend_contract.py
          tests/contract/test_admission_identity_contract.py
          tests/contract/test_admission_probe_contract.py
          tests/infra/test_managed_admission_sql.py
          tests/integration/test_managed_admission_ory.py
          tests/integration/test_managed_identity_journey.py
          tests/integration/test_managed_runtime_recovery.py
          tests/integration/test_managed_community_cost.py
          tests/integration/test_managed_lineage.py
          tests/integration/test_managed_presence.py
          tests/integration/test_managed_routes.py
          tests/contract/test_binding_store_scoped_contract.py
          tests/infra/test_account_link_requests.py
          tests/infra/test_link_publication_sql.py
          tests/infra/test_managed_otp.py
          tests/infra/test_managed_mutation_gate.py
          tests/infra/test_kratos_identity_contract.py
          tests/infra/test_roster_provisioning_sql.py
          tests/infra/test_otp.py
          tests/architecture/test_port_fakes_live_in_nora_testing.py
          tests/architecture/test_ory_ci.py
      - name: Install Redis for isolated eval subjects
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: '24.22.1'
      - name: Install portal browser test dependencies
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm ci --prefix app
          npm exec --prefix app -- playwright install --with-deps chromium
      - name: Selected backend acceptance
        if: github.event_name == 'workflow_dispatch'
        env:
          READERS: ${{ needs.classify.outputs.readers }}
          TESTMON: ${{ needs.classify.outputs.testmon }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          uv run python - <<'PYTEST'
          import json, os, subprocess, sys
          targets = json.loads(os.environ['READERS'])
          if targets != 'ALL' and os.environ.get('TESTMON') == 'true':
              from pathlib import Path
              if Path('.testmondata').is_file():
                  done = subprocess.run(
                      [sys.executable, 'scripts/affected_tests.py', '--base', os.environ['BASE_SHA']],
                      capture_output=True, text=True,
                  )
                  line = done.stdout.strip()
                  if done.returncode or not line or line == 'ALL':
                      targets = 'ALL'
                  elif line != 'NONE':
                      targets = line.split()
                  else:
                      targets = []
              else:
                  targets = 'ALL'
          command = (
              [sys.executable, '-m', 'scripts.pytest_gate', '--junit-dir', 'backend-results']
              if targets == 'ALL'
              else [sys.executable, '-m', 'scripts.pytest_gate', '--junit-dir', 'backend-results', *targets]
              if targets
              else None
          )
          if command is not None:
              if os.environ.get('EVENT_NAME') in ('push', 'schedule', 'workflow_dispatch'):
                  command.append('--testmon')
              subprocess.run(command, check=True)
          PYTEST

      - id: dephash
        # a partial record (failed run) would lie about coverage: upload only
        # when every previous step succeeded
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && success() }}
        run: echo "hash=$(uv run python -m scripts.testmon_record hash)" >> "$GITHUB_OUTPUT"
      - name: Upload dependency record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && success() }}
        with:
          name: testmon-data-${{ steps.dephash.outputs.hash }}-${{ github.sha }}
          path: .testmondata
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      - name: Per-file durations
        if: ${{ !cancelled() }}
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, shutil, xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path
          for receipt in Path(".git").glob("nora-test-cost-*.json"):
              Path("backend-results").mkdir(exist_ok=True)
              shutil.copyfile(receipt, Path("backend-results") / receipt.name)
          files, outcomes = Counter(), Counter()
          for report in sorted(Path("backend-results").glob("*.xml")):
              for case in ET.parse(report).iter("testcase"):
                  files[case.get("file") or "<no file>"] += float(case.get("time") or 0)
                  outcomes[next((c.tag for c in case if c.tag in ("failure", "error", "skipped")), "passed")] += 1
          Path("test-durations.json").write_text(json.dumps(dict(sorted(files.items())), indent=1))
          total = sum(files.values())
          print(f"Outcomes: {dict(outcomes)}  \nFiles: {len(files)}  \nSummed test time: {total/60:.1f} min\n")
          print("| seconds | file |\n|---:|---|")
          for name, seconds in files.most_common(30):
              print(f"| {seconds:.1f} | {name} |")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: backend-acceptance
          path: |
            backend-results/*
            test-durations.json

      - name: Read disposable service failures
        if: failure() && steps.ory.outcome != 'skipped' && steps.ory.outcome != ''
        run: docker compose -p nora-ory-contract -f deploy/ory/compose.yaml logs --no-color
      - name: Remove disposable services and data
        if: always() && steps.ory.outcome != 'skipped' && steps.ory.outcome != ''
        run: docker compose -p nora-ory-contract -f deploy/ory/compose.yaml down -v

  ory-journey:
    needs: classify
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['ory-journey']) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 90 || 5 }}
    permissions:
      contents: read
      actions: read
    env:
      NORA_TEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen --extra evals
      - name: Match the audited Periphery Compose CLI
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64 \
            -o "$RUNNER_TEMP/docker-compose"
          echo "c57ab918abd5b05ca7e7d0f275875dd1330a695074f309dc9eab1b49efafcd4b  $RUNNER_TEMP/docker-compose" | sha256sum --check
          install -m 755 "$RUNNER_TEMP/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - id: ory
        name: Start disposable pinned Ory services
        run: docker compose -p nora-ory-contract -f deploy/ory/compose.yaml up -d --wait --wait-timeout 90
      - name: Execute policy and production-client contracts
        run: |
          uv run python -m scripts.check_ory_policy --read-url http://127.0.0.1:4466 --write-url http://127.0.0.1:4467
          uv run python -m scripts.check_ory_clients --kratos-url http://127.0.0.1:4434 --keto-read-url http://127.0.0.1:4466 --keto-write-url http://127.0.0.1:4467
      - name: Managed identity contracts
        if: github.event_name != 'workflow_dispatch'
        run: >-
          uv run python -m scripts.pytest_gate
          --junit-dir backend-results
          tests/integration/test_managed_export_ory.py
          tests/integration/test_managed_identity_restore.py
          tests/integration/test_managed_analytics.py
          tests/integration/test_managed_circle_cost.py
          tests/integration/test_managed_collective_identity.py
          tests/integration/test_managed_ingest_authority.py
          tests/integration/test_platform_observation_ingest.py
          tests/web/test_management_bootstrap.py
          tests/web/test_management_auth_bootstrap.py
          tests/web/test_management_sessions.py
          tests/web/test_management_operator.py
          tests/web/test_managed_viewer.py
          tests/web/test_managed_otp_flow.py
          tests/web/test_managed_ory_credentials.py
          tests/web/test_roster_provisioning.py
          tests/web/test_holder_links.py
          tests/web/test_otp.py
          tests/web/test_management_api.py
          tests/unit/test_roster_sources.py
          tests/unit/test_managed_authority.py
          tests/unit/test_managed_identity_handoff.py
          tests/unit/test_managed_registration.py
          tests/unit/test_account_linking_state.py
          tests/unit/test_holder_link.py
          tests/unit/test_grouped_account_observation.py
          tests/unit/test_link_publication.py
          tests/unit/test_management_request.py
          tests/unit/test_management_authentication.py
          tests/domain/test_management.py
      - name: Per-file durations
        if: ${{ !cancelled() }}
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, shutil, xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path
          for receipt in Path(".git").glob("nora-test-cost-*.json"):
              Path("backend-results").mkdir(exist_ok=True)
              shutil.copyfile(receipt, Path("backend-results") / receipt.name)
          files, outcomes = Counter(), Counter()
          for report in sorted(Path("backend-results").glob("*.xml")):
              for case in ET.parse(report).iter("testcase"):
                  files[case.get("file") or "<no file>"] += float(case.get("time") or 0)
                  outcomes[next((c.tag for c in case if c.tag in ("failure", "error", "skipped")), "passed")] += 1
          Path("test-durations.json").write_text(json.dumps(dict(sorted(files.items())), indent=1))
          total = sum(files.values())
          print(f"Outcomes: {dict(outcomes)}  \nFiles: {len(files)}  \nSummed test time: {total/60:.1f} min\n")
          print("| seconds | file |\n|---:|---|")
          for name, seconds in files.most_common(30):
              print(f"| {seconds:.1f} | {name} |")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: backend-acceptance-ory-journey
          path: |
            backend-results/*
            test-durations.json

      - name: Read disposable service failures
        if: failure() && steps.ory.outcome != 'skipped' && steps.ory.outcome != ''
        run: docker compose -p nora-ory-contract -f deploy/ory/compose.yaml logs --no-color
      - name: Remove disposable services and data
        if: always() && steps.ory.outcome != 'skipped' && steps.ory.outcome != ''
        run: docker compose -p nora-ory-contract -f deploy/ory/compose.yaml down -v

  checks:
    timeout-minutes: 1
    if: always()
    needs: [classify, python, contracts, ory, ory-journey, portal, portal-browser, go, dependency-review, codeql-python, codeql-javascript, codeql-go, codeql-actions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject failed, cancelled, missing or unexpectedly skipped selected jobs
        env:
          PLAN: ${{ needs.classify.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -m scripts.ci_plan verify
