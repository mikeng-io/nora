name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      readers: ${{ steps.plan.outputs.readers }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      testmon: ${{ steps.plan.outputs.testmon }}
      release_eligible: ${{ steps.plan.outputs.release_eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 -m scripts.ci_plan

  python:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['python']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen --extra evals
      - run: make lint typecheck imports

  contracts:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['contracts']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      NORA_TEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen --extra evals
      - name: Match the audited Periphery Compose CLI
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64 \
            -o "$RUNNER_TEMP/docker-compose"
          echo "c57ab918abd5b05ca7e7d0f275875dd1330a695074f309dc9eab1b49efafcd4b  $RUNNER_TEMP/docker-compose" | sha256sum --check
          install -m 755 "$RUNNER_TEMP/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - name: Architecture and documentation contracts
        if: needs.classify.outputs.readers != '"ALL"' && needs.classify.outputs.docs_only != 'true' && needs.classify.result == 'success'
        run: >-
          uv run pytest -q
          tests/architecture/test_contribution_conventions.py
          tests/architecture/test_contribution_content.py
          tests/architecture/test_public_repository_settings.py
          tests/architecture/test_release_scope.py
          tests/architecture/test_release_config_matches_the_repo.py
          tests/architecture/test_release_plan.py
          tests/architecture/test_ci_plan.py
          tests/architecture/test_ci_runs_the_plumbing_guards.py
          tests/architecture/test_pr_triage.py
          tests/architecture/test_commit_body_rule.py
          tests/architecture/test_dockerfile_bases_are_pinned.py
          tests/architecture/test_runtime_imports_are_runtime_dependencies.py
          tests/architecture/test_site_csp_allows_the_graph_and_pagefind.py
          tests/architecture/test_doc_references_resolve.py
          tests/test_architecture_doc.py tests/test_docs.py
          tests/test_boundaries.py tests/test_deploy_assets.py
          tests/unit/test_release_deployment.py tests/unit/test_verify_deploy.py
      - name: Dependency record for selection
        if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.testmon == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m scripts.testmon_record fetch || true
      - name: Release pull request waits on the base commit's full run
        if: ${{ needs.classify.outputs.release_eligible == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m scripts.ci_plan release
      - name: Selected backend acceptance
        if: ${{ needs.classify.outputs.release_eligible != 'true' }}
        env:
          READERS: ${{ needs.classify.outputs.readers }}
          TESTMON: ${{ needs.classify.outputs.testmon }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          uv run python - <<'PYTEST'
          import json, os, subprocess, sys
          targets = json.loads(os.environ['READERS'])
          if targets != 'ALL' and os.environ.get('TESTMON') == 'true':
              from pathlib import Path
              if Path('.testmondata').is_file():
                  done = subprocess.run(
                      [sys.executable, 'scripts/affected_tests.py', '--base', os.environ['BASE_SHA']],
                      capture_output=True, text=True,
                  )
                  line = done.stdout.strip()
                  if done.returncode or not line or line == 'ALL':
                      targets = 'ALL'
                  elif line != 'NONE':
                      targets = line.split()
                  else:
                      targets = []
              else:
                  targets = 'ALL'
          command = (
              [sys.executable, '-m', 'scripts.pytest_gate', '--junit-dir', 'backend-results']
              if targets == 'ALL'
              else [sys.executable, '-m', 'scripts.pytest_gate', '--junit-dir', 'backend-results', *targets]
              if targets
              else None
          )
          if command is not None:
              if os.environ.get('EVENT_NAME') in ('push', 'schedule', 'workflow_dispatch'):
                  command.append('--testmon')
              subprocess.run(command, check=True)
          PYTEST

      - name: Escape report
        if: ${{ github.event_name == 'push' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m scripts.ci_plan escape >> "$GITHUB_STEP_SUMMARY"
      - id: dephash
        # a partial record (failed run) would lie about coverage: upload only
        # when every previous step succeeded
        if: ${{ github.event_name != 'pull_request' && success() }}
        run: echo "hash=$(uv run python -m scripts.testmon_record hash)" >> "$GITHUB_OUTPUT"
      - name: Upload dependency record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name != 'pull_request' && success() }}
        with:
          name: testmon-data-${{ steps.dephash.outputs.hash }}-${{ github.sha }}
          path: .testmondata
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      - name: Per-file durations
        if: ${{ !cancelled() }}
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, shutil, xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path
          for receipt in Path(".git").glob("nora-test-cost-*.json"):
              Path("backend-results").mkdir(exist_ok=True)
              shutil.copyfile(receipt, Path("backend-results") / receipt.name)
          files, outcomes = Counter(), Counter()
          for report in sorted(Path("backend-results").glob("*.xml")):
              for case in ET.parse(report).iter("testcase"):
                  files[case.get("file") or "<no file>"] += float(case.get("time") or 0)
                  outcomes[next((c.tag for c in case if c.tag in ("failure", "error", "skipped")), "passed")] += 1
          Path("test-durations.json").write_text(json.dumps(dict(sorted(files.items())), indent=1))
          total = sum(files.values())
          print(f"Outcomes: {dict(outcomes)}  \nFiles: {len(files)}  \nSummed test time: {total/60:.1f} min\n")
          print("| seconds | file |\n|---:|---|")
          for name, seconds in files.most_common(30):
              print(f"| {seconds:.1f} | {name} |")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: backend-acceptance
          path: |
            backend-results/*
            test-durations.json


  portal:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['portal']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: npm ci --prefix app
      - run: npm run check --prefix app
      - run: npm run build --prefix app

  go:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['go']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        module: [deploy/instagram-bridge, deploy/http-egress]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go test ./...
        working-directory: ${{ matrix.module }}

  site:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan).site) }}
    uses: ./.github/workflows/wiki.yml

  dependency-review:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['dependency-review']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
      - name: No PR dependency delta on baseline events
        if: github.event_name != 'pull_request'
        run: echo 'Dependency review applies to pull requests only'

  codeql-python:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['codeql-python']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: python
          build-mode: none
          config-file: ./.github/codeql/config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:python
          output: .codeql-results
      - name: Block high or critical findings on added PR lines
        run: python3 -m scripts.ci_plan codeql

  codeql-javascript:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['codeql-javascript']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript
          output: .codeql-results
      - name: Block high or critical findings on added PR lines
        run: python3 -m scripts.ci_plan codeql

  codeql-go:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['codeql-go']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      matrix:
        module: [deploy/instagram-bridge, deploy/http-egress]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: go
          build-mode: manual
          config-file: ./.github/codeql/config.yml
      - run: go build ./...
        working-directory: ${{ matrix.module }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:go/module:${{ matrix.module }}
          output: .codeql-results
      - name: Block high or critical findings on added PR lines
        run: python3 -m scripts.ci_plan codeql

  codeql-actions:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || fromJSON(needs.classify.outputs.plan)['codeql-actions']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: actions
          build-mode: none
          config-file: ./.github/codeql/config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:actions
          output: .codeql-results
      - name: Block high or critical findings on added PR lines
        run: python3 -m scripts.ci_plan codeql

  checks:
    if: always()
    needs: [classify, python, contracts, portal, go, site, dependency-review, codeql-python, codeql-javascript, codeql-go, codeql-actions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject failed, cancelled, missing or unexpectedly skipped selected jobs
        env:
          PLAN: ${{ needs.classify.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -m scripts.ci_plan verify
