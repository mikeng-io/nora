# No host access: a published stable release produces images and Git desired state.
name: Release images
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-images
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.RELEASE_IMAGES_ENABLED == 'true' && (github.event_name == 'release' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.images }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.18'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen
      - id: matrix
        run: echo "images=$(uv run --frozen python scripts/release_bundle.py matrix)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.18'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen
      - name: Publish exact release image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          IMAGE: ${{ matrix.image }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          uv run --frozen python scripts/release_bundle.py build --tag "$RELEASE_TAG" --image "$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: release-output/${{ matrix.image }}.json
          retention-days: 7
          if-no-files-found: error
  promote:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.18'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: release-output
          merge-multiple: true
      - name: Publish complete desired state after every image succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          uv run --frozen python scripts/release_bundle.py bundle --tag "$RELEASE_TAG"
          uv run --frozen python scripts/release_bundle.py promote --tag "$RELEASE_TAG"
