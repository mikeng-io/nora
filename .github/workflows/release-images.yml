# No host access: published releases and owner-selected master snapshots share one lane.
name: Release images
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Rebuild a published release, or Deploy master (owner only)
        required: true
        type: choice
        options: [release, master]
        default: release
      tag:
        description: Published stable release tag to build
        required: false
        type: string
      candidate:
        description: Optional assessed full master SHA; refuses if master has advanced
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-images
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'mikeng-io/nora' &&
      ((vars.RELEASE_IMAGES_ENABLED == 'true' &&
        (github.event_name == 'release' ||
         (github.ref == 'refs/heads/master' && inputs.target == 'release'))) ||
       (vars.MASTER_DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/master' && inputs.target == 'master'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen
      - name: Pin and validate the complete source before any registry writes
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event_name == 'release' && 'release' || inputs.target }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          CANDIDATE: ${{ inputs.candidate }}
          MASTER_DEPLOY_ENABLED: ${{ vars.MASTER_DEPLOY_ENABLED }}
        run: |
          selection=$(uv run --frozen python scripts/release_bundle.py select \
            --channel "$CHANNEL" --tag "$RELEASE_TAG" --candidate "$CANDIDATE")
          echo "selection=$selection" >> "$GITHUB_OUTPUT"
          echo "$selection" >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.selection).matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      # Keep the reviewed publisher when rebuilding an older tag. It must not
      # regain an old version-only promotion guard from the source being built.
      - run: cp scripts/release_bundle.py "$RUNNER_TEMP/release_bundle.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.prepare.outputs.selection).commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen
      - name: Publish exact selected image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ fromJSON(needs.prepare.outputs.selection).version }}
          SOURCE: ${{ fromJSON(needs.prepare.outputs.selection).commit }}
          CHANNEL: ${{ fromJSON(needs.prepare.outputs.selection).channel }}
          PREVIOUS: ${{ fromJSON(needs.prepare.outputs.selection).previous }}
          IMAGE: ${{ matrix.image }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          uv run --frozen python "$RUNNER_TEMP/release_bundle.py" build \
            --channel "$CHANNEL" --version "$VERSION" --source "$SOURCE" --image "$IMAGE" \
            --previous-ref "$PREVIOUS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: release-output/${{ matrix.image }}.json
          retention-days: 7
          if-no-files-found: error
  promote:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: cp scripts/release_bundle.py "$RUNNER_TEMP/release_bundle.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.prepare.outputs.selection).commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: release-output
          merge-multiple: true
      - name: Publish complete desired state after every image succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ fromJSON(needs.prepare.outputs.selection).version }}
          SOURCE: ${{ fromJSON(needs.prepare.outputs.selection).commit }}
          CHANNEL: ${{ fromJSON(needs.prepare.outputs.selection).channel }}
          PREVIOUS: ${{ fromJSON(needs.prepare.outputs.selection).previous }}
        run: |
          uv run --frozen python "$RUNNER_TEMP/release_bundle.py" bundle \
            --channel "$CHANNEL" --version "$VERSION" --source "$SOURCE" --previous-ref "$PREVIOUS"
          uv run --frozen python "$RUNNER_TEMP/release_bundle.py" promote \
            --channel "$CHANNEL" --version "$VERSION" --source "$SOURCE" --previous-ref "$PREVIOUS"
