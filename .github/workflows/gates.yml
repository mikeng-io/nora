name: gates

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev --extra evals

      - name: ruff
        run: uv run ruff check nora/ evals/ tests/

      - name: mypy
        run: uv run mypy nora/domain nora/config.py nora/app

      - name: import-linter
        run: uv run lint-imports

      - name: pytest
        run: uv run pytest -q
