name: OpenWiki update

on:
  workflow_dispatch:
    inputs:
      request:
        description: 'Optional generation request; forces a fresh plan even without source changes'
        required: false
        type: string
      diagnostics:
        description: 'Log safe provider response structure and native stage/tool progress'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    # The operator enables unattended inference only after a successful manual run.
    if: github.event_name == 'workflow_dispatch' || vars.OPENWIKI_AUTO_UPDATE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Check generation credentials
        env:
          OPENWIKI_API_KEY: ${{ secrets.OPENWIKI_API_KEY }}
          APP_ID: ${{ vars.RELEASE_APP_ID }}
        run: |
          test -n "$OPENWIKI_API_KEY" || { echo '::error::Set the OPENWIKI_API_KEY Actions secret.'; exit 1; }
          test -n "$APP_ID" || { echo '::error::Configure the repository GitHub App described in docs/maintainers/github.md.'; exit 1; }
      - run: npm ci --prefix docs-site
      - name: Update repository wiki
        id: generation
        timeout-minutes: 35
        run: |
          mkdir -p "$RUNNER_TEMP/openwiki-safe-summary"
          chmod 700 "$RUNNER_TEMP/openwiki-safe-summary"
          set +e
          if [[ -n "${OPENWIKI_UPDATE_REQUEST//[[:space:]]/}" ]]; then
            npm run wiki:update --prefix docs-site -- "$OPENWIKI_UPDATE_REQUEST"
          else
            npm run wiki:update --prefix docs-site
          fi
          rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/openwiki-safe-summary/generation.rc"
          exit "$rc"
        env:
          NODE_OPTIONS: '--import=./docs-site/scripts/provider-compat.mjs'
          OPENWIKI_PROVIDER_DIAGNOSTICS: ${{ (github.event_name == 'schedule' || inputs.diagnostics != false) && 'true' || 'false' }}
          OPENWIKI_UPDATE_REQUEST: ${{ inputs.request }}
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENWIKI_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENWIKI_BASE_URL || 'https://ollama.com/v1' }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID || 'deepseek-v4.1-flash:1017' }}
          OPENWIKI_OPENAI_COMPATIBLE_REASONING_EFFORT_SUPPORTED: 'true'
          OPENWIKI_REASONING_EFFORT: high
          OPENWIKI_MAX_OUTPUT_TOKENS: '32768'
          OPENWIKI_PAGE_CONCURRENCY: '1'
          OPENWIKI_TELEMETRY_DISABLED: '1'
      - name: Save safe checkpoint summary
        if: always()
        env:
          OPENWIKI_GENERATION_OUTCOME: ${{ steps.generation.outcome }}
        run: node docs-site/scripts/safe-run-summary.mjs
      - name: Retain only the content-free checkpoint summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwiki-safe-summary
          path: ${{ runner.temp }}/openwiki-safe-summary/summary.json
          if-no-files-found: error
          retention-days: 3
      - name: Require a fully completed OpenWiki run
        run: node docs-site/scripts/check-completion.mjs
      - name: Build the proposed public wiki
        run: npm run build --prefix docs-site
      # The model process has ended before a GitHub write credential is created.
      - name: Create a repository-scoped documentation token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Propose only completed documentation changes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          APP_BOT_ID: ${{ vars.RELEASE_APP_BOT_USER_ID }}
        run: |
          set -eu
          test ! -f openwiki/.run.json
          git diff --exit-code -- openwiki/INSTRUCTIONS.md
          git add -- openwiki AGENTS.md CLAUDE.md
          if git diff --cached --quiet; then exit 0; fi
          test -n "$APP_SLUG" && test -n "$APP_BOT_ID"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -C docs/openwiki-update
          git commit -m 'docs: update the implementation wiki'
          gh auth setup-git
          git push --force-with-lease origin HEAD:docs/openwiki-update
          cat > "$RUNNER_TEMP/wiki-pr.md" <<'BODY'
          ## What
          Refresh the source-grounded implementation wiki with OpenWiki. Review the generated Markdown and claim changes before merging.

          ## Gate on the merged tree
          OpenWiki completed successfully and the proposed static wiki built successfully. The PR's CI and public-site build provide the remaining checks; no live deployment or model-quality acceptance is claimed.
          BODY
          existing=$(gh pr list --head docs/openwiki-update --base master --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/wiki-pr.md"
          else
            gh pr create --base master --head docs/openwiki-update --title 'docs: update the implementation wiki' --body-file "$RUNNER_TEMP/wiki-pr.md"
          fi
