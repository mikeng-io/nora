name: Contribution content

on:
  pull_request_target:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      kind:
        description: Contribution to validate
        type: choice
        options: [pr, issue]
        required: true
      number:
        description: PR or issue number
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: contribution-${{ github.event.pull_request.number || github.event.issue.number || inputs.number }}-${{ inputs.kind || (github.event_name == 'pull_request_target' && 'pr' || 'issue') }}
  cancel-in-progress: true

jobs:
  pr-metadata:
    if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.kind == 'pr')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      # This privileged metadata job NEVER checks out or executes PR source.
      # All title/body data is read through JSON/API, never interpolated in shell.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          persist-credentials: false
      - name: Validate current metadata and publish PR content on its head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
        run: python3 -m scripts.check_contribution_content
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        if: always()
        continue-on-error: true
        with:
          version: '0.11.18'
          enable-cache: false
      - name: Advisory spelling
        if: always()
        continue-on-error: true
        run: python3 -m scripts.check_contribution_content --spelling

  issue-feedback:
    if: github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && inputs.kind == 'issue')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          persist-credentials: false
      - name: Update advisory issue feedback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.check_contribution_content
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        if: always()
        continue-on-error: true
        with:
          version: '0.11.18'
          enable-cache: false
      - name: Advisory spelling
        if: always()
        continue-on-error: true
        run: python3 -m scripts.check_contribution_content --spelling
