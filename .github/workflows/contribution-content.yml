name: Contribution content

on:
  pull_request_target:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      kind:
        description: Contribution to validate
        type: choice
        options: [pr, issue]
        required: true
      number:
        description: PR or issue number
        type: string
        required: true

permissions:
  contents: read

# No concurrency group: a run cancelled by a newer event leaves a cancelled `pr-metadata`
# check on the same commit, and the merge rules treat that as unsatisfied even though a
# newer run is green. Every run reads the live title and body, so none can go stale.

jobs:
  pr-metadata:
    if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.kind == 'pr')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      # This privileged metadata job NEVER checks out or executes PR source.
      # All title/body data is read through JSON/API, never interpolated in shell.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Validate current metadata and publish PR content on its head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_BOT_USER_ID: ${{ vars.RELEASE_APP_BOT_USER_ID }}
        run: python3 -m scripts.check_contribution_content
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: always()
        continue-on-error: true
        with:
          version: '0.13.4'
          enable-cache: false
      - name: Advisory spelling
        if: always()
        continue-on-error: true
        run: python3 -m scripts.check_contribution_content --spelling

  issue-feedback:
    if: github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && inputs.kind == 'issue')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Update advisory issue feedback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.check_contribution_content
      - name: Classify current issue Area
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.triage_issue
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: always()
        continue-on-error: true
        with:
          version: '0.13.4'
          enable-cache: false
      - name: Advisory spelling
        if: always()
        continue-on-error: true
        run: python3 -m scripts.check_contribution_content --spelling
