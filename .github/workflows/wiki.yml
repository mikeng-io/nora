name: Wiki and public site

on:
  pull_request:
    paths: ['openwiki/**', 'docs-site/**', 'site/**', 'assets/**', '.github/workflows/wiki.yml']
  push:
    branches: [master]
    paths: ['openwiki/**', 'docs-site/**', 'site/**', 'assets/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
      - run: npm ci --prefix docs-site
      - run: npm run build --prefix docs-site
      - run: npm ci --prefix site
      - run: npm run build --prefix site
      - run: cp -R docs-site/dist site/dist/wiki
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nora-public-site-${{ github.sha }}
          path: site/dist/
          if-no-files-found: error
          retention-days: 7
