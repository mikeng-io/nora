name: Wiki and public site

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: npm ci --prefix docs-site
      - run: npm run build --prefix docs-site
      - run: npm ci --prefix site
      - run: npm test --prefix site
      - run: npm run build --prefix site
      - run: cp -R docs-site/dist site/dist/wiki
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nora-public-site-${{ github.sha }}
          path: site/dist/
          if-no-files-found: error
          retention-days: 7
