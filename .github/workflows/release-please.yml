# Release metadata only; deployment is a separate operator procedure.
name: release-please

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find unreleased runtime changes
        id: scope
        run: python3 scripts/release_scope.py >> "$GITHUB_OUTPUT"
      - name: Create a repository-scoped release token
        if: vars.RELEASE_APP_ID != ''
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: ${{ steps.scope.outputs.eligible != 'true' }}
      - name: Queue the generated release PR for merge after required checks
        if: steps.app.outputs.token != '' && steps.release.outputs.pr != '' && !github.event.repository.private
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          # Refuse to merge unattended until the public required-check policy exists.
          gh api repos/"$GH_REPO"/branches/master/protection/required_status_checks \
            --jq '.contexts | index("checks") != null' | grep -qx true
          number=$(jq -r '.number' <<< "$RELEASE_PR")
          sha=$(gh pr view "$number" --json headRefOid --jq .headRefOid)
          gh pr merge "$number" --auto --merge --match-head-commit "$sha" \
            --subject "merge: publish release (#$number)" \
            --body "Release Please metadata; required checks gate automatic publication."
      - name: Report manual bootstrap requirement
        if: vars.RELEASE_APP_ID == ''
        run: echo '::notice::Install the free release GitHub App and configure public branch protection to enable unattended releases. See docs/github-maintenance.md.'
