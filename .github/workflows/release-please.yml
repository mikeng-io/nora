# Isolated diagnostic branch only. Never merge this replacement into master.
name: Release access read-back
on:
  workflow_dispatch:
permissions: {}
jobs:
  readback:
    if: github.repository == 'mikeng-io/nora' && github.actor == 'mikeng-io'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reproduce the production token action
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: nora
          permission-administration: read
          permission-contents: write
          permission-pull-requests: write
      - name: Read existing App grants and Git capability advertisement
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          ACTION_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          node <<'JS'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const {spawnSync} = require('node:child_process');
          const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = encode({alg:'RS256',typ:'JWT'}) + '.' + encode({iat:now-60,exp:now+300,iss:process.env.APP_ID});
          let token;
          async function api(path, auth, method='GET', body) {
            const response = await fetch('https://api.github.com' + path, {
              method, redirect:'error',
              headers:{Authorization:'Bearer '+auth,Accept:'application/vnd.github+json','User-Agent':'nora-release-readback','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
              body:body === undefined ? undefined : JSON.stringify(body)
            });
            if (!response.ok) throw new Error('GitHub API '+path.split('?')[0]+' HTTP '+response.status);
            return response.status === 204 ? null : response.json();
          }
          (async () => {
            const jwt = unsigned + '.' + crypto.sign('RSA-SHA256',Buffer.from(unsigned),process.env.APP_KEY).toString('base64url');
            const app = await api('/app',jwt);
            console.log(JSON.stringify({app:app.slug,app_permissions:app.permissions}));
            const installations = await api('/app/installations?per_page=100',jwt);
            const matching = installations.filter(item=>item.account.login==='mikeng-io');
            if (matching.length!==1) throw new Error('Expected exactly one owner installation');
            const installation = matching[0];
            console.log(JSON.stringify({installation_permissions:installation.permissions,repository_selection:installation.repository_selection,suspended:installation.suspended_at!==null}));
            const grant = await api('/app/installations/'+installation.id+'/access_tokens',jwt,'POST',{repositories:['nora'],permissions:{administration:'read',contents:'write',pull_requests:'write'}});
            token = grant.token;
            console.log(JSON.stringify({token_permissions:grant.permissions,repositories:grant.repositories.map(repo=>repo.full_name)}));
            const repo = await api('/repos/mikeng-io/nora',token);
            console.log(JSON.stringify({repository:repo.full_name,archived:repo.archived,permissions:repo.permissions ?? null}));
            if(!process.env.ACTION_TOKEN) throw new Error('Read-back action token unavailable');
            console.log(JSON.stringify({action_and_direct_token_equal:process.env.ACTION_TOKEN===token}));
            for(const [token_source,probeToken] of [['direct',token],['production-action',process.env.ACTION_TOKEN]]) {
            for (const service of ['git-upload-pack','git-receive-pack']) {
              const response = await fetch('https://github.com/mikeng-io/nora.git/info/refs?service='+service,{redirect:'error',headers:{Authorization:'Basic '+Buffer.from('x-access-token:'+probeToken).toString('base64')}});
              console.log(JSON.stringify({token_source,service,status:response.status,content_type:response.headers.get('content-type')}));
              await response.arrayBuffer();
            }
            const scratch = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP,'release-readback-'));
            const env = {...process.env,GH_TOKEN:probeToken,GIT_TERMINAL_PROMPT:'0'};
            delete env.APP_KEY;
            delete env.ACTION_TOKEN;
            const commands = [
              ['git',['init','--quiet']],
              ['git',['remote','add','origin','https://github.com/mikeng-io/nora.git']],
              ['gh',['auth','setup-git']],
              ['git',['fetch','--quiet','--depth=1','origin','master']],
              ['git',['checkout','--quiet','--detach','FETCH_HEAD']]
            ];
            for (const [command,args] of commands) {
              const result=spawnSync(command,args,{cwd:scratch,env,encoding:'utf8',timeout:45000});
              if(result.status!==0) throw new Error('Read-back setup unavailable');
            }
            const dry=spawnSync('git',['push','--dry-run','--force','origin','HEAD:refs/heads/release-please--branches--master--components--nora'],{cwd:scratch,env:{...env,GIT_TRACE_CURL:'1',GIT_TRACE_CURL_NO_DATA:'1',GIT_TRACE_REDACT:'1'},encoding:'utf8',timeout:45000});
            console.log(JSON.stringify({token_source,probe:'gh-helper-dry-run',exit_code:dry.status}));
            for(const line of (dry.stderr??'').split('\n')) {
              const match=line.match(/(?:=> Send header: ((?:GET|POST) [^\r\n]+)|<= Recv header: ((?:HTTP\/[^\r\n]+|x-github-request-id:[^\r\n]+)))/i);
              if(match) console.log(match[1]??match[2]);
            }
            fs.rmSync(scratch,{recursive:true,force:true});
            for(const service of ['git-receive-pack','git-upload-pack']) {
              const response=await fetch('https://github.com/mikeng-io/nora.git/'+service,{method:'POST',redirect:'error',headers:{Authorization:'Basic '+Buffer.from('x-access-token:'+probeToken).toString('base64'),'Content-Type':'application/x-'+service+'-request'},body:'0000'});
              console.log(JSON.stringify({token_source,probe:'zero-command-post',service,status:response.status,request_id:response.headers.get('x-github-request-id'),content_type:response.headers.get('content-type')}));
              await response.arrayBuffer();
            }
            }
          })().catch(error=>{console.error(error.message.startsWith('GitHub API ') || error.message.startsWith('Expected exactly') ? error.message : 'Read-back unavailable');process.exitCode=1;}).finally(async()=>{
            if (token) {
              try {await api('/installation/token',token,'DELETE');console.log('Ephemeral installation token revoked');}
              catch {console.error('Token revocation unavailable');process.exitCode=1;}
            }
          });
          JS
