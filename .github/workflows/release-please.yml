# Release metadata; release-images publishes deployments for the installed Komodo poller.
# scripts/release_plan.py opens the release PR from git reachability (ADR 0025);
# the release-please action only tags and publishes it once that PR is merged.
name: release-please

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create a repository-scoped release token
        if: vars.RELEASE_APP_ID != ''
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-pull-requests: write
      # Tag first: the plan below measures from the newest tag, so a release PR that
      # just merged must be tagged before it is measured, or it would be planned twice.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - name: Open or update the release PR from unreleased runtime changes
        id: plan
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD: release-please--branches--master--components--nora
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          APP_BOT_ID: ${{ vars.RELEASE_APP_BOT_USER_ID }}
        run: |
          set -euo pipefail
          # checkout dropped its credentials (persist-credentials: false) and the repo is
          # private, so every git remote operation below needs the helper first.
          gh auth setup-git
          git fetch --tags --force origin
          python3 -m scripts.release_plan --out "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"
          grep -qx 'eligible=true' "$RUNNER_TEMP/plan.txt" || exit 0
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/plan.txt")
          # The App's own bot identity, so GitHub links the commit to it. A generic
          # noreply address resolves to an unrelated account that owns that login.
          test -n "$APP_SLUG" && test -n "$APP_BOT_ID"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -C "$PR_HEAD"
          git add -- .release-please-manifest.json CHANGELOG.md nora/__init__.py pyproject.toml uv.lock
          git commit -m "chore(master): release $version"
          git push --force origin "HEAD:$PR_HEAD"
          number=$(gh pr list --head "$PR_HEAD" --base master --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$(cat "$RUNNER_TEMP/release/title.txt")" --body-file "$RUNNER_TEMP/release/body.md"
          else
            number=$(gh pr create --base master --head "$PR_HEAD" --label 'autorelease: pending' \
              --title "$(cat "$RUNNER_TEMP/release/title.txt")" --body-file "$RUNNER_TEMP/release/body.md" | grep -oE '[0-9]+$')
          fi
          echo "pr=$number" >> "$GITHUB_OUTPUT"
      - name: Queue the generated release PR for merge after required checks
        if: steps.plan.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.plan.outputs.pr }}
        run: |
          # Refuse to merge unattended until the required-check policy exists.
          gh api repos/"$GH_REPO"/rules/branches/master \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | index("checks") != null' | grep -qx true
          sha=$(gh pr view "$RELEASE_PR" --json headRefOid --jq .headRefOid)
          gh pr merge "$RELEASE_PR" --auto --merge --match-head-commit "$sha" \
            --subject "merge: publish release (#$RELEASE_PR)" \
            --body "Release metadata; required checks gate automatic publication."
      - name: Report manual bootstrap requirement
        if: vars.RELEASE_APP_ID == ''
        run: echo '::notice::Install the free release GitHub App and configure public branch protection to enable unattended releases. See docs/maintainers/github.md.'
