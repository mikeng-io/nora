# Security fixes are grouped per ecosystem across the listed directories.
# Keep routine version updates limited to the monthly Actions and base-image groups.
# Every update is assigned to the maintainer and carries the repo's own labels: the triage
# workflow cannot label a Dependabot PR (its token is read-only), so this file does it.
# Security-only ecosystems commit as `security(deps)`, a user-visible type, so a patched
# dependency triggers a release by itself; Actions bumps stay the hidden `build(deps)`.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  assignees:
  - mikeng-io
  labels:
  - dependencies
  - 'type: build'
  - 'area: deps'
  open-pull-requests-limit: 2
  groups:
    github-actions:
      patterns:
      - '*'
    github-actions-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: docker
  directories:
  - /
  - /app
  - /deploy/alert-bridge
  - /deploy/bridge-projection
  - /deploy/computer
  - /deploy/discord-bridge
  - /deploy/instagram-bridge
  - /deploy/komodo
  - /deploy/otel-queue-fixture/langfuse-sink
  - /deploy/signal-bridge
  - /deploy/signal-cli
  - /deploy/stt
  - /deploy/voice-sidecar
  - /deploy/voice-wake
  - /deploy/whatsapp-bridge
  - /site
  schedule:
    interval: monthly
  assignees:
  - mikeng-io
  labels:
  - dependencies
  - 'type: security'
  - 'area: deps'
  commit-message:
    prefix: security
    include: scope
  open-pull-requests-limit: 3
  # Dependabot proposes the highest tag, which for node is the odd-numbered Current
  # line (25), never an LTS. Majors are moved by hand to the Active LTS line.
  ignore:
  - dependency-name: node
    update-types:
    - version-update:semver-major
  groups:
    base-images:
      patterns:
      - '*'
- package-ecosystem: uv
  directories:
  - /
  - /deploy/stt
  - /deploy/voice-wake
  schedule:
    interval: monthly
  assignees:
  - mikeng-io
  labels:
  - dependencies
  - 'type: security'
  - 'area: deps'
  commit-message:
    prefix: security
    include: scope
  open-pull-requests-limit: 0
  groups:
    uv-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: pip
  directories:
  - /deploy/computer
  schedule:
    interval: monthly
  assignees:
  - mikeng-io
  labels:
  - dependencies
  - 'type: security'
  - 'area: deps'
  commit-message:
    prefix: security
    include: scope
  open-pull-requests-limit: 0
  groups:
    pip-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: npm
  directories:
  - /app
  - /deploy/computer/render
  - /deploy/voice-sidecar
  - /deploy/whatsapp-bridge
  - /showreel
  - /site
  - /docs-site
  - /voice-lab/spikes/sidecar
  schedule:
    interval: monthly
  assignees:
  - mikeng-io
  labels:
  - dependencies
  - 'type: security'
  - 'area: deps'
  commit-message:
    prefix: security
    include: scope
  open-pull-requests-limit: 0
  groups:
    npm-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: gomod
  directories:
  - /deploy/instagram-bridge
  schedule:
    interval: monthly
  assignees:
  - mikeng-io
  labels:
  - dependencies
  - 'type: security'
  - 'area: deps'
  commit-message:
    prefix: security
    include: scope
  open-pull-requests-limit: 0
  groups:
    gomod-security:
      applies-to: security-updates
      patterns:
      - '*'
