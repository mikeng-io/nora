# Security fixes are grouped per ecosystem across the listed directories.
# Keep routine version updates limited to the existing monthly Actions group.
# Every update is assigned to the maintainer and carries the repo's own labels: the triage
# workflow cannot label a Dependabot PR (its token is read-only), so this file does it.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  assignees:
  - mikeng-io
  labels:
  - dependencies
  - 'type: build'
  - 'area: deps'
  open-pull-requests-limit: 2
  groups:
    github-actions:
      patterns:
      - '*'
    github-actions-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: uv
  directories:
  - /
  - /deploy/stt
  - /deploy/voice-wake
  schedule:
    interval: monthly
  assignees:
  - mikeng-io
  labels:
  - dependencies
  - 'type: build'
  - 'area: deps'
  open-pull-requests-limit: 0
  groups:
    uv-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: pip
  directories:
  - /deploy/computer
  schedule:
    interval: monthly
  assignees:
  - mikeng-io
  labels:
  - dependencies
  - 'type: build'
  - 'area: deps'
  open-pull-requests-limit: 0
  groups:
    pip-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: npm
  directories:
  - /app
  - /deploy/computer/render
  - /deploy/voice-sidecar
  - /deploy/whatsapp-bridge
  - /showreel
  - /site
  - /docs-site
  - /voice-lab/spikes/sidecar
  schedule:
    interval: monthly
  assignees:
  - mikeng-io
  labels:
  - dependencies
  - 'type: build'
  - 'area: deps'
  open-pull-requests-limit: 0
  groups:
    npm-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: gomod
  directories:
  - /deploy/instagram-bridge
  schedule:
    interval: monthly
  assignees:
  - mikeng-io
  labels:
  - dependencies
  - 'type: build'
  - 'area: deps'
  open-pull-requests-limit: 0
  groups:
    gomod-security:
      applies-to: security-updates
      patterns:
      - '*'
