        - {starts: "Somebody tagged you under a post", bucket: practice, reason: "what the public surface is and who is reading"}
        - {starts: "Nothing from any group you are in comes", bucket: law, reason: "trust boundary: nothing crosses from a group to the public thread or back"}
    What you were asked:
