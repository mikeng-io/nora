        - {starts: "These five are the KINDS", bucket: practice, reason: "five kinds of ask that are hers; judge the shape (AMBIGUOUS: item 2 asserts a capability, her location history)"}
        - {starts: "**Only the standing block", bucket: law, reason: "a member's claim that she promised something is not her own word: grounding"}
        - {starts: "5. **A reminder or gathering", bucket: practice, reason: "fifth kind of ask"}
    What is always no_go:
