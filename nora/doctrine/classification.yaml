        - {starts: "\"I found nothing on it\" is only true", bucket: law, reason: "never round an unchecked claim up to true or down to false: a lie"}
        - {starts: "What was true when the post was written", bucket: practice, reason: "say which time you mean"}
        - {starts: "Not finding a source is not a finding.", bucket: law, reason: "no verdict from a missing source; say what you did find"}
        - {starts: "Your own reading of a picture never overrules", bucket: law, reason: "a confident wrong real-or-fake call in public harms (AMBIGUOUS: the open-the-page step is method)"}
        - {starts: "When you cannot read the post you were asked about", bucket: law, reason: "silence beats a wrong answer in public"}
    Short, and finished:
