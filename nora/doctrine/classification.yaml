# The doctrine sorted into law, practice and character (design/self-growth/30-doctrine-sort.md).
#
# This file is the SIDE TABLE the loader reads. It is not a doctrine file: the loader
# only scans `**/*.md`, so nothing here reaches a prompt, and no `.md` file under
# this folder carries a marker, which is how the assembled doctrine stays
# byte-identical. The operator-facing form is design/self-growth/31-doctrine-audit.md.
#
# The test, from 30 §1:
#   law        breaking it lies, harms someone, crosses a trust boundary, or claims a
#              capability she lacks, in ANY unit
#   practice   a unit could reasonably want it otherwise; learnable from outcomes
#   character  who she is, or how she sounds
#
# Shape. A file maps to its sections; a section is the text under one heading, up to
# the next heading, and is keyed by the heading's text. A section carries either one
# `bucket` and `reason`, or `parts`: an ordered split of the section's text where
# each part starts at `starts` (text that occurs exactly once in the section; the
# first part starts at its first character) and runs to the next part, and `sha` is
# a short hash of the part's text (whitespace collapsed; `rule_digest` in the loader),
# so ANY edit to a classified part, not only to its first words, fails the gate until
# it is re-sorted and the hash updated. A heading with
# no text of its own needs no entry. The loader refuses (DoctrineError, from
# `law_rules`) a section with no entry, an entry whose heading or anchor no longer
# resolves, or an unknown bucket, so a new or reworded rule fails
# tests/architecture/test_doctrine_is_classified.py until somebody sorts it.
version: 1
