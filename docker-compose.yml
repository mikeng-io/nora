services:
  # signal-cli — Nora's Signal transport. Merged into this compose project on
  # 2026-08-05 after confirming Nora is its ONLY consumer (the sole holder of
  # :18080 was `python3 -m nora` itself; hermes-agent runs profiles attest /
  # bento / default and has no nora profile). CLAUDE.md's operational
  # constraint 3 called this daemon "neutral and shared" — that was true once
  # and is not any more.
  #
  # It ran as a bare JVM on the host for 61 days with nothing supervising it.
  signal-cli:
    build:
      context: ./deploy/signal-cli
      # network: host is REQUIRED, not a preference — BuildKit's default bridge
      # cannot resolve deb.debian.org on this host (systemd-resolved stub
      # 127.0.0.53), so `apt-get update` fails with exit 100. This is standing
      # operational constraint 1, expressed so `docker compose build` obeys it
      # without anyone remembering to pass --network=host.
      network: host
      # Run deploy/signal-cli/fetch.sh first: it downloads the release tarball
      # and its .asc. Upstream ships no official image, so the Dockerfile
      # re-verifies the signature at build time.
    image: signal-cli:0.14.7
    container_name: signal-cli
    restart: unless-stopped
    # On the private `nora` network (cutover 2026-08-07, Option 2). It binds
    # 0.0.0.0:18080 (see command) so co-networked containers (nora, presence)
    # reach it as `signal-cli:18080`, and it publishes NOTHING — a netns
    # reachable only on that network, a STRICTER trust set than the old host
    # loopback (any host process could hit that). The no-auth / host-header
    # concern only bites behind a host port-map or a browser (DNS-rebinding);
    # neither can reach an internal-only network with no published port.
    # --receive-mode=on-start stays load-bearing (CLAUDE.md #3).
    networks: [nora]
    volumes:
      # Identity keys, group state, contacts. Losing this loses the device
      # registration itself — not just message history.
      # Lives INSIDE the repo tree so there is exactly one place to look, back
      # up, and restore. Deliberately NOT under ./data — Nora bind-mounts that
      # as /app/data, and she has no business reading Signal identity keys.
      - ./state/signal-cli:/data/signal-cli
    environment:
      - XDG_DATA_HOME=/data
    # --receive-mode=on-start is load-bearing, not decoration. Without it the
    # HTTP server comes up and every RPC works while signal-cli never opens its
    # websocket to Signal — so not one message is delivered. The host daemon
    # ran that way for two months, and under R-5 it looked like a quiet group.
    command: ["--account", "+85290000100", "daemon", "--http", "0.0.0.0:18080", "--receive-mode", "on-start"]
    healthcheck:
      # Probes the RUNNING daemon over JSON-RPC. The previous check was
      # `signal-cli --version`, which forks a fresh JVM, prints a string and
      # exits WITHOUT touching the daemon — it would have reported healthy
      # throughout the 61-day outage. This at least proves the process is
      # serving.
      #
      # It still CANNOT prove the websocket to Signal is alive; no RPC exposes
      # that. The real detector for that lives one layer up: Nora's /health
      # publishes sse.last_event_age_seconds and deploy/watchdog.sh alerts on
      # it. Do not mistake this check for websocket liveness.
      test: ["CMD-SHELL", "curl -fsS -m 5 -X POST http://127.0.0.1:18080/api/v1/rpc -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":\"hc\",\"method\":\"version\",\"params\":{}}' | grep -q '\"version\"' || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  nora:
    build:
      context: .
      # network: host is REQUIRED, not a preference — BuildKit's default bridge
      # can't resolve deb.debian.org on this host (systemd-resolved stub
      # 127.0.0.53), so `apt-get update` stalls ~30s per repo and the build
      # never finishes. Operational constraint 1, expressed here so
      # `docker compose build` obeys it without anyone remembering a flag —
      # this used to be a NOTE telling you to run `docker build --network=host`
      # by hand, which is a constraint stored in a comment rather than in the
      # build. `docker compose build` does not accept --network, so the comment
      # form had no way to be right.
      network: host
      # The version stamp, for exactly the same reason one line up: the
      # Dockerfile gate (`scripts/check_version_stamp.py`) refuses a build whose
      # baked `nora/version.json` disagrees with this argument, and it exits
      # non-zero on an empty one. Adding the gate while leaving compose without
      # `args` re-created the defect the `network: host` note above exists to
      # describe — a build constraint recorded in prose instead of in the build,
      # so `docker compose build` broke on the documented command.
      #
      # `:-` and not `:?`: an operator running `docker compose build` to pick up
      # a config change should not be forced to invent a version. Empty means
      # UNSTAMPED, the gate lets it through, and an unstamped image answers
      # `unavailable` and announces nothing — which is the honest state for a
      # build that was never tagged. `scripts/build-image.sh V3` is what stamps.
      args:
        NORA_VERSION: "${NORA_VERSION:-}"
    image: nora:latest
    container_name: nora
    restart: unless-stopped
    # On the private `nora` network (cutover 2026-08-07, Option 2): reaches
    # db and signal-cli BY NAME (db:5432, signal-cli:18080), and the
    # host-side externals — Honcho :8000, OmniRoute :20128, Langfuse :3100 — via
    # host.docker.internal (they publish 0.0.0.0, so host-gateway reaches them).
    # config.toml's base_urls were switched to match. (SearXNG/Firecrawl network
    # joins removed 2026-08-08, DEC-73 — web_search is Tavily, a public API.)
    networks: [nora]
    extra_hosts: ["host.docker.internal:host-gateway"]
    # The Docker-socket bind mount below is necessary but not sufficient: the
    # `nora` user (uid/gid 1000, this repo's own Dockerfile) is not a member of
    # the HOST's `docker` group that owns the socket (`srw-rw---- root:docker`),
    # so `docker.from_env()` fails with a bare PermissionError(13), not a
    # docker-specific error. `group_add` puts the container process in that
    # group by GID (Linux group membership is by number, not name, across the
    # container/host boundary — there is no `docker` group inside the image at
    # all). DOCKER_GID MUST match `getent group docker` on THIS host — it is
    # not portable across hosts/distros, hence env-injected with this host's
    # own value as the default rather than hardcoded with no override. Only
    # load-bearing once `[compute] enabled = true`.
    group_add: ["${DOCKER_GID:-973}"]
    # :9100 on loopback so deploy/watchdog.sh (host) still reads /health; the
    # in-container healthcheck below hits the container's own 127.0.0.1:9100.
    ports: ["127.0.0.1:9100:9100"]
    depends_on:
      signal-cli:
        # service_started only waits for the process to exist. Nora's first
        # act is to attach an SSE listener, so she must wait for the daemon
        # to be SERVING, not merely spawned.
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      # Never hardcoded — must already be exported in the shell that runs `docker
      # compose up` (see .env.example). Compose fails fast if it's unset.
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:?set OMNIROUTE_API_KEY in the host environment first}
      # The Postgres record store (cutover 2026-08-07, DEC-51). asyncpg-shaped;
      # the sync/Alembic driver is derived from it; Nora runs migrations at
      # startup. Password from .env (DEC-8), never inlined.
      - DATABASE_URL=postgresql+asyncpg://nora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/nora
      # Langfuse OTLP auth. Optional by design: tracing is never load-bearing, so an
      # unset value must degrade to no-auth rather than refuse to boot — hence `:-`
      # and not `:?`. config.toml's obs.tracing.headers_env names this variable; the
      # value never appears in config (DEC-8).
      - LANGFUSE_OTLP_HEADERS=${LANGFUSE_OTLP_HEADERS:-}
      # Grounding + presence keys, all OPTIONAL (`:-` not `:?`): each names a
      # capability that stays `unavailable` (never a crash, never a leak) when
      # its key is absent — config.toml's `enabled` flag plus a present key is
      # what turns each on. Values live in the host `.env`, which compose reads
      # for substitution; they never appear in the image or this file (DEC-8).
      #   GOOGLE_MAPS_API_KEY   — the `route` tool (Routes+Places+Geocoding)
      #   MEDIA_ENCRYPTION_KEY  — AES-256-GCM at rest for attachment custody
      #   LIFE360_USERNAME/PASSWORD — the presence collector's observer account
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - MEDIA_ENCRYPTION_KEY=${MEDIA_ENCRYPTION_KEY:-}
      - LIFE360_USERNAME=${LIFE360_USERNAME:-}
      - LIFE360_PASSWORD=${LIFE360_PASSWORD:-}
      #   NORA_DROP_TOKEN       — minting nora.example.net short links / drop
      #   artifact registration ([shortener]; cut over 2026-08-12 from the
      #   n.example.net Worker's own NORA_SHORTENER_TOKEN to the SAME secret the
      #   `drop` service below already authenticates its internal listener
      #   with — config.toml's `[shortener].token_env` now names this var
      #   instead, so there's one bearer value for the whole mint/register
      #   path, not two names for what has to be the same shared secret).
      - NORA_DROP_TOKEN=${NORA_DROP_TOKEN:-}
      #   TAVILY_API_KEY        — the `web_search` tool (Tavily, DEC-73)
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      #   GIPHY_API_KEY         — described reaction GIF search and download.
      #   Unset means GIF tools are unavailable; it must be explicitly passed
      #   because Compose does not inherit host .env values into a service.
      - GIPHY_API_KEY=${GIPHY_API_KEY:-}
      #   DISCORD_BOT_TOKEN     — the Gateway/REST credential for the Discord
      #   adapter ([platforms.discord] enabled, DEC-102). Passed explicitly for
      #   the same reason as every value above: Compose does not inherit host
      #   .env into a service. Unlike the keys above this one is NOT `:-`
      #   optional in effect — `AdapterRegistry` refuses to start an enabled
      #   platform that cannot authenticate, so an unset value here is a
      #   crash-loop, not a degraded feature. Left `:-` so a deployment with
      #   Discord DISABLED still starts without it.
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      #   NORA_DATA_HOST_ROOT   — the HOST-side path of the `./data` mount in
      #   `volumes:` below, and the one value in this file that exists because
      #   a path inside this container is NOT a path the Docker daemon can
      #   resolve. `LocalDockerBackend` ([compute] enabled) bind-mounts a job's
      #   workspace into Smith's sandbox container, and a bind SOURCE is
      #   resolved by the daemon on the HOST filesystem — so handing it
      #   `/app/data/compute-workspaces` (which is what `store.data_dir`
      #   resolves to in here) makes the daemon silently create an empty
      #   directory at that path on the host, and Smith never sees the
      #   `task.txt` Nora wrote while Nora never sees Smith's `url.txt`. Every
      #   job then fails with no exception and no error — the exact R-5 shape.
      #   `:-` not `:?`: unset is fine for every deployment with `[compute]`
      #   off (the shipped default), and the mount below falls back to the same
      #   `./data` it always used. With `[compute] enabled = true`,
      #   `nora.app.composition` REFUSES TO START unless this names an absolute
      #   host path (it cannot verify it, so it fails closed at boot rather
      #   than silently at job time in front of the group).
      - NORA_DATA_HOST_ROOT=${NORA_DATA_HOST_ROOT:-}
      #   PULSE_MCP_TOKEN       — bearer token for the `pulse` MCP server
      #   ([tools.mcp.pulse], spec: docs/superpowers/specs/2026-08-08-mcp-tool-provider-design.md).
      #   Unset means `build_mcp_tools`'s `${env:PULSE_MCP_TOKEN}` interpolation
      #   fails to resolve and the mount is silently skipped (R-5-shaped: absent,
      #   never a crash) — never load-bearing for anything else Nora does.
      - PULSE_MCP_TOKEN=${PULSE_MCP_TOKEN:-}
      #   PULSE_API_TOKEN       — bearer token for Pulse's REST API
      #   (nora/web/games.py's PulseGamesClient), the Games Hub web
      #   feature's OWN credential — separate from PULSE_MCP_TOKEN above,
      #   which is only for the LLM tool-calling path. Unset means
      #   composition.py builds no games_client and the games routes answer
      #   503 (R-5-shaped: absent, never a crash or a guessed 200).
      - PULSE_API_TOKEN=${PULSE_API_TOKEN:-}
      # The group is in Hong Kong. Without this the container runs UTC, and
      # `nora.agent.prefill._now_line` — which calls `datetime.now().astimezone()`
      # — tells her it is 07:05 when the group's clock says 15:05.
      #
      # Found live 2026-08-06: asked 「今日係幾時？幾點？」 she answered
      # 「凌晨2:55」 in the middle of a Hong Kong afternoon. Nothing failed, no
      # error was logged, and the only symptom was a confident wrong answer —
      # R-5's shape, in the one module written specifically to stop it (that
      # docstring's whole purpose is grounding 今晚 / 琴日 / 而家 / 尋日).
      #
      # This is a floor, not the fix. A container-level default still means the
      # same code gives different answers in different environments and no test
      # can catch it; the timezone belongs in config.toml, read explicitly.
      - TZ=Asia/Hong_Kong
    volumes:
      # `${NORA_DATA_HOST_ROOT:-./data}` and NOT a bare `./data`, so this bind
      # source and the `NORA_DATA_HOST_ROOT` value handed to the process above
      # are THE SAME EXPRESSION and cannot drift apart. See that variable's own
      # comment for why the process needs to know its host-side path at all.
      # Unset behaves exactly as the old `./data` did.
      - ${NORA_DATA_HOST_ROOT:-./data}:/app/data
      - ./config.toml:/app/config.toml:ro
      - ./identity.toml:/app/identity.toml:ro
      # Deny-by-default: without this Nora refuses to start rather than
      # running mute, which under R-5 would look identical to working.
      - ./policy.toml:/app/policy.toml:ro
      # Read-only so edits on the host (doctrine hot-reload, mtime-based) are visible
      # inside the container without a rebuild or restart.
      - ./nora/doctrine:/app/nora/doctrine:ro
      # The host Docker socket, so `LocalDockerBackend` (Nora Compute spec
      # §2/§3, `[compute] enabled`) can call `docker.from_env()` to launch
      # Smith's per-job sandbox containers. Named explicitly, not glossed
      # over: this gives Nora's own container the ability to launch — and,
      # transitively given Docker's own model, potentially escape into —
      # arbitrary containers on the host, a real widening of this container's
      # privilege beyond anything else this design has needed so far. This
      # was not discussed anywhere in the original Nora Compute design
      # conversation; it was raised as a Self-Review flag on the plan that
      # added this wiring and escalated to the human before implementation,
      # who ruled: proceed as specced (mount the socket directly, not a
      # sidecar, not deferred). Inert while `[compute] enabled = false`
      # (the shipped default) — the mount exists either way, but nothing in
      # this process calls `docker.from_env()` until that flag is on.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # app — the friend-group web portal (design spec:
  # docs/superpowers/specs/2026-08-17-nora-web-design.md). Loopback-only,
  # same pattern as `nora` itself — public reachability is a separate,
  # operator-side Cloudflare Tunnel step, not this compose file's job.
  app:
    build:
      context: ./app
      network: host
    image: nora-app:latest
    container_name: nora-app
    restart: unless-stopped
    networks: [nora]
    ports: ["127.0.0.1:3400:3000"]
    depends_on:
      nora:
        condition: service_healthy
    environment:
      # The games-hub routes reach Pulse THROUGH this too now (nora/web/games.py,
      # over Nora's already-working [tools.mcp.pulse] MCP connection) — the
      # old separate GAMES_API_BASE direct-to-Pulse tailnet path is gone: that
      # port is host-loopback-only by design and was never actually reachable
      # from this container's separate compose project.
      - NORA_API_BASE=http://nora:9100
      - AUTH_DISCORD_ID=${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in the host environment first}
      - AUTH_DISCORD_SECRET=${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET in the host environment first}
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET in the host environment first}
      - AUTH_URL=${AUTH_URL:?set AUTH_URL (the public origin, e.g. https://nora.67.zone) in the host environment first}
    volumes:
      # Same file, same read-only mount as `nora`/`presence` below — the web
      # portal's whitelist can never drift from Nora's own roster because it
      # reads the identical bytes.
      - ./identity.toml:/app/identity.toml:ro

  # presence — the Life360 presence collector (design/19 §4). Same image as
  # nora, a DIFFERENT command and a SEPARATE process: `python -m nora.presence`
  # polls each circle derived from identity.toml and records fixes into the
  # shared Postgres store. No build: stanza on purpose — it runs whatever
  # `docker compose build nora` produced, so the two processes can never drift
  # onto different code.
  presence:
    image: nora:latest
    container_name: presence
    restart: unless-stopped
    # The image's ENTRYPOINT is `uv run --no-sync python -m nora` (the daemon) —
    # a compose `command:` would be appended to THAT as subcommand args, so the
    # collector must override the entrypoint itself, not the command.
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "nora.presence"]
    command: ["--config", "config.toml"]
    networks: [nora]
    # :9101 on loopback so deploy/watchdog.sh (host) can read the collector's
    # own /metrics + /health (§4: liveness lives in the daemon).
    ports: ["127.0.0.1:9101:9101"]
    depends_on:
      db:
        # The collector runs `alembic upgrade head` first thing, so it needs a
        # SERVING Postgres, not merely a spawned container.
        condition: service_healthy
    environment:
      # Same DATABASE_URL shape as nora's: the two processes share one store.
      - DATABASE_URL=postgresql+asyncpg://nora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/nora
      # Life360 creds are `:-` not `:?` on purpose: a compose-level `:?` failure
      # aborts `docker compose up` for EVERY service, while an unset value here
      # lets the collector itself refuse to start with its readable
      # PresenceStartupError (composition.py, DEC-8) — scoped to this one
      # container, visible in its logs, and absent entirely when presence is
      # disabled in config.toml.
      - LIFE360_CLIENT_CREDENTIAL=${LIFE360_CLIENT_CREDENTIAL:-}
      - LIFE360_USERNAME=${LIFE360_USERNAME:-}
      - LIFE360_PASSWORD=${LIFE360_PASSWORD:-}
      # No Google Maps key here (2026-08-14) — the collector talks to Life360
      # ONLY. Reverse-geocoding moved to Nora's own process (`where_is`,
      # on demand), which already has GOOGLE_MAPS_API_KEY for `route`/
      # `render_map`; the collector calling Google unconditionally on every
      # poll cost real billed requests for addresses nobody ever read.
      # Same reasoning as nora's TZ: fix timestamps and logs should read in the
      # group's clock, not UTC.
      - TZ=Asia/Hong_Kong
    volumes:
      - ./config.toml:/app/config.toml:ro
      # The circle/member mapping — the collector's entire roster (design/19 §3).
      - ./identity.toml:/app/identity.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9101/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  analytics:
    image: nora:latest
    container_name: analytics
    restart: unless-stopped
    # Same entrypoint-override shape as `presence` — the image's ENTRYPOINT
    # is `uv run --no-sync python -m nora`, so this process must override
    # it rather than append a command.
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "nora.analytics"]
    command: ["--config", "config.toml"]
    networks: [nora]
    # :9103, next free port after nora's own :9100, presence's :9101, and drop's :9102.
    ports: ["127.0.0.1:9103:9103"]
    depends_on:
      db:
        # Like presence, this process runs `alembic upgrade head` itself on
        # startup, so it needs a SERVING Postgres, not merely a spawned one.
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://nora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/nora
      - TZ=Asia/Hong_Kong
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./identity.toml:/app/identity.toml:ro

  # valkey — dedicated slug -> URL store for the `drop` service (Nora Drop
  # spec, docs/superpowers/specs/2026-08-12-nora-drop-design.md §3/§4). NOT
  # the same Redis Honcho already runs for its own cache (`redis:8.2`,
  # CACHE_URL) — the spec's own §4 is explicit ("do not mix it"): a dedicated
  # instance avoids relying on a DB-index or key-prefix convention staying
  # correct forever. Valkey over Redis per §4's licensing/protocol argument
  # (BSD-3, RESP2/RESP3-compatible, no code-level cost).
  #
  # Publishes NOTHING — same network-containment posture as `signal-cli`
  # above: reachable only as `valkey:6379` on the private `nora` network,
  # never a host port, never a Tunnel rule.
  valkey:
    image: valkey/valkey:9.1.1-alpine  # latest stable release tag as of 2026-08-12
    container_name: valkey
    restart: unless-stopped
    networks: [nora]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # rustfs — S3-compatible object store for `drop`'s artifact bytes (same
  # spec, §4). Chosen over MinIO (OSS repo archived Apr 2026), SeaweedFS
  # (built for a multi-node distribution problem this single-box deployment
  # doesn't have) and Garage (AGPL, built for geo-distributed/unreliable
  # infra) — full comparison in the spec. Pinned to the newest release
  # candidate available as of 2026-08-12; still pre-stable (RustFS has not
  # cut a 1.0.0 final), accepted per the spec's §4 argument: drop artifacts
  # are regenerable compute output, not Nora's system of record, so the
  # failure mode of an immature storage engine here is "regenerate the file,"
  # not data loss of anything irreplaceable.
  #
  # Publishes NOTHING — same posture as `signal-cli`/`valkey`: reachable only
  # as `rustfs:9000` (S3 API) / `rustfs:9001` (console) on the private `nora`
  # network.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.1
    container_name: rustfs
    restart: unless-stopped
    networks: [nora]
    environment:
      # Root credentials for the S3 API. Required (`:?`, not `:-`) the same
      # way POSTGRES_PASSWORD is below — an object store holding artifact
      # bytes shouldn't ever fall back to RustFS's own built-in default
      # credential. `drop`'s own environment below reuses these SAME values
      # to authenticate `deploy/drop/artifacts.py`'s S3 client. Values live
      # in the host `.env`, never in this file (DEC-8).
      - RUSTFS_ROOT_USER=${RUSTFS_ROOT_USER:?set RUSTFS_ROOT_USER in .env}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_ROOT_PASSWORD:?set RUSTFS_ROOT_PASSWORD in .env}
    volumes:
      - rustfs-data:/data
    healthcheck:
      # No `-f`: RustFS's advertised liveness path (/rustfs/health/live,
      # MinIO-style convention) was observed 2026-08-12 to return 403
      # unsigned once its IAM subsystem finishes initializing — every route
      # on :9000 requires SigV4 auth, health path included, so `-f` (which
      # treats any 4xx/5xx as a curl failure) would report unhealthy on a
      # server that is actually up and answering. Dropping `-f` makes this a
      # pure "is something listening and completing HTTP transactions on
      # :9000" check: curl exits 0 for ANY HTTP response (200, 403, whatever)
      # and only non-zero on a connection-level failure (refused/timeout) —
      # verified: `curl -sS -o /dev/null` against this exact 403 exits 0,
      # against a closed port exits 7. Good enough for "the process is up";
      # tightening this to an authenticated check is for whoever wires the
      # real ingest calls (§7a), not this scaffolding task.
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # drop (docs/superpowers/specs/2026-08-12-nora-drop-design.md; routing shape
  # superseded post-spec -- see deploy/drop/server.py's module docstring for
  # why: drop.nora.example.net can't get a cert without paying for Cloudflare's
  # Advanced Certificate Manager, so both capabilities now live on the ONE
  # working hostname, nora.example.net, split by PATH not Host header). One
  # process, two listeners, split by which socket a route is bound on
  # (§3/§5a). The INTERNAL listener's write API is real: `POST /api/links`
  # (mint, §5) and `POST /api/artifacts` (register, §7a) — both write through
  # to `valkey`/`rustfs`/`db` below. The PUBLIC listener: `GET /i/<slug>`
  # 301-redirects, `GET /drop/<slug>` renders an artifact with a real
  # Content-Disposition (inline vs. attachment per `deploy/drop/rendering.py`)
  # — which handler answers is decided by the request path, not any Host
  # header (`deploy/drop/server.py`'s own module docstring has the full
  # account).
  #
  # Own image, own dependency set (deploy/drop/pyproject.toml) — NOT built
  # from the top-level Dockerfile / nora:latest. Starlette + uvicorn,
  # matching the separate `ridgeline-drop` project's own shape (its
  # drop/server.py) per the spec's §8 open question ("no strong reason
  # surfaced either way"); picking the precedent that already exists in this
  # operator's infra over inventing a second stack.
  drop:
    build:
      context: ./deploy/drop
      # Same reason as `nora`'s and `signal-cli`'s own `network: host` above
      # (operational constraint 1): BuildKit's default bridge can't resolve
      # deb.debian.org here, and this Dockerfile's own `apt-get install curl`
      # would otherwise stall/fail the build.
      network: host
    image: drop:latest
    container_name: drop
    restart: unless-stopped
    # Two networks, deliberately (Nora Compute spec §5a): `nora` keeps drop
    # reachable by Nora and able to reach Postgres/Valkey/RustFS, unchanged
    # from the Drop spec. `nora-compute` is new and narrower -- only drop and
    # Smith's per-job sandbox containers (Phase 2) ever join it, so Smith
    # never gets network-level reachability to anything else on `nora`
    # (Postgres, signal-cli, Valkey, RustFS) just by being able to reach drop.
    networks: [nora, nora-compute]
    # Only the PUBLIC listener gets a host port (§6): `cloudflared` runs
    # `network_mode: host` in its own separate compose project and reaches
    # every backend via `localhost:<port>`, never by container DNS name, so
    # it needs a loopback publish here — same pattern `nora` (:9100) and
    # `presence` (:9101) already use for their own `/health` endpoints
    # (docker-compose.yml, above). The INTERNAL listener (port 8081, §5a)
    # deliberately has NO `ports:` entry at all — reachable only as
    # `drop:8081` on the private `nora` network, never published, never
    # given a Tunnel rule. That asymmetry is the network-containment control
    # itself, not an oversight.
    ports: ["127.0.0.1:9102:9102"]
    depends_on:
      # `presence`'s own dependency below is the model this copies: drop's
      # artifact metadata lives in the same Postgres (§4), so it needs a
      # SERVING db, not merely a spawned container. valkey/rustfs are now
      # actually called by POST /api/links and POST /api/artifacts.
      #
      # NOTE: this does NOT guarantee the `artifacts` table exists by the
      # time `drop` starts accepting writes — that migration
      # (nora/infra/sql/migrations/versions/0007_drop_artifacts.py) is owned
      # and applied by Nora's own alembic chain, run at `nora`'s/`presence`'s
      # startup (or by hand against `127.0.0.1:5435` — `db`'s own comment
      # below), not by this service. Bringing up `drop` before `nora` has
      # migrated at least once leaves `POST /api/artifacts` failing with a
      # Postgres "relation does not exist" 503 until a migration runs.
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      - DROP_INTERNAL_PORT=8081
      - DROP_PUBLIC_PORT=9102
      # The ONE public hostname slugs are eventually served from — NOT where
      # this service listens; used only to build the URLs the mint/register
      # responses hand back (server.py's own comment on why). Path prefix
      # (`/i/` vs `/drop/`) is added by server.py itself, not part of this
      # value.
      - DROP_PUBLIC_BASE_URL=https://nora.example.net
      # Same `DATABASE_URL` shape/value `nora`'s own environment above uses
      # (DEC-8: one name for one secret) — `drop`'s own Postgres client
      # (deploy/drop/artifacts.py, raw asyncpg) reads the `artifacts` table
      # Nora's alembic chain owns, over the same `db` service.
      - DATABASE_URL=postgresql+asyncpg://nora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/nora
      - VALKEY_URL=redis://valkey:6379/0
      - RUSTFS_ENDPOINT=http://rustfs:9000
      - RUSTFS_BUCKET=drop-artifacts
      - RUSTFS_ROOT_USER=${RUSTFS_ROOT_USER:?set RUSTFS_ROOT_USER in .env}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_ROOT_PASSWORD:?set RUSTFS_ROOT_PASSWORD in .env}
      # Bearer token for BOTH internal-listener write routes (§5a defence in
      # depth; the network-level control — no `ports:` entry, no Tunnel rule —
      # is the primary one). Same shape as NORA_SHORTENER_TOKEN, a new,
      # separate value since `drop` is a different service.
      - NORA_DROP_TOKEN=${NORA_DROP_TOKEN:?set NORA_DROP_TOKEN in .env}
      # Signs/verifies per-job scoped tokens (Nora Compute spec §5/§9) --
      # separate from NORA_DROP_TOKEN (the master credential): a job's own
      # token is minted and verified against THIS secret, never compared to
      # the master token directly.
      - DROP_JOB_TOKEN_SECRET=${DROP_JOB_TOKEN_SECRET:?set DROP_JOB_TOKEN_SECRET in .env}
    healthcheck:
      # Matches `nora`'s own healthcheck pattern (curl against /health).
      # Checks the public listener; both listeners are one process (see
      # deploy/drop/server.py's module docstring) so either both come up or
      # neither does — there's no state where this passes while the internal
      # listener is actually down.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9102/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # db — Nora's own PostgreSQL record store (design/20 §3). Reached as `db:5432`
  # on the private network; loopback publish (127.0.0.1:5435) lets host-side ops
  # (migrations, the one-time load, backups, the `nora groups` CLI) in without
  # exposing it off the box.
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    networks: [nora]
    ports: ["127.0.0.1:5435:5432"]
    environment:
      POSTGRES_USER: nora
      POSTGRES_DB: nora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # pg18+ stores data in a major-version subdir under this mount
      # (/var/lib/postgresql/18/docker) — mount the PARENT, not .../data, or the
      # image refuses to start ("unused mount/volume"). See docker-library/postgres#1259.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nora -d nora"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nora:
  # SearXNG + Firecrawl network joins REMOVED (DEC-73, 2026-08-08): web_search is
  # Tavily (a public API reached over the default network), web_fetch is gone, so
  # Nora no longer calls the co-located SearXNG/Firecrawl containers.
  nora-compute:
    # EXPLICIT, and load-bearing: without a `name:` key Compose prefixes a
    # network with the project name, so this one would really be created as
    # `nora_nora-compute` (confirmed on this host: the sibling `nora:` network
    # above is really `nora_nora`). `LocalDockerBackend` does NOT go through
    # Compose — it calls the Docker daemon directly with
    # `containers.run(..., network="nora-compute")`, a literal string that has
    # no project name to prefix with — so the un-named form makes every single
    # compute job die with a docker-py `NotFound` before its container ever
    # starts. Naming the network is Compose's own documented opt-out of the
    # prefix, and it is the half of this pair that is allowed to move: the
    # backend's string is the fixed point.
    name: nora-compute
  # Nora Compute spec §5a: only `drop` and Smith's per-job sandbox containers
  # (Phase 2, LocalDockerBackend) ever join this network. Smith needs to reach
  # `drop:8081` directly (its own per-job credential, Nora Compute spec §2/§3)
  # without inheriting reachability to Postgres/signal-cli/Valkey/RustFS the
  # way it would if it joined `nora` itself.

volumes:
  db-data:
  # slug -> URL data (valkey) and artifact bytes (rustfs) for the `drop`
  # service (docs/superpowers/specs/2026-08-12-nora-drop-design.md).
  valkey-data:
  rustfs-data:
