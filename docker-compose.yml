services:
  # signal-cli — Nora's Signal transport. Merged into this compose project on
  # 2026-08-05 after confirming Nora is its ONLY consumer (the sole holder of
  # :18080 was `python3 -m nora` itself; hermes-agent runs profiles attest /
  # bento / default and has no nora profile). CLAUDE.md's operational
  # constraint 3 called this daemon "neutral and shared" — that was true once
  # and is not any more.
  #
  # It ran as a bare JVM on the host for 61 days with nothing supervising it.
  signal-cli:
    build:
      context: ./deploy/signal-cli
      # network: host is REQUIRED, not a preference — BuildKit's default bridge
      # cannot resolve deb.debian.org on this host (systemd-resolved stub
      # 127.0.0.53), so `apt-get update` fails with exit 100. This is standing
      # operational constraint 1, expressed so `docker compose build` obeys it
      # without anyone remembering to pass --network=host.
      network: host
      # Run deploy/signal-cli/fetch.sh first: it downloads the release tarball
      # and its .asc. Upstream ships no official image, so the Dockerfile
      # re-verifies the signature at build time.
    image: signal-cli:0.14.7
    container_name: signal-cli
    restart: unless-stopped
    # On the private `nora` network (cutover 2026-08-07, Option 2). It binds
    # 0.0.0.0:18080 (see command) so co-networked containers (nora, presence)
    # reach it as `signal-cli:18080`, and it publishes NOTHING — a netns
    # reachable only on that network, a STRICTER trust set than the old host
    # loopback (any host process could hit that). The no-auth / host-header
    # concern only bites behind a host port-map or a browser (DNS-rebinding);
    # neither can reach an internal-only network with no published port.
    # --receive-mode=on-start stays load-bearing (CLAUDE.md #3).
    networks: [nora]
    volumes:
      # Identity keys, group state, contacts. Losing this loses the device
      # registration itself — not just message history.
      # Lives INSIDE the repo tree so there is exactly one place to look, back
      # up, and restore. Deliberately NOT under ./data — Nora bind-mounts that
      # as /app/data, and she has no business reading Signal identity keys.
      - ./state/signal-cli:/data/signal-cli
    environment:
      - XDG_DATA_HOME=/data
    # --receive-mode=on-start is load-bearing, not decoration. Without it the
    # HTTP server comes up and every RPC works while signal-cli never opens its
    # websocket to Signal — so not one message is delivered. The host daemon
    # ran that way for two months, and under R-5 it looked like a quiet group.
    # The account is the deployment's own phone number, so it lives in `.env`
    # (`SIGNAL_ACCOUNT`), never in git: the identifier scrub (#767) replaced the
    # literal here with a pseudonym and signal-cli came up unregistered.
    command: ["--account", "${SIGNAL_ACCOUNT:?set SIGNAL_ACCOUNT in .env}", "daemon", "--http", "0.0.0.0:18080", "--receive-mode", "on-start"]
    healthcheck:
      # Probes the RUNNING daemon over JSON-RPC. The previous check was
      # `signal-cli --version`, which forks a fresh JVM, prints a string and
      # exits WITHOUT touching the daemon — it would have reported healthy
      # throughout the 61-day outage. This at least proves the process is
      # serving.
      #
      # It still CANNOT prove the websocket to Signal is alive; no RPC exposes
      # that. The real detector for that lives one layer up: Nora's /health
      # publishes sse.last_event_age_seconds and deploy/watchdog.sh alerts on
      # it. Do not mistake this check for websocket liveness.
      test: ["CMD-SHELL", "curl -fsS -m 5 -X POST http://127.0.0.1:18080/api/v1/rpc -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":\"hc\",\"method\":\"version\",\"params\":{}}' | grep -q '\"version\"' || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # whatsapp-bridge — Nora's WhatsApp transport (design/whatsapp-adoption/).
  # A containerized Baileys (Node) daemon, the transport TWIN of signal-cli
  # above: same private `nora` network, same no-published-ports posture, same
  # ./state/ volume discipline. The bridge holds the full WhatsApp session
  # (a paired companion device on the bot's dedicated number) — the narrower
  # its netns, the smaller the blast radius. Reachable ONLY as
  # whatsapp-bridge:18081 on the `nora` network.
  #
  # FIRST RUN needs pairing, the one step signal-cli doesn't have: WhatsApp
  # has no headless registration, so an operator runs
  #   docker compose run --rm whatsapp-bridge --pair --phone <digits>
  # once (prints a pairing code to type into the phone app: Linked Devices →
  # Link with phone number), then normal `docker compose up -d` boots with
  # the saved session. See design/whatsapp-adoption/01-bridge-container.md.
  whatsapp-bridge:
    build:
      context: ./deploy/whatsapp-bridge
      # network: host is REQUIRED, not a preference — same standing
      # operational constraint 1 as signal-cli above: BuildKit's default
      # bridge cannot resolve deb.debian.org on this host (systemd-resolved
      # stub 127.0.0.53), and this Dockerfile's `apt-get install curl` (the
      # healthcheck below curls /health; node:24-trixie-slim ships NO curl — the
      # design review's B1) would otherwise stall/fail the build.
      network: host
    image: whatsapp-bridge:0.1.0
    container_name: whatsapp-bridge
    restart: unless-stopped
    networks: [nora]
    volumes:
      # Baileys multi-file auth state (encryption keys, device creds,
      # lid-mapping-*.json). Losing this loses the pairing — not just
      # history. Same wall as ./state/signal-cli: deliberately NOT under
      # ./data (Nora must not read transport credentials). chmod 700; never
      # commit.
      - ./state/whatsapp:/app/session
    environment:
      # Shared bearer for Nora's calls to this bridge. Network membership is
      # not authentication: any co-networked container can reach the account
      # routes, so the bridge refuses to start without this.
      - NORA_BRIDGE_TOKEN=${NORA_BRIDGE_TOKEN:?set NORA_BRIDGE_TOKEN in the host environment first}
    command: ["node", "bridge.js", "--port", "18081", "--session", "/app/session"]
    healthcheck:
      # Proves the bridge's HTTP layer serves. It CANNOT prove the WhatsApp
      # websocket is alive — same lesson the signal-cli healthcheck comment
      # above records. The real detector lives one layer up: the bridge emits
      # SSE heartbeats, Nora's /health publishes the per-platform
      # last_event_age_seconds, and deploy/watchdog.sh alerts on it aging.
      test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:18081/health || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # instagram-bridge — the Instagram wire, the fourth transport daemon after
  # signal-cli, whatsapp-bridge and Discord's in-process client.
  # Full reasoning for every line below lives in
  # deploy/instagram-bridge/compose.fragment.yml, which this is lifted from.
  instagram-bridge:
    build:
      context: ./deploy/instagram-bridge
      # network: host is REQUIRED, not a preference — standing operational
      # constraint 1, the same one signal-cli and whatsapp-bridge record:
      # BuildKit's default bridge cannot resolve deb.debian.org on this host
      # (systemd-resolved stub 127.0.0.53), and this Dockerfile's
      # `apt-get install ca-certificates curl` would stall. It also covers the
      # `go mod download` in the build stage.
      network: host
    image: instagram-bridge:0.1.0
    container_name: instagram-bridge
    restart: unless-stopped
    # Private `nora` network, publishing NOTHING — the third instance of the
    # trust posture signal-cli cut over to on 2026-08-07. This container holds
    # a full Instagram account session; the narrower its netns, the smaller the
    # blast radius. Co-networked containers reach it as instagram-bridge:18082.
    networks: [nora]
    volumes:
      # Cookies + reconnection state. Losing cookies.json means redoing the
      # browser login; losing state.json and seq.json only costs a full
      # LoadIndex on the next boot. Deliberately NOT under ./data — Nora
      # bind-mounts that, and she has no business reading transport
      # credentials. chmod 700; never commit.
      - ./state/instagram:/session
    # host.docker.internal reaches the collector on the host (4318). Egress
    # only: the service still publishes nothing.
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      - IG_SESSION_DIR=/session
      - NORA_BRIDGE_TOKEN=${NORA_BRIDGE_TOKEN:?set NORA_BRIDGE_TOKEN in the host environment first}
      # Tracing (design/instagram-adoption/16 §Tracing): OTLP to the host's
      # collector, the same endpoint Nora exports to. The collector routes the
      # spans to Jaeger (and to Langfuse when a trace carries a model call).
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - OTEL_SERVICE_NAME=instagram-bridge
      # The summons comment write, the bridge's only public write (design
      # instagram-adoption/19; the guards and the latch are documented in
      # deploy/instagram-bridge/compose.fragment.yml). Off unless the host's
      # .env says exactly `on`: the switch is operator config, not code.
      - INSTAGRAM_COMMENT_WRITES=${INSTAGRAM_COMMENT_WRITES:-off}
      - INSTAGRAM_COMMENT_DAILY_CAP=${INSTAGRAM_COMMENT_DAILY_CAP:-10}
      - INSTAGRAM_COMMENT_MIN_INTERVAL=${INSTAGRAM_COMMENT_MIN_INTERVAL:-90s}
      # The story and timeline reads' GraphQL doc_ids (design/cognition-loop/
      # 22-social-stream.md §1a), from the host's .env: they rotate with
      # Instagram's web builds and are never in the repo. Unset is a 501.
      - INSTAGRAM_STORY_DOC_ID=${INSTAGRAM_STORY_DOC_ID:-}
      - INSTAGRAM_TIMELINE_DOC_ID=${INSTAGRAM_TIMELINE_DOC_ID:-}
    command: ["--port", "18082", "--session", "/session"]
    healthcheck:
      # Proves the bridge's HTTP layer serves. It CANNOT prove the Instagram
      # socket is alive, and it deliberately does not try: /health answers 200
      # while checkpointed, because a checkpoint is a normal operating state
      # and restarting on one fixes nothing. The real detector lives one layer
      # up — the bridge emits SSE heartbeats, Nora's /health publishes the
      # per-platform last_event_age_seconds, and deploy/watchdog.sh alerts on
      # it aging.
      test: ["CMD-SHELL", "printf 'Authorization: Bearer %s\\n' \"$$NORA_BRIDGE_TOKEN\" | curl -fsS -m 5 -H @- http://127.0.0.1:18082/health || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  nora:
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    build:
      context: .
      # network: host is REQUIRED, not a preference — BuildKit's default bridge
      # can't resolve deb.debian.org on this host (systemd-resolved stub
      # 127.0.0.53), so `apt-get update` stalls ~30s per repo and the build
      # never finishes. Operational constraint 1, expressed here so
      # `docker compose build` obeys it without anyone remembering a flag —
      # this used to be a NOTE telling you to run `docker build --network=host`
      # by hand, which is a constraint stored in a comment rather than in the
      # build. `docker compose build` does not accept --network, so the comment
      # form had no way to be right.
      network: host
      # The version stamp, for exactly the same reason one line up: the
      # Dockerfile gate (`scripts/check_version_stamp.py`) refuses a build whose
      # baked `nora/version.json` disagrees with this argument, and it exits
      # non-zero on an empty one. Adding the gate while leaving compose without
      # `args` re-created the defect the `network: host` note above exists to
      # describe — a build constraint recorded in prose instead of in the build,
      # so `docker compose build` broke on the documented command.
      #
      # `:-` and not `:?`: an operator running `docker compose build` to pick up
      # a config change should not be forced to invent a version. Empty means
      # UNSTAMPED, the gate lets it through, and an unstamped image answers
      # `unavailable`. What stamps is `scripts/gen_version_manifest.py` plus
      # this variable set to its `git describe` version (DEC-314): nora-deploy
      # step 3 and `scripts/build-image.sh` both do it.
      args:
        NORA_VERSION: "${NORA_VERSION:-}"
        # The commit and build time baked into the image for the deploy
        # revision (Dockerfile, above `USER nora`); nora-deploy step 3 sets
        # both on its `docker compose build nora`. Empty is recorded as such.
        NORA_GIT_SHA: "${NORA_GIT_SHA:-}"
        NORA_BUILT_AT: "${NORA_BUILT_AT:-}"
    image: nora:latest
    container_name: nora
    restart: unless-stopped
    # How long `docker stop` (a compose recreate included) waits between SIGTERM and
    # SIGKILL. The default is 10 s. Nora now stops on SIGTERM (`nora.__main__.
    # run_until_stopped`): the adapters and loops stop, a Cognition session already
    # running gets `SESSION_SHUTDOWN_GRACE_SECONDS` (30 s) to finish, then it is
    # cancelled and records its wake `cancelled` (a restart) so its unit is free, and
    # the model client and the store close. 75 s is that 30 plus the time the rest
    # needs; `tests/architecture/test_the_stop_grace_covers_the_shutdown.py` holds the margin. It does NOT wait out a
    # tag turn (360 s timeout) or a Dreamer pass: they end with the process, as before.
    # A recreate takes up to this long only when a session is running.
    stop_grace_period: 75s
    # On the private `nora` network (cutover 2026-08-07, Option 2): reaches
    # db and signal-cli BY NAME (db:5432, signal-cli:18080), and the
    # host-side externals — OmniRoute :20128, Langfuse :3100 — via
    # host.docker.internal (they publish 0.0.0.0, so host-gateway reaches them).
    # config.toml's base_urls were switched to match. (SearXNG/Firecrawl network
    # joins removed 2026-08-08, DEC-73 — web_search is Tavily, a public API.)
    #
    # HONCHO is the exception (#633, DEC-259): it answers with no authentication,
    # so it is NOT published on 0.0.0.0. It publishes on 127.0.0.1 only (host
    # evals, the tailnet forward) and nora reaches it BY NAME, `honcho:8000`, on
    # the `honcho` network below, which holds Honcho's api and this one service.
    # docs/runbook.md §"Closing Honcho" has the order the steps must go in.
    #
    # `embedder` (design/unified-memory/65-build-step-3-vectors.md V1): the
    # internal network that holds the embedding server and this one service.
    networks: [nora, honcho, embedder]
    extra_hosts: ["host.docker.internal:host-gateway"]
    # :9100 on loopback so deploy/watchdog.sh (host) still reads /health; the
    # in-container healthcheck below hits the container's own 127.0.0.1:9100.
    ports: ["127.0.0.1:9100:9100"]
    depends_on:
      signal-cli:
        # service_started only waits for the process to exist. Nora's first
        # act is to attach an SSE listener, so she must wait for the daemon
        # to be SERVING, not merely spawned.
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      # Never hardcoded — must already be exported in the shell that runs `docker
      # compose up` (see .env.example). Compose fails fast if it's unset.
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:?set OMNIROUTE_API_KEY in the host environment first}
      # Shared bearer for the WhatsApp and Instagram bridges. Required, and the
      # same value in all three services: the bridges refuse to start without
      # it, so an upgrade that forgets it fails loudly rather than serving
      # account routes unauthenticated.
      - NORA_BRIDGE_TOKEN=${NORA_BRIDGE_TOKEN:?set NORA_BRIDGE_TOKEN in the host environment first}
      # The Postgres record store (cutover 2026-08-07, DEC-51). asyncpg-shaped;
      # the sync/Alembic driver is derived from it; Nora runs migrations at
      # startup. Password from .env (DEC-8), never inlined.
      - DATABASE_URL=postgresql+asyncpg://nora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/nora
      # Langfuse OTLP auth. Optional by design: tracing is never load-bearing, so an
      # unset value must degrade to no-auth rather than refuse to boot — hence `:-`
      # and not `:?`. config.toml's obs.tracing.headers_env names this variable; the
      # value never appears in config (DEC-8).
      - LANGFUSE_OTLP_HEADERS=${LANGFUSE_OTLP_HEADERS:-}
      # Sentry DSN. Optional for the same reason and with the same `:-`: error
      # reporting is never load-bearing, and `nora/obs/errors.py` degrades to
      # "off" (saying so at startup) rather than refusing to boot.
      # config.toml's obs.errors.dsn_env NAMES this variable; the value never
      # appears in config (DEC-8).
      - SENTRY_DSN=${SENTRY_DSN:-}
      # Grounding + presence keys, all OPTIONAL (`:-` not `:?`): each names a
      # capability that stays `unavailable` (never a crash, never a leak) when
      # its key is absent — config.toml's `enabled` flag plus a present key is
      # what turns each on. Values live in the host `.env`, which compose reads
      # for substitution; they never appear in the image or this file (DEC-8).
      #   GOOGLE_MAPS_API_KEY   — the `route` tool (Routes+Places+Geocoding)
      #   MEDIA_ENCRYPTION_KEY  — AES-256-GCM at rest for attachment custody
      #   LIFE360_USERNAME/PASSWORD — the presence collector's observer account
      #   LIFE360_AUTH_TOKEN  — its browser-issued bearer, when Life360 refuses the password
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - MEDIA_ENCRYPTION_KEY=${MEDIA_ENCRYPTION_KEY:-}
      - LIFE360_USERNAME=${LIFE360_USERNAME:-}
      - LIFE360_PASSWORD=${LIFE360_PASSWORD:-}
      - LIFE360_AUTH_TOKEN=${LIFE360_AUTH_TOKEN:-}
      # [media.rustfs] (DEC-136), off by default. Same OPTIONAL posture and
      # the SAME two values `rustfs:`'s own environment below already
      # requires (`:?`) whenever this compose file runs at all — reusing them
      # here costs a deployment that already runs `rustfs` no new secret,
      # only new wiring.
      - RUSTFS_ROOT_USER=${RUSTFS_ROOT_USER:-}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_ROOT_PASSWORD:-}
      #   NORA_COMPUTER_TOKEN   — computerd's bearer token ([computer].token_env,
      #   design/sandbox-runtime, DEC-243). Nora refuses to start with
      #   [computer] enabled and this empty: it was missing here on
      #   2026-09-30 and the first enable crash-looped nora for about three
      #   minutes. tests/test_env_template.py now checks every *_env name.
      - NORA_COMPUTER_TOKEN=${NORA_COMPUTER_TOKEN:-}
      #   NORA_OTP_SECRET / NORA_OTP_API_TOKEN — [otp].secret_env (the HMAC
      #   key one-time codes are hashed under) and [otp].api_token_env (the
      #   bearer the portal sends to /app/v1/otp/*). Nora refuses to start
      #   with [otp] enabled and either empty.
      - NORA_OTP_SECRET=${NORA_OTP_SECRET:-}
      - NORA_OTP_API_TOKEN=${NORA_OTP_API_TOKEN:-}
      #   HKGOV_MAPS_TOKEN      — [presence].hkgov_token_env, the optional
      #   HK-government reverse geocoder that `where_is` uses (reverse-geocoding
      #   runs here, not in the collector). Found unpassed on 2026-09-30 by the
      #   same check; empty keeps today's behaviour.
      - HKGOV_MAPS_TOKEN=${HKGOV_MAPS_TOKEN:-}
      #   GOOGLE_OAUTH_CLIENT_ID / _CLIENT_SECRET / _REFRESH_TOKEN —
      #   [google], Nora's ONE Google identity shared by every Google service
      #   she uses (design/external-files §4). Read only when one is switched
      #   on; recording a link as a handle needs none of them.
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REFRESH_TOKEN=${GOOGLE_OAUTH_REFRESH_TOKEN:-}
      #   TAVILY_API_KEY / EXA_API_KEY — the `web_search`/`web_fetch` tools.
      #   BOTH are passed and only the one named by `[search.<provider>]
      #   api_key_env` is ever read (DEC-157), so flipping `[search] provider`
      #   is a config change and not a compose change. Compose does NOT inherit
      #   host .env values into a service, so a key absent here is invisible to
      #   Nora however present it is in .env — she logs "search enabled on
      #   provider X but Y is unset" and answers `unavailable` forever.
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      #   STEAM_WEB_API_KEY   — the `online_now` Steam half ([online],
      #   design/online-status/, PR #252). Same OPTIONAL posture: `[online]
      #   enabled` AND this key present turns the Steam arms on; unset logs
      #   "online enabled but STEAM_WEB_API_KEY is unset" and everything
      #   stays `unavailable`. Must be passed explicitly — Compose does not
      #   inherit host .env values into a service.
      - STEAM_WEB_API_KEY=${STEAM_WEB_API_KEY:-}
      #   GIPHY_API_KEY         — described reaction GIF search and download.
      #   Unset means GIF tools are unavailable; it must be explicitly passed
      #   because Compose does not inherit host .env values into a service.
      - GIPHY_API_KEY=${GIPHY_API_KEY:-}
      #   KIMI_CODE_API_KEY — the DIRECT media-describer lane ([media.describe.*]
      #   provider="kimi", 2026-08-30): `api.kimi.com/coding/v1`, used for VIDEO
      #   because OmniRoute drops `video_url` content blocks. Optional: a kimi
      #   provider whose key is unset answers `unavailable`, never a silent
      #   omniroute fallback — but a deployment that enables video MUST set it.
      - KIMI_CODE_API_KEY=${KIMI_CODE_API_KEY:-}
      #   OPENCODE_GO_API_KEY — the OpenCode Go DIRECT describer lane
      #   (provider="opencode-go", DEC-197): MiMo v2.6 Flash for video with
      #   sound and for audio. Same OPTIONAL posture: unset means those
      #   modalities answer `unavailable`, never an omniroute fallback.
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      #   XAI_OAUTH_REFRESH_TOKEN — the xAI image-generation lane (DEC-137).
      #   Written by `nora xai-login` (device flow) into the host `.env`;
      #   passed through here so the container can refresh access tokens
      #   against it. Same OPTIONAL posture: `[image_gen].enabled` in
      #   config.toml PLUS this present is what turns the lane on.
      - XAI_OAUTH_REFRESH_TOKEN=${XAI_OAUTH_REFRESH_TOKEN:-}
      #   OPENAI_CODEX_REFRESH_TOKEN — the OpenAI Codex image lane's
      #   BOOTSTRAP token (DEC-304), written by `nora openai-codex-login`.
      #   The rotating token after it lives in ./state/openai-codex-oauth.json.
      #   Read only when `[image_gen] provider = "openai_codex"`.
      - OPENAI_CODEX_REFRESH_TOKEN=${OPENAI_CODEX_REFRESH_TOKEN:-}
      #   DISCORD_BOT_TOKEN     — the Gateway/REST credential for the Discord
      #   adapter ([platforms.discord] enabled, DEC-102). Passed explicitly for
      #   the same reason as every value above: Compose does not inherit host
      #   .env into a service. Unlike the keys above this one is NOT `:-`
      #   optional in effect — `AdapterRegistry` refuses to start an enabled
      #   platform that cannot authenticate, so an unset value here is a
      #   crash-loop, not a degraded feature. Left `:-` so a deployment with
      #   Discord DISABLED still starts without it.
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      # Voice reply closure (design/voice-channel/07 §5): the TTS provider key
      # must reach the nora DAEMON container — Compose does not pass through
      # unlisted vars, and without it composition.py logs "no speaker is
      # wired; voice answers stay text-only" (found live 2026-09-16 while
      # verifying B-2; first fix landed on the web portal by mistake and the
      # daemon still lacked it, caught by `docker compose config`).
      - MINIMAX_CN_API_KEY=${MINIMAX_CN_API_KEY:-}
      #   PULSE_MCP_TOKEN       — bearer token for the `pulse` MCP server
      #   ([tools.mcp.pulse], spec: docs/superpowers/specs/2026-08-08-mcp-tool-provider-design.md).
      #   Unset means `build_mcp_tools`'s `${env:PULSE_MCP_TOKEN}` interpolation
      #   fails to resolve and the mount is silently skipped (R-5-shaped: absent,
      #   never a crash) — never load-bearing for anything else Nora does.
      - PULSE_MCP_TOKEN=${PULSE_MCP_TOKEN:-}
      #   PULSE_API_TOKEN       — bearer token for Pulse's REST API
      #   (nora/web/games.py's PulseGamesClient), the Games Hub web
      #   feature's OWN credential — separate from PULSE_MCP_TOKEN above,
      #   which is only for the LLM tool-calling path. Unset means
      #   composition.py builds no games_client and the games routes answer
      #   503 (R-5-shaped: absent, never a crash or a guessed 200).
      - PULSE_API_TOKEN=${PULSE_API_TOKEN:-}
      # The Pulse REST base (a private tailnet host), read with the token
      # above (`nora.app.composition`); unset keeps the source's placeholder.
      - PULSE_API_BASE=${PULSE_API_BASE:-}
      # The group is in Hong Kong. Without this the container runs UTC, and
      # `nora.agent.prefill._now_line` — which calls `datetime.now().astimezone()`
      # — tells her it is 07:05 when the group's clock says 15:05.
      #
      # Found live 2026-08-06: asked 「今日係幾時？幾點？」 she answered
      # 「凌晨2:55」 in the middle of a Hong Kong afternoon. Nothing failed, no
      # error was logged, and the only symptom was a confident wrong answer —
      # R-5's shape, in the one module written specifically to stop it (that
      # docstring's whole purpose is grounding 今晚 / 琴日 / 而家 / 尋日).
      #
      # This is a floor, not the fix. A container-level default still means the
      # same code gives different answers in different environments and no test
      # can catch it; the timezone belongs in config.toml, read explicitly.
      - TZ=Asia/Hong_Kong
    volumes:
      # `${NORA_DATA_HOST_ROOT:-./data}`: the host directory this bind mounts
      # is overridable (the eval sandbox points it at a scratch directory).
      # Unset behaves exactly as the old `./data` did. It is a compose-only
      # variable: the process no longer reads it (S3b).
      - ${NORA_DATA_HOST_ROOT:-./data}:/app/data
      # OAuth state (DEC-137, DEC-304, DEC-308): `./state/xai-oauth.json` and
      # `./state/openai-codex-oauth.json` live in the SAME repo-tree state dir
      # signal-cli's identity keys already use, container-writable. Both
      # issuers rotate the refresh token on use, so the host `.env`
      # (immutable, DEC-8) holds only the bootstrap a login wrote and these
      # files are the ONLY live copy of each chain: losing one means logging
      # in again. The daemon refreshes both on a schedule (DEC-308).
      - ./state:/app/state
      - ./config.toml:/app/config.toml:ro
      - ./identity.toml:/app/identity.toml:ro
      # Deny-by-default: without this Nora refuses to start rather than
      # running mute, which under R-5 would look identical to working.
      - ./policy.toml:/app/policy.toml:ro
      # Read-only so edits on the host (doctrine hot-reload, mtime-based) are visible
      # inside the container without a rebuild or restart.
      - ./nora/doctrine:/app/nora/doctrine:ro
      # Read-only so edits on the host (Dreamer instruction hot-reload,
      # mtime-based) are visible inside the container without a rebuild or
      # restart. A DIRECTORY mount, not a file mount, so an editor's atomic
      # save — which replaces the inode — keeps working, the same reason the
      # doctrine mount above survives one.
      - ./nora/dreamer:/app/nora/dreamer:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # app — the friend-group web portal (design spec:
  # docs/superpowers/specs/2026-08-17-nora-web-design.md). Loopback-only,
  # same pattern as `nora` itself — public reachability is a separate,
  # operator-side Cloudflare Tunnel step, not this compose file's job.
  app:
    build:
      context: ./app
      network: host
    image: nora-app:latest
    container_name: nora-app
    restart: unless-stopped
    networks: [nora]
    ports: ["127.0.0.1:3400:3000"]
    depends_on:
      nora:
        condition: service_healthy
    environment:
      # The games-hub routes reach Pulse THROUGH this too now (nora/web/games.py,
      # over Nora's already-working [tools.mcp.pulse] MCP connection) — the
      # old separate GAMES_API_BASE direct-to-Pulse tailnet path is gone: that
      # port is host-loopback-only by design and was never actually reachable
      # from this container's separate compose project.
      - NORA_API_BASE=http://nora:9100
      - AUTH_DISCORD_ID=${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in the host environment first}
      - AUTH_DISCORD_SECRET=${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET in the host environment first}
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET in the host environment first}
      - AUTH_URL=${AUTH_URL:?set AUTH_URL (the public origin, e.g. https://nora.67.zone) in the host environment first}
      # One-time code sign-in (DEC-287): the SAME value `nora` gets above, the
      # bearer its /app/v1/otp/* routes require. Empty, the login page offers
      # Discord alone.
      - NORA_OTP_API_TOKEN=${NORA_OTP_API_TOKEN:-}
    volumes:
      # Same file, same read-only mount as `nora`/`presence` below — the web
      # portal's whitelist can never drift from Nora's own roster because it
      # reads the identical bytes.
      - ./identity.toml:/app/identity.toml:ro

  # site — Nora's public site (site/, Astro, static). Loopback-only like
  # `app`; it answers `/`, `/en/`, `/_astro/*`, `/_site/*`, `/favicon.ico`,
  # `/robots.txt`, `/sitemap.xml` and `/llms.txt` on the portal's own
  # hostname once the tunnel routes those paths here (site/README.md, "Going
  # live"). Behind a profile until then, so `docker compose up -d` does not
  # start it:
  #   docker compose --profile site build site && docker compose --profile site up -d site
  site:
    build:
      context: .
      dockerfile: site/Dockerfile
      network: host
    image: nora-site:latest
    container_name: nora-site
    profiles: [site]
    restart: unless-stopped
    ports: ["127.0.0.1:3401:8080"]

  # presence — the Life360 presence collector (design/19 §4). Same image as
  # nora, a DIFFERENT command and a SEPARATE process: `python -m nora.presence`
  # polls each circle derived from identity.toml and records fixes into the
  # shared Postgres store. No build: stanza on purpose — it runs whatever
  # `docker compose build nora` produced, so the two processes can never drift
  # onto different code.
  presence:
    image: nora:latest
    container_name: presence
    restart: unless-stopped
    # The image's ENTRYPOINT is `uv run --no-sync python -m nora` (the daemon) —
    # a compose `command:` would be appended to THAT as subcommand args, so the
    # collector must override the entrypoint itself, not the command.
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "nora.presence"]
    command: ["--config", "config.toml"]
    networks: [nora]
    # :9101 on loopback so deploy/watchdog.sh (host) can read the collector's
    # own /metrics + /health (§4: liveness lives in the daemon).
    ports: ["127.0.0.1:9101:9101"]
    depends_on:
      db:
        # The collector runs `alembic upgrade head` first thing, so it needs a
        # SERVING Postgres, not merely a spawned container.
        condition: service_healthy
    environment:
      # Same DATABASE_URL shape as nora's: the two processes share one store.
      - DATABASE_URL=postgresql+asyncpg://nora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/nora
      # Life360 creds are `:-` not `:?` on purpose: a compose-level `:?` failure
      # aborts `docker compose up` for EVERY service, while an unset value here
      # lets the collector itself refuse to start with its readable
      # PresenceStartupError (composition.py, DEC-8) — scoped to this one
      # container, visible in its logs, and absent entirely when presence is
      # disabled in config.toml.
      - LIFE360_CLIENT_CREDENTIAL=${LIFE360_CLIENT_CREDENTIAL:-}
      - LIFE360_USERNAME=${LIFE360_USERNAME:-}
      - LIFE360_PASSWORD=${LIFE360_PASSWORD:-}
      - LIFE360_AUTH_TOKEN=${LIFE360_AUTH_TOKEN:-}
      # No Google Maps key here (2026-08-14) — the collector talks to Life360
      # ONLY. Reverse-geocoding moved to Nora's own process (`where_is`,
      # on demand), which already has GOOGLE_MAPS_API_KEY for `route`/
      # `render_map`; the collector calling Google unconditionally on every
      # poll cost real billed requests for addresses nobody ever read.
      # Same reasoning as nora's TZ: fix timestamps and logs should read in the
      # group's clock, not UTC.
      - TZ=Asia/Hong_Kong
    volumes:
      - ./config.toml:/app/config.toml:ro
      # The circle/member mapping — the collector's entire roster (design/19 §3).
      - ./identity.toml:/app/identity.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9101/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  analytics:
    image: nora:latest
    container_name: analytics
    restart: unless-stopped
    # Same entrypoint-override shape as `presence` — the image's ENTRYPOINT
    # is `uv run --no-sync python -m nora`, so this process must override
    # it rather than append a command.
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "nora.analytics"]
    command: ["--config", "config.toml"]
    networks: [nora]
    # :9103, next free port after nora's own :9100, and presence's :9101 (:9102 was the retired `drop`).
    ports: ["127.0.0.1:9103:9103"]
    depends_on:
      db:
        # Like presence, this process runs `alembic upgrade head` itself on
        # startup, so it needs a SERVING Postgres, not merely a spawned one.
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://nora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/nora
      - TZ=Asia/Hong_Kong
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./identity.toml:/app/identity.toml:ro
      # The unit rollups (step 2, design/cognition-loop/25-rollup.md §3) read
      # which rooms make up each unit and who its members are. Without it the
      # presence Rollup still runs and the unit rollups compute nothing.
      - ./policy.toml:/app/policy.toml:ro
    # Same override as `presence`'s below — the image's baked-in HEALTHCHECK
    # targets the main agent's :9100/health, which this entrypoint never
    # serves (confirmed live: it sat "unhealthy" forever on a genuinely
    # healthy process, since nothing ever answered :9100 in this container).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9103/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # rustfs — S3-compatible object store: Nora's blob store ([media.rustfs],
  # DEC-136) holds every attachment, generated image and computer export, and
  # the portal's /artifacts page streams them back (ADR 0023). The old `drop`
  # service's bucket (`drop-artifacts`) is left in place, unread. Chosen over
  # MinIO (OSS repo archived Apr 2026), SeaweedFS (built for a multi-node
  # distribution problem this single-box deployment doesn't have) and Garage
  # (AGPL, built for geo-distributed/unreliable infra). Pinned to a release
  # candidate; still pre-stable (RustFS has not cut a 1.0.0 final).
  #
  # Publishes NOTHING — same posture as `signal-cli`: reachable only
  # as `rustfs:9000` (S3 API) / `rustfs:9001` (console) on the private `nora`
  # network.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.1
    container_name: rustfs
    restart: unless-stopped
    networks: [nora]
    environment:
      # Root credentials for the S3 API. Required (`:?`, not `:-`) the same
      # way POSTGRES_PASSWORD is below — an object store holding Nora's files
      # shouldn't ever fall back to RustFS's own built-in default
      # credential. Values live in the host `.env`, never in this file (DEC-8).
      - RUSTFS_ROOT_USER=${RUSTFS_ROOT_USER:?set RUSTFS_ROOT_USER in .env}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_ROOT_PASSWORD:?set RUSTFS_ROOT_PASSWORD in .env}
    volumes:
      - rustfs-data:/data
    healthcheck:
      # No `-f`: RustFS's advertised liveness path (/rustfs/health/live,
      # MinIO-style convention) was observed 2026-08-12 to return 403
      # unsigned once its IAM subsystem finishes initializing — every route
      # on :9000 requires SigV4 auth, health path included, so `-f` (which
      # treats any 4xx/5xx as a curl failure) would report unhealthy on a
      # server that is actually up and answering. Dropping `-f` makes this a
      # pure "is something listening and completing HTTP transactions on
      # :9000" check: curl exits 0 for ANY HTTP response (200, 403, whatever)
      # and only non-zero on a connection-level failure (refused/timeout) —
      # verified: `curl -sS -o /dev/null` against this exact 403 exits 0,
      # against a closed port exits 7. Good enough for "the process is up";
      # tightening this to an authenticated check is for whoever wires the
      # real ingest calls (§7a), not this scaffolding task.
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # embedder — the memory index's embedding model
  # (design/unified-memory/65-build-step-3-vectors.md): Qwen3-VL-Embedding-2B,
  # the Q4_K_M GGUF and its f16 projector, served by llama.cpp's server with
  # `--embedding --pooling last`, the setup the bake-off measured (#22, #24:
  # ~3.06 GB peak RSS, ~0.4 s a text and ~3.4 s an image on norty's CPU).
  # nora reaches it as `embedder:8080` (`[memory_index] embedder_url`); the
  # worker that calls it runs only under `[memory_index] embed = true`.
  #
  # - Profile `embedder`: not started by a plain `docker compose up`. Bring it
  #   up with `docker compose --profile embedder up -d embedder`, then turn the
  #   worker on.
  # - The model files are bind-mounted READ-ONLY from EMBEDDER_MODELS_DIR
  #   (.env; default ./models/embedder), never downloaded by the container.
  #   The two file names are the ones `config.toml [memory_index]
  #   embedder_model` describes; a different file is a different model.
  # - Threads capped at 4 and memory at 4g with no swap (`stt`'s reason: the
  #   weights stay resident), so a backfill leaves the turn path its CPU.
  # - nora reaches it on the `embedder` network, which is internal. The eval
  #   suite runs on the host, where neither `embedder` nor the container's
  #   address on an internal network answers, and docker publishes no port
  #   for a container whose only network is internal. So it also joins
  #   `embedder_host`, a network of its own whose one job is to carry a
  #   LOOPBACK publish (127.0.0.1:8092, `nora.subject.EMBEDDER_FROM_HOST`):
  #   nothing off the box reaches it, and no other service joins it.
  # - Pinned to the nearest published server image after the bake-off's
  #   build (b11521, b42b7e6d3): b11541, by digest.
  # - The bake-off's server flags exactly (results/20261015T171213Z-stage2-*:
  #   `-c 2048 -b 2048 -ub 2048 -t 4 -ngl 0 --parallel 1`), so memory and the
  #   image token cap (which the server ties to -ub) are what was measured.
  #   A pooled embedding is one micro-batch, so the client keeps every prompt
  #   under 2048 tokens (`nora.infra.embedder.TOKEN_BUDGET`).
  # - LLAMA_MEDIA_MARKER pins the multimodal marker: unset, this build picks a
  #   random one per start, and a client holding the old one gets HTTP 500.
  embedder:
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    image: ghcr.io/ggml-org/llama.cpp:server-b11541@sha256:bf3da52e92c083472b3d1c9f9da081f423ab9def95a87ec4bba51940382d75fd
    container_name: embedder
    restart: unless-stopped
    profiles: [embedder]
    networks: [embedder, embedder_host]
    ports: ["127.0.0.1:8092:8080"]
    environment:
      - LLAMA_MEDIA_MARKER=<__media__>
    command:
      - "--embedding"
      - "--pooling"
      - "last"
      - "-m"
      - "/models/Qwen3-VL-Embedding-2B.Q4_K_M.gguf"
      - "--mmproj"
      - "/models/Qwen3-VL-Embedding-2B.mmproj-f16.gguf"
      - "-c"
      - "2048"
      - "-b"
      - "2048"
      - "-ub"
      - "2048"
      - "-t"
      - "4"
      - "-ngl"
      - "0"
      - "--parallel"
      - "1"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    cpus: 4
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - ${EMBEDDER_MODELS_DIR:-./models/embedder}:/models:ro
    healthcheck:
      # llama-server's own /health: 200 once the model is loaded.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  # db — Nora's own PostgreSQL record store (design/20 §3). Reached as `db:5432`
  # on the private network; loopback publish (127.0.0.1:5435) lets host-side ops
  # (migrations, the one-time load, backups, the `nora groups` CLI) in without
  # exposing it off the box.
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    networks: [nora]
    ports: ["127.0.0.1:5435:5432"]
    environment:
      POSTGRES_USER: nora
      POSTGRES_DB: nora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # pg18+ stores data in a major-version subdir under this mount
      # (/var/lib/postgresql/18/docker) — mount the PARENT, not .../data, or the
      # image refuses to start ("unused mount/volume"). See docker-library/postgres#1259.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nora -d nora"]
      interval: 10s
      timeout: 5s
      retries: 5

  # stt — Nora's local Cantonese STT. Own image, own dependency set
  # (deploy/stt/), NOT built from nora:latest — the same "separate app that
  # lives in this repo" shape.
  #
  # Two engines behind one OpenAI-compatible /v1/audio/transcriptions
  # (decision: design/voice-channel/06-stt-provider-decision.md, 2026-09-15):
  # the DEFAULT is JackyHoCL whisper-large-v3-turbo-cantonese-noise-detection
  # (transformers, fp32 CPU) — the only A/B engine that kept both `RV` and
  # `discord` intact on real Discord voice audio, Hant + punctuation out of
  # the box. SenseVoiceSmall (FunASR) stays as the always-loaded backup —
  # the latency floor (RTF ~0.04) and zero-new-infrastructure failover.
  #
  # Posture mirrors signal-cli: NO `ports:` publish at all — reachable
  # only as `stt:8000` on the private `nora` network. Audio from the group
  # stays on the box; there is no reason to ever expose the transcription
  # surface to the host or the internet.
  #
  # The default model (~3.2GB fp32) downloads from Hugging Face on FIRST boot
  # into the container's ~/.cache/huggingface; the SenseVoice backup (~936MB)
  # downloads from ModelScope into ~/.cache/modelscope on first use. The named
  # volumes pin both caches so a restart/recreate doesn't re-download; first
  # start_period is long because of the download, subsequent starts are fast.
  stt:
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    build:
      context: ./deploy/stt
      # network: host is REQUIRED, same reason as every other build in this
      # file (operational constraint 1): BuildKit's bridge can't resolve
      # deb.debian.org on this host, so apt-get stalls/fails. This Dockerfile
      # does apt-get install curl.
      network: host
    image: stt:latest
    container_name: stt
    restart: unless-stopped
    networks: [nora]
    # NEVER SWAPPED (2026-10-01). Every slow first wake of a voice session
    # (3 of 14 recorded turns, 8.6-9.1s before the turn even began; on
    # 2026-10-01 the stt log shows forward=4.97s for 5.3s of speech, RTF 0.94,
    # against 0.06 warm) came after hours of idle, and a restart does NOT
    # reproduce it (first call 0.71s), so it is not model init. norty holds
    # ~14GB of swap with RAM to spare and its idle containers are the ones
    # paged out (`voice-wake` 187MB, `omniroute` 432MB, `signal-cli` 544MB on
    # 2026-10-01); the first call after a long idle faults the weights back
    # in. `memswap_limit` equal to `mem_limit` gives the cgroup no swap, so
    # its anonymous pages (the loaded weights) stay resident. 8g is headroom,
    # not a measurement: sensevoice alone is ~3.2GB and the lazily loaded
    # noise-detection whisper adds ~3.5GB, and a cap is not a reservation.
    # Pinned by tests/architecture/test_voice_path_never_swaps.py.
    mem_limit: 8g
    memswap_limit: 8g
    volumes:
      - stt-modelscope-cache:/home/stt/.cache/modelscope
      - stt-huggingface-cache:/home/stt/.cache/huggingface
      # config.toml [speech.wake].stt_model = the engine pre-loaded at boot
      # (2026-09-17: replaced the STT_MODEL env var, which had drifted from
      # this file). Read-only, like nora's own mount of the same file.
      - ./config.toml:/app/config.toml:ro
    healthcheck:
      # /health is served by the server process itself (deploy/stt/server.py)
      # — proves the HTTP layer is up; the model may still be downloading on
      # first boot, hence the long start_period below.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      # 900s: the first boot downloads ~3.2GB of fp32 whisper weights from
      # Hugging Face and then loads them on CPU before /health serves.
      start_period: 900s
      retries: 3

  # voice-sidecar — stage 2 of the voice-channel design
  # (design/voice-channel/05-sidecar-receive.md): a Node receive-only sidecar
  # (@discordjs/voice + libdave, Discord's own stack) that joins a Discord
  # voice channel, DAVE-decrypts per-user Opus, decodes to PCM, and forwards
  # {user_id, pcm} over a local TCP seam to the FUTURE Python wake gate
  # (stage 3, separately gated — nothing consumes the stream yet). Dumb pipe:
  # no wake, no STT, no AI; audio is forwarded, never stored.
  #
  # Posture mirrors stt: own image from deploy/voice-sidecar/, NO `ports:`
  # publish — reachable only on the private `nora` network. Without
  # DISCORD_BOT_TOKEN the service is healthy-but-idle (its /health is
  # liveness, see the README in deploy/voice-sidecar/), so a deployment with
  # voice receive off still starts clean.
  voice-sidecar:
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    build:
      context: ./deploy/voice-sidecar
      # network: host is REQUIRED, same reason as every other build in this
      # file (operational constraint 1): BuildKit's bridge can't resolve
      # deb.debian.org on this host, so apt-get stalls/fails. This Dockerfile
      # does apt-get install curl.
      network: host
    image: voice-sidecar:latest
    container_name: voice-sidecar
    restart: unless-stopped
    networks: [nora]
    environment:
      # The same bot token the nora service uses (Discord adapter, DEC-102) —
      # the sidecar joins voice as the same bot. `:-` not `:?` so a
      # deployment with voice receive off starts without it (idle, above).
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      # NO GUILD IDENTITY HERE (multi-guild, 2026-09-17). One process serves
      # every guild nora asks it to: a core is created on `/voice/join` and
      # restored at boot from the state directory below. Which guilds exist is
      # nora's `[speech.tts] sidecars`, and Discord itself enforces the rest —
      # a join for a guild this bot is not in fails at the Discord API, which
      # is a stronger authority than any list this container could hold.
      #
      # A guild id is not a secret (it is in every Discord URL) so it never
      # belonged in .env; the bot token does, and stays.
      # The wake-gate seam (deploy/voice-sidecar/TRANSPORT.md). Stage 3 made
      # the consumer real: `voice-wake` below listens on 4599, so the shipped
      # default is the service name on this same private network — the
      # sidecar connects OUT, no port is ever published. 127.0.0.1 remains as
      # an explicit VOICE_PUMP_HOST override for the consume.mjs stand-in.
      - PUMP_HOST=${VOICE_PUMP_HOST:-voice-wake}
      - PUMP_PORT=${VOICE_PUMP_PORT:-4599}
      # Nora drives the audio-controller HTTP contract (join/exit, /music/*,
      # /stream for TTS — the old /play route is gone). The Node server's own
      # default HOST is 127.0.0.1 (a host-run sidecar should stay
      # loopback-only); inside compose it must listen on the private nora
      # network so the nora container can reach
      # http://voice-sidecar:4600/voice/status. 0.0.0.0 here is still
      # private: the service publishes NO host port (no `ports:` at all,
      # above).
      - HOST=0.0.0.0
      # Audio-controller durable desired-state + event callback
      # (design/voice-channel/07 §12.1, §3.3). Both match the defaults in
      # src/service.mjs; pinned here so the posture is explicit. The state
      # lives on the NAMED volume below, not a host bind mount (B-1: a bind
      # mount MASKS the image's chown of /var/lib/audio-controller — a fresh
      # host would see root:root and every write would EACCES; a named
      # volume inherits the image path's ownership on first use).
      #
      # A DIRECTORY, one `<guild_id>.json` inside it (multi-guild 2026-09-17):
      # each guild's connection is its own single-connection state machine
      # with its own file, and this directory is also the process's only
      # memory of which guilds to restore on boot.
      - STATE_DIR=/var/lib/audio-controller
      - NORA_EVENT_URL=http://nora:9100/app/v1/voice/event
    volumes:
      # Desired-state durability (§12.1): /discord exit writes idle, a join
      # writes connected, and the boot decision reads this file — it must
      # survive container restarts/recreates. Named volume (not a bind
      # mount) so it inherits the Dockerfile's `chown node:node` (B-1).
      - audio-controller-state:/var/lib/audio-controller
    healthcheck:
      # /health is process liveness served by src/service.mjs; it answers
      # while the service idles without a token (healthy-but-idle).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-4600}/health"]
      interval: 30s
      timeout: 5s
      # No model download here — but the first `npm ci`-built image boot and
      # the Discord gateway handshake get headroom anyway.
      start_period: 60s
      retries: 3

  # voice-wake — stage 3 of the voice-channel design
  # (design/voice-channel/00-overview.md): the Python wake gate, and the ONLY
  # consumer of the sidecar's seam. Per-user PCM in, openWakeWord 「喂 Nora」
  # detection (the v3 ONNX is baked into the image), utterance collection,
  # transcription via the local `stt` service, and the TRANSCRIPT forwarded
  # to Nora's POST /app/v1/voice/utterance — audio is transient end to end,
  # never stored. Failure posture: no wake → no cost (one STT retry with
  # language unset, then a silent drop).
  #
  # Posture mirrors stt/voice-sidecar: own image from deploy/voice-wake/, NO
  # `ports:` publish — the seam (4599) and /health (4601) are reachable only
  # on the private `nora` network. It has no configuration of its own beyond
  # its binds: with nothing connected it is healthy-but-idle, so a deployment
  # with voice wake off still starts clean.
  voice-wake:
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    build:
      context: ./deploy/voice-wake
      # network: host is REQUIRED, same reason as every other build in this
      # file (operational constraint 1): BuildKit's bridge can't resolve
      # deb.debian.org on this host, so apt-get stalls/fails. This Dockerfile
      # does apt-get install curl.
      network: host
    image: voice-wake:latest
    container_name: voice-wake
    restart: unless-stopped
    networks: [nora]
    # NEVER SWAPPED, same reason as `stt` above: the wake model and its
    # onnxruntime state are resident memory the first utterance after an idle
    # stretch needs at once (187MB of this container was in swap on
    # 2026-10-01). ~0.4-0.5GB resident; 2g is headroom.
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      # NO GUILD IDENTITY HERE EITHER (multi-guild, 2026-09-17). The guild
      # arrives per CONNECTION in the sidecar's hello frame, so one gate
      # serves them all and this container is identical on every deployment.
      # nora resolves that guild to the room marked `voice = true` in
      # policy.toml, so a spoken utterance lands beside its typed chat.
      # Model knobs — threshold, model path, STT engine (sensevoice: warm 0.3s
      # CPU vs whisper 5.1s), STT endpoint/language/timeout, silence tail —
      # come from config.toml [speech.wake] + [speech.stt], mounted below.
      # NOT env since 2026-09-17: compose and the config file used to disagree.
      # `nora` is the nora container's aiohttp app (health + web routes on
      # 9100), reached by SERVICE NAME on this network.
      - NORA_INGEST_URL=http://nora:9100
    volumes:
      - ./config.toml:/app/config.toml:ro
    healthcheck:
      # /health is process liveness served by the wake service itself; it
      # answers while the service idles without a channel configured
      # (healthy-but-idle), same posture as the sidecar's.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4601/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # --- the metrics reader, and the path an alert takes to a human -----------
  #
  # Added 2026-09-09. Until then NOTHING scraped the 94 `nora_*` series: they
  # were exposed on :9100 and read only when a human curled them, while
  # `nora-egress.service` sat in `failed` for sixteen days with nothing to say
  # so. Three stores and no reader — `docs/observability.md`.
  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: nora-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30 days. At this deployment's volume (94 series, 30s scrape) that is
      # well under a gigabyte, and it is the window in which "when did this
      # start" is still a useful question.
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks: [nora]
    ports:
      # 127.0.0.1 like every other admin surface here: reachable over the
      # Tailscale host, never published to the LAN.
      - "127.0.0.1:9190:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: nora-alertmanager
    restart: unless-stopped
    # Alertmanager reads a bearer from a FILE (http_config credentials_file), not
    # the environment, and the config is a read-only mount. So the shared bridge
    # token is written to tmpfs before the real binary starts: it never lands in
    # the config, the image or a volume. Same token the alert-bridge checks.
    environment:
      - NORA_BRIDGE_TOKEN=${NORA_BRIDGE_TOKEN:?set NORA_BRIDGE_TOKEN in the host environment first}
    entrypoint: ["/bin/sh", "-c", "umask 077 && printf '%s' \"$$NORA_BRIDGE_TOKEN\" > /run/alertmanager/bridge-token && exec /bin/alertmanager \"$$@\"", "alertmanager"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    tmpfs:
      - /run/alertmanager
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [nora]
    ports:
      - "127.0.0.1:9193:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  alert-bridge:
    build: ./deploy/alert-bridge
    image: nora-alert-bridge:latest
    container_name: nora-alert-bridge
    restart: unless-stopped
    environment:
      # WHERE alerts go: the same Discord channel the participation mirror uses
      # for operator review. Empty means alerts are rendered, logged and
      # dropped — the bridge says so at ERROR rather than pretending.
      - ALERT_DISCORD_CHANNEL=${ALERT_DISCORD_CHANNEL:-}
      # The SAME bot credential Nora holds. Reused rather than a second
      # webhook: a webhook would have to be created by hand in the Discord UI,
      # while this variable is already in `.env`. The REST call does not care
      # whether Nora's Gateway session is alive, which is the whole point of
      # this container being separate.
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      # The shared bridge bearer. Required: the bridge refuses to start without
      # it, and Alertmanager sends it on every POST (deploy/alertmanager).
      - NORA_BRIDGE_TOKEN=${NORA_BRIDGE_TOKEN:?set NORA_BRIDGE_TOKEN in the host environment first}
    # NOT on the `nora` network only: this one needs the public internet to
    # reach discord.com, and it no longer needs to reach signal-cli at all.
    networks: [nora, default]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9110/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  nora:
  # Honcho's API and nora, and nothing else (#633). Owned by NEITHER compose
  # project: it is created once by hand, INTERNAL (`docker network create --internal
  # honcho_memory`: no gateway, so nora's default route stays on `nora`)
  # and both stacks mark it external, so taking either stack down never removes
  # it. Absent, `docker compose up nora` fails at once and names it, before the
  # running container is touched.
  honcho:
    external: true
    name: honcho_memory
  # The embedding server and nora, and nothing else (65 V1). Internal: the
  # model server needs no egress, and an internal network has no gateway, so
  # joining it cannot move nora's default route (the `honcho` network's note).
  embedder:
    internal: true
  # The embedder's loopback publish for the eval suite on the host, and nothing
  # else: docker publishes no port for a container on internal networks only.
  # No masquerade, so it gives the model server no NAT route out; the publish
  # is docker-proxy on the host connecting in, which needs none.
  embedder_host:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # SearXNG + Firecrawl network joins REMOVED (DEC-73, 2026-08-08): web_search is
  # Tavily (a public API reached over the default network), web_fetch is gone, so
  # Nora no longer calls the co-located SearXNG/Firecrawl containers.

volumes:
  prometheus-data:
  alertmanager-data:
  db-data:
  rustfs-data:
  # ModelScope weights cache for the `stt` service (~/.cache/modelscope inside
  # the container) — pins the ~936MB SenseVoiceSmall backup download across
  # restarts/recreates so it happens once, not every boot.
  stt-modelscope-cache:
  # Hugging Face weights cache for the `stt` service (~/.cache/huggingface
  # inside the container) — pins the ~3.2GB noise-detection whisper download
  # (the DEFAULT model since 2026-09-15) the same way.
  stt-huggingface-cache:
  # audio-controller's desired-state file (design/voice-channel/07 §12.1).
  # Named (not a bind mount) so the volume inherits the image's
  # `chown node:node /var/lib/audio-controller` on first use (B-1).
  audio-controller-state:
