services:
  nora:
    # NOTE: build with `docker build --network=host .` — BuildKit's default bridge
    # can't resolve deb.debian.org on this host (systemd-resolved stub 127.0.0.53),
    # so `apt-get update` stalls ~30s per repo and the build never finishes.
    build: .
    image: nora:latest
    container_name: nora
    restart: unless-stopped
    # Nora only ever talks to localhost services (signal-cli :18080, Honcho :8000,
    # OmniRoute :20128) and exposes metrics on :9100 — host networking is simpler and
    # more honest than reproducing three port-forwards for a purely localhost agent.
    # signal-cli itself is NOT touched: it keeps running on the host, unmodified.
    network_mode: host
    environment:
      # Never hardcoded — must already be exported in the shell that runs `docker
      # compose up` (see .env.example). Compose fails fast if it's unset.
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:?set OMNIROUTE_API_KEY in the host environment first}
      # Langfuse OTLP auth. Optional by design: tracing is never load-bearing, so an
      # unset value must degrade to no-auth rather than refuse to boot — hence `:-`
      # and not `:?`. config.toml's obs.tracing.headers_env names this variable; the
      # value never appears in config (DEC-8).
      - LANGFUSE_OTLP_HEADERS=${LANGFUSE_OTLP_HEADERS:-}
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
      - ./identity.toml:/app/identity.toml:ro
      # Read-only so edits on the host (persona hot-reload, mtime-based) are visible
      # inside the container without a rebuild or restart.
      - ./nora/persona:/app/nora/persona:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
