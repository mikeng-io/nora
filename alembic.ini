# For CLI use only — `uv run alembic check`, `uv run alembic revision --autogenerate`.
# The application builds its Config programmatically in
# nora/infra/sql/migrations_runner.py and never reads this file, so an
# unmounted ini can never stop Nora from starting.
[alembic]
script_location = nora/infra/sql/migrations
# NOT the production `nora` database, deliberately. Alembic creates
# alembic_version as a side effect before most commands report anything, so a
# bare `alembic` invocation would mutate a real database before telling you it
# was wrong. This default names an obvious scratch database on localhost that
# does not exist by default; target a real database explicitly:
#   uv run alembic -x db=postgresql+psycopg://nora:…@localhost/scratch check
# Runtime never reads this file — nora/infra/sql/migrations_runner.py builds its
# Config programmatically, deriving the psycopg (sync) URL from DATABASE_URL.
sqlalchemy.url = postgresql+psycopg://localhost/alembic_cli_scratch
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
