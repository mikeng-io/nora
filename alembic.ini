# For CLI use only — `uv run alembic check`, `uv run alembic revision --autogenerate`.
# The application builds its Config programmatically in
# nora/infra/sql/migrations_runner.py and never reads this file, so an
# unmounted ini can never stop Nora from starting.
[alembic]
script_location = nora/infra/sql/migrations
# NOT data/messages.db, deliberately. Alembic creates alembic_version as a side
# effect before most commands report anything, so a bare `alembic` invocation
# from the repo root would mutate production before telling you it was wrong.
# This default is a harmless scratch file; target a real database explicitly:
#   uv run alembic -x db=/tmp/some-copy.db check
# Runtime never reads this file — nora/infra/sql/migrations_runner.py builds its
# Config programmatically.
sqlalchemy.url = sqlite:///data/alembic-cli-scratch.db
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
