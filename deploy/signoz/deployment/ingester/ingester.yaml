# SigNoz ingester config — rendered by Foundry (casting.yaml pins), then
# extended for Nora (issue #440, ADR 0034). Non-secret inputs live in the repo;
# host mounts/credentials stay in the local secret.toml-named refs.
#
# Additions vs the stock render:
#   * memory_limiter + file_storage-backed sending queues — bounded memory and
#     a durable export queue (Trustless write-stall lesson).
#   * tail_sampling: keep generation traces, error traces and undeclared roots;
#     drop `nora.trace_kind=plumbing` successes (the R-76 noise rule, moved
#     from SDK head sampling to outcome-aware tail selection).
#   * transform/normalize_llm: Strands stamps accumulated usage on the
#     invoke_agent parent as well as each chat leaf — renamed so trace
#     token/cost totals count each model call exactly once.
#   * prometheus receiver: scrapes nora/presence/analytics + this collector's
#     own telemetry endpoint (the ingestion-path self-monitor).
#   * filelog receiver (container JSON logs) and journald receiver (Linux
#     host journal) — one canonical log path; enable per deployment.
connectors:
  signozmeter:
    dimensions: [service.name, deployment.environment, host.name]
    metrics_flush_interval: 1h
extensions:
  pprof:
    endpoint: 0.0.0.0:1777
  signoz_health_check:
    endpoint: 0.0.0.0:13133
  file_storage/collector:
    # Durable queue + cursor state; survives container recreation.
    directory: /var/lib/otelcol/storage
    timeout: 5s
exporters:
  clickhouselogsexporter:
    dsn: tcp://signoz-telemetrystore-clickhouse-0-0:9000/signoz_logs
    timeout: 45s
    use_new_schema: true
    sending_queue:
      enabled: true
      queue_size: 1000
      storage: file_storage/collector
    retry_on_failure:
      enabled: true
  clickhousetraces:
    datasource: tcp://signoz-telemetrystore-clickhouse-0-0:9000/signoz_traces
    low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
    timeout: 45s
    use_new_schema: true
    sending_queue:
      enabled: true
      queue_size: 2000
      storage: file_storage/collector
    retry_on_failure:
      enabled: true
  metadataexporter:
    cache:
      provider: in_memory
    dsn: tcp://signoz-telemetrystore-clickhouse-0-0:9000/signoz_metadata
    enabled: true
    timeout: 45s
  signozclickhousemeter:
    dsn: tcp://signoz-telemetrystore-clickhouse-0-0:9000/signoz_meter
    timeout: 45s
  signozclickhousemetrics:
    dsn: tcp://signoz-telemetrystore-clickhouse-0-0:9000/signoz_metrics
    timeout: 45s
    sending_queue:
      enabled: true
      queue_size: 1000
      storage: file_storage/collector
processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 70
    spike_limit_percentage: 20
  batch:
    send_batch_max_size: 55000
    send_batch_size: 50000
    timeout: 5s
  batch/meter:
    send_batch_max_size: 25000
    send_batch_size: 20000
    timeout: 5s
  signozllmpricing:
    attrs:
      cache_read: gen_ai.usage.cache_read.input_tokens
      cache_write: gen_ai.usage.cache_creation.input_tokens
      in: gen_ai.usage.input_tokens
      model: gen_ai.request.model
      out: gen_ai.usage.output_tokens
    default_pricing:
      rules: []
    output_attrs:
      cache_read: signoz.gen_ai.usage.cache_read.input_tokens.cost
      cache_write: signoz.gen_ai.usage.cache_write.input_tokens.cost
      in: signoz.gen_ai.usage.input_tokens.cost
      out: signoz.gen_ai.usage.output_tokens.cost
      total: signoz.gen_ai.usage.tokens.cost
  signozspanmapper:
    groups: []
  transform/normalize_llm:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Strands aggregates usage onto invoke_agent parents AND the chat
          # leaves — SigNoz sums gen_ai.usage.* per trace, so the parent's copy
          # is renamed (kept for debugging, excluded from totals).
          - set(attributes["gen_ai.agent.usage.input_tokens"], attributes["gen_ai.usage.input_tokens"]) where attributes["gen_ai.operation.name"] == "invoke_agent"
          - set(attributes["gen_ai.agent.usage.output_tokens"], attributes["gen_ai.usage.output_tokens"]) where attributes["gen_ai.operation.name"] == "invoke_agent"
          - set(attributes["gen_ai.agent.usage.total_tokens"], attributes["gen_ai.usage.total_tokens"]) where attributes["gen_ai.operation.name"] == "invoke_agent"
          - set(attributes["gen_ai.agent.usage.cache_read_input_tokens"], attributes["gen_ai.usage.cache_read_input_tokens"]) where attributes["gen_ai.operation.name"] == "invoke_agent"
          - set(attributes["gen_ai.agent.usage.cache_creation_input_tokens"], attributes["gen_ai.usage.cache_creation_input_tokens"]) where attributes["gen_ai.operation.name"] == "invoke_agent"
          - delete_key(attributes, "gen_ai.usage.input_tokens") where attributes["gen_ai.operation.name"] == "invoke_agent"
          - delete_key(attributes, "gen_ai.usage.output_tokens") where attributes["gen_ai.operation.name"] == "invoke_agent"
          - delete_key(attributes, "gen_ai.usage.total_tokens") where attributes["gen_ai.operation.name"] == "invoke_agent"
          - delete_key(attributes, "gen_ai.usage.prompt_tokens") where attributes["gen_ai.operation.name"] == "invoke_agent"
          - delete_key(attributes, "gen_ai.usage.completion_tokens") where attributes["gen_ai.operation.name"] == "invoke_agent"
          - delete_key(attributes, "gen_ai.usage.cache_read_input_tokens") where attributes["gen_ai.operation.name"] == "invoke_agent"
          - delete_key(attributes, "gen_ai.usage.cache_creation_input_tokens") where attributes["gen_ai.operation.name"] == "invoke_agent"
  signozspanmetrics/delta:
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    dimensions:
      - {name: service.namespace, default: default}
      - {name: deployment.environment, default: default}
      - {name: signoz.collector.id}
      - {name: service.version}
    dimensions_cache_size: 100000
    enable_exp_histogram: true
    latency_histogram_buckets: [100us, 1ms, 2ms, 6ms, 10ms, 50ms, 100ms, 250ms,
      500ms, 1000ms, 1400ms, 2000ms, 5s, 10s, 20s, 40s, 60s]
    metrics_exporter: signozclickhousemetrics
    metrics_flush_interval: 60s
  tail_sampling:
    # Nora turns run long (p50 ~14s, spans observed past 90s); the window is
    # sized for the slowest measured turn, not Trustless's 10s/1500ms.
    decision_wait: 300s
    num_traces: 50000
    expected_new_traces_per_sec: 50
    policies:
      - name: keep-generations
        type: string_attribute
        string_attribute:
          key: gen_ai.operation.name
          values: [chat, invoke_agent]
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-non-plumbing
        type: string_attribute
        string_attribute:
          key: nora.trace_kind
          values: [plumbing]
          invert_match: true
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus/nora:
    config:
      scrape_configs:
        - job_name: nora
          scrape_interval: 30s
          static_configs:
            - targets: ["nora:9100"]
        - job_name: presence
          scrape_interval: 30s
          static_configs:
            - targets: ["presence:9101"]
        - job_name: analytics
          scrape_interval: 30s
          static_configs:
            - targets: ["analytics:9103"]
        - job_name: signoz-ingester
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:8888"]
  filelog/containers:
    # Local/docker json-file proof path (Docker Desktop). On the Linux deploy
    # host the journald receiver below is the durable source instead.
    include: [/var/log/containers/*-json.log]
    start_at: end
    storage: file_storage/collector
    operators:
      - type: json_parser
      - type: move
        from: body.log
        to: body
  journald/nora:
    # Linux host path: Docker journald driver writes unit entries; the
    # compatible collector image (deploy/signoz/collector/Dockerfile) carries
    # journalctl plus the journal mounts this needs.
    directory: /var/log/journal
    units: [nora, presence, analytics, instagram-bridge, signal-bridge,
      discord-bridge, whatsapp-bridge, bridge-projection]
    storage: file_storage/collector
    operators:
      - type: json_parser
        if: 'body matches "^{.*}$"'
      - type: move
        from: body.message
        to: body
        if: 'body.message != nil'
service:
  extensions: [signoz_health_check, pprof, file_storage/collector]
  telemetry:
    logs:
      encoding: json
    metrics:
      # Self-telemetry for the ingestion-path absence alert
      # (IngestionSilent replaces PrometheusNotIngesting).
      address: 0.0.0.0:8888
  pipelines:
    logs:
      exporters: [clickhouselogsexporter, signozmeter, metadataexporter]
      processors: [memory_limiter, batch]
      receivers: [otlp]
    logs/containers:
      exporters: [clickhouselogsexporter, metadataexporter]
      processors: [memory_limiter, batch]
      receivers: [filelog/containers, journald/nora]
    metrics:
      exporters: [signozclickhousemetrics, signozmeter, metadataexporter]
      processors: [memory_limiter, batch]
      receivers: [otlp, prometheus/nora]
    metrics/meter:
      exporters: [signozclickhousemeter]
      processors: [batch/meter]
      receivers: [signozmeter]
    traces:
      exporters: [clickhousetraces, signozmeter, metadataexporter]
      processors:
        - memory_limiter
        - tail_sampling
        - transform/normalize_llm
        - signozspanmetrics/delta
        - signozspanmapper
        - signozllmpricing
        - batch
      receivers: [otlp]
