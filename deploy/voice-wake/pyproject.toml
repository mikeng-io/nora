[project]
name = "nora-voice-wake"
version = "0.1.0"
description = "Nora voice wake gate -- stage 3 of the voice-channel design (design/voice-channel/). The only consumer of the voice-sidecar's TCP seam: per-user PCM in, openWakeWord 喂Nora detection, utterance collection, transcription via the local stt service, transcript forwarded to Nora as text. Separate app from Nora herself (own image, own dependency set) that lives in the same repo and docker-compose project."
requires-python = ">=3.12"
dependencies = [
    # openWakeWord — the wake-word runtime. Pinned to 0.4.0 exactly: it is the
    # last PyPI release whose dependency set (onnxruntime/scipy/scikit-learn,
    # no tflite-runtime) installs on Python 3.12 — 0.6.0's published metadata
    # still depends on tflite-runtime, which has no cp312 wheel (0.6.0's
    # source tree moved to ai-edge-litert but was never released). 0.4.0 is
    # also the version the voice-lab .venv-wake ran the model's gates
    # against, and it bundles the melspectrogram/embedding ONNX preprocessors
    # a custom wakeword_models=[path] load needs.
    "openwakeword==0.4.0",
    # STT POST + Nora forward + the /health endpoint — same HTTP stack Nora
    # herself uses.
    "aiohttp>=3.9",
    # Explicit although openwakeword/scipy both pull it: the PCM conditioning
    # (wakegate/audio.py) is numpy-shaped end to end.
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wakegate"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
