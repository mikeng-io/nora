[project]
name = "nora-drop"
version = "0.1.0"
description = "Nora Drop -- local-first artifact delivery and link shortener. Spec: docs/superpowers/specs/2026-08-12-nora-drop-design.md. This is a separate app from Nora herself (own image, own dependency set) that happens to live in the same repo and docker-compose project."
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.29",
    # POST /api/artifacts (artifacts.py) accepts multipart/form-data --
    # Starlette's Request.form() needs this to parse it at all.
    "python-multipart>=0.0.9",
    # valkey speaks RESP2/RESP3 identically to Redis (spec §4) -- the
    # `redis` package's async client works against it with zero code changes.
    "redis>=5.0",
    # drop's own Postgres client (artifacts.py) -- raw asyncpg, not SQLAlchemy:
    # the table this app reads/writes is Nora's own alembic-owned schema
    # (nora/infra/sql/schema.py, nora/infra/sql/migrations/versions/0007_drop_artifacts.py)
    # -- this app never migrates it, only queries the shape that migration
    # already created.
    "asyncpg>=0.29",
    # RustFS's S3 API (artifacts.py) -- boto3, called through asyncio.to_thread
    # the same way nora/infra/blobs/filesystem.py offloads its own blocking I/O,
    # rather than pulling in aiobotocore's larger dependency chain for a
    # few-artifacts-a-day service.
    "boto3>=1.34",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Same rule selection as the top-level repo's own [tool.ruff.lint] --
# consistency across the two apps, not a stricter/looser bar for this one.
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "ASYNC", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S101 — tests assert (root repo's own tests/** ignore, same reasoning).
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
# This app has no in-repo stubs for asyncpg/boto3/redis's own typing surface
# and no reason to vendor any -- unlike nora/'s own strict-scoped mypy gate
# (CLAUDE.md), this is a best-effort check on the app's OWN code, not a
# strict boundary.
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# server.py/artifacts.py/links.py/auth.py/slugs.py import each other as flat
# top-level modules (no package __init__.py -- this app is a script, not a
# library, per the module-level `[tool.uv] package = false` note below), so
# the app root needs to be on sys.path for `tests/` (a subdirectory) to import
# them the same way `uv run python server.py` does at runtime.
pythonpath = ["."]

[tool.uv]
# This is an application, not a library other code imports -- there is nothing
# for uv to build a wheel out of (server.py is run directly, not imported).
# `package = false` tells `uv sync` to install only the dependency set above
# into .venv without trying to build/install this project itself, so no
# [build-system] table is needed.
package = false
