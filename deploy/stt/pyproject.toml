[project]
name = "nora-stt"
version = "0.1.0"
description = "Nora STT -- local OpenAI-compatible transcription endpoint, Cantonese-first. Two engines behind one /v1/audio/transcriptions: JackyHoCL whisper-large-v3-turbo-cantonese-noise-detection (transformers, the default since 2026-09-15, design/voice-channel/06) and SenseVoiceSmall (FunASR, the 2026-08-21 backup). Separate app from Nora herself (own image, own dependency set) that lives in the same repo and docker-compose project."
requires-python = ">=3.12"
dependencies = [
    # FunASR -- SenseVoiceSmall model runtime (iic/SenseVoiceSmall), Apache-2.0.
    # Serves /v1/audio/transcriptions in OpenAI-compatible shape so Nora (or any
    # OpenAI-style client) can call it without a custom adapter.
    "funasr>=1.2",
    # transformers runtime for the DEFAULT model, JackyHoCL
    # whisper-large-v3-turbo-cantonese-noise-detection (MIT; fp32 CPU).
    # >=4.46.3 is the model card's tokenizer floor; the lock resolves 5.x and
    # server.py's loader is written against the 5.x API (`dtype=`).
    "transformers>=5",
    # low_cpu_mem_usage=True in from_pretrained needs accelerate.
    "accelerate>=1",
    # The whisper pipeline gets audio as a numpy array; soundfile reads the
    # ffmpeg-normalized 16kHz WAV (already a funasr transitive dep, made
    # explicit because server.py imports it directly now).
    "soundfile>=0.12",
    # HTTP layer for the OpenAI-compatible endpoint.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    # multipart/form-data parsing for the OpenAI `file=@...` upload shape.
    "python-multipart>=0.0.9",
    # SenseVoice emits Simplified Chinese; Nora's doctrine is yue-Hant-HK, so the
    # server converts s2t inline (see server.py) -- Nora should never have to
    # think about the written-variant gap.
    "opencc-python-reimplemented>=0.1.7",
    # torch is a hard requirement of both backends but neither funasr nor
    # transformers pins the CPU wheel -- declared here with the CPU index
    # below so `uv sync` installs the ~200MB CPU build, not the multi-GB
    # CUDA one (this host has no CUDA). torchaudio alongside, matching the
    # voice-lab venv that measured both engines on this exact host.
    "torch>=2",
    "torchaudio>=2",
]

# CPU-only torch wheels (see the torch comment above). The Dockerfile no
# longer needs its explicit `uv pip install torch torchaudio --index-url`
# dance -- the lock pins these from this index.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
