[project]
name = "nora-stt"
version = "0.1.0"
description = "Nora STT -- local SenseVoice (FunASR) OpenAI-compatible transcription endpoint, Cantonese-first. Spec: docs/superpowers/specs/2026-08-21-nora-stt-infrastructure-design.md. Separate app from Nora herself (own image, own dependency set) that lives in the same repo and docker-compose project."
requires-python = ">=3.12"
dependencies = [
    # FunASR -- SenseVoiceSmall model runtime (iic/SenseVoiceSmall), Apache-2.0.
    # Serves /v1/audio/transcriptions in OpenAI-compatible shape so Nora (or any
    # OpenAI-style client) can call it without a custom adapter.
    "funasr>=1.2",
    # HTTP layer for the OpenAI-compatible endpoint.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    # multipart/form-data parsing for the OpenAI `file=@...` upload shape.
    "python-multipart>=0.0.9",
    # SenseVoice emits Simplified Chinese; Nora's doctrine is yue-Hant-HK, so the
    # server converts s2t inline (see server.py) -- Nora should never have to
    # think about the written-variant gap.
    "opencc-python-reimplemented>=0.1.7",
]
