# Where an alert GOES, which is the half that decides whether any of this is
# real. `deploy/watchdog.sh` existed since August with an alert channel of
# `echo >&2` plus a non-zero exit — so even scheduled it would have produced a
# failed systemd unit, which is precisely what nobody noticed for sixteen days.
# It was deleted once these rules covered its one condition.
#
# The sink is the Discord review channel the participation mirror already posts
# to — the operator is reading it anyway, so an alert lands beside the
# determinations it is about rather than in a second place to remember.

global:
  resolve_timeout: 5m

route:
  receiver: discord
  # Group by alertname and job so five silent platforms are one message, not
  # five. `group_wait` is short because the thresholds above are already
  # minutes-scale — waiting again would double every alert's latency.
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  # Twelve hours, deliberately long. A repeat every few minutes is how an alert
  # channel becomes a muted one, and every rule here is for a condition a human
  # must act on rather than watch.
  repeat_interval: 12h

receivers:
  - name: discord
    webhook_configs:
      # `alert-bridge` translates Alertmanager's webhook payload into a
      # Discord message. It is a SEPARATE container and deliberately does not
      # go through Nora: the most important alert this stack can send is "Nora
      # is down", and routing that through Nora would make the alert depend on
      # the thing it is reporting.
      #
      # Alertmanager HAS a native `discord_configs`, and this does not use it:
      # that receiver posts a fixed template to a WEBHOOK url, which means
      # creating one by hand in the Discord UI and keeping a second credential,
      # for a message shape we would then have to work around. The bridge is
      # forty lines and already existed.
      - url: http://alert-bridge:9110/alert
        send_resolved: true
        # The shared NORA_BRIDGE_TOKEN as a Bearer. A FILE, not inline: this
        # config is committed. The compose entrypoint writes the token there.
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/alertmanager/bridge-token
