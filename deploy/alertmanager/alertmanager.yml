# Where an alert GOES, which is the half that decides whether any of this is
# real. `deploy/watchdog.sh` has existed since August and its alert channel is
# `echo >&2` plus a non-zero exit — so even scheduled it would have produced a
# failed systemd unit, which is precisely what nobody noticed for sixteen days.
#
# The sink is Signal, because that is where the operator already is.

global:
  resolve_timeout: 5m

route:
  receiver: signal
  # Group by alertname and job so five silent platforms are one message, not
  # five. `group_wait` is short because the thresholds above are already
  # minutes-scale — waiting again would double every alert's latency.
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  # Twelve hours, deliberately long. A repeat every few minutes is how an alert
  # channel becomes a muted one, and every rule here is for a condition a human
  # must act on rather than watch.
  repeat_interval: 12h

receivers:
  - name: signal
    webhook_configs:
      # `alert-bridge` translates Alertmanager's webhook payload into
      # signal-cli's JSON-RPC. It is a SEPARATE container and deliberately does
      # not go through Nora: the most important alert this stack can send is
      # "Nora is down", and routing that through Nora would make the alert
      # depend on the thing it is reporting.
      - url: http://alert-bridge:9110/alert
        send_resolved: true
