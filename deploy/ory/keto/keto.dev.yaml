# Development Keto (v26.2.0) — private listeners only, sqlite persistence.
# Prerequisite: `keto migrate up -c deploy/ory/keto/keto.dev.yaml` creates the
# tables once, then `keto serve -c deploy/ory/keto/keto.dev.yaml`.
# `namespaces.location` is the required v26.2.0 key holding the OPL source URI;
# Strict mode prevents a direct permit tuple from bypassing a deny rewrite.
dsn: sqlite:///var/lib/keto/keto.db?_fk=true
serve:
  read:
    host: 127.0.0.1
    port: 4466
  write:
    host: 127.0.0.1
    port: 4467
limit:
  max_read_depth: 16
namespaces:
  location: file:///etc/keto/namespaces.ts
  experimental_strict_mode: true
