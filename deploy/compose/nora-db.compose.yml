# nora-db — the PostgreSQL record store (design/20 §3).
#
# REVIEW-ONLY FRAGMENT — not applied. This is the stanza to MERGE into the real
# `docker-compose.yml` at cutover, alongside moving signal-cli onto the `nora`
# network and pointing the five external services at host.docker.internal. That
# whole compose edit is operator-run and constraint-sensitive (CLAUDE.md #3:
# signal-cli off host networking is a live-verified ship-condition), so it is
# left here for review rather than written into the live compose file.
#
# The shape (operator direction, §3): every Nora-owned container on a private
# `nora` network; nora-db and signal-cli publish NOTHING (reachable only by name
# on that network); the five external services reached via host.docker.internal.

networks:
  nora:                                   # private; every container Nora owns

services:
  nora-db:
    image: postgres:16-alpine
    networks: [nora]                      # no published port — reachable only as nora-db:5432
    environment:
      POSTGRES_USER: nora
      POSTGRES_DB: nora
      # DEC-8: the password is injected from .env, never inlined here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - nora-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nora -d nora"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── the edits the two existing services need (shown for review) ─────────────
  # signal-cli:
  #   networks: [nora]                    # MOVED off host networking; reached as signal-cli:18080
  #   # publish nothing — a netns reachable only by nora/presence (a stricter
  #   # trust set than host-loopback). Keep --receive-mode=on-start (CLAUDE.md #3).
  #
  # nora:
  #   networks: [nora]
  #   extra_hosts: ["host.docker.internal:host-gateway"]
  #   depends_on:
  #     nora-db: { condition: service_healthy }
  #   environment:
  #     # asyncpg-shaped; the sync/Alembic driver is derived from it.
  #     DATABASE_URL: postgresql+asyncpg://nora:${POSTGRES_PASSWORD}@nora-db/nora
  #   # config.toml base_urls change 127.0.0.1:* -> host.docker.internal:* for
  #   # omniroute/honcho/langfuse; signal-cli becomes signal-cli:18080.
  #
  # presence:                             # design/19 — the same DATABASE_URL, the same network
  #   networks: [nora]
  #   extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  nora-db-data:
