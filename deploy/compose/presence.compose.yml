# presence — the presence collector (design/19 §4, DEC-55).
#
# REVIEW-ONLY FRAGMENT — not applied. This is the stanza to MERGE into the real
# `docker-compose.yml` at cutover, alongside the `nora-db` / networking edits in
# `nora-db.compose.yml`. Applying it is operator work and constraint-sensitive:
# it turns presence ON (`[presence] enabled = true` in config.toml plus the
# Life360 credentials in `.env`), which starts recording five people's movement
# history — the most PII-heavy data in the system (§5). So it is left here for
# review, deliberately not written into the live compose file.
#
# The collector is the SAME image as Nora, a DIFFERENT command (§4): one process
# is `python -m nora`, this one is `python -m nora.presence`. It shares only the
# `nora` database and the Life360 client library with Nora; either can be down
# without the other.

services:
  presence:
    image: nora:latest                    # the SAME image as the nora service
    command: ["python", "-m", "nora.presence", "--config", "/app/config.toml"]
    networks: [nora]                       # private; reaches nora-db by name
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      nora-db: { condition: service_healthy }
    environment:
      # The SAME database URL as Nora — presence is a second store in the one
      # `nora` database (design/20). asyncpg-shaped; Alembic derives the sync URL.
      DATABASE_URL: postgresql+asyncpg://nora:${POSTGRES_PASSWORD}@nora-db/nora
      # Life360 credentials, named via env (DEC-8) — never inlined in config or
      # here. Set these in `.env`; the names match `[presence].*_env` defaults.
      LIFE360_CLIENT_CREDENTIAL: ${LIFE360_CLIENT_CREDENTIAL:?set in .env}
      LIFE360_USERNAME: ${LIFE360_USERNAME:?set in .env}
      LIFE360_PASSWORD: ${LIFE360_PASSWORD:?set in .env}
    volumes:
      # config.toml carries the `[[presence.circles]]` mapping (member→person_id),
      # read-only, exactly as Nora mounts it.
      - ./config.toml:/app/config.toml:ro
    # The daemon's own liveness endpoint (§4): /metrics carries the heartbeat
    # (nora_presence_last_collection_age_seconds) and the canary counters; a
    # separate port from Nora's obs.metrics.port because it is a separate process.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9101/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

# The Dockerfile needs NO change: `nora/presence` is baked in by the existing
# `COPY nora/` (like `nora/skills`), and the migrations ship as package data, so
# the collector can bring the shared `nora` database to head itself. The only
# thing that differs between the two services is the `command:` above.
