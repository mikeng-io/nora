# Nora's metrics reader.
#
# Until 2026-09-09 there was none: 94 `nora_*` series were exposed on :9100 and
# NOTHING scraped them — `ss` showed no established connection to the port, and
# every number in them existed only for as long as a human was curling it. Three
# stores (Prometheus format, Langfuse, Jaeger) and no reader. See
# `docs/observability.md`.
#
# 30s, not 15s: this is one small deployment, the alert thresholds below are all
# minutes-scale, and halving the sample rate halves the storage for no loss of
# anything anyone asks.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The three exporters this deployment already publishes. Container names on
  # the `nora` network, never host ports: the published ones are bound to
  # 127.0.0.1 and Prometheus is not on the host.
  - job_name: nora
    static_configs:
      - targets: ["nora:9100"]
  - job_name: presence
    static_configs:
      - targets: ["presence:9100"]
  - job_name: analytics
    static_configs:
      - targets: ["analytics:9100"]

  # Prometheus watching itself. Cheap, and it is what makes "the rule engine
  # stopped evaluating" visible rather than silent — the failure mode of a
  # monitoring system is to fail quietly and leave everything green.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
