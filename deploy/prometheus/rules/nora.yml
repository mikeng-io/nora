# The alerts, and every one of them is an ABSENCE.
#
# `docs/observability.md` states why this file exists rather than a Sentry
# project: this codebase is built NOT to raise — 210 docstrings promise it, 45
# metric specs declare an `unavailable` state, 223 sites catch and continue — so
# its characteristic failure is a counter label or a gauge that stopped moving,
# never a traceback. Sentry sees what threw. These see what stopped.
#
# Each rule names the incident that motivated it. A rule with no story behind it
# is a rule nobody will trust at 3am, and an untrusted alert is a disabled one.

groups:
  - name: nora-liveness
    rules:
      # THE ONE THAT WOULD HAVE CAUGHT `nora-egress.service`, which sat in
      # `failed` for sixteen days with nothing to say so. A target that does not
      # answer is the cheapest, broadest signal there is.
      - alert: TargetDown
        expr: up == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is not answering its metrics endpoint"
          description: >-
            Prometheus could not scrape {{ $labels.instance }} for 3 minutes.
            Either the process is down or its port is unreachable.

      # The internal loop stalled while the process still answers HTTP — the
      # shape that a healthcheck alone cannot see. `nora_heartbeat_last_tick_
      # age_seconds` is set after every successful tick, so a rising value is a
      # loop that stopped, not a quiet room.
      - alert: HeartbeatStalled
        expr: nora_heartbeat_last_tick_age_seconds > 300
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Nora's heartbeat has not ticked for {{ $value | humanizeDuration }}"

      # A restart LOOP, which `TargetDown` cannot see: it needs 3 continuous minutes of
      # `up == 0`, and a process that comes back within a scrape or two never gives it
      # that. Nora starts 2 to 24 times a day (the 2026-10-02 audit: 47 starts in 4.5
      # days, read from `deploy_revision`; median gap 45 min, shortest 1 min). 17 of
      # the 47 were same-sha restarts, NOT deploys (cause unverified: a recreate
      # discards the previous container's log), so a restart is not a deploy and a day
      # of 24 is real. The rule must fire on a LOOP and stay quiet on a bad day of them.
      # `nora_process_start_time_seconds` changes only when the process restarts
      # (`prometheus_client`'s own `process_start_time_seconds` is not exported: `Metrics`
      # owns its registry), so `changes()` counts the restarts a scrape saw.
      # 6 in 30 minutes is one every 5: faster than any sequence of deploys (a build
      # alone takes minutes) and well under a crash loop's one a minute. Blind by
      # construction to a process that dies BEFORE it serves (a startup failure never
      # exposes the series): that is `TargetDown`, 3 minutes later.
      - alert: NoraRestartLoop
        expr: changes(nora_process_start_time_seconds{job="nora"}[30m]) >= 6
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "nora restarted {{ $value | humanize }} times in 30 minutes"
          description: >-
            Not a deploy: deploys are minutes apart. Capture the previous container's
            log BEFORE the next restart destroys it (`docker logs nora --since 1h`),
            then read `deploy_revision` for the pattern and `docker inspect nora`
            for OOMKilled and ExitCode. `nora cognition health` counts the starts.

      # Errors the code counted instead of raising. This codebase is built not to
      # raise (the file's first comment), so a burst of `nora_errors_total` is how a
      # failing stage shows: the provider, a store, a loop. By STAGE (a code
      # constant), never by room or person. 10 in 15 minutes: a wake loop whose tick
      # fails every 30 s adds 30, a stage that errors once an hour never reaches it.
      # NOT sized from a measured baseline (none was available when this was written):
      # loose on purpose, and `increase()` cannot see the first error of a stage whose
      # series is created by it. Tighten it from `quantile_over_time` on 14 days.
      - alert: NoraErrorsRising
        expr: sum by (stage) (increase(nora_errors_total{job="nora"}[15m])) > 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "nora counted {{ $value | humanize }} errors in 15 minutes (stage {{ $labels.stage }})"
          description: >-
            Read the stage's log lines: `docker logs nora --since 30m | grep -i
            <stage>`. A wake loop (`cognition_wake`), a session (`cognition_session`) or
            a boot reclaim (`cognition_reclaim`) failing is the cognition loop; see
            docs/runbook.md "The cognition loop is not healthy".

      # SSE silence — what `deploy/watchdog.sh` checked, and never ran to check.
      # That script is deleted; this rule is what replaced it.
      # 900s, not the script's 300s: a genuinely quiet night in one room is
      # normal and a threshold that cries wolf is a threshold somebody mutes.
      - alert: PlatformSilent
        expr: nora_adapter_last_event_age_seconds > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "no {{ $labels.platform }} event for {{ $value | humanizeDuration }}"
          description: >-
            The listener may have died without the connection closing. Compare
            against /health's per-platform last_event_age_seconds.

      # Presence is UP but not collecting — the shape TargetDown cannot see.
      # 2026-09-24: Life360 stopped accepting the collector's login at 00:12
      # and every read after was refused for hours. The container stayed
      # healthy, nothing alerted, and the first sign was Nora telling a member
      # they had been home through a ride she never recorded. The gauge climbs
      # from each circle's last SUCCESSFUL read (from boot, if none yet).
      # 1800s: a healthy circle succeeds every 5-60s, so half an hour is a
      # collector that has stopped, never a quiet circle.
      - alert: PresenceCollectionStalled
        expr: nora_presence_last_collection_age_seconds > 1800
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "presence has not collected circle {{ $labels.circle }} for {{ $value | humanizeDuration }}"
          description: >-
            Everything Nora says about where people are or have been stops at
            the last successful read. Check the presence container log for
            `life360 auth failed` / `banned/refused` before restarting it.

      # The restart-proof twin of the rule above. That gauge counts from BOOT,
      # so every restart resets it: a crash-looping collector, or one recreated
      # on every deploy, never reaches 1800s. This one reads what was actually
      # WRITTEN. increase() survives counter resets, and `or vector(0)` answers
      # for a series that is absent (created lazily, or the target down).
      # 2h: over 14 days (09-10 → 09-24) the longest gap between any two fixes
      # outside the two real outages (09-16, 4.8h; 09-24, 3h) was 30 min, and
      # no aligned 2h bucket held fewer than 7. A 2h window is 4x that gap.
      - alert: PresenceNotRecording
        expr: (sum(increase(nora_presence_fixes_total[2h])) or vector(0)) == 0
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "presence has written no location fix for anyone in 2 hours"
          description: >-
            No new fix has been recorded for any member in 2h, including across
            restarts. Every where_is / where_been answer stops at the last one.
            Check the presence container log for `life360 auth failed`,
            `banned/refused` or `access token rejected`, and its restart count.

      # WHY the collection stopped, when the cause is Life360 refusing us. Each
      # increment is a refused login (`auth_403`), a ban-class read (`banned`),
      # or the app-update challenge page (`challenge`) — never a stale token
      # that one re-auth fixed. A refused login does not heal on its own.
      #
      # `token_rejected` is left to its own rule below, which carries the fix.
      - alert: PresenceAuthRefused
        expr: sum by (reason) (increase(nora_presence_auth_alarms_total{reason!="token_rejected"}[15m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Life360 is refusing the presence collector ({{ $labels.reason }})"
          description: >-
            auth_403 means Life360 refused the password login. A verified phone
            number on the account blocks the password grant for good, which is
            what happened on 2026-09-24. It needs the operator, not a restart:
            switch to token mode (LIFE360_AUTH_TOKEN, docs/runbook.md §4c).

      # Token mode's dead token (2026-09-24). With LIFE360_AUTH_TOKEN set, the
      # collector never falls back to the password, so a token Life360 stopped
      # accepting stays dead until a person copies a new one. 2h, not 15m: the
      # back-off caps at an hour between attempts, so a shorter window flaps.
      - alert: Life360TokenRejected
        expr: sum by (job) (increase(nora_presence_auth_alarms_total{reason="token_rejected"}[2h])) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Life360 rejected LIFE360_AUTH_TOKEN — no locations are being recorded"
          description: >-
            Every where_is / where_been answer stops at the last fix until this
            is fixed. Sign in at https://life360.com/login as Nora's Life360
            account, open DevTools > Application > Cookies > life360.com, and
            copy the LIFE360_AUTH_TOKEN value into LIFE360_AUTH_TOKEN= in
            nora/.env on norty. Then run `docker compose up -d --force-recreate
            presence` (a restart keeps the old environment). The full steps are
            in docs/runbook.md §4c.

  - name: cognition
    rules:
      # The wake evaluator's loop stopped, in a process that still answers HTTP and
      # whose `HeartbeatStalled` (the reminders loop) is fine. `nora_cognition_wake_
      # last_tick_seconds` is the unix time the loop last FINISHED a tick, written from
      # inside the loop, so a loop that is gone or hung in a store call stops moving it.
      # 600 s is 20 ticks (30 s each) and several times the 5 s store timeout, so a slow
      # tick is not a stall. ABSENT while `[cognition] enabled = false`: not applicable, and
      # a rule on `time() - x` over an absent series is empty, never firing.
      - alert: CognitionWakeStalled
        expr: time() - max(nora_cognition_wake_last_tick_seconds{job="nora"}) > 600
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "the cognition wake loop has not ticked for {{ $value | humanizeDuration }}"
          description: >-
            No unit is being woken and no stimulus consumed. `nora cognition health` says
            what is pending; the log says why the tick stopped
            (`docker logs nora --since 1h | grep -i "wake tick"`).

      # A stimulus that could wake a unit has waited four hours. The wake table fires at
      # `max_age_seconds` (1 h) and a failing unit backs off to at most 6 h, so four hours
      # is past what one failed session explains. `max()` drops the unit: the alert names
      # that something is stuck, `nora cognition health` names where. The gauge is 0 for a
      # unit with nothing pending and absent until its first tick.
      - alert: StimulusBacklog
        expr: max(nora_stimulus_pending_age_seconds{job="nora"}) > 14400
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "a stimulus has waited {{ $value | humanizeDuration }} to wake a unit"
          description: >-
            Either the wake loop stopped (see `CognitionWakeStalled`), a unit is backing off
            behind failing sessions, or a session holds it. `nora cognition health`.

      # Sessions that END badly, as a RATIO and with a floor: 3 or more failed or timed out
      # in 3 hours AND over 30% of the sessions that ended. `cancelled` is in neither side:
      # it is a restart, and a restart is not a verdict on a session. CUTOVER-PLAN §5.1
      # stops a flip at 10% failed; this alerts at 30% because it runs unattended, where
      # a unit on its cooldown produces few sessions and a ratio over a few is noise.
      # `increase` survives the counter reset a restart causes.
      - alert: CognitionSessionsFailing
        expr: >-
          (
            sum(increase(nora_cognition_session_ended_total{job="nora", outcome=~"failed|timeout"}[3h]))
            /
            sum(increase(nora_cognition_session_ended_total{job="nora", outcome=~"closed|failed|timeout"}[3h]))
            > 0.3
          )
          and
          (sum(increase(nora_cognition_session_ended_total{job="nora", outcome=~"failed|timeout"}[3h])) >= 3)
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanizePercentage }} of cognition sessions failed or timed out in 3 hours"
          description: >-
            A provider outage backs a unit off and never strikes a stimulus (DEC-244), so this
            is the model or the store, not lost messages. `nora cognition health` splits the
            failures by cause and unit.

  - name: nora-r27
    rules:
      # R-27's third state, as an alert. `unavailable` means "I could not
      # check" — a wiring gap, a dead dependency, a store that would not
      # answer — and it is the state this codebase produces INSTEAD of raising.
      #
      # Deliberately generic across every `*_total` carrying the label, so a
      # counter added next month is covered the day it ships rather than the
      # day somebody remembers to add a rule. That is the same
      # derive-don't-hand-copy rule AGENTS.md holds for label vocabularies.
      #
      # The series does not exist until the first occurrence (prometheus_client
      # only exposes label combinations that have been used), which is why this
      # is written on `increase(...)` and not on a comparison with a level.
      #
      # `nora_computer_calls_total` is excluded: one `unavailable` there is a
      # call that hit a computerd restart, not an incident, and
      # `ComputerCallsFailing` below is its thresholded rule. Left in, one
      # computer call would page twice for the same thing.
      - alert: UnavailableOutcomes
        expr: >-
          sum by (job, __name__) (increase({__name__=~".+_total",
          __name__!="nora_computer_calls_total", status="unavailable"}[15m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          # Not `{{ $labels.__name__ }}`: increase() and sum() drop the metric
          # name, so that rendered empty ("  is reporting unavailable", read back
          # with promtool 2026-10-01). The query below names the counter.
          summary: "a counter is reporting unavailable ({{ $labels.job }})"
          description: >-
            Something could not be checked at all — a wiring gap or a dead
            dependency, not an empty answer. This is the state that replaces an
            exception in this codebase, so nothing else will report it. Which
            counter: `{__name__=~".+_total", status="unavailable"}` in Prometheus.

      # Custody switched off while attachments are still arriving: the exact
      # silent degrade `nora/ingest/stages/media.py` counts rather than raises.
      - alert: MediaCustodyNotConfigured
        expr: increase(nora_media_custody_total{status="not_configured"}[1h]) > 0
        labels: { severity: warning }
        annotations:
          summary: "attachments are arriving with media custody switched off"

  - name: music
    rules:
      # The divergence IS the failure, not a proxy for it: nora believes a
      # track is playing and the controller reports it is producing no sound.
      # Before these series existed there was no music metric of any kind —
      # not "not collected", never declared — so no rule could be written and
      # a wedged controller sat green for days while a person in the room was
      # the only thing that noticed.
      #
      # `unless` rather than a subtraction: a guild whose controller gauge is
      # ABSENT (nora could not read it — see UNKNOWN) must not satisfy this.
      # Unreadable is not the same claim as not-playing, and treating it as
      # one is the fail-open reading the whole watch exists to remove; the
      # MusicControllerUnreadable rule below covers that case separately.
      - alert: MusicWedged
        expr: (nora_music_expected_playing == 1) unless (nora_music_controller_playing == 1)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "guild {{ $labels.guild_id }}: nora thinks music is playing, the controller disagrees"
          description: >-
            nora holds a current track and the audio controller reports no audio
            moving (status not playing, position frozen, or autopaused).
            CAPTURE THE SIDECAR LOG BEFORE RESTARTING ANYTHING — every previous
            occurrence was diagnosed from nothing because the restart that
            restored service destroyed the evidence.

      # nora cannot read the controller at all. Distinct from the above on
      # purpose: this is "I do not know", and the two need different hands.
      - alert: MusicControllerUnreadable
        expr: increase(nora_music_liveness_total{verdict="unknown"}[10m]) >= 5
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "guild {{ $labels.guild_id }}: the audio controller could not be read for 10 minutes"

      # The loud failure the silent one hides behind. A track that keeps
      # failing to start burns the queue two retries at a time.
      - alert: MusicStreamFailing
        expr: increase(nora_music_stream_failed_total[15m]) >= 3
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "guild {{ $labels.guild_id }}: 3+ music streams failed in 15 minutes (reason {{ $labels.reason }})"

  - name: computer
    rules:
      # Nora cannot use her computer, as Nora sees it (DEC-261). `nora_computer_up`
      # is set by a timed, AUTHENTICATED probe every 30s and by every real call,
      # so it covers computerd down or hung, the sandbox stopped (a lapsed Docker
      # login stops sbx's local sandboxes), and a token rotation that reached
      # computerd but not Nora's container, where `/v1/health` stays green and
      # every real call is a 401. The audit of 2026-10-01 found NO series that
      # said any of this.
      #
      # `== 0`, never `absent()`: with `[computer] enabled = false` the series
      # has no sample at all, which is "not applicable", and an absence-based
      # rule would page a deployment that has no computer. The cost is that a
      # dead Nora produces no series either: `TargetDown` is the rule for that.
      - alert: ComputerDown
        expr: nora_computer_up == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Nora's computer has not answered for 5 minutes"
          description: >-
            Every computer tool answers unavailable until this clears. On norty:
            `deploy/computer/nora-computer status` (sandbox=, computerd=,
            egress=), `systemctl --user status nora-computer`, `sbx ls`. A
            computerd that is up but answers 401 is a token the container does
            not hold: `status` reads `computerd=up` and not `healthy`, and
            deploy/computer/README.md "Rotating the token" is the fix. A stopped
            sandbox after a Docker login lapse needs `sbx login`.

      # Calls reaching computerd and failing, while it may still answer enough
      # to keep `nora_computer_up` at 1 (a full disk, an OS error, a command
      # path that raises). `unavailable` only: `denied` is a refusal as asked and
      # `nothing_found` an honest empty (R-27), neither is the computer failing.
      # "5 in 15m" is `increase() >= 5`, and `increase` EXTRAPOLATES at the window
      # edges: with the zero baseline sample inside the window (the counters are
      # created at 0 at start) exactly 5 events read exactly 5 and exactly 4 read
      # 4, one burst inside a single scrape reads 5 (the promtool cases at the
      # threshold, below), but events straddling the window's start can read
      # a little under or over. So the threshold is "about 5", never an exact
      # count. A computerd restart mid-call costs one or two.
      - alert: ComputerCallsFailing
        expr: sum by (job) (increase(nora_computer_calls_total{status="unavailable"}[15m])) >= 5
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanize }} computer calls answered unavailable in 15 minutes"
          description: >-
            Compare by op: `nora_computer_calls_total{status="unavailable"}`.
            When `nora_computer_up` is also 0 this is `ComputerDown`'s cause;
            when it is 1 computerd is answering and failing, so read its unit
            journal (`journalctl --user -u nora-computer -n 100`).

      # The audit trail is the operator's one required control over the computer
      # (design/sandbox-runtime §12) and "an operation with no row is a defect".
      # The counter was never seen live because its series only existed after
      # the first failure; it is created at zero at start now, so the first
      # failure moves it from 0 and `increase` can see it.
      - alert: ComputerAuditFailing
        expr: sum by (job, stage) (increase(nora_computer_audit_failures_total[1h])) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "computer audit writes are failing (stage {{ $labels.stage }})"
          description: >-
            A computer call ran without its audit row (stage row), or its full
            input/output was not kept (blob). The tool still answered. Check the
            db and the blob store; the rows that failed are not recoverable.

  - name: monitoring-itself
    rules:
      # A monitoring stack's own failure mode is to go quiet and leave every
      # dashboard green. This fires if Prometheus stops seeing its own series.
      - alert: PrometheusNotIngesting
        expr: absent(up{job="prometheus"} == 1)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus is not scraping itself — the rule engine may be dead"

  # --- Delete withdrawal (PR #711, DEC-276) ---------------------------------
  # Appended at the END of the file in its own block (another change edits this file).
  # A platform delete of a message that is not on record YET is held in `orphan_delete`
  # and applied when the message arrives. Two ways a held delete is lost leave a deleted
  # message VISIBLE and fed to memory if the message then arrives, and neither was
  # alerted on: a write that failed after every attempt (`orphan_lost`: a counter and ONE
  # log line with no ids) and a flood that evicted held deletes at a cap
  # (`orphan_evicted`). Both counters are created at ZERO at start
  # (`nora.app.delete_withdrawal.prime_delete_metrics`): `increase()` cannot see a
  # series' first increment, and nora restarts several times a day.
  - name: delete-withdrawal
    rules:
      - alert: OrphanDeleteLost
        expr: sum by (job, platform) (increase(nora_delete_withdrawals_total{outcome="orphan_lost"}[1h])) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "a held delete was lost on {{ $labels.platform }}: its message will stay visible if it arrives"
          description: >-
            The touch stage could not write a delete whose message was not on record
            yet, after four attempts (a deadlock that did not pass, or the database
            down). Check the `nora` log for "it is lost" and the database. The delete
            is gone: if its message arrives it is visible and fed to memory. The sender
            deleting it again, once the message is on record, withdraws it.

      # 50 evictions in an hour is a PICK, not a measurement: the caps (40 per named
      # deleter, 500 unnamed per room, 1000 per room) are far above ordinary traffic, so
      # any eviction at all means a flood, and 50 separates one noisy room from a single
      # stray. Tune it from `nora_delete_withdrawals_total{outcome="orphan_evicted"}`
      # once there is a week of data.
      - alert: OrphanDeleteEvicted
        expr: sum by (job, platform) (increase(nora_delete_withdrawals_total{outcome="orphan_evicted"}[1h])) > 50
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "more than 50 held deletes evicted on {{ $labels.platform }} in an hour"
          description: >-
            A flood of deletes of messages that are not on record (Discord and Instagram
            name nobody, a modified WhatsApp client revokes ids that do not exist) is
            pushing held deletes out at a cap. An evicted delete whose message then
            arrives leaves that message visible. Read `orphan_stale_target` beside it, and
            the room with the most `orphan_delete` rows.
