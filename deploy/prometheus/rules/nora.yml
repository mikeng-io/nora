# The alerts, and every one of them is an ABSENCE.
#
# `docs/observability.md` states why this file exists rather than a Sentry
# project: this codebase is built NOT to raise — 210 docstrings promise it, 45
# metric specs declare an `unavailable` state, 223 sites catch and continue — so
# its characteristic failure is a counter label or a gauge that stopped moving,
# never a traceback. Sentry sees what threw. These see what stopped.
#
# Each rule names the incident that motivated it. A rule with no story behind it
# is a rule nobody will trust at 3am, and an untrusted alert is a disabled one.

groups:
  - name: nora-liveness
    rules:
      # THE ONE THAT WOULD HAVE CAUGHT `nora-egress.service`, which sat in
      # `failed` for sixteen days with nothing to say so. A target that does not
      # answer is the cheapest, broadest signal there is.
      - alert: TargetDown
        expr: up == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is not answering its metrics endpoint"
          description: >-
            Prometheus could not scrape {{ $labels.instance }} for 3 minutes.
            Either the process is down or its port is unreachable.

      # The internal loop stalled while the process still answers HTTP — the
      # shape that a healthcheck alone cannot see. `nora_heartbeat_last_tick_
      # age_seconds` is set after every successful tick, so a rising value is a
      # loop that stopped, not a quiet room.
      - alert: HeartbeatStalled
        expr: nora_heartbeat_last_tick_age_seconds > 300
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Nora's heartbeat has not ticked for {{ $value | humanizeDuration }}"

      # SSE silence — what `deploy/watchdog.sh` checked, and never ran to check.
      # That script is deleted; this rule is what replaced it.
      # 900s, not the script's 300s: a genuinely quiet night in one room is
      # normal and a threshold that cries wolf is a threshold somebody mutes.
      - alert: PlatformSilent
        expr: nora_adapter_last_event_age_seconds > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "no {{ $labels.platform }} event for {{ $value | humanizeDuration }}"
          description: >-
            The listener may have died without the connection closing. Compare
            against /health's per-platform last_event_age_seconds.

      # Presence is UP but not collecting — the shape TargetDown cannot see.
      # 2026-09-24: Life360 stopped accepting the collector's login at 00:12
      # and every read after was refused for hours. The container stayed
      # healthy, nothing alerted, and the first sign was Nora telling a member
      # they had been home through a ride she never recorded. The gauge climbs
      # from each circle's last SUCCESSFUL read (from boot, if none yet).
      # 1800s: a healthy circle succeeds every 5-60s, so half an hour is a
      # collector that has stopped, never a quiet circle.
      - alert: PresenceCollectionStalled
        expr: nora_presence_last_collection_age_seconds > 1800
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "presence has not collected circle {{ $labels.circle }} for {{ $value | humanizeDuration }}"
          description: >-
            Everything Nora says about where people are or have been stops at
            the last successful read. Check the presence container log for
            `life360 auth failed` / `banned/refused` before restarting it.

      # WHY the collection stopped, when the cause is Life360 refusing us. Each
      # increment is a refused login (`auth_403`), a ban-class read (`banned`),
      # or the app-update challenge page (`challenge`) — never a stale token
      # that one re-auth fixed. A refused login does not heal on its own.
      #
      # `token_rejected` is left to its own rule below, which carries the fix.
      - alert: PresenceAuthRefused
        expr: sum by (reason) (increase(nora_presence_auth_alarms_total{reason!="token_rejected"}[15m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Life360 is refusing the presence collector ({{ $labels.reason }})"
          description: >-
            auth_403 means Life360 refused the password login. A verified phone
            number on the account blocks the password grant for good, which is
            what happened on 2026-09-24. It needs the operator, not a restart:
            switch to token mode (LIFE360_AUTH_TOKEN, docs/runbook.md §4c).

      # Token mode's dead token (2026-09-24). With LIFE360_AUTH_TOKEN set, the
      # collector never falls back to the password, so a token Life360 stopped
      # accepting stays dead until a person copies a new one. 2h, not 15m: the
      # back-off caps at an hour between attempts, so a shorter window flaps.
      - alert: Life360TokenRejected
        expr: sum by (job) (increase(nora_presence_auth_alarms_total{reason="token_rejected"}[2h])) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Life360 rejected LIFE360_AUTH_TOKEN — no locations are being recorded"
          description: >-
            Every where_is / where_been answer stops at the last fix until this
            is fixed. Sign in at https://life360.com/login as Nora's Life360
            account, open DevTools > Application > Cookies > life360.com, and
            copy the LIFE360_AUTH_TOKEN value into LIFE360_AUTH_TOKEN= in
            nora/.env on norty. Then run `docker compose up -d --force-recreate
            presence` (a restart keeps the old environment). The full steps are
            in docs/runbook.md §4c.

  - name: nora-r27
    rules:
      # R-27's third state, as an alert. `unavailable` means "I could not
      # check" — a wiring gap, a dead dependency, a store that would not
      # answer — and it is the state this codebase produces INSTEAD of raising.
      #
      # Deliberately generic across every `*_total` carrying the label, so a
      # counter added next month is covered the day it ships rather than the
      # day somebody remembers to add a rule. That is the same
      # derive-don't-hand-copy rule AGENTS.md holds for label vocabularies.
      #
      # The series does not exist until the first occurrence (prometheus_client
      # only exposes label combinations that have been used), which is why this
      # is written on `increase(...)` and not on a comparison with a level.
      - alert: UnavailableOutcomes
        expr: sum by (job, __name__) (increase({__name__=~".+_total", status="unavailable"}[15m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.__name__ }} is reporting unavailable"
          description: >-
            Something could not be checked at all — a wiring gap or a dead
            dependency, not an empty answer. This is the state that replaces an
            exception in this codebase, so nothing else will report it.

      # Custody switched off while attachments are still arriving: the exact
      # silent degrade `nora/ingest/stages/media.py` counts rather than raises.
      - alert: MediaCustodyNotConfigured
        expr: increase(nora_media_custody_total{status="not_configured"}[1h]) > 0
        labels: { severity: warning }
        annotations:
          summary: "attachments are arriving with media custody switched off"

  - name: music
    rules:
      # The divergence IS the failure, not a proxy for it: nora believes a
      # track is playing and the controller reports it is producing no sound.
      # Before these series existed there was no music metric of any kind —
      # not "not collected", never declared — so no rule could be written and
      # a wedged controller sat green for days while a person in the room was
      # the only thing that noticed.
      #
      # `unless` rather than a subtraction: a guild whose controller gauge is
      # ABSENT (nora could not read it — see UNKNOWN) must not satisfy this.
      # Unreadable is not the same claim as not-playing, and treating it as
      # one is the fail-open reading the whole watch exists to remove; the
      # MusicControllerUnreadable rule below covers that case separately.
      - alert: MusicWedged
        expr: (nora_music_expected_playing == 1) unless (nora_music_controller_playing == 1)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "guild {{ $labels.guild_id }}: nora thinks music is playing, the controller disagrees"
          description: >-
            nora holds a current track and the audio controller reports no audio
            moving (status not playing, position frozen, or autopaused).
            CAPTURE THE SIDECAR LOG BEFORE RESTARTING ANYTHING — every previous
            occurrence was diagnosed from nothing because the restart that
            restored service destroyed the evidence.

      # nora cannot read the controller at all. Distinct from the above on
      # purpose: this is "I do not know", and the two need different hands.
      - alert: MusicControllerUnreadable
        expr: increase(nora_music_liveness_total{verdict="unknown"}[10m]) >= 5
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "guild {{ $labels.guild_id }}: the audio controller could not be read for 10 minutes"

      # The loud failure the silent one hides behind. A track that keeps
      # failing to start burns the queue two retries at a time.
      - alert: MusicStreamFailing
        expr: increase(nora_music_stream_failed_total[15m]) >= 3
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "guild {{ $labels.guild_id }}: 3+ music streams failed in 15 minutes (reason {{ $labels.reason }})"

  - name: monitoring-itself
    rules:
      # A monitoring stack's own failure mode is to go quiet and leave every
      # dashboard green. This fires if Prometheus stops seeing its own series.
      - alert: PrometheusNotIngesting
        expr: absent(up{job="prometheus"} == 1)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus is not scraping itself — the rule engine may be dead"
