# `promtool test rules deploy/prometheus/tests/computer.test.yml`, from the repo
# root (or the docker form in tests/test_deploy_assets.py). Nora's computer
# (DEC-260): ComputerDown, ComputerCallsFailing, ComputerAuditFailing, and the
# one change to UnavailableOutcomes. Each case states what a WRONG rule would do.
rule_files:
  - ../rules/nora.yml

evaluation_interval: 1m

tests:
  # --- ComputerDown ---------------------------------------------------------

  # Down for 10 minutes: pending for the 5m `for`, then firing.
  - interval: 1m
    input_series:
      - series: 'nora_computer_up{job="nora",target="computerd"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: ComputerDown
        exp_alerts: []
      - eval_time: 7m
        alertname: ComputerDown
        exp_alerts:
          - exp_labels: { severity: critical, job: nora, target: computerd }
            exp_annotations:
              summary: "Nora's computer has not answered for 5 minutes"
              description: >-
                Every computer tool answers unavailable until this clears. On norty:
                `deploy/computer/nora-computer status` (sandbox=, computerd=,
                egress=), `systemctl --user status nora-computer`, `sbx ls`. A
                computerd that is up but answers 401 is a token the container does
                not hold: `status` reads `computerd=up` and not `healthy`, and
                deploy/computer/README.md "Rotating the token" is the fix. A stopped
                sandbox after a Docker login lapse needs `sbx login`.

  # A blip: down for 3 minutes then back. Never fires, however long it runs.
  - interval: 1m
    input_series:
      - series: 'nora_computer_up{job="nora",target="computerd"}'
        values: '1x5 0x3 1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ComputerDown
        exp_alerts: []
      - eval_time: 25m
        alertname: ComputerDown
        exp_alerts: []

  # NOT APPLICABLE: `[computer] enabled = false` exports no nora_computer_up
  # sample. The target is alive (`up` is 1), the series is absent, and the rule
  # must stay silent however long that lasts. This is the case an
  # absent()-based rule would fail.
  - interval: 1m
    input_series:
      - series: 'up{job="nora"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ComputerDown
        exp_alerts: []
      - eval_time: 60m
        alertname: ComputerDown
        exp_alerts: []

  # --- ComputerCallsFailing -------------------------------------------------

  # A rare failure that the zero baseline makes visible: the series is created
  # at 0 at start, then 6 `unavailable` land inside 15 minutes.
  - interval: 1m
    input_series:
      - series: 'nora_computer_calls_total{job="nora",op="run",status="unavailable"}'
        values: '0x5 1 2 3 4 5 6 6 6 6'
    alert_rule_test:
      - eval_time: 10m
        alertname: ComputerCallsFailing
        exp_alerts:
          - exp_labels: { severity: warning, job: nora }
            exp_annotations:
              summary: "5 computer calls answered unavailable in 15 minutes"
              description: >-
                Compare by op: `nora_computer_calls_total{status="unavailable"}`.
                When `nora_computer_up` is also 0 this is `ComputerDown`'s cause;
                when it is 1 computerd is answering and failing, so read its unit
                journal (`journalctl --user -u nora-computer -n 100`).

  # A restart mid-call costs one or two: 2 in the window never fires.
  - interval: 1m
    input_series:
      - series: 'nora_computer_calls_total{job="nora",op="run",status="unavailable"}'
        values: '0x5 1 2 2 2 2 2 2 2 2'
    alert_rule_test:
      - eval_time: 12m
        alertname: ComputerCallsFailing
        exp_alerts: []

  # THE THRESHOLD ITSELF. `increase` extrapolates at the window edges, so the
  # claim is pinned where it holds: with the primed zero baseline in the window,
  # exactly 5 events fire the rule and exactly 4 do not, whether they arrive one
  # a minute or as one burst inside a single scrape.
  - interval: 1m
    input_series:
      - series: 'nora_computer_calls_total{job="nora",op="run",status="unavailable"}'
        values: '0x20 1 2 3 4 5 5x30'
    alert_rule_test:
      - eval_time: 24m
        alertname: ComputerCallsFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: ComputerCallsFailing
        exp_alerts:
          - exp_labels: { severity: warning, job: nora }
            exp_annotations:
              summary: "5 computer calls answered unavailable in 15 minutes"
              description: >-
                Compare by op: `nora_computer_calls_total{status="unavailable"}`.
                When `nora_computer_up` is also 0 this is `ComputerDown`'s cause;
                when it is 1 computerd is answering and failing, so read its unit
                journal (`journalctl --user -u nora-computer -n 100`).
    promql_expr_test:
      - expr: sum by (job) (increase(nora_computer_calls_total{status="unavailable"}[15m]))
        eval_time: 25m
        exp_samples:
          - { labels: '{job="nora"}', value: 5 }
  - interval: 1m
    input_series:
      - series: 'nora_computer_calls_total{job="nora",op="run",status="unavailable"}'
        values: '0x20 5 5x30'
    alert_rule_test:
      - eval_time: 21m
        alertname: ComputerCallsFailing
        exp_alerts:
          - exp_labels: { severity: warning, job: nora }
            exp_annotations:
              summary: "5 computer calls answered unavailable in 15 minutes"
              description: >-
                Compare by op: `nora_computer_calls_total{status="unavailable"}`.
                When `nora_computer_up` is also 0 this is `ComputerDown`'s cause;
                when it is 1 computerd is answering and failing, so read its unit
                journal (`journalctl --user -u nora-computer -n 100`).
  - interval: 1m
    input_series:
      - series: 'nora_computer_calls_total{job="nora",op="run",status="unavailable"}'
        values: '0x20 1 2 3 4 4x30'
    alert_rule_test:
      - eval_time: 24m
        alertname: ComputerCallsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: ComputerCallsFailing
        exp_alerts: []
    promql_expr_test:
      - expr: sum by (job) (increase(nora_computer_calls_total{status="unavailable"}[15m]))
        eval_time: 24m
        exp_samples:
          - { labels: '{job="nora"}', value: 4 }

  # `denied` and `nothing_found` are answers, not the computer failing: a flood
  # of either (the model asking for files that are not there) never fires.
  - interval: 1m
    input_series:
      - series: 'nora_computer_calls_total{job="nora",op="read",status="nothing_found"}'
        values: '0+10x15'
      - series: 'nora_computer_calls_total{job="nora",op="write",status="denied"}'
        values: '0+10x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ComputerCallsFailing
        exp_alerts: []

  # --- UnavailableOutcomes: the computer series is left to its own rule ----

  # The generic rule still fires for any other counter with the label ...
  - interval: 1m
    input_series:
      - series: 'nora_other_total{job="nora",status="unavailable"}'
        values: '0x5 1 2 3 3 3 3 3 3 3 3 3 3'
    alert_rule_test:
      - eval_time: 12m
        alertname: UnavailableOutcomes
        exp_alerts:
          - exp_labels: { severity: warning, job: nora }
            exp_annotations:
              summary: "a counter is reporting unavailable (nora)"
              description: >-
                Something could not be checked at all — a wiring gap or a dead
                dependency, not an empty answer. This is the state that replaces an
                exception in this codebase, so nothing else will report it. Which
                counter: `{__name__=~".+_total", status="unavailable"}` in Prometheus.

  # ... and does not double-page for the computer's.
  - interval: 1m
    input_series:
      - series: 'nora_computer_calls_total{job="nora",op="run",status="unavailable"}'
        values: '0x5 1 2 3 3 3 3 3 3 3 3 3 3'
    alert_rule_test:
      - eval_time: 12m
        alertname: UnavailableOutcomes
        exp_alerts: []

  # --- ComputerAuditFailing -------------------------------------------------

  # Created at 0, then one row failed: the baseline is what lets increase()
  # see it.
  - interval: 1m
    input_series:
      - series: 'nora_computer_audit_failures_total{job="nora",tool="computer_run",stage="row"}'
        values: '0x5 1 1 1 1'
    alert_rule_test:
      - eval_time: 7m
        alertname: ComputerAuditFailing
        exp_alerts:
          - exp_labels: { severity: warning, job: nora, stage: row }
            exp_annotations:
              summary: "computer audit writes are failing (stage row)"
              description: >-
                A computer call ran without its audit row (stage row), or its full
                input/output was not kept (blob). The tool still answered. Check the
                db and the blob store; the rows that failed are not recoverable.

  # All zero: never fires (a positive control for the case above).
  - interval: 1m
    input_series:
      - series: 'nora_computer_audit_failures_total{job="nora",tool="computer_run",stage="row"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ComputerAuditFailing
        exp_alerts: []
