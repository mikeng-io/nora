# `promtool test rules deploy/prometheus/tests/oauth.test.yml`, from the repo
# root's deploy/prometheus/tests (or the docker form in
# tests/unit/test_oauth_alert_rules.py). The OAuth keepalive (DEC-306):
# OAuthRefreshStale and OAuthRefreshRefused. promtool's time() is the eval
# time in seconds from 0, so a timestamp gauge is written in those units.
# Each case states what a WRONG rule would do.
rule_files:
  - ../rules/nora.yml

evaluation_interval: 1m

tests:
  # --- OAuthRefreshStale ----------------------------------------------------

  # A lane that last refreshed at t=0 with a 1h interval: stale past 2h, then
  # firing after the 15m `for`. A rule on the interval alone (1x) would fire at
  # 1h15m; one on a failure counter would never fire at all here.
  - interval: 1m
    input_series:
      - series: 'nora_oauth_last_refresh_timestamp_seconds{job="nora",lane="xai"}'
        values: '0x200'
      - series: 'nora_oauth_refresh_interval_seconds{job="nora",lane="xai"}'
        values: '3600x200'
    alert_rule_test:
      - eval_time: 90m
        alertname: OAuthRefreshStale
        exp_alerts: []
      - eval_time: 125m
        alertname: OAuthRefreshStale
        exp_alerts: []
      - eval_time: 140m
        alertname: OAuthRefreshStale
        exp_alerts:
          - exp_labels: { severity: critical, job: nora, lane: xai }
            exp_annotations:
              summary: "the xai login has not refreshed for over twice its interval"
              description: >-
                Image generation on this lane fails once its access token expires.
                Read why in the nora log (`oauth_lane` / `oauth keepalive` lines name
                the lane and the reason). `auth` means the refresh token is dead: run
                `nora xai-login` (lane xai) or `nora openai-codex-login` (lane
                openai_codex), then `docker compose up -d --force-recreate nora`. The
                new login supersedes the old state file; nothing needs deleting.

  # A healthy lane: the timestamp keeps up with the clock (refreshed every
  # hour). Never fires, however long it runs.
  - interval: 1m
    input_series:
      - series: 'nora_oauth_last_refresh_timestamp_seconds{job="nora",lane="openai_codex"}'
        values: '0x59 3600x59 7200x59 10800x59 14400x59'
      - series: 'nora_oauth_refresh_interval_seconds{job="nora",lane="openai_codex"}'
        values: '3600x300'
    alert_rule_test:
      - eval_time: 299m
        alertname: OAuthRefreshStale
        exp_alerts: []

  # NOT APPLICABLE: no lane is kept (image generation off), so the series are
  # absent. The rule must stay silent; an absent()-based rule would page.
  - interval: 1m
    input_series:
      - series: 'up{job="nora"}'
        values: '1x300'
    alert_rule_test:
      - eval_time: 299m
        alertname: OAuthRefreshStale
        exp_alerts: []
      - eval_time: 299m
        alertname: OAuthRefreshRefused
        exp_alerts: []

  # --- OAuthRefreshRefused --------------------------------------------------

  # Refused at minute 3: fires at once (no `for`), and clears after the next
  # success sets the gauge back to 0.
  - interval: 1m
    input_series:
      - series: 'nora_oauth_refresh_refused{job="nora",lane="xai"}'
        values: '0 0 0 1 1 1 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: OAuthRefreshRefused
        exp_alerts: []
      - eval_time: 4m
        alertname: OAuthRefreshRefused
        exp_alerts:
          - exp_labels: { severity: critical, job: nora, lane: xai }
            exp_annotations:
              summary: "the xai login was refused and needs the operator"
              description: >-
                The issuer refused the lane's refresh token (`invalid_grant`), or
                ./state is not writable. Log in again with `nora xai-login` (lane
                xai) or `nora openai-codex-login` (lane openai_codex) and recreate
                nora; the keepalive retries once per interval until then. On norty,
                no other checkout's .env may hold the same token: a second holder
                spending one rotating token revokes the chain.
      - eval_time: 7m
        alertname: OAuthRefreshRefused
        exp_alerts: []
