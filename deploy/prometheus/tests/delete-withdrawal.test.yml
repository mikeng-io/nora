# `promtool test rules deploy/prometheus/tests/delete-withdrawal.test.yml`, from the
# repo root (or the docker form in tests/unit/test_computer_alert_rules.py). The
# delete-withdrawal rules (PR #711, DEC-276): OrphanDeleteLost, OrphanDeleteEvicted.
# `_` is an ABSENT sample: nora created the series at ZERO when it started
# (`prime_delete_metrics`), so every case starts absent, appears at 0, then moves.
rule_files:
  - ../rules/nora.yml

evaluation_interval: 1m

tests:
  # --- OrphanDeleteLost -----------------------------------------------------

  # The series does not exist, nora starts and primes it at 0, then ONE delete is lost:
  # the first increment is visible because the zero baseline is in the window.
  - interval: 1m
    input_series:
      - series: 'nora_delete_withdrawals_total{job="nora",platform="signal",outcome="orphan_lost"}'
        values: '_x5 0x5 1x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: OrphanDeleteLost
        exp_alerts: []
      - eval_time: 9m
        alertname: OrphanDeleteLost
        exp_alerts: []
      - eval_time: 20m
        alertname: OrphanDeleteLost
        exp_alerts:
          - exp_labels: { severity: warning, job: nora, platform: signal }
            exp_annotations:
              summary: "a held delete was lost on signal: its message will stay visible if it arrives"
              description: >-
                The touch stage could not write a delete whose message was not on record
                yet, after four attempts (a deadlock that did not pass, or the database
                down). Check the `nora` log for "it is lost" and the database. The delete
                is gone: if its message arrives it is visible and fed to memory. The sender
                deleting it again, once the message is on record, withdraws it.

  # WHAT PRIMING PREVENTS. A series whose first sample is already 1 has no baseline:
  # `increase()` reads 0 and the rule is blind to a real loss. This is why the counter
  # is created at zero at start; the case is here so nobody removes that thinking the
  # rule still works.
  - interval: 1m
    input_series:
      - series: 'nora_delete_withdrawals_total{job="nora",platform="signal",outcome="orphan_lost"}'
        values: '_x5 1x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: OrphanDeleteLost
        exp_alerts: []

  # Nothing lost: a primed zero stays zero, however long it runs. Another outcome of the
  # same counter moving does not fire it.
  - interval: 1m
    input_series:
      - series: 'nora_delete_withdrawals_total{job="nora",platform="signal",outcome="orphan_lost"}'
        values: '_x3 0x40'
      - series: 'nora_delete_withdrawals_total{job="nora",platform="signal",outcome="hidden"}'
        values: '_x3 0 1 2 3 4 5x35'
    alert_rule_test:
      - eval_time: 40m
        alertname: OrphanDeleteLost
        exp_alerts: []

  # --- OrphanDeleteEvicted --------------------------------------------------

  # A flood: 60 evictions inside the hour, from a primed zero.
  - interval: 1m
    input_series:
      - series: 'nora_delete_withdrawals_total{job="nora",platform="discord",outcome="orphan_evicted"}'
        values: '_x2 0x3 60x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: OrphanDeleteEvicted
        exp_alerts: []
      - eval_time: 20m
        alertname: OrphanDeleteEvicted
        exp_alerts:
          - exp_labels: { severity: warning, job: nora, platform: discord }
            exp_annotations:
              summary: "more than 50 held deletes evicted on discord in an hour"
              description: >-
                A flood of deletes of messages that are not on record (Discord and Instagram
                name nobody, a modified WhatsApp client revokes ids that do not exist) is
                pushing held deletes out at a cap. An evicted delete whose message then
                arrives leaves that message visible. Read `orphan_stale_target` beside it, and
                the room with the most `orphan_delete` rows.

  # A handful (below the 50 pick) never fires.
  - interval: 1m
    input_series:
      - series: 'nora_delete_withdrawals_total{job="nora",platform="discord",outcome="orphan_evicted"}'
        values: '_x2 0x3 20x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: OrphanDeleteEvicted
        exp_alerts: []
