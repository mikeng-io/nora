# The ONLY way out of the `nora-compute` network (docker-compose.yml's
# `compute-egress` service). `nora-compute` is `internal: true` with the
# bridge's IPv4 inhibited, so a sandbox container has no route to the host,
# the LAN, Tailscale or the internet: it reaches `drop` directly on that
# network and everything else through this proxy, which allows exactly what
# Smith needs and denies the rest (measured 2026-09-30: before this, a sandbox
# read Honcho unauthenticated on host.docker.internal:8000).
#
# This file and `EGRESS_ALLOWLIST` in nora/infra/compute/docker_backend.py
# are one list in two places; tests/infra/compute/test_compute_egress.py
# parses this file and fails if they differ. Widen both together, and name
# the Smith skill that needs the new destination.
http_port 3128

acl host_services dstdomain host.docker.internal
acl omniroute_port port 20128
acl omniroute_path urlpath_regex ^/v1/
acl otlp_port port 4318
acl otlp_path urlpath_regex ^/v1/traces
acl maps dstdomain maps.googleapis.com
acl SSL_ports port 443
acl CONNECT method CONNECT

# OmniRoute's model API only: not its dashboard or admin routes on that port.
http_access allow host_services omniroute_port omniroute_path !CONNECT
http_access allow host_services otlp_port otlp_path !CONNECT
http_access allow CONNECT maps SSL_ports
http_access deny all

cache deny all
# /dev/stdout is not writable by squid's `proxy` user; read with
# `docker exec compute-egress tail /var/log/squid/access.log`.
access_log stdio:/var/log/squid/access.log
