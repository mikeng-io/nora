[project]
name = "nora"
version = "2.0.0"
description = "A private ambient Signal group agent (Strands-based)"
requires-python = ">=3.11"
dependencies = [
    "strands-agents==1.50.2",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "openai>=1.40",
    "PyYAML>=6.0",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
evals = ["strands-agents-evals==1.0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nora*"]

[tool.setuptools.package-data]
nora = [
    "persona/*.md",
    "py.typed",
    "infra/sql/migrations/*",
    "infra/sql/migrations/versions/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: requires a live external service (OmniRoute, signal-cli, Honcho); excluded by default",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# NOTE: this expands `strict = true` by hand instead of using the shorthand.
# mypy 2.3.0 has a confirmed bug where `strict = true` inside a
# [[tool.mypy.overrides]] section leaks strict mode to EVERY module mypy
# checks in the run (even ones this override's `module` glob does not
# match) instead of scoping to the matched modules — verified by a minimal
# repro. Two of --strict's flags (warn_redundant_casts, warn_unused_ignores)
# are global-only in mypy and are already set above; the rest are spelled
# out here so this override only tightens nora.domain/config/app/infra and does
# not silently tighten nora.obs, nora.agent, etc.
[[tool.mypy.overrides]]
module = ["nora.domain.*", "nora.config", "nora.app.*", "nora.infra.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# The gRPC OTLP exporter is a genuinely missing optional dependency, not a
# suppression of real errors: Phase 6 replaces it with the HTTP/protobuf OTLP
# exporter because Langfuse's `/api/public/otel` endpoint is HTTP, not gRPC,
# so installing the gRPC package now would be the wrong dependency to add.
# Scoped to this exact module path only — nora.obs and every other module
# stay under full checking.
[[tool.mypy.overrides]]
module = "opentelemetry.exporter.otlp.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# TID is deliberately omitted: relative imports inside nora/ are house style.
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "ASYNC", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test-only allowances:
#   S101  — tests assert.
#   S104/S311 — fixtures bind all interfaces and use non-crypto randomness.
#   S607  — test_acceptance_rules shells out to `uv` by partial path, correctly.
#   RUF001 — fullwidth CJK punctuation in test_evals_adversarial's prompt-injection
#            corpus is test DATA. Replacing it with ASCII would change which
#            adversarial inputs are exercised — a behaviour change to the suite.
#   N803/N818 — test-local argument and exception-class naming, not production surface.
"tests/**" = ["S101", "S104", "S311", "S607", "RUF001", "N803", "N818"]
"evals/**" = ["S101"]

[tool.importlinter]
root_package = "nora"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is framework-free"
type = "forbidden"
source_modules = ["nora.domain"]
forbidden_modules = ["aiohttp", "strands", "sqlalchemy", "pydantic", "prometheus_client", "opentelemetry", "yaml", "openai"]

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
# Middle rows reflect the real import order among today's packages (agent -> persona
# -> obs -> infra; platform is independent of the other four) so the contract does
# not fight legitimate cross-package imports. The property this contract exists to
# prove is the last line: nothing above nora.domain may be imported BY nora.domain.
layers = [
    "nora.app",
    "nora.ingest | nora.engagement",
    "nora.agent | nora.platform",
    "nora.persona",
    "nora.obs",
    "nora.infra | nora.testing",
    "nora.domain",
]

[[tool.importlinter.contracts]]
name = "only app and __main__ read config"
type = "forbidden"
source_modules = [
    "nora.agent", "nora.obs", "nora.persona", "nora.platform",
    "nora.domain", "nora.persons", "nora.tag",
    "nora.infra", "nora.testing", "nora.ingest", "nora.engagement",
]
forbidden_modules = ["nora.config"]

[[tool.importlinter.contracts]]
name = "the nora package's own __init__ does not read config either"
type = "forbidden"
# A "forbidden" contract skips any source/forbidden pair where one module is a
# subpackage of the other (import-linter's own overlap rule — see forbidden.py's
# `_modules_overlap`): `nora.config` is *inside* `nora`, so listing the package
# `nora` as a source module in the contract above is silently a no-op for the
# `nora.config` target, by import-linter's own design, not a bug in this config.
# `as_packages = false` treats both sides as single literal modules instead of
# packages, which sidesteps that overlap rule and actually checks nora/__init__.py.
source_modules = ["nora"]
forbidden_modules = ["nora.config"]
as_packages = false

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-aiohttp>=1.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "tomli-w>=1.0",
    "types-pyyaml>=6.0.12.20260724",
]
