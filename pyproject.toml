[project]
name = "nora"
version = "2.0.0"
description = "A private ambient Signal group agent (Strands-based)"
requires-python = ">=3.11"
dependencies = [
    "strands-agents==1.50.2",
    "aiohttp>=3.9",
    "openai>=1.40",
    "PyYAML>=6.0",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "prometheus-client>=0.26.0",
    "structlog>=26.1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "pillow>=12.3.0",
    "cryptography>=50.0.0",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.4",
    "docker>=7.2.0",
    "requests>=2.34.2",
    # [voice] pulls PyNaCl AND davey -- discord.py 2.7.1's VoiceClient.__init__
    # raises RuntimeError unconditionally without EITHER (verified live,
    # 2026-08-23: "davey library needed in order to use voice" on the very
    # first real /music play -- pinning PyNaCl alone, as this line originally
    # did, was not sufficient and the voice-support warning at startup
    # ("davey is not installed") was wrongly read as harmless).
    "discord-py[voice]>=2.7.1",
    "yt-dlp>=2026.8.19",
    "boto3>=1.43.62",
    "pgvector>=0.5.0",
    # SQLAlchemy's async engine needs greenlet, but sqlalchemy's own marker
    # only pulls it in on win32/AMD64/x86_64/ppc64le/aarch64 -- NOT macOS arm64,
    # so on an Apple Silicon laptop every SQL-touching test errored with "the
    # greenlet library is required" (found 2026-09-07 running the suite there).
    # The container is Linux and never saw it; declared so the suite runs where
    # the operator edits.
    "greenlet>=3.5.4",
    # `nora config` reads AND writes TOML — tomlkit preserves comments
    # and formatting; tomli_w would strip every rationale comment in a
    # 75KB config. Runtime dependency: the CLI ships in the image.
    "tomlkit>=0.13",
]

[project.optional-dependencies]
evals = ["strands-agents-evals==1.0.3"]
# Error reporting is OPTIONAL and off by default: `nora/obs/errors.py` degrades
# to "off" when the SDK is absent, so a laptop, the test suite and a deployment
# that does not want Sentry all run without it. Pinned like every other
# dependency here; the deployment image installs it via this extra.
sentry = [
    "sentry-sdk==2.44.0",
]

# Makes `nora groups` and `nora persons pending` — the commands design/10 §6,
# policy.example.toml and `nora.policy`'s own error messages all name — real
# commands rather than shorthand for `python -m nora …`. Same entry point, so
# the container's `python -m nora` CMD is unaffected.
[project.scripts]
nora = "nora.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nora*"]

[tool.setuptools.package-data]
nora = [
    "doctrine/*.md",
    # `nora/dreamer/` has no `__init__.py` and must not get one — it is data,
    # not a package — so `packages.find` will not install it. Same failure mode
    # the migrations below are declared for: without these lines a WHEEL ships
    # without the Dreamer's instructions and every adaptor fails at startup.
    "dreamer/doctrine/*.md",
    "dreamer/objectives/*.md",
    "py.typed",
    # The build-time version stamp (DEC-79). Generated, gitignored, and absent
    # from a source checkout — declared here so a WHEEL built from a stamped
    # tree ships it, exactly as the migrations below are declared so the image
    # ships those.
    "version.json",
    "infra/sql/migrations/*",
    "infra/sql/migrations/versions/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: requires a live external service (OmniRoute, signal-cli, Honcho); excluded by default",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# NOTE: this expands `strict = true` by hand instead of using the shorthand.
# mypy 2.3.0 has a confirmed bug where `strict = true` inside a
# [[tool.mypy.overrides]] section leaks strict mode to EVERY module mypy
# checks in the run (even ones this override's `module` glob does not
# match) instead of scoping to the matched modules — verified by a minimal
# repro. Two of --strict's flags (warn_redundant_casts, warn_unused_ignores)
# are global-only in mypy and are already set above; the rest are spelled
# out here so this override only tightens the packages named in `module` below
# and does not silently tighten nora.obs, nora.agent, etc.
#
# #121 (measured 2026-09-11, re-measured 2026-09-17): ingest, analytics,
# doctrine, language and skills cost zero own-file errors; instructions (2),
# engagement (9) and web (50) were fixed — all `[type-arg]` (missing generic
# type arguments), no behaviour change. Own-file errors are only reproducible
# by scoping the override to ONE package at a time and counting `^nora/<pkg>/
# .*: error:` — strict flags on the command line leak into every transitively
# imported module and inflate the count (see the issue).
[[tool.mypy.overrides]]
module = [
    "nora.domain.*", "nora.config", "nora.app.*", "nora.infra.*", "nora.presence.*",
    "nora.ingest.*", "nora.analytics.*", "nora.doctrine.*", "nora.language.*",
    "nora.skills.*", "nora.instructions.*", "nora.engagement.*", "nora.web.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# TID is deliberately omitted: relative imports inside nora/ are house style.
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "ASYNC", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test-only allowances:
#   S101  — tests assert.
#   S104/S311 — fixtures bind all interfaces and use non-crypto randomness.
#   S607  — test_acceptance_rules shells out to `uv` by partial path, correctly.
#   RUF001 — fullwidth CJK punctuation in test_evals_adversarial's prompt-injection
#            corpus is test DATA. Replacing it with ASCII would change which
#            adversarial inputs are exercised — a behaviour change to the suite.
#   N803/N818 — test-local argument and exception-class naming, not production surface.
#   N802  — a test NAME here is a sentence stating the claim, and ALL-CAPS marks the
#           claim's hinge: `test_chain_walks_PARENT_LINKS_newest_first`,
#           `test_an_empty_batch_renders_NOTHING_so_the_runtime_does_not_fire`. The
#           convention is deliberate and load-bearing for readability; N802 was
#           finding it, not finding a defect. Added 2026-09-17 (#285) after 25 N802s
#           accumulated across the culture-tier and participation-measure suites and
#           `make gate` went red at its FIRST step. Renaming them was the alternative
#           and is worse: it costs the emphasis and churns names `design/09-decision-index.md`
#           cites (#187 already carries 91 stale selectors, largely from renames).
#           Scoped to tests/ on purpose — in `nora/` lowercase function names ARE the rule.
"tests/**" = ["S101", "S104", "S311", "S607", "RUF001", "N802", "N803", "N818"]
"evals/**" = ["S101"]

[tool.importlinter]
root_packages = ["nora", "evals"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is framework-free"
type = "forbidden"
source_modules = ["nora.domain"]
forbidden_modules = ["aiohttp", "strands", "sqlalchemy", "pydantic", "prometheus_client", "opentelemetry", "yaml", "openai"]

[[tool.importlinter.contracts]]
name = "the analytics substrate serves no particular consumer"
type = "forbidden"
# DEC-115 / spec §1.1: the operator's constraint was that nora.analytics
# serve neither the agent nor the app, but sit under both as a substrate.
# A neutrality claim living only in a docstring is decoration — this is
# what turns it into a build failure the first time it is violated.
#
# allow_indirect_imports = "True" is load-bearing for the same reason it is on
# the evals contract below: nora.analytics.composition legitimately imports
# nora.config (its own composition root reading its own config), and
# nora.config in turn carries deliberate one-way, function-scoped validation
# imports into nora.agent.tools and nora.engagement.context (see
# nora/config.py's own comments on those imports — "safe from cycles" because
# agent/engagement may never import config back). ForbiddenContract's default
# walks the whole transitive chain, which would flag
# `nora.analytics -> nora.config -> nora.agent.tools -> ... -> nora.doctrine.loader`
# even though nora.analytics never writes that import itself. This contract is
# only about nora.analytics's/nora.domain.mobility's own direct imports.
source_modules = ["nora.analytics", "nora.domain.mobility"]
forbidden_modules = [
    "nora.agent", "nora.app", "nora.platform", "nora.tag",
    "nora.doctrine", "nora.ingest", "nora.engagement", "nora.skills",
]
allow_indirect_imports = "True"

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
# Middle rows reflect the real import order among today's packages (agent -> doctrine
# -> obs -> infra; platform is independent of the other four) so the contract does
# not fight legitimate cross-package imports. The property this contract exists to
# prove is the last line: nothing above nora.domain may be imported BY nora.domain.
#
# nora.ingest sits ABOVE nora.engagement, not beside it: the standing event fold
# (design/standing-watermark/10) is triggered from the ingest path — every message,
# tagged or not, spawns the watermark check — while the fold machinery it reuses
# (ConversationSlots, the debrief objective/prompt/parse) is engagement's. That is
# engagement's own framing ("ingest decides WHETHER to engage; engagement decides
# HOW", nora/engagement/__init__.py): the trigger layer above, the machinery below.
# The reverse import does not exist and stays forbidden.
layers = [
    # `nora.subject` obtains the composed graph for a caller that is NOT
    # production (design/evaluation/01-boundaries.md §6, operator 2026-09-17).
    # It sits ABOVE `nora.app` so it may reach the composition root while the
    # reverse is refused — the property that stops the application learning it
    # is being measured. Before this layer existed there was no slot for that
    # shape, which is why `nora/app/offline.py` and `eval_support.py`'s
    # assemblies grew inside the application instead.
    "nora.subject",
    "nora.app | nora.presence | nora.analytics",
    "nora.ingest",
    "nora.engagement",
    "nora.agent | nora.platform",
    "nora.doctrine",
    "nora.language",
    "nora.skills | nora.instructions",
    "nora.obs",
    "nora.infra | nora.testing",
    "nora.domain",
]

[[tool.importlinter.contracts]]
name = "only app and __main__ read config"
type = "forbidden"
# `nora.subject` is DELIBERATELY ABSENT from this list, and the absence is the
# decision rather than an oversight: its whole job is composing the real graph,
# and `build_dependencies` takes a `Config`. It reads config for the same reason
# `nora.app` does. Recorded because this list is explicit — a package not named
# here is unconstrained because nothing looks, not because anything decided, and
# that was measured while choosing the layer (design/evaluation/01-boundaries §6).
source_modules = [
    "nora.agent", "nora.obs", "nora.doctrine", "nora.language", "nora.platform",
    "nora.domain", "nora.persons", "nora.tag",
    "nora.infra", "nora.testing", "nora.ingest", "nora.engagement",
    "nora.skills", "nora.instructions",
]
forbidden_modules = ["nora.config"]

[[tool.importlinter.contracts]]
name = "the nora package's own __init__ does not read config either"
type = "forbidden"
# A "forbidden" contract skips any source/forbidden pair where one module is a
# subpackage of the other (import-linter's own overlap rule — see forbidden.py's
# `_modules_overlap`): `nora.config` is *inside* `nora`, so listing the package
# `nora` as a source module in the contract above is silently a no-op for the
# `nora.config` target, by import-linter's own design, not a bug in this config.
# `as_packages = false` treats both sides as single literal modules instead of
# packages, which sidesteps that overlap rule and actually checks nora/__init__.py.
source_modules = ["nora"]
forbidden_modules = ["nora.config"]
as_packages = false

[[tool.importlinter.contracts]]
name = "evals may only reach nora.app, nora.testing and nora.subject"
type = "forbidden"
# Positive framing ("evals may import nora.app and nora.testing — nothing else",
# spec §4.1) expressed as its complement, the same shape contract 3 already uses:
# every other nora subpackage evals could reach, plus tests/ itself (Task 10 — evals
# stopped importing tests/, this is what keeps it stopped). A new nora subpackage
# added later needs a line here too; `tests/test_boundaries.py`'s AST-based sibling
# check is the allowlist-style backstop that does not need updating for that case.
#
# allow_indirect_imports = "True" is load-bearing, not cosmetic: `nora.app` (the
# composition root) legitimately imports nora.agent/nora.doctrine/nora.tag/etc.
# internally, so evals *transitively* reaches every package below without it —
# ForbiddenContract's default checks the whole import chain, which would flag
# `evals -> nora.app.eval_support -> nora.doctrine.loader` even though evals never
# writes that import itself. This contract is only about evals' own import
# statements; nora.app's freedom to import whatever it needs is contract 2's concern.
source_modules = ["evals"]
forbidden_modules = [
    "nora.agent", "nora.config", "nora.domain", "nora.engagement",
    "nora.infra", "nora.ingest", "nora.obs", "nora.doctrine", "nora.persons",
    "nora.platform", "nora.tag", "nora.skills", "nora.presence", "nora.analytics",
    "nora.instructions", "tests",
]
allow_indirect_imports = "True"

[dependency-groups]
dev = [
    "aioresponses>=0.7.9",
    "boto3-stubs[s3]>=1.43.78",
    "import-linter>=2.0",
    "mcp>=1.29.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-aiohttp>=1.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.15.0",
    "tomli-w>=1.0",
    "types-docker>=7.2.0.20260813",
    "types-pyyaml>=6.0.12.20260724",
    "types-yt-dlp>=2026.8.19.20260823",
]
