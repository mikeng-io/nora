<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f2f2" />
    <meta name="robots" content="noindex" />
    <title>Nora</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <!--
      Shown by the service worker (public/sw.js) when a page is opened with
      no connection and was never opened on this device before. Static and
      self-contained: DESIGN.md's tokens inline, both lightings, both
      languages, no request it could fail on except the precached icon.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        var theme = null;
        var lang = null;
        try {
          theme = localStorage.getItem("nora-theme");
          lang = localStorage.getItem("nora-lang");
        } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        d.dataset.theme = dark ? "dark" : "light";
        var seg = location.pathname.split("/")[1];
        var en = seg === "en" || (seg !== "zh-Hant" && lang === "en");
        d.lang = en ? "en" : "zh-Hant-HK";
        d.dataset.lang = en ? "en" : "zh";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? "#141112" : "#f4f2f2";
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --studio: #f4f2f2;
        --surface: #fcfbfb;
        --hoodie: #ece8e8;
        --hairline: #dcd5d5;
        --seam: #bdb3b3;
        --ink: #2b2220;
        --ink-soft: #5e5351;
        --ink-muted: #6e6362;
        --denim: #48587a;
        --denim-dim: #5d6c8e;
        --blush: #c26a5a;
        --bun: #5a3d34;
        --ease: cubic-bezier(0.2, 0, 0, 1);
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --studio: #141112;
        --surface: #1b1718;
        --hoodie: #241f20;
        --hairline: #332c2d;
        --seam: #4a4243;
        --ink: #f2eded;
        --ink-soft: #b9afaf;
        --ink-muted: #948989;
        --denim: #9aa9ca;
        --denim-dim: #7c89a8;
        --blush: #efa497;
        --bun: #c99a86;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--studio);
        color: var(--ink);
        font-family: Inter, "Noto Sans HK", "PingFang HK", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      :lang(zh) body {
        line-height: 1.7;
      }
      [data-lang="en"] [lang="zh-Hant-HK"],
      [data-lang="zh"] [lang="en"] {
        display: none;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px);
      }
      .card {
        width: min(100%, 420px);
        display: grid;
        justify-items: center;
        gap: 20px;
        text-align: center;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mark img {
        width: 30px;
        height: 30px;
      }
      .word {
        font-family: "Space Grotesk", Inter, system-ui, sans-serif;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--bun);
      }
      .ring {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        border: 1.5px solid var(--seam);
      }
      .art {
        width: 104px;
        height: 104px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 650;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      p {
        margin: 0;
        color: var(--ink-soft);
        text-wrap: pretty;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        border: 1px solid transparent;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition:
          background-color 100ms var(--ease),
          color 100ms var(--ease);
      }
      .btn-primary {
        background: var(--denim);
        color: var(--surface);
      }
      .btn-primary:hover {
        background: var(--denim-dim);
      }
      .btn-outline {
        border-color: var(--seam);
        color: var(--ink);
        background: transparent;
      }
      .btn-outline:hover {
        background: var(--hoodie);
      }
      .btn:focus-visible {
        outline: 2px solid var(--denim);
        outline-offset: 2px;
      }
      .note {
        font-size: 13px;
        color: var(--ink-muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card" role="status">
        <div class="mark" aria-hidden="true">
          <img src="/icons/icon-192.png" alt="" width="30" height="30" />
          <span class="word">Nora</span>
          <span class="ring"></span>
        </div>
        <img class="art" src="/icons/icon-512.png" alt="" width="104" height="104" />
        <h1>
          <span lang="zh-Hant-HK">你離咗線</span>
          <span lang="en">You're offline</span>
        </h1>
        <p>
          <span lang="zh-Hant-HK">之前打開過嘅頁面仍然用得；呢一頁喺呢部機仲未打開過。</span>
          <span lang="en">Pages you've opened before still work. This one hasn't been opened on this device yet.</span>
        </p>
        <div class="actions">
          <button class="btn btn-primary" type="button" onclick="location.reload()">
            <span lang="zh-Hant-HK">再試一次</span>
            <span lang="en">Try again</span>
          </button>
          <a class="btn btn-outline" href="/zh-Hant/today" id="today">
            <span lang="zh-Hant-HK">去今日</span>
            <span lang="en">Go to Today</span>
          </a>
        </div>
        <p class="note">
          <span lang="zh-Hant-HK">連返網就會自動載入。</span>
          <span lang="en">It loads by itself once you're connected.</span>
        </p>
      </div>
    </main>
    <script>
      // Today in the reader's language: the locale page is the one a device
      // would have kept, where a bare /today would only redirect.
      document.getElementById("today").href =
        document.documentElement.dataset.lang === "en" ? "/en/today" : "/zh-Hant/today";
      // Back online: try the page that was asked for.
      addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
