# Dev-only identity roster for the mock Nora API (mock-nora.mjs) and for the
# portal's dev sign-in (src/auth.ts, NORA_DEV_LOGIN=1 + `next dev`).
#
# Shape mirrors the real identity.toml exactly (see /identity.example.toml at
# the repo root, and src/server/allowlist.ts's own docstring): one
# [persons.<id>] table per person, with name = "...", and one
# [[persons.<id>.discord]] array-of-tables block per Discord account,
# user_id = "...". `user_id` is the only field ever matched on.
#
# Every person and every id below is an INVENTED placeholder — never real
# data. This file is committed and read at mock-nora.mjs's startup, and by
# smol-toml in the dev sign-in path; it must stay plain, valid TOML (no
# folded strings, no nested inline tables) so both readers agree on it.

[persons.miles]
name = "Miles"

[[persons.miles.discord]]
user_id = "100000000000000001"

[persons.ken]
name = "Ken"

[[persons.ken.discord]]
user_id = "100000000000000002"

[persons.mei]
name = "Mei"

[[persons.mei.discord]]
user_id = "100000000000000003"

[persons.jo]
name = "Jo"

[[persons.jo.discord]]
user_id = "100000000000000004"

[persons.ada]
name = "Ada"

[[persons.ada.discord]]
user_id = "100000000000000005"

# Sam has no Discord account on file — the roster's one person with no way
# to sign in, and not a member of the presence circle either (mock-nora.mjs
# treats persons.sam as known-but-outside-the-circle throughout).
[persons.sam]
name = "Sam"
