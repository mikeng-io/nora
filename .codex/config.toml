[mcp_servers.aikido]
command = "npx"
args = ["-y", "@aikidosec/mcp@latest"]

[mcp_servers.meshy]
command = "npx"
args = ["-y", "@meshy-ai/meshy-mcp-server@0.6.6"]
env_vars = ["MESHY_API_KEY"]

[mcp_servers.devin]
url = "https://mcp.devin.ai/mcp"
bearer_token_env_var = "DEVIN_API_KEY"
env_http_headers = { "X-Org-Id" = "DEVIN_ORG_ID" }
