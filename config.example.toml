# Deployment settings; credentials and endpoint examples: docs/configuration.md.

identity_file = "identity.toml"
policy_file = "policy.toml"   # who may talk to her, and where; see policy.example.toml

[agent]
name = "nora"

[agent.handles]
signal = "@nora.000"
whatsapp = "@noraexample"
x = "@noraexample"
threads = "@noraexample"

[platforms.signal]
# mode = "direct": base_url is the signal-cli daemon's JSON-RPC/HTTP API and
#   inbound arrives over its SSE. mode = "bridge": base_url is the standalone
#   signal-bridge's /v1 action API and inbound arrives over Redis Streams —
#   the deployed shape (design/platform-bridges). Never run a direct adapter
#   AND a bridge on the same account: that is two sessions on one
#   registration.
base_url = "http://signal-bridge:18090"
mode = "bridge"
# account_key names the stream's account leg — an explicit opaque key shared
# by the bridge's NORA_BRIDGE_ACCOUNT_KEY and the bridge-projection
# publisher's SIGNAL_BRIDGE_ACCOUNT_KEY, never derived from the number.
account_key = "signal-acct-1"
account = ""                     # empty = derive from the signal-cli daemon
enabled = true                   # false with no other platform enabled refuses to start

[platforms.discord]
enabled = false                  # off by default
token_env = "DISCORD_BOT_TOKEN"  # env var holding the bot token; never the value itself
# mode = "direct": the app holds the Gateway connection itself. mode =
# "bridge": discord-bridge holds Gateway+voice+music; the app consumes Redis
# and calls its action API at base_url. account_key = the stream leg the
# bridge and publisher both carry (DISCORD_BRIDGE_ACCOUNT_KEY).
# mode = "bridge"
base_url = "http://discord-bridge:18093"
# account_key = "default"

[platforms.whatsapp]
enabled = false                  # off by default; requires pairing first
base_url = "http://whatsapp-bridge:18081"  # bridge holds the paired session; no token or account here
# mode = "bridge"                 # inbound over Redis Streams; "direct" uses SSE
# account_key = "default"

[platforms.instagram]
enabled = false                  # off by default; requires a session first
base_url = "http://instagram-bridge:18082"  # bridge holds the cookie session; no token or account here
# mode = "bridge"
# account_key = "default"

# [bridges] — the durable inbound handoff (design/platform-bridges). Any
# platform with mode = "bridge" requires redis_url_env to resolve at boot.
# redis_url_env names the env var carrying the Redis URL (a credential —
# named reference only, never a value here); token_env names the shared /v1
# bearer; lease_seconds bounds a claimed work item's visibility before
# reclaim.
# [bridges]
# redis_url_env = "NORA_REDIS_URL"
# token_env = "NORA_BRIDGE_TOKEN"
# lease_seconds = 300

[honcho]
base_url = "http://127.0.0.1:8000"
workspace_id = "nora"
tagger_card_conclusions = 8
people_in_window_conclusions = 3
people_in_window_speakers = 4
read_timeout_seconds = 5.0

[llm]
base_url = "http://localhost:20128/v1"
api_key_env = "OMNIROUTE_API_KEY"     # env var NAME, never the value

model = "ollamacloud/deepseek-v4-flash:0731"
max_tokens = 2000
temperature = 0.7

reasoning_effort = "low"
defer_tools = false
timeout_seconds = 360

[llm.budgets]
web_fetch = 6

[llm.limits]
turns = 20
total_tokens = 1024000
output_tokens = 12000

[engagement]
policy = "trigger_text"

[engagement.reactions]
enabled = true

[engagement.queue]
max_depth = 16

[engagement.trigger]
enabled = true
text = "nora"
min_interval_seconds = 5

[participation]
enabled = false
settle_seconds = 10
max_window_messages = 10
reasoning_effort = "none"
cooldown_minutes = 10
shadow = false
# shadow_channel = "1234567890123456789/9876543210987654321"  # required when shadow = true
# shadow_platform = "discord"              # the mirror's platform

[proactive]
reasoning_effort = "low"
max_tokens = 20000

[relevance_gate]
enabled = false
model = "nora-gate"
reasoning_effort = "none"
max_tokens = 512
temperature = 0.0
timeout_seconds = 20.0
transcript_rows = 40
shadow = true
# shadow_channel = "1234567890123456789/9876543210987654321"  # required when enabled AND shadow
# shadow_platform = "discord"

[reaction]
enabled = false
model = ""                 # empty = [llm] model
reasoning_effort = "none"  # empty inherits [llm]
timeout_seconds = 6.0      # bounds the whole pick, download included
max_tokens = 200

[store]
database_url_env = "DATABASE_URL"
data_dir = "~/workspace/nora/data"
max_per_conversation = 500   # rows kept per conversation by the retention sweep
context_window = 40          # rows read per conversation; `who_said` searches this depth
prompt_window = 20
quote_margin = 10
quote_window_multiplier = 3
# prune_enabled = false

[memory.graph]
enabled = false

[memory.extraction]
enabled = false
model = "ollamacloud/deepseek-v4.1-flash"
messages_per_call = 20
context_messages = 20
min_message_age_seconds = 2.0
timeout_seconds = 90.0
max_tokens = 6000

[memory.index]
refresh_seconds = 60.0
read = false
embed = false
embedder_url = "http://embedder:8080"
embedder_model = "Qwen3-VL-Embedding-2B.Q4_K_M.gguf@7812c91cd1e0"
embed_batch = 64
embed_images_per_hour = 120

[memory.profile]
write = false
read = false
update_every_seconds = 604800

[memory.profile.person]
update_every_messages = 100

[memory.profile.unit]
update_every_room_profile_changes = 5

[memory.profile.nora]
update_every_replies = 100

[memory.graph.comprehend]
enabled = false
turns = 8
total_tokens = 120000
output_tokens = 12000
timeout_seconds = 240
live_concurrency = 1
historical_concurrency = 1
preview_tokens = 1500
web_searches = 3
page_fetches = 3

[lineage]
mode = "off"

[record_query]
enabled = false

[cognition]
enabled = false
tick_seconds = 30                     # how often the evaluator checks every unit; one read per unit, no model call
quiet_seconds = 1800
cue_quiet_seconds = 120               # strong cue (date/time, place link, keep instruction, pending RSVP), then this much quiet
batch_max = 80                        # wake when this many stimuli are pending
max_age_seconds = 3600                # wake when the oldest pending stimulus is this old
cooldown_seconds = 300                # pause after each session; one strong cue may cut it once
max_concurrent_sessions = 2           # sessions running at once across all units
reply_quiet_seconds = 600             # a reply to Nora's message inside this window is recorded but never wakes a session alone
time_floors = ["07:00", "00:00"]
timezone = "Asia/Hong_Kong"
floor_grace_seconds = 3600
upcoming_days = 3
store_timeout_seconds = 5
max_items = 12                        # items per session
max_strikes = 3
# session_timeout_seconds = 3900
max_self_wakes = 5
max_self_wakes_per_day = 12
backoff_max_seconds = 21600
max_consecutive_failures = 5
# model_window_tokens = 200000
overflow_window_fraction = 0.8
record_chars = 40000
message_chars = 400
register_lines = 40
own_send_lookback_seconds = 1800.0
own_sends_max = 6

[dreamer]
dir = "nora/dreamer"
reload = "mtime"
strict = true
enabled = false
tick_seconds = 300
safety_lag = 300
quiet_seconds = 1800
max_age_seconds = 86400
batch_limit = 400
store_timeout_seconds = 15.0
# max_unit_hold_seconds = 1200.0
reasoning_effort = "none"

model = "ollamacloud/deepseek-v4-flash:0731"
max_tokens = 6000

[dreamer.budgets.culture]
turns = 10
total_tokens = 120000
output_tokens = 6000
max_memory_calls = 12

[dreamer.budgets.culture.tool_calls]
lookup_person = 12

[dreamer.budgets.cognition]
turns = 200
total_tokens = 10240000
output_tokens = 120000
timeout_seconds = 3600.0

[dreamer.budgets.subagent]
turns = 200
total_tokens = 10240000
output_tokens = 120000
timeout_seconds = 3600.0

[heartbeat]
enabled = false
tick_seconds = 60          # how often it wakes. Reminders fire at or after due_at,
timeout_seconds = 120

[reminders]
max_pending_per_requester = 20
min_lead_seconds = 120     # must exceed heartbeat.tick_seconds or Nora refuses to start
max_horizon_days = 365     # furthest-out due date. Recurring series are bounded by
max_occurrences_per_series = 60   # total firings in one recurring series (one pending row at a time)
min_interval_seconds = 300 # fastest a series may repeat; 300 = at most 12 firings/hour.
timezone = "Asia/Hong_Kong"   # IANA zone name (not an offset) a recurrence keeps its wall clock in

[notes]
enabled = false

[culture]
enabled = false
wake_batch = 200
stale_seconds = 604800
batch_limit = 300

[lessons]
