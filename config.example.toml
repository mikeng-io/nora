identity_file = "identity.toml"
policy_file = "policy.toml"   # WHO may talk to her, and where. See policy.example.toml.

[platforms.signal]
base_url = "http://127.0.0.1:18080"
account = ""                     # empty = derive from the signal-cli daemon (D5)
nora_sender_id = "nora"          # how Nora's own rows are tagged in the audit
enabled = true                   # NOT YET HONOURED — SignalAdapter starts regardless;
                                  # wiring lands with the Phase 4 adapter registry

[memory]
base_url = "http://127.0.0.1:8000"
workspace_id = "nora"

[llm]
base_url = "http://localhost:20128/v1"
api_key_env = "OMNIROUTE_API_KEY"     # env var NAME, never the value

# PINNED to one upstream, not the `nora` combo. The combo fans out per request
# and only ONE of its three upstreams accepts a forced tool_choice while
# thinking is enabled — measured 4/4 each, not sampled:
#
#   deepseek/deepseek-v4-flash       400 "Thinking mode does not support this
#   opencode-go/deepseek-v4-flash    400  tool_choice" (deepseek-ai/DeepSeek-V3#1376)
#   opencode-zen/deepseek-v4-flash   200, and picks the right tool 4/4
#
# So on the combo she was on a coin flip: routed to zen she chained correctly,
# routed to either other she 400'd mid-turn and went silent — showing the group
# ⚠️, which reads as "gave up" rather than "the provider refused the request".
#
# This gives up the alias's benefit of keeping the upstream name out of her
# process (R-18 still blocks model names from replies, so she cannot say it).
# Determinism is worth more than the indirection.
#
# WATCH THIS: zen is the only one of the three that reports no reasoning_tokens
# in usage, which suggests a different — possibly older — build than the other
# two. If that is why it accepts the forced tool_choice, their next update
# could start 400ing with nothing changing here. The version-independent
# fallback is reasoning_effort = "none", which works on all three.
model = "opencode-zen/deepseek-v4-flash"
# The provider's per-CALL ceiling — NOT the turn's budget (see [llm.limits]
# below, which is where the loop's budget lives). Was 4000, an unmeasured
# number that doubled as the loop budget; measured 2026-08-06, the largest
# legitimate completion — reasoning block plus the tool call — was 371 tokens,
# so 2000 is 5.4x headroom.
max_tokens = 2000
temperature = 0.7
# "none" | "low" | "medium" | "high". A tag is one short reply from context she
# already holds — nothing to reason through. Measured on deepseek-v4-flash:
# "none" 4.7s, "low" 9.5s, unset 16.1s, all producing the tool call.
reasoning_effort = "low"
timeout_seconds = 30

# The three caps around the WHOLE agent loop for one tag — all measured
# 2026-08-06, all three previously wrong in the same direction.
#
# Real per-call INPUT is 4,952 tokens (doctrine + transcript + tool schemas),
# paid again on every call in the loop, plus whatever the tool results from
# earlier calls added to the context. A measured 6-call turn totalled
# 32,426-36,748 tokens.
#
# At the old total_tokens = 24000 that ceiling was crossed during model call
# FIVE, so `turns = 8` was unreachable dead config: the token cap always bound
# first and the turn count never did. Worse, until R-23 the cut was reported
# byte-identically to the model simply choosing not to answer.
#
# 64000 gives ~2x headroom over the worst measured 6-call turn and lets
# `turns` be the cap that actually binds — which is the one an operator can
# reason about, because a turn is a round trip and a token is not.
[llm.limits]
turns = 8
total_tokens = 64000
# The loop's OUTPUT budget across every call of the turn, deliberately not
# `llm.max_tokens` (which is one call's ceiling). It was literally that number
# until 2026-08-06, so the whole loop could emit what one call could — and
# single calls were measured emitting 3,993 / 3,987 / 3,974 completion tokens,
# i.e. 99.8% of it. 12000 is 6x the per-call ceiling.
output_tokens = 12000

[engagement]
policy = "trigger_text"

[engagement.trigger]
text = "nora.000"
min_interval_seconds = 5

[store]
db_path = "~/workspace/nora/data/messages.db"
max_per_conversation = 500
context_window = 40

# Attachment byte custody (DEC-43), encrypted at rest (DEC-47). The WHOLE
# SECTION IS OPTIONAL — every key below is its own default — so a config.toml
# without it behaves identically.
#
# There is no path key on purpose: media lives beside `store.db_path`, in
# `data/media/<first2>/<rest>`, keyed by the sha256 of the content. The row and
# the blob it names are one record; a second root would let them be backed up
# and deleted separately, and the first time that happened the transcript would
# point at blobs nobody kept.
#
# ENCRYPTION AT REST (DEC-47). The bytes on disk are AES-256-GCM ciphertext, not
# the picture. For IMAGES, EXIF/embedded metadata (GPS, device id) is stripped
# BEFORE the content is hashed — so the same photo with different GPS dedups to
# one blob, and the location PII is gone from what Nora holds. NON-IMAGES
# (audio, video, documents) have NO metadata stripped — there is no cheap
# universal stripper — so their embedded metadata survives inside the encrypted
# blob. Custody turns ON only when `enabled` is true AND `encryption_key_env`
# names an env var holding a valid key; a missing/malformed key degrades to
# custody OFF (never plaintext-by-accident, never a crash).
#
# RETENTION IS NOT DECIDED. `store.max_per_conversation` prunes MESSAGES; no
# sweep deletes blobs yet, so today this grows without bound. That is DEC-43's
# open question and it is the operator's to answer — this is the most PII-heavy
# data in the system. `enabled = false` is the honest off switch in the
# meantime: attachments are then recorded exactly as before (a placeholder, no
# handle) and every one is counted under
# nora_media_custody_total{status="not_configured"}.
[media]
enabled = true
# Names the env var holding the base64 of a 32-byte AES-256 key (DEC-8: name the
# var, never inline the secret). Host-injected, like OMNIROUTE_API_KEY. Generate:
#   python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
# Empty (or the var unset) = custody OFF.
encryption_key_env = "NORA_MEDIA_KEY"
max_bytes = 104857600     # 100 MiB — Signal's own attachment ceiling
timeout_seconds = 8.0     # ingest path: a wedged daemon costs seconds, never the message

# Google routing for the `route` tool (DEC-46). The WHOLE SECTION IS OPTIONAL
# and every key defaults — a config.toml without it behaves as if routing is
# off. `route` is the one grounding tool that costs money and reaches a third
# party (Google Maps Platform), so it is OFF by default; while off the tool
# answers `unavailable`, never a silent empty.
#
# `api_key_env` names the env var holding the key — the VALUE is never in config
# (DEC-8), exactly like `llm.api_key_env`. Restrict the key at Google to
# Routes + Places + Geocoding, and set a budget alert.
[route]
enabled = false
api_key_env = "GOOGLE_MAPS_API_KEY"

# Web search (SearXNG) + page fetch (Firecrawl) for the `search`/`fetch` tools
# (DEC-57, design/22). The WHOLE SECTION IS OPTIONAL and every key defaults — a
# config.toml without it behaves as if search is off.
#
# It ships INERT (`enabled = false`) and must stay so until TWO things are true:
# an operator turns it on, AND Firecrawl's egress is network-isolated so it
# cannot reach Nora's own internals (Honcho, signal-cli, OmniRoute) at the packet
# layer. That isolation is the PRIMARY SSRF control (design/22 §0) — Nora's
# search-result URL fence and is_global precheck are only defence in depth,
# because Firecrawl follows redirects and re-resolves DNS itself. While off, both
# tools answer `unavailable`, never a silent empty.
#
# `firecrawl_api_version` is pinned to the deployed instance's scrape route —
# verified `v1` on the running firecrawl-api container (both v1 and v2 answer
# identically today; v1 matches design/14's measurement). The three caps bound
# the input-token cost of retrieved text, re-sent on every subsequent model call.
[search]
enabled = false
searxng_url = "http://127.0.0.1:8080"
firecrawl_url = "http://127.0.0.1:3002"
firecrawl_api_version = "v1"
search_max_results = 6      # SearXNG format=json returns the whole set (measured 27)
snippet_max_bytes = 500     # per-snippet byte clamp; truncation stated in the result
fetch_max_chars = 10000     # a scraped page's char ceiling
timeout_seconds = 15.0

[doctrine]
dir = "nora/doctrine"
reload = "mtime"                      # mtime | startup
strict = true
language_hint = "yue-Hant-HK"         # BCP 47 (RFC 5646): Cantonese, Traditional Han, Hong Kong
canary = "CHANGE-ME-PER-DEPLOYMENT"   # fixed string; R-6 leak sentinel
display_name = "Nora"

[obs.logging]
level = "INFO"
path = "~/workspace/nora/data/nora.log"
format = "json"

[obs.metrics]
port = 9100                           # also serves /health

[obs.tracing]
enabled = true
exporter = "file"                     # console | otlp_http | file
endpoint = ""
headers_env = ""                      # env var NAME holding OTLP auth headers, never the
                                       # value (DEC-8); only read when exporter = "otlp_http"

[evals.langfuse]
enabled = false                       # opt-in: also requires `--export-langfuse` on the CLI
host = "http://127.0.0.1:3100"
headers_env = ""                      # same shape/var as obs.tracing.headers_env — see
                                       # nora.config.LangfuseEvalConfig's docstring for why
                                       # this reuses that credential rather than adding a
                                       # second one
