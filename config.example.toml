[speech]

[speech.stt]
enabled = false
endpoint = "http://stt:8000"   # the deploy/stt service on the private nora network
model = "noise-detection"      # STT engine: "noise-detection" (Cantonese whisper)
language = "yue"               # the engine's own language code, not BCP-47

[speech.tts]
enabled = false
provider = ""                  # "" = no speaker; set "minimax_cn" to speak. The API
sidecars = []
# voice = "Cantonese_CuteGirl" # a native Cantonese voice
speed = 1.0                    # speaking rate, 0.5 to 2.0
pitch = 0.0                    # semitones, -12 to 12
vol = 1.0                      # volume, 0.1 to 10
emotion = ""                   # e.g. "fluent"; "" lets MiniMax match the text.
text_normalization = false     # vendor digit/English normalization (slightly slower)
pronunciation = []             # entries "original/replacement", e.g. "RV/(aa1)(wai1)"; [] = off
# duck_gain = 0.25             # music volume while she speaks (0<x<1); currently unread
# duck_ramp_ms = 150           # ramp time for ducking, ms; currently unread

[speech.tts.format]
mode = "off"
model = "nora-gate"            # model alias; "" = [llm] model
reasoning_effort = "none"
timeout_seconds = 2.0          # worst-case delay added before she is heard
max_tokens = 1024
min_chars = 12                 # fewer letters+digits than this: no model call
max_chars = 200                # more than this: no model call

[speech.wake]
enabled = false
threshold = 0.5                    # wake score that starts utterance collection
model_path = "/app/models/喂Nora.onnx"  # wake model baked into the voice-wake image
stt_model = "sensevoice"           # STT engine for the wake path, preloaded by the stt
vad_enabled = true                 # end an utterance when Silero VAD hears no speech for
vad_threshold = 0.5                # speech probability at/above this counts as speech
silence_tail_ms = 800              # no-speech tail that ends an utterance
max_utterance_s = 10.0             # utterance ceiling
silence_rms = 400.0                # int16 RMS under this reads as silence (RMS fallback only)

