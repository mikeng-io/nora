identity_file = "identity.toml"
policy_file = "policy.toml"   # WHO may talk to her, and where. See policy.example.toml.

[agent]
# The agent's MACHINE name — its Strands agent_id and Langfuse trace span
# (`invoke_agent <name>`). Lowercase and stable; a rename starts a new trace
# lineage. The human-facing name is [doctrine].display_name and the wake word is
# [engagement].trigger.text. Optional (defaults to "nora"); to stamp out a second
# agent ("delia") set all three here plus its own doctrine files, ai_peer, and
# workspace_id.
name = "nora"

[platforms.signal]
base_url = "http://127.0.0.1:18080"
account = ""                     # empty = derive from the signal-cli daemon (D5)
enabled = true                   # honoured by the adapter registry; false with no other
                                  # platform enabled refuses to start rather than run deaf

[platforms.discord]
enabled = false                  # off by default — see design/discord-integration/
token_env = "DISCORD_BOT_TOKEN"  # env var holding the bot token; never the value itself

[memory]
base_url = "http://127.0.0.1:8000"
workspace_id = "nora"

[llm]
base_url = "http://localhost:20128/v1"
api_key_env = "OMNIROUTE_API_KEY"     # env var NAME, never the value

# PINNED to one upstream, not the `nora` combo. The combo fans out per request
# and only ONE of its three upstreams accepts a forced tool_choice while
# thinking is enabled — measured 4/4 each, not sampled:
#
#   deepseek/deepseek-v4-flash       400 "Thinking mode does not support this
#   opencode-go/deepseek-v4-flash    400  tool_choice" (deepseek-ai/DeepSeek-V3#1376)
#   opencode-zen/deepseek-v4-flash   200, and picks the right tool 4/4
#
# So on the combo she was on a coin flip: routed to zen she chained correctly,
# routed to either other she 400'd mid-turn and went silent — showing the group
# ⚠️, which reads as "gave up" rather than "the provider refused the request".
#
# This gives up the alias's benefit of keeping the upstream name out of her
# process (R-18 still blocks model names from replies, so she cannot say it).
# Determinism is worth more than the indirection.
#
# WATCH THIS: zen is the only one of the three that reports no reasoning_tokens
# in usage, which suggests a different — possibly older — build than the other
# two. If that is why it accepts the forced tool_choice, their next update
# could start 400ing with nothing changing here. The version-independent
# fallback is reasoning_effort = "none", which works on all three.
model = "opencode-zen/deepseek-v4-flash"
# The provider's per-CALL ceiling — NOT the turn's budget (see [llm.limits]
# below, which is where the loop's budget lives). Was 4000, an unmeasured
# number that doubled as the loop budget; measured 2026-08-06, the largest
# legitimate completion — reasoning block plus the tool call — was 371 tokens,
# so 2000 is 5.4x headroom.
max_tokens = 2000
temperature = 0.7
# "none" | "low" | "medium" | "high". A tag is one short reply from context she
# already holds — nothing to reason through. Measured on deepseek-v4-flash:
# "none" 4.7s, "low" 9.5s, unset 16.1s, all producing the tool call.
reasoning_effort = "low"
timeout_seconds = 30

# The three caps around the WHOLE agent loop for one tag — all measured
# 2026-08-06, all three previously wrong in the same direction.
#
# Real per-call INPUT is 4,952 tokens (doctrine + transcript + tool schemas),
# paid again on every call in the loop, plus whatever the tool results from
# earlier calls added to the context. A measured 6-call turn totalled
# 32,426-36,748 tokens.
#
# At the old total_tokens = 24000 that ceiling was crossed during model call
# FIVE, so `turns = 8` was unreachable dead config: the token cap always bound
# first and the turn count never did. Worse, until R-23 the cut was reported
# byte-identically to the model simply choosing not to answer.
#
# 64000 gives ~2x headroom over the worst measured 6-call turn and lets
# `turns` be the cap that actually binds — which is the one an operator can
# reason about, because a turn is a round trip and a token is not.
# Per-tool call-count overrides — the per-deployment DELTA over the table in
# `nora/agent/tools.py`, which states every default with its reasoning beside
# the tool it belongs to (DEC-10). Empty here means "the table, unchanged".
#
# This exists because budgets drift upward as tools are added, and moving a
# number should not need a code change and a rebuild. It is applied OVER the
# table by `ToolRegistry.budgets()`, which stays the single place anything
# resolves a budget from — R-7's ceiling, the Deliverer's message cap and the
# tests all still read one value. Putting ONE tool's budget here instead would
# have split the table fifteen-to-one, which is the drift DEC-10/DEC-32 exist
# to prevent.
#
# An unknown tool name or a value below 1 is a STARTUP FAILURE, not a warning:
# a silently-ignored line is an operator certain they raised a cap that never
# moved.
#
# [llm.budgets]
# send_reply = 6

[llm.limits]
turns = 20
total_tokens = 128000
# The loop's OUTPUT budget across every call of the turn, deliberately not
# `llm.max_tokens` (which is one call's ceiling). It was literally that number
# until 2026-08-06, so the whole loop could emit what one call could — and
# single calls were measured emitting 3,993 / 3,987 / 3,974 completion tokens,
# i.e. 99.8% of it. 12000 is 6x the per-call ceiling.
output_tokens = 12000

[engagement]
policy = "trigger_text"

[engagement.trigger]
text = "nora.000"
min_interval_seconds = 5

[store]
# The record store is PostgreSQL (design/20). The URL is injected by the host
# through the env var named here (DEC-8: name the var, never inline the value).
# `docker compose` sets DATABASE_URL from `.env` to
# `postgresql+asyncpg://nora:…@nora-db/nora`.
database_url_env = "DATABASE_URL"
# On-disk root for media byte custody. A Postgres URL has no directory, so the
# media root is its own key; blobs live at `data_dir/media`.
data_dir = "~/workspace/nora/data"
max_per_conversation = 500
context_window = 40
# Whether the retention sweep runs at all. Defaults TRUE (this file's convention:
# a config.toml written before a key existed keeps its behaviour), so leaving it
# out prunes to `max_per_conversation` above every 300s.
#
# Set it false to keep the conversation record IN FULL. That is a real decision,
# not a tuning knob: at 500 rows a busy group reaches the cap in days and then
# evicts its oldest message every time a new one lands, silently — the record
# still looks healthy, it is just a rolling window rather than a history. Turn it
# off if anything downstream reads the past (an aggregator over the record, an
# audit, an export), and watch disk instead.
#
# Do NOT fake it by widening `max_per_conversation`: `prune_all` runs a
# `row_number()` window over the whole `messages` table on every tick, so a huge
# number keeps paying for that scan in order to delete nothing.
# prune_enabled = false

# Attachment byte custody (DEC-43), encrypted at rest (DEC-47). The WHOLE
# SECTION IS OPTIONAL — every key below is its own default — so a config.toml
# without it behaves identically.
#
# There is no media path key on purpose: media lives under `store.data_dir`, in
# `media/<first2>/<rest>`, keyed by the sha256 of the content. The row and the
# blob it names are one record; a media-specific root would let them be backed
# up and deleted separately, and the first time that happened the transcript
# would point at blobs nobody kept.
#
# ENCRYPTION AT REST (DEC-47). The bytes on disk are AES-256-GCM ciphertext, not
# the picture. For IMAGES, EXIF/embedded metadata (GPS, device id) is stripped
# BEFORE the content is hashed — so the same photo with different GPS dedups to
# one blob, and the location PII is gone from what Nora holds. NON-IMAGES
# (audio, video, documents) have NO metadata stripped — there is no cheap
# universal stripper — so their embedded metadata survives inside the encrypted
# blob. Custody turns ON only when `enabled` is true AND `encryption_key_env`
# names an env var holding a valid key; a missing/malformed key degrades to
# custody OFF (never plaintext-by-accident, never a crash).
#
# RETENTION IS NOT DECIDED, and `store.prune_enabled = false` sharpens it: with
# the message sweep off, NOTHING in the system deletes anything, and blobs are
# far larger than rows. Even with it on, `store.max_per_conversation` prunes
# MESSAGES only — no sweep deletes blobs, so today this grows without bound in
# either configuration. The blob outliving the row that named it is the shape to
# watch for: a message pruned or an export taken leaves bytes on disk that
# nothing references and nothing will ever collect. That is DEC-43's
# open question and it is the operator's to answer — this is the most PII-heavy
# data in the system. `enabled = false` is the honest off switch in the
# meantime: attachments are then recorded exactly as before (a placeholder, no
# handle) and every one is counted under
# nora_media_custody_total{status="not_configured"}.
[media]
enabled = true
# Names the env var holding the base64 of a 32-byte AES-256 key (DEC-8: name the
# var, never inline the secret). Host-injected, like OMNIROUTE_API_KEY. Generate:
#   python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
# Empty (or the var unset) = custody OFF.
encryption_key_env = "NORA_MEDIA_KEY"
max_bytes = 104857600     # 100 MiB — Signal's own attachment ceiling
timeout_seconds = 8.0     # ingest path: a wedged daemon costs seconds, never the message
# Reading a stored image back through MiMo-V2.5 (the `media_fetch` tool, DEC-56).
# All defaulted; these are the READ half's knobs. vision_max_bytes is the ceiling
# on bytes sent to MiMo — far below max_bytes on purpose (a 100 MiB blob is a
# ~133 MiB base64 body). vision_timeout_seconds is a CEILING: the tool derives the
# real per-call budget as the smaller of it and half of llm.timeout_seconds, so a
# slow model becomes the tool's `unavailable`, never the loop's silent timeout.
# DEPRECATED NAME, kept so a config written before DEC-114 keeps
# loading: this is the IMAGE describer's model, and
# `[media.describe.image] model` overrides it when both are set.
# The sticker reader resolves through the same describer, so the two
# image paths cannot disagree about what wrote a shared cache row.
vision_model = "ollamacloud/minimax-m3"
vision_max_tokens = 1024
vision_reasoning_effort = "low"
vision_max_bytes = 8388608   # 8 MiB → ~10.7 MiB base64 body
vision_timeout_seconds = 20.0

# Google routing for the `route` tool (DEC-46). The WHOLE SECTION IS OPTIONAL
# and every key defaults — a config.toml without it behaves as if routing is
# off. `route` is the one grounding tool that costs money and reaches a third
# party (Google Maps Platform), so it is OFF by default; while off the tool
# answers `unavailable`, never a silent empty.
#
# `api_key_env` names the env var holding the key — the VALUE is never in config
# (DEC-8), exactly like `llm.api_key_env`. Restrict the key at Google to
# Routes + Places + Geocoding, and set a budget alert.
[route]
enabled = false
api_key_env = "GOOGLE_MAPS_API_KEY"

# MCP tool providers (spec: docs/superpowers/specs/2026-08-08-mcp-tool-provider-design.md).
# Off unless enabled=true; the token value goes in .env, never here.
[tools.mcp.pulse]
enabled = false
base_url = "https://orion.tail0a1b2c3d.ts.net/pulse/mcp"
token_env = "PULSE_MCP_TOKEN"
budget = 5

# The presence collector (design/19, DEC-54/55) — a SEPARATE process,
# `python -m nora.presence`, that records circle members' distinct location
# fixes into the same `nora` database (PLAINTEXT). The WHOLE SECTION IS OPTIONAL
# and every key defaults; `enabled` defaults to False, so presence ships INERT —
# a config.toml without a `[presence]` section behaves as if it is off, and while
# off nothing constructs a collector or a Life360 client and `whereis` answers
# `unavailable`.
#
# CREDENTIALS ARE NAMED, NEVER INLINED (DEC-8). `client_credential_env` names the
# env var holding the Basic client credential (the Life360 app's, the study's
# auth); `username_env`/`password_env` name the account login. The collector
# reads the VALUES from the environment.
#
# The poll interval is ADAPTIVE, not fixed. `cadence_moving_seconds` (default 20)
# is the floor used while ANYONE in the circle is driving — so `whereis` stays
# fresh through a commute — and `cadence_still_seconds` (default 300) is the
# ceiling a stationary circle ramps toward, so a parked circle is not polled
# every 20 s all night. `cadence_seconds` (default 90) remains the base for the
# auth-failure back-off, which ALWAYS wins over the moving floor: a Life360 429
# lengthens the sleep regardless of who is driving — ban safety is never traded
# for freshness. Keep the band ~15–300 s, roughly what the Life360 app itself
# does; set moving == still == cadence_seconds for the old fixed interval. The
# collector is a CHANGE-RECORDER (it writes only when a member's position
# advances). `retention_days` is the prune window (operator decision: 720 —
# 180 -> 720 as of 2026-08-19: 378 B/row x ~1,800 fixes/day x 720d ~= 490MB,
# cheap, and it is what keeps Tier-4 forecasting training data from being
# pruned before it is usable). `metrics_port` is the daemon's own /metrics +
# /health endpoint, separate from obs.metrics.port because it is a separate
# process.
#
# This section carries NO ids. Circle membership lives entirely in identity.toml:
# each person gets a `[[persons.<id>.life360]]` block with `member_id = "…"` and
# `circle_id = "…"` (run `nora presence members` to print both). The collector
# derives its circles by grouping those blocks by circle_id, so who-is-in-which-
# circle stays in one gitignored file and never lands in this tracked config. The
# person_ids in a circle are the R-21 disclosure roster (§5). Refuses to start if
# enabled with no life360 block, or a life360 block that has no circle_id.
[presence]
enabled = false
client_credential_env = "LIFE360_CLIENT_CREDENTIAL"
username_env = "LIFE360_USERNAME"
password_env = "LIFE360_PASSWORD"
cadence_seconds = 90
retention_days = 720
metrics_port = 9101
# Reverse-geocode backend — a switchable OPTION, never a replacement. "google"
# (default, proven; needs GOOGLE_MAPS_API_KEY) or "hkgov" (the HK-gov LandsD
# ArcGIS locator). Both sit behind the ReverseGeocoder port and both are optional
# (no credential → no geocoder, fixes store the coordinate/Life360 label). For
# hkgov, set the full .../reverseGeocode service URL and the token env var from
# your LANDSD Map API portal account (the key is issued to government
# departments); tune hkgov_lang_zh/_en to the langCode strings your locator
# honours. Left commented — the default is google.
# geocode_provider = "hkgov"
# hkgov_geocode_url = "https://api.hkmapservice.gov.hk/.../GeocodeServer/reverseGeocode"
# hkgov_token_env = "HKGOV_MAPS_TOKEN"
# hkgov_lang_zh = "zh"
# hkgov_lang_en = "en"

# The presence analytics substrate — the DERIVED layer (docs/superpowers/
# specs/2026-08-18-presence-analytics-substrate-design.md), DEC-115. Ships
# INERT like [presence]/[search]/[compute]/[language]: turning it on is an
# operator decision, never something a missing section decides. Computation
# knobs ONLY — no consumer knobs (spec §1.1).
[analytics]
enabled = false
# tick_seconds = 120
# safety_lag = 600            # unprocessed FIXES, not messages
# settled_seconds = 900       # no new fix -> the stay is closeable
# max_age_seconds = 86400     # fires at lag == 0 on purpose (spec §4.2)
# batch_limit = 400           # steady state; inert in practice (spec §4.3)
# backfill_batch_limit = 20000
# backfill_threshold = 4000
# grace_seconds = 60
# stay_radius_m = 120         # INHERITED, not measured (spec §7.1)
# stay_min_dwell_seconds = 600 # INHERITED, not measured (spec §7.1)
# cluster_eps_m = 100
# cluster_min_samples = 3
# min_nights = 3
# min_weekdays = 3
# label_freshness_days = 45
# anomaly_min_samples = 5     # Tier 3 — fewer prior stays and no anomaly claim (fail-closed)
# anomaly_z_threshold = 3.0   # Tier 3 — |z| above this counts nora_analytics_anomalies_total
# corridor_max_edit_distance = 2   # Tier 5 — corridor identity tolerance
# corridor_min_samples = 3         # Tier 5 — trips needed before a corridor is named
# min_trip_fixes = 3               # Tier 5 — shorter runs between stays are noise, not trips
# tz_name = "Asia/Hong_Kong"
# metrics_port = 9103

# Web search (SearXNG) + page fetch (Firecrawl) for the `search`/`fetch` tools
# (DEC-57, design/22). The WHOLE SECTION IS OPTIONAL and every key defaults — a
# config.toml without it behaves as if search is off.
#
# It ships INERT (`enabled = false`) and must stay so until TWO things are true:
# an operator turns it on, AND Firecrawl's egress is network-isolated so it
# cannot reach Nora's own internals (Honcho, signal-cli, OmniRoute) at the packet
# layer. That isolation is the PRIMARY SSRF control (design/22 §0) — Nora's
# search-result URL fence and is_global precheck are only defence in depth,
# because Firecrawl follows redirects and re-resolves DNS itself. While off, both
# tools answer `unavailable`, never a silent empty.
#
# `firecrawl_api_version` is pinned to the deployed instance's scrape route —
# verified `v1` on the running firecrawl-api container (both v1 and v2 answer
# identically today; v1 matches design/14's measurement). The three caps bound
# the input-token cost of retrieved text, re-sent on every subsequent model call.
[search]
# web_search + web_fetch via Tavily (DEC-73, DEC-116) — one call returns ranked
# results with content, a second opens a specific link; both fetch from Tavily's
# own servers, no SSRF surface. Off here for the "explicitly on" house rule; a
# real deployment sets enabled=true AND exports the key named by api_key_env.
enabled = false
api_key_env = "TAVILY_API_KEY"   # NAMES the env var; the key never lives here (DEC-8)
# url = "https://api.tavily.com/search"
# search_depth = "basic"         # "basic" (1 credit) | "advanced" (2, richer)
# max_results = 5                 # ≤ 20
# content_max_chars = 1500        # per-result snippet clamp (bounds re-sent tokens)
# timeout_seconds = 12.0
# extract_url = "https://api.tavily.com/extract"
# extract_depth = "basic"        # "basic" (1 credit) | "advanced" (2, richer)
# extract_max_chars = 3000        # fetched-page clamp (bounds re-sent tokens)

[preview]
# Sender-generated link previews on Nora's OUTBOUND messages: when a reply
# carries a URL she fetches its OpenGraph tags and attaches a title/description
# (and image) card, the way every Signal client does.
#
# Off here for a sharper reason than the "explicitly on" house rule. This is the
# one capability that makes Nora FETCH a url that came out of a model, from her
# own network — the exposure DEC-73 deleted along with `web_fetch`, on the
# argument that Tavily is never handed a url and searches from ITS servers.
# Turning it on takes a bounded version of that exposure back, so it is a
# decision an operator makes rather than a default they inherit. The bound is in
# `nora/infra/preview.py`: http(s) only, every resolved address must be globally
# routable, redirects followed by hand and re-validated per hop, a byte ceiling
# and a small total timeout. Keyless, so `enabled` is the whole switch.
enabled = false
# timeout_seconds = 3.0     # small: this is on the reply path, human waiting
# max_bytes = 262144        # how much of the document to read (og tags are in <head>)
# image = true              # fetch og:image too — the expensive half
# image_max_bytes = 262144

[weather]
# The `weather` tool (DEC-72) — HK Observatory Open Data, KEYLESS. Off here for
# the "explicitly on" house rule; safe to enable (no key, no cost, no egress).
enabled = false
provider = "hko"           # the WeatherProvider adapter; "hko" is the only one today
# url = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php"
# lang = "tc"              # HKO language: tc | en | sc
# timeout_seconds = 8.0

[heartbeat]
# The background tick that fires due reminders — Nora's first unprompted-speech
# path. Ships INERT, like [presence] and [search]: turning it on is an operator
# decision, never something a missing section decides.
enabled = false
tick_seconds = 60          # how often she WAKES. This is the best case for
                           # lateness, not a bound on it: a tick runs its
                           # turn-groups one after another (each up to
                           # timeout_seconds below), and a group whose
                           # conversation is busy with a tag is deferred to a
                           # later tick outright — watch
                           # nora_heartbeat_deferrals_total. The only promise
                           # is "at or after due_at, never before".
# Deliberately its own knob, NOT [llm].timeout_seconds — even though master
# raised that to 120 on 2026-08-08 (Kimi audit, "so a research turn fits") and
# the two now happen to MATCH. They answer different questions: [llm]'s bounds a
# turn a human is waiting on, and moves when a human's patience does; this one
# bounds a turn nobody is waiting on, where cutting short leaves silence in a
# group that asked nothing. Equal today, independent on purpose — if you ever
# lower [llm] back for responsiveness, this must not follow it down.
timeout_seconds = 120

[reminders]
# The anti-runaway caps. They apply whenever a reminder can be CREATED, which is
# independent of whether [heartbeat] is firing them.
max_pending_per_requester = 20
min_lead_seconds = 120     # MUST be > heartbeat.tick_seconds, so a
                           # minimum-lead row cannot land in the tick already
                           # running. Nora refuses to start if it is not.
max_horizon_days = 365
                           # bounded by max_occurrences_per_series instead, and
                           # a rule whose own period is longer than this (a
                           # yearly birthday) is allowed one period of headroom
                           # — otherwise the horizon would forbid the
                           # recurrence rather than bound it (DEC-85).
max_occurrences_per_series = 60   # a recurring reminder is a chain with ONE
                           # pending row at a time, so it costs 1 against
                           # max_pending_per_requester; this is what bounds the
                           # series itself. Every series is bounded — there is
                           # no «forever».
timezone = "Asia/Hong_Kong"   # the wall clock a recurrence KEEPS. An IANA zone
                           # name, never an offset: «08:00 every day» must stay
                           # 08:00 local across a DST boundary, and +08:00
                           # cannot say that.

[language]
# The Dreamer — a background clock (`dream_loop`) that distils the slang a
# room has made its own out of its own message record, and renders a small
# block of it into every tag's/fire turn's prefill.
#
# Ships INERT, like [presence]/[search]/[compute]: a new subsystem does not
# switch itself on, and a config.toml written before this section existed
# keeps loading with the Dreamer off.
enabled = false
# The loop's WAKE interval — the same "best case for lateness, not a bound"
# shape [heartbeat].tick_seconds documents.
tick_seconds = 300
# First fire condition: `lag > safety_lag` fires once this many unconsolidated
# human messages have piled up, independent of how quiet the room has gone —
# the anti-runaway bound for a room that never falls quiet.
safety_lag = 300
# Second fire condition (paired with lag > 0): the room has gone quiet for
# this long, the natural moment to consolidate a finished conversation.
quiet_seconds = 1800
# Third fire condition, and the only one that does NOT require lag > 0 — it
# fires at lag == 0 ON PURPOSE, because rescoring is what lets a lexeme's
# recognition_score DECAY; without this a dormant room's lexicon would never
# fade and would render `live` forever, describing a slang era that ended.
max_age_seconds = 86400
# The ceiling `RecordStore.since` reads per cycle — bounds both the one model
# call's prompt size and the store's single INSERT statement. A scope whose
# lag exceeds this drains over several ticks rather than one.
batch_limit = 400
# The RENDER cap threaded to `build_prefill`'s room-language block — matches
# that call's own default (Task 10's reviewed value) rather than raising it:
# this block sits in the UNCACHED tier, so every extra entry is paid on every
# turn. Deliberately smaller than the STORE limit (15, not configurable here)
# that `TranscriptInjection` reads with — the store fetches wider than what is
# rendered so the renderer has room to drop a few exampleless entries and
# still fill the block; equal numbers make it silently under-fill. Nora
# refuses to start if this is raised to or past the store limit.
max_rendered_lexemes = 6
# The ONE completion LexemeObserver makes per cycle. Defaults to [llm].model's
# own value — the Dreamer is a background job nobody is waiting on, so reusing
# the deployment's already-working tier is reasonable, but this is a SEPARATE
# knob for an operator who wants a cheaper or differently-tuned model for a
# bulk classification task than for a live conversational turn.
model = "ollamacloud/deepseek-v4-flash"
# Bounds _LanguageModelClient.complete (nora.app.composition) — matches
# [llm].timeout_seconds's own value; every other model call in the codebase
# is explicitly bounded and this was the one quiet exception (a hung call
# here gets skipped tick after tick instead of ever raising, so the backoff
# non-negotiable 4 exists for never engages without this).
timeout_seconds = 120.0

[version]
# The startup upgrade note (DEC-97). On the boot after a deploy, if the version
# baked into this image has not been announced in a room yet, Nora relays the
# release note there ONCE — in her own words, through the same fire path a
# reminder uses. Never twice: the claim is a row in `version_announcements`,
# taken before the turn, so a restart (or a crash-loop) stays quiet (R-42).
#
# ON by default, unlike [heartbeat]/[presence]/[search], because it is already
# gated by something stronger: an image with no baked stamp announces nothing at
# all. Only a build made with `scripts/build-image.sh V3` — which stamps
# nora/version.json from git and makes the Dockerfile refuse a mismatch — can
# ever speak here. Set it false if you would rather tell the group yourself.
#
# WHERE she announces is not configured here: it is every conversation
# policy.toml already allows her into. Which rooms she may speak in is a trust
# question, and trust lives in policy.toml (DEC-8).
announce = true

[doctrine]
dir = "nora/doctrine"
reload = "mtime"                      # mtime | startup
strict = true
language_hint = "yue-Hant-HK"         # BCP 47 (RFC 5646): Cantonese, Traditional Han, Hong Kong
canary = "CHANGE-ME-PER-DEPLOYMENT"   # fixed string; R-6 leak sentinel
display_name = "Nora"

[obs.logging]
level = "INFO"
path = "~/workspace/nora/data/nora.log"
format = "json"

[obs.metrics]
port = 9100                           # also serves /health

[obs.tracing]
enabled = true
exporter = "file"                     # console | otlp_http | file
endpoint = ""
headers_env = ""                      # env var NAME holding OTLP auth headers, never the
                                       # value (DEC-8); only read when exporter = "otlp_http"

[evals]
# judge_model grades the adversarial live run; MUST differ from llm.model
# (a model grading itself self-scores). Kept at deepseek-v4-pro: a measured run
# had cheaper flash miss fabrications pro caught, so pro is the conservative
# default (DEC-75). The judge runs once per graded case, pre-deploy only.
judge_model = "deepseek-v4-pro"
# judge_samples: the judge grades each reply k times; the gate binds the majority
# safety verdict (A2, kills single-sample noise). 1 = single sample; 3 = stable.
judge_samples = 1
# journey_samples: --suite journeys runs each journey k times, majority-gated (F8a).
# Routing is stochastic — n=1 flakes a good model and passes a lucky broken one.
journey_samples = 3

[evals.langfuse]
enabled = false                       # opt-in: also requires `--export-langfuse` on the CLI
host = "http://127.0.0.1:3100"
headers_env = ""                      # same shape/var as obs.tracing.headers_env — see
                                       # nora.config.LangfuseEvalConfig's docstring for why
                                       # this reuses that credential rather than adding a
                                       # second one

# The per-modality describers (2026-08-17). `vision_model` above stays the
# IMAGE model's alias, so a config written before this split keeps working.
#
# Audio and video ship INERT — wired, but off, with no model named. That is not
# timidity: the OmniRoute catalogue advertises `vision` on 215 of its 406 models
# and carries NO `audio` or `video` key at all, so it cannot tell us whether any
# reachable route can hear or watch. Enabling either is a flag and a model name,
# with no code change; until a probe answers that question, a voice note is
# answered `unavailable` («I couldn't check»), never `nothing_found`.
[media.describe.image]
enabled = true
model = "ollamacloud/minimax-m3"

[media.describe.audio]
enabled = false
model = ""

[media.describe.video]
enabled = false
model = ""
