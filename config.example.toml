identity_file = "identity.toml"
policy_file = "policy.toml"   # WHO may talk to her, and where. See policy.example.toml.

[platforms.signal]
base_url = "http://127.0.0.1:18080"
account = ""                     # empty = derive from the signal-cli daemon (D5)
nora_sender_id = "nora"          # how Nora's own rows are tagged in the audit
enabled = true                   # NOT YET HONOURED — SignalAdapter starts regardless;
                                  # wiring lands with the Phase 4 adapter registry

[memory]
base_url = "http://127.0.0.1:8000"
workspace_id = "nora"

[llm]
base_url = "http://localhost:20128/v1"
api_key_env = "OMNIROUTE_API_KEY"     # env var NAME, never the value

# PINNED to one upstream, not the `nora` combo. The combo fans out per request
# and only ONE of its three upstreams accepts a forced tool_choice while
# thinking is enabled — measured 4/4 each, not sampled:
#
#   deepseek/deepseek-v4-flash       400 "Thinking mode does not support this
#   opencode-go/deepseek-v4-flash    400  tool_choice" (deepseek-ai/DeepSeek-V3#1376)
#   opencode-zen/deepseek-v4-flash   200, and picks the right tool 4/4
#
# So on the combo she was on a coin flip: routed to zen she chained correctly,
# routed to either other she 400'd mid-turn and went silent — showing the group
# ⚠️, which reads as "gave up" rather than "the provider refused the request".
#
# This gives up the alias's benefit of keeping the upstream name out of her
# process (R-18 still blocks model names from replies, so she cannot say it).
# Determinism is worth more than the indirection.
#
# WATCH THIS: zen is the only one of the three that reports no reasoning_tokens
# in usage, which suggests a different — possibly older — build than the other
# two. If that is why it accepts the forced tool_choice, their next update
# could start 400ing with nothing changing here. The version-independent
# fallback is reasoning_effort = "none", which works on all three.
model = "opencode-zen/deepseek-v4-flash"
max_tokens = 4000
temperature = 0.7
# "none" | "low" | "medium" | "high". A tag is one short reply from context she
# already holds — nothing to reason through. Measured on deepseek-v4-flash:
# "none" 4.7s, "low" 9.5s, unset 16.1s, all producing the tool call.
reasoning_effort = "low"
timeout_seconds = 30

[llm.limits]
turns = 8
total_tokens = 24000

[engagement]
policy = "trigger_text"

[engagement.trigger]
text = "nora.000"
min_interval_seconds = 5

[store]
db_path = "~/workspace/nora/data/messages.db"
max_per_conversation = 500
context_window = 40

[persona]
dir = "nora/persona"
reload = "mtime"                      # mtime | startup
strict = true
chinese_script = "traditional"        # traditional | simplified
canary = "CHANGE-ME-PER-DEPLOYMENT"   # fixed string; R-6 leak sentinel
display_name = "Nora"

[obs.logging]
level = "INFO"
path = "~/workspace/nora/data/nora.log"
format = "json"

[obs.metrics]
port = 9100                           # also serves /health

[obs.tracing]
enabled = true
exporter = "file"                     # console | otlp_http | file
endpoint = ""
headers_env = ""                      # env var NAME holding OTLP auth headers, never the
                                       # value (DEC-8); only read when exporter = "otlp_http"

[evals.langfuse]
enabled = false                       # opt-in: also requires `--export-langfuse` on the CLI
host = "http://127.0.0.1:3100"
headers_env = ""                      # same shape/var as obs.tracing.headers_env — see
                                       # nora.config.LangfuseEvalConfig's docstring for why
                                       # this reuses that credential rather than adding a
                                       # second one
