identity_file = "identity.toml"
policy_file = "policy.toml"   # WHO may talk to her, and where. See policy.example.toml.

[agent]
# The agent's MACHINE name — its Strands agent_id and Langfuse trace span
# (`invoke_agent <name>`). Lowercase and stable; a rename starts a new trace
# lineage. The human-facing name is [doctrine].display_name and the wake word is
# [engagement].trigger.text. Optional (defaults to "nora"); to stamp out a second
# agent ("delia") set all three here plus its own doctrine files, ai_peer, and
# workspace_id.
name = "nora"

[platforms.signal]
base_url = "http://127.0.0.1:18080"
account = ""                     # empty = derive from the signal-cli daemon (D5)
enabled = true                   # honoured by the adapter registry; false with no other
                                  # platform enabled refuses to start rather than run deaf

[platforms.discord]
enabled = false                  # off by default — see design/discord-integration/
token_env = "DISCORD_BOT_TOKEN"  # env var holding the bot token; never the value itself

[memory]
base_url = "http://127.0.0.1:8000"
workspace_id = "nora"
# `<self_card>` — how many of HER OWN conclusions ride in the per-tag prefill,
# so a promise she made last night survives falling out of the transcript
# window. 0 turns the block off. From `representation`, never from the peer
# CARD: read live 2026-08-11 her card asserts «Kind: AI chatbot/assistant» and
# «Owner: 主人 with admin authority» — both distilled from her own output, both
# contradicting identity.md, and both would WIN against the doctrine because a
# concrete observation outranks a prescription in practice.
#
# 8, not 25. This block is per-tag, so it is re-sent on every model call of the
# loop rather than living in the cached static head: 25 conclusions measured
# 2,459 chars (~820 tokens), which at `turns = 20` is ~16k of the 128k budget.
# Eight measured ~1,080 chars.
self_card_conclusions = 8
# `<peer_history>` — how many of her conclusions ABOUT THE TAGGER ride in the
# per-tag prefill. 0 disables the block. NOT a duplicate of `<peer_card>`: read
# live 2026-08-15 the two shared ZERO items — the card renders IDENTITY claims,
# the representation states dated episodes. Who they are, and what happened.
#
# Same per-tag arithmetic as `self_card_conclusions`: 8 (~360 tokens) is ~7.2k
# of the 128k budget at `turns = 20`. Raising BOTH to 16 spends ~29k before
# anybody has said anything — measure a real turn's total_tokens first.
tagger_card_conclusions = 8

[llm]
base_url = "http://localhost:20128/v1"
api_key_env = "OMNIROUTE_API_KEY"     # env var NAME, never the value

# PINNED to one upstream, not the `nora` combo — the combo fans out per request
# and the upstreams disagree about forced `tool_choice`, so on it she was on a
# coin flip. See ADR 0006 for the full measurement behind BOTH values here.
#
# SUPERSEDED (kept: the wrong turn stays visible so it is not retaken). Until
# 2026-08-10 this line read `opencode-zen/deepseek-v4-flash`, on this argument:
# only ONE of the combo's three upstreams accepted a forced tool_choice while
# thinking was enabled — measured 4/4 each, not sampled:
#
#   deepseek/deepseek-v4-flash       400 "Thinking mode does not support this
#   opencode-go/deepseek-v4-flash    400  tool_choice" (deepseek-ai/DeepSeek-V3#1376)
#   opencode-zen/deepseek-v4-flash   200, and picks the right tool 4/4
#
# Routed to zen she chained correctly, routed to either other she 400'd mid-turn
# and went silent — showing the group ⚠️, which reads as "gave up" rather than
# "the provider refused the request". The note ALSO said to watch zen, because
# it was the only one of the three reporting no reasoning_tokens in usage, which
# suggested a different — possibly older — build.
#
# opencode-zen → ollamacloud (DEC-84, 2026-08-10). Two reasons, in order:
#   1. ECONOMICS. ollama-cloud is subscription-based; opencode-zen is credit-based
#      and was returning 403/429 «All credentials for model deepseek-v4-flash are
#      cooling down» throughout a probing session. A route that rate-limits under
#      load is not a route for the only path the group can reach her by.
#   2. tool_choice. The 400 «Thinking mode does not support this tool_choice»
#      that forced the zen pin does NOT occur here: 0 errors in 32 forced calls
#      across all three deepseek tags.
#
# `deepseek-v4-flash` and NEVER `-pro` (operator). Measured, `pro` is not better
# at the one thing that matters here — it obeyed a forced tool_choice 2/3 where
# flash-at-none obeyed 8/8 — so the larger model buys nothing and costs more.
#
# Pinning gives up the alias's benefit of keeping the upstream name out of her
# process (R-18 still blocks model names from replies, so she cannot say it).
# Determinism is worth more than the indirection.
# Tagged :0731 (2026-08-30) — OmniRoute catalog re-sync after restart dropped
# the bare id; upstream only exposes the tagged variant now. See catalog-400.
model = "ollamacloud/deepseek-v4-flash:0731"
# The provider's per-CALL ceiling — NOT the turn's budget (see [llm.limits]
# below, which is where the loop's budget lives). Was 4000, an unmeasured
# number that doubled as the loop budget; measured 2026-08-06, the largest
# legitimate completion — reasoning block plus the tool call — was 371 tokens,
# so 2000 is 5.4x headroom.
max_tokens = 2000
# SAMPLING — and this one key is the whole of it: `temperature` is the ONLY
# sampling parameter this deployment sets. The `top_p` note below it is the
# other half of the picture and is deliberately not a key.
#
# 0.7 is INHERITED, not measured — it has been this value since the first
# config and no probe has ever moved it. Nothing here argues for it.
temperature = 0.7
# `top_p` is UNSET, and deliberately has no key in this file, so the value in
# force is whatever the provider defaults to. `nora/agent/factory.py`'s
# `create_model_provider` builds `params` from exactly four entries —
# `max_tokens`, `temperature`, `tool_choice`, `reasoning_effort` — so no
# nucleus truncation is applied by us at any point in the loop.
#
# This is recorded because the absence was INVISIBLE: reading this file gave no
# hint that a sampling parameter was in play at all, and an audit reasoning
# about her sampling from the repo got the wrong picture (F8, the 2026-08-20
# prompt-architecture audit).
#
# DO NOT add a `top_p` key to make the knob "explicit" without measuring first.
# `top_p = 1.0` is a no-op that buys nothing but the illusion of control, and
# any value below it truncates the distribution on a guess — for work that is
# «pick one tool and call it correctly», the failure mode that matters is her
# ending a turn without calling `send_reply`, which is exactly what the
# `reasoning_effort` series below shows sampling changes can move. Measure it
# the way that series was measured — auto tool-choice rate and no_send_call
# journeys, n≥5 — and only then decide whether a knob should exist.

# REASONING EFFORT: "none" | "low" | "medium" | "high". NOT "auto" — the
# provider 400s on it.
#
# SUPERSEDED, kept because the reasoning is still half-right and the value it
# argued for is the documented fallback: this line read `low` on the argument
# that «a tag is one short reply from context she already holds — nothing to
# reason through», with latency measured on deepseek-v4-flash at "none" 4.7s,
# "low" 9.5s, unset 16.1s, all producing the tool call.
#
# Measured 2026-08-10 on ollamacloud/deepseek-v4-flash. Two independent probes,
# same monotonic shape — and this measurement is NOT retracted by the value
# below it:
#
#   effort   out tok p50   p50 s   auto tool-choice   no_send_call (journeys)
#   none              49     1.2         5/5                    5
#   low               70     1.1         3/5                    4
#   medium            81     1.2         2/5                    —
#   high             104     2.9         1/5                   15
#
# ROUTING is a wash — journeys total-samples high 21/24, none 20/24, low 19/24,
# i.e. one sample apart at n=3. What is not a wash is the last column: `high`
# ends the turn without calling `send_reply` three times as often, and that is
# her going mute in the group.
#
# `none` → `low` (operator, 2026-08-11). Measured against the real shipped
# doctrine, same scene 「阿豪又遲到，仲賴塞車」, one call each: `low` was FASTER
# and better, producing the escalating three-beat burst DEC-95 asks for where
# `none` produced neither. The work is no longer «pick one tool and call it
# correctly» — since DEC-95 it is «read the room, choose how hard, and compose
# several messages», which is deliberation, and the model needs a little of it.
#
# `low` → `high` (operator, 2026-08-17), against the 2026-08-10 table above.
# The failure mode to watch is the one that table names: at `high`, 1/5 auto
# tool-choice and 15 no_send_call journeys — her ending a turn without calling
# `send_reply` at all. Revert to `low` if silent turns show up in the traces.
#
# `high` → `low` (operator, 2026-08-21).
reasoning_effort = "low"
# 30 → 60 (2026-08-07): a REAL photo through MiMo measures 12.9 s in-container,
# and the vision per-call budget derives from THIS value — at 30 it computed 9 s,
# so every real image timed out while the tiny probe PNG passed.
# 60 → 120 (2026-08-08, Kimi audit): this is the WHOLE-TURN wall-clock
# (`asyncio.wait_for` in the invoke stage). It was sized when the web pair could
# spend 4×15 s fetching pages (web_fetch, now retired, DEC-73); Tavily's one-call
# web_search is ~12 s, so a research turn is far cheaper now. 120 is kept as
# comfortable headroom for a multi-tool turn (web_search + weather + model
# round-trips); a normal turn is still ~10 s, so this only bounds the rare slow
# turn (the operator: a longer wait is fine). Vision derives min(configured 20, 120×0.5).
# SUPERSEDED 2026-08-30 by the 120 → 240 note below (vision now derives
# min(configured 40, 240 × 0.6 / 4) = 36 s).
# 120 → 240 (2026-08-30, operator): real 13.4 MB videos through the kimi direct
# lane time out at the derived per-call vision budget 18 s (120 × 0.6 SHARE / 4
# media_fetch budget). A video upload+inference cannot fit. Raising the loop to
# 240 recomputes per_call = 240 × 0.6 / 4 = 36 s, still under `vision_timeout_seconds`
# 40 raised alongside. Invariant budget × derived < loop still holds: 4 × 36 < 240.
timeout_seconds = 240

# The three caps around the WHOLE agent loop for one tag — all measured
# 2026-08-06, all three previously wrong in the same direction.
#
# Real per-call INPUT is 4,952 tokens (doctrine + transcript + tool schemas),
# paid again on every call in the loop, plus whatever the tool results from
# earlier calls added to the context. A measured 6-call turn totalled
# 32,426-36,748 tokens.
#
# At the old total_tokens = 24000 that ceiling was crossed during model call
# FIVE, so `turns = 8` was unreachable dead config: the token cap always bound
# first and the turn count never did. Worse, until R-23 the cut was reported
# byte-identically to the model simply choosing not to answer.
#
# 64000 gives ~2x headroom over the worst measured 6-call turn and lets
# `turns` be the cap that actually binds — which is the one an operator can
# reason about, because a turn is a round trip and a token is not.
# Per-tool call-count overrides — the per-deployment DELTA over the table in
# `nora/agent/tools.py`, which states every default with its reasoning beside
# the tool it belongs to (DEC-10). Empty here means "the table, unchanged".
#
# This exists because budgets drift upward as tools are added, and moving a
# number should not need a code change and a rebuild. It is applied OVER the
# table by `ToolRegistry.budgets()`, which stays the single place anything
# resolves a budget from — R-7's ceiling, the Deliverer's message cap and the
# tests all still read one value. Putting ONE tool's budget here instead would
# have split the table fifteen-to-one, which is the drift DEC-10/DEC-32 exist
# to prevent.
#
# An unknown tool name or a value below 1 is a STARTUP FAILURE, not a warning:
# a silently-ignored line is an operator certain they raised a cap that never
# moved.
#
# [llm.budgets]
# send_reply = 6

[llm.limits]
turns = 20
# Raised 128000 -> 256000 to match the deployment (config.toml). These two
# files MUST agree on the budget — `tests/test_turn_budget.py::
# test_both_config_files_declare_the_same_budget` exists because "a budget fix
# applied to one and not the other" is a state master has been in before. It is
# not site-specific: it is the current known-good ceiling, and a template
# disagreeing with it misleads every future investigation.
total_tokens = 256000
# The loop's OUTPUT budget across every call of the turn, deliberately not
# `llm.max_tokens` (which is one call's ceiling). It was literally that number
# until 2026-08-06, so the whole loop could emit what one call could — and
# single calls were measured emitting 3,993 / 3,987 / 3,974 completion tokens,
# i.e. 99.8% of it. 12000 is 6x the per-call ceiling.
output_tokens = 12000

[engagement]
policy = "trigger_text"

[engagement.reactions]
# 👀 while she works, then ✅ (replied) or ⚠️ (failed).
# Off = she writes nothing to the group but replies.
enabled = true

[engagement.queue]
# Per-conversation FIFO depth beyond which an arriving tag is shed as a flood
# (R-30). Bounds runaway growth, not waiting — a queued tag keeps its place
# however long the turn ahead of it takes, and there is no staleness rule.
max_depth = 16

[engagement.trigger]
# Set false to disable the trigger PHRASE only — a real @mention or a reply to
# one of her own messages still engage her either way (MentionPolicy/
# ReplyToNoraPolicy, unaffected by this flag).
enabled = true
# Superseded 2026-08-26 by the operator (live: "nora" — any message containing
# the word engages her; a @mention or reply does regardless).
text = "nora"
min_interval_seconds = 5

[store]
# The record store is PostgreSQL (design/20). The URL is injected by the host
# through the env var named here (DEC-8: name the var, never inline the value).
# `docker compose` sets DATABASE_URL from `.env` to
# `postgresql+asyncpg://nora:…@nora-db/nora`.
database_url_env = "DATABASE_URL"
# On-disk root for media byte custody. A Postgres URL has no directory, so the
# media root is its own key; blobs live at `data_dir/media`.
data_dir = "~/workspace/nora/data"
max_per_conversation = 500
context_window = 40
# Whether the retention sweep runs at all. Defaults TRUE (this file's convention:
# a config.toml written before a key existed keeps its behaviour), so leaving it
# out prunes to `max_per_conversation` above every 300s.
#
# Set it false to keep the conversation record IN FULL. That is a real decision,
# not a tuning knob: at 500 rows a busy group reaches the cap in days and then
# evicts its oldest message every time a new one lands, silently — the record
# still looks healthy, it is just a rolling window rather than a history. Turn it
# off if anything downstream reads the past (an aggregator over the record, an
# audit, an export), and watch disk instead.
#
# Do NOT fake it by widening `max_per_conversation`: `prune_all` runs a
# `row_number()` window over the whole `messages` table on every tick, so a huge
# number keeps paying for that scan in order to delete nothing.
#
# The live deployment sets this FALSE, and the measurement behind that is the
# reason to read the paragraph above rather than skim it. Measured 2026-08-15:
# the busy group was sitting at exactly 500 rows — at the cap, evicting its
# oldest message every time a new one arrived, on a sweep that runs every 300s
# — with its earliest surviving message only eight days old and ids below 121
# already gone. History is the input to everything downstream (the transcript
# window's own past, any consolidator built on the record), and a rolling 500
# is not history.
#
# It stays COMMENTED OUT here on purpose, and that is load-bearing rather than
# an oversight: `tests/test_main.py::test_the_retention_sweep_is_spawned_when_
# the_flag_is_on` loads this very file to pin the CODE default (absent means
# enabled), so writing the key here would silently delete that assertion.
# `tests/test_env_template.py` names it as the one key allowed to be absent.
# prune_enabled = false

# Attachment byte custody (DEC-43), encrypted at rest (DEC-47). The WHOLE
# SECTION IS OPTIONAL — every key below is its own default — so a config.toml
# without it behaves identically.
#
# There is no media path key on purpose: media lives under `store.data_dir`, in
# `media/<first2>/<rest>`, keyed by the sha256 of the content. The row and the
# blob it names are one record; a media-specific root would let them be backed
# up and deleted separately, and the first time that happened the transcript
# would point at blobs nobody kept.
#
# ENCRYPTION AT REST (DEC-47). The bytes on disk are AES-256-GCM ciphertext, not
# the picture. For IMAGES, EXIF/embedded metadata (GPS, device id) is stripped
# BEFORE the content is hashed — so the same photo with different GPS dedups to
# one blob, and the location PII is gone from what Nora holds. NON-IMAGES
# (audio, video, documents) have NO metadata stripped — there is no cheap
# universal stripper — so their embedded metadata survives inside the encrypted
# blob. Custody turns ON only when `enabled` is true AND `encryption_key_env`
# names an env var holding a valid key; a missing/malformed key degrades to
# custody OFF (never plaintext-by-accident, never a crash).
#
# RETENTION IS NOT DECIDED, and `store.prune_enabled = false` sharpens it: with
# the message sweep off, NOTHING in the system deletes anything, and blobs are
# far larger than rows. Even with it on, `store.max_per_conversation` prunes
# MESSAGES only — no sweep deletes blobs, so today this grows without bound in
# either configuration. The blob outliving the row that named it is the shape to
# watch for: a message pruned or an export taken leaves bytes on disk that
# nothing references and nothing will ever collect. That is DEC-43's
# open question and it is the operator's to answer — this is the most PII-heavy
# data in the system. `enabled = false` is the honest off switch in the
# meantime: attachments are then recorded exactly as before (a placeholder, no
# handle) and every one is counted under
# nora_media_custody_total{status="not_configured"}.
[media]
enabled = true
# Names the env var holding the base64 of a 32-byte AES-256 key (DEC-8: name the
# var, never inline the secret). Host-injected, like OMNIROUTE_API_KEY. Generate:
#   python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
# Empty (or the var unset) = custody OFF.
encryption_key_env = "NORA_MEDIA_KEY"
max_bytes = 104857600     # 100 MiB — Signal's own attachment ceiling
timeout_seconds = 8.0     # ingest path: a wedged daemon costs seconds, never the message
# Reading a stored image back through MiMo-V2.5 (the `media_fetch` tool, DEC-56).
# All defaulted; these are the READ half's knobs. vision_max_bytes is the ceiling
# on bytes sent to MiMo — far below max_bytes on purpose (a 100 MiB blob is a
# ~133 MiB base64 body). vision_timeout_seconds is a CEILING: the tool derives the
# real per-call budget as the smaller of it and half of llm.timeout_seconds, so a
# slow model becomes the tool's `unavailable`, never the loop's silent timeout.
# DEPRECATED NAME, kept so a config written before DEC-114 keeps
# loading: this is the IMAGE describer's model, and
# `[media.describe.image] model` overrides it when both are set.
# The sticker reader resolves through the same describer, so the two
# image paths cannot disagree about what wrote a shared cache row.
# ollamacloud/minimax-m3 → ollamacloud/glm-5.3-flash (2026-08-30, benchmark:
# GLM 5.3 Flash 2-4s vs M3-style 5-26s per image, accuracy parity except
# hyphens/punctuation in dense OCR — verified through OmniRoute).
vision_model = "ollamacloud/glm-5.3-flash"
vision_max_tokens = 1024
vision_reasoning_effort = "low"
vision_max_bytes = 8388608   # 8 MiB → ~10.7 MiB base64 body
# 20 → 40 (2026-08-30, operator): the per-call vision budget derives as
# min(vision_timeout_seconds, loop × 0.6 SHARE / media_fetch budget). With the
# loop raised 120 → 240 the derived value is 240 × 0.6 / 4 = 36 s; leaving this
# at 20 would cap the budget at 20 s and real 13.4 MB videos would keep timing
# out. 40 keeps the configured ceiling above the derived budget so the derived
# number is the true cap.
vision_timeout_seconds = 40.0
# Reading a sticker automatically at INGEST (sticker spec §6) — separate from
# media_fetch above because the two calls have different budgets and risk.
#
# ON since 2026-08-16, operator's call. The spec §7 probe (2026-08-15, live
# gateway) cleared the animated-WebP risk this flag was originally gated on;
# what remained was a latency trade-off. The cost being accepted, measured
# rather than estimated: a NEW sticker blocks the ingest path 3.9-12.2s while
# the vision call runs, and when it rides on the tagging message that lands on
# Nora's reply latency. A repeat is free — 41% of sightings already, rising as
# the group's sticker set saturates. Watch nora_sticker_describe_seconds and the
# level= label on nora_sticker_descriptions_total; if the p99 hurts, this line
# is the off switch and nothing else has to change.
sticker_descriptions = true

# WHERE the (always-encrypted) bytes above land (DEC-136). OFF by default: a
# config.toml written before this existed keeps writing to
# store.data_dir / "media" exactly as before. On, an S3-compatible object
# store takes over — bucket/endpoint here, credentials named by env var
# (DEC-8), same reuse pattern encryption_key_env above already sets. A
# misconfigured or unreachable RustFS falls back to the filesystem rather
# than crashing the daemon or turning custody off entirely.
[media.rustfs]
enabled = false
endpoint = ""              # e.g. "http://rustfs:9000"
bucket = "nora-media"
access_key_env = "RUSTFS_ROOT_USER"      # same var `drop`'s RustFS client uses
secret_key_env = "RUSTFS_ROOT_PASSWORD"

# Image generation (design/proposed/29, DEC-137): provider-agnostic
# `ImageGenerator` port; the first adapter is xAI, on Nora's OWN X Premium
# subscription OAuth lane — quota-bounded, not metered per-call billing.
# Ships INERT, exactly like [presence]/[search]/[compute]/[music] before it:
# a new subsystem does not switch itself on. `enabled = false` leaves the
# `generate_image` tool present but answering `unavailable` (R-5) — the
# wiring-gap state, never `nothing_found`.
#
# To turn it on: set `enabled = true` AND run `nora xai-login` (device flow;
# it appends `XAI_OAUTH_REFRESH_TOKEN` to the host `.env`), then recreate
# the container. The access token is NOT stored in `.env` — it lives in the
# container-writable `./state/xai-oauth.json` and refreshes automatically
# from the `.env` refresh token (single source of truth, DEC-8 pattern).
[image_gen]
enabled = false
provider = "xai"

# Reference images (editing a photo already in this conversation) are a
# PRIVACY gate: references upload to a third-party cloud, so they default
# off. `media_fetch` (describe-only) is unaffected. When enabled, the model
# can only reference a photo NORA ALREADY HOLDS (a marker code from THIS
# conversation's own media window) — never an arbitrary external URL.
allow_reference_images = false

[image_gen.xai]
# xAI adapter knobs. `model`/`quality_model` mirror the names Hermes'
# image_gen/xai plugin uses; `refresh_token_env` is resolved by NAME from
# the container env (DEC-8: one name for one secret — the CLI writes it).
model = "grok-imagine-image"
quality_model = "grok-imagine-image-quality"
refresh_token_env = "XAI_OAUTH_REFRESH_TOKEN"
timeout_seconds = 90.0

# Nora's own link shortener / drop delivery (deploy/drop/, this repo's own
# compose service — docs/superpowers/specs/2026-08-12-nora-drop-design.md §5).
# The WHOLE SECTION IS OPTIONAL and every key defaults; off (or an unset token)
# leaves long URLs in replies, never a failure. Self-hosted on purpose — a
# third-party shortener would see every destination the group routes to — and
# never load-bearing: a mint that fails leaves the long URL exactly as it was.
#
# `base_url` points at `drop`'s INTERNAL listener, NOT the public hostname.
# `drop` deliberately splits an internal listener (`drop:8081`, no `ports:`
# entry, no Tunnel rule — spec §5a) carrying `POST /api/links` from a PUBLIC
# listener carrying only the read-only `GET /i/<slug>` redirect, so the public
# host has no `/api/links` route at all and minting against it 404s. Nora's own
# container sits on the same Docker network and reaches `drop:8081` by
# container DNS. The public `short_url` a mint returns is unaffected — `drop`
# builds it server-side from its own DROP_PUBLIC_BASE_URL and hands it back.
#
# `token_env` NAMES the env var holding the mint bearer (DEC-8); the value is
# `drop`'s own secret.
[shortener]
enabled = false
base_url = "http://drop:8081"
token_env = "NORA_DROP_TOKEN"

# Google routing for the `route` tool (DEC-46). The WHOLE SECTION IS OPTIONAL
# and every key defaults — a config.toml without it behaves as if routing is
# off. `route` is the one grounding tool that costs money and reaches a third
# party (Google Maps Platform), so it is OFF by default; while off the tool
# answers `unavailable`, never a silent empty.
#
# `api_key_env` names the env var holding the key — the VALUE is never in config
# (DEC-8), exactly like `llm.api_key_env`. Restrict the key at Google to
# Routes + Places + Geocoding, and set a budget alert.
[route]
enabled = false
api_key_env = "GOOGLE_MAPS_API_KEY"

# MCP tool providers (spec: docs/superpowers/specs/2026-08-08-mcp-tool-provider-design.md).
# Off unless enabled=true; the token value goes in .env, never here.
[tools.mcp.pulse]
enabled = false
base_url = "https://orion.tail0a1b2c3d.ts.net/pulse/mcp"
token_env = "PULSE_MCP_TOKEN"
budget = 5

# `make_artifact` — she builds a FILE (a report, a chart, a map) in a sandboxed
# container and hands back a link, instead of typing the answer into chat.
#
# Ships INERT, like [presence] and [search] before it, and this one has more
# reason than either: turning it on gives her process the host Docker socket
# (docker-compose.yml mounts it, with the argument for that beside the mount)
# and lets an LLM-authored program run on this box. That is an operator
# decision every time, never something a missing section decides.
#
# Turning `enabled` on ALSO requires four host-injected values, and Nora
# REFUSES TO START without any of them rather than accepting every job and
# failing it minutes later in front of the group:
#   NORA_DATA_HOST_ROOT   the host-side path of the /app/data mount. It exists
#                         because a sandbox's workspace is bind-mounted by the
#                         HOST Docker daemon, which resolves the source on the
#                         host filesystem — an in-container path silently
#                         resolves to an empty directory and the job produces
#                         nothing. docker-compose.yml sets it from the same
#                         expression as the mount itself, so the two agree.
#   NORA_DROP_TOKEN       [shortener].token_env — the credential each job's own
#                         scoped, short-lived Drop token is minted against.
#   GOOGLE_MAPS_API_KEY   [route].api_key_env — the SAME key the `route` tool
#                         uses, shared with the map-rendering skill.
#   OMNIROUTE_API_KEY     [llm].api_key_env — the model the sandbox itself runs
#                         on (the same OmniRoute triple Nora uses).
[compute]
enabled = false
# sandbox_image = "smith:latest"
# job_timeout_seconds = 300   # wall-clock guardrail; the container is killed
# max_concurrent_jobs = 2     # containers in flight at once
# poll_tick_seconds = 10      # how often the poller WAKES to check for a
#                             # finished job — the same "best case for
#                             # lateness, not an upper bound" shape that the
#                             # heartbeat section's own tick_seconds has.
# mem_limit = "8g"            # docker-py's own containers.run mem_limit shape
# nano_cpus = 2000000000      # billionths of a CPU core (2 vCPUs)
# data_host_root_env = "NORA_DATA_HOST_ROOT"

# The presence collector (design/19, DEC-54/55) — a SEPARATE process,
# `python -m nora.presence`, that records circle members' distinct location
# fixes into the same `nora` database (PLAINTEXT). The WHOLE SECTION IS OPTIONAL
# and every key defaults; `enabled` defaults to False, so presence ships INERT —
# a config.toml without a `[presence]` section behaves as if it is off, and while
# off nothing constructs a collector or a Life360 client and `whereis` answers
# `unavailable`.
#
# CREDENTIALS ARE NAMED, NEVER INLINED (DEC-8). `client_credential_env` names the
# env var holding the Basic client credential (the Life360 app's, the study's
# auth); `username_env`/`password_env` name the account login. The collector
# reads the VALUES from the environment.
#
# The poll interval is ADAPTIVE, not fixed. `cadence_moving_seconds` (default 20)
# is the floor used while ANYONE in the circle is driving — so `whereis` stays
# fresh through a commute — and `cadence_still_seconds` (default 300) is the
# ceiling a stationary circle ramps toward, so a parked circle is not polled
# every 20 s all night. `cadence_seconds` (default 90) remains the base for the
# auth-failure back-off, which ALWAYS wins over the moving floor: a Life360 429
# lengthens the sleep regardless of who is driving — ban safety is never traded
# for freshness. Keep the band ~15–300 s, roughly what the Life360 app itself
# does; set moving == still == cadence_seconds for the old fixed interval. The
# collector is a CHANGE-RECORDER (it writes only when a member's position
# advances). `retention_days` is the prune window (operator decision: 720 —
# 180 -> 720 as of 2026-08-19: 378 B/row x ~1,800 fixes/day x 720d ~= 490MB,
# cheap, and it is what keeps Tier-4 forecasting training data from being
# pruned before it is usable). `metrics_port` is the daemon's own /metrics +
# /health endpoint, separate from obs.metrics.port because it is a separate
# process.
#
# This section carries NO ids. Circle membership lives entirely in identity.toml:
# each person gets a `[[persons.<id>.life360]]` block with `member_id = "…"` and
# `circle_id = "…"` (run `nora presence members` to print both). The collector
# derives its circles by grouping those blocks by circle_id, so who-is-in-which-
# circle stays in one gitignored file and never lands in this tracked config. The
# person_ids in a circle are the R-21 disclosure roster (§5). Refuses to start if
# enabled with no life360 block, or a life360 block that has no circle_id.
[presence]
enabled = false
client_credential_env = "LIFE360_CLIENT_CREDENTIAL"
username_env = "LIFE360_USERNAME"
password_env = "LIFE360_PASSWORD"
cadence_seconds = 90
# Adaptive cadence (design/19 §4.1): floor while a circle has a driver, ceiling
# once it's been still long enough to hit the ramp. `cadence_seconds` above
# stays the base for the SEPARATE ban-safe backoff (cadence_seconds *
# 2^auth_failures), not the steady-state poll interval anymore.
cadence_moving_seconds = 5
cadence_still_seconds = 60
retention_days = 720
metrics_port = 9101
# On-demand LIVE refresh (DEC-67): where_is pings the phone for a fresh position
# before answering, so it reports where they ARE, not where they were last seen.
# `refresh_url` is the collector's HTTP endpoint AS NORA REACHES IT (the presence
# service by name in compose, e.g. "http://presence:9101"); empty leaves where_is
# read-only, answering from the last stored fix.
refresh_url = ""
refresh_timeout_seconds = 8
# Reverse-geocode backend — a switchable OPTION, never a replacement. "google"
# (default, proven; needs GOOGLE_MAPS_API_KEY) or "hkgov" (the HK-gov LandsD
# ArcGIS locator). Both sit behind the ReverseGeocoder port and both are optional
# (no credential → no geocoder, fixes store the coordinate/Life360 label). For
# hkgov, set the full .../reverseGeocode service URL and the token env var from
# your LANDSD Map API portal account (the key is issued to government
# departments); tune hkgov_lang_zh/_en to the langCode strings your locator
# honours. Left commented — the default is google.
# geocode_provider = "hkgov"
# hkgov_geocode_url = "https://api.hkmapservice.gov.hk/.../GeocodeServer/reverseGeocode"
# hkgov_token_env = "HKGOV_MAPS_TOKEN"
# hkgov_lang_zh = "zh"
# hkgov_lang_en = "en"

# The presence analytics substrate — the DERIVED layer (docs/superpowers/
# specs/2026-08-18-presence-analytics-substrate-design.md), DEC-115. Ships
# INERT like [presence]/[search]/[compute]/[language]: turning it on is an
# operator decision, never something a missing section decides. Computation
# knobs ONLY — no consumer knobs (spec §1.1).
[analytics]
enabled = false
# tick_seconds = 120
# safety_lag = 600            # unprocessed FIXES, not messages
# settled_seconds = 900       # no new fix -> the stay is closeable
# max_age_seconds = 86400     # fires at lag == 0 on purpose (spec §4.2)
# batch_limit = 400           # steady state; inert in practice (spec §4.3)
# backfill_batch_limit = 20000
# backfill_threshold = 4000
# grace_seconds = 60
# stay_radius_m = 120         # INHERITED, not measured (spec §7.1)
# stay_min_dwell_seconds = 600 # INHERITED, not measured (spec §7.1)
# cluster_eps_m = 100
# cluster_min_samples = 3
# min_nights = 3
# min_weekdays = 3
# label_freshness_days = 45
# anomaly_min_samples = 5     # Tier 3 — fewer prior stays and no anomaly claim (fail-closed)
# anomaly_z_threshold = 3.0   # Tier 3 — |z| above this counts nora_analytics_anomalies_total
# corridor_max_edit_distance = 2   # Tier 5 — corridor identity tolerance
# corridor_min_samples = 3         # Tier 5 — similar trips needed before a corridor is
#                                  #   named. They accumulate ACROSS cycles (a trip stays
#                                  #   in the pool until it is linked), so this is "3
#                                  #   occurrences of the route", not "3 in one tick".
# corridor_cluster_batch_limit = 500 # Tier 5 — cap on the not-yet-clustered trips one
#                                  #   pass re-clusters. MEASURED, not inherited:
#                                  #   cluster_trips is O(n^2) over an edit-distance
#                                  #   metric — n=500 costs 1.87s, 1.6% of a 120s tick;
#                                  #   n=1000 costs 7.6s. Must be >= corridor_min_samples
#                                  #   or no corridor could ever form (startup refuses).
# min_trip_fixes = 3               # Tier 5 — shorter runs between stays are noise, not trips
# max_trip_duration_seconds = 10800 # Tier 5 — safety valve: force-settle a trip
#                                  #   even mid-drive once its span exceeds this
#                                  #   (a stuck is_driving signal shouldn't hold
#                                  #   the watermark back forever). A judgment
#                                  #   call, not a measured value.
# tz_name = "Asia/Hong_Kong"
# metrics_port = 9103

# Web search (SearXNG) + page fetch (Firecrawl) for the `search`/`fetch` tools
# (DEC-57, design/22). The WHOLE SECTION IS OPTIONAL and every key defaults — a
# config.toml without it behaves as if search is off.
#
# It ships INERT (`enabled = false`) and must stay so until TWO things are true:
# an operator turns it on, AND Firecrawl's egress is network-isolated so it
# cannot reach Nora's own internals (Honcho, signal-cli, OmniRoute) at the packet
# layer. That isolation is the PRIMARY SSRF control (design/22 §0) — Nora's
# search-result URL fence and is_global precheck are only defence in depth,
# because Firecrawl follows redirects and re-resolves DNS itself. While off, both
# tools answer `unavailable`, never a silent empty.
#
# `firecrawl_api_version` is pinned to the deployed instance's scrape route —
# verified `v1` on the running firecrawl-api container (both v1 and v2 answer
# identically today; v1 matches design/14's measurement). The three caps bound
# the input-token cost of retrieved text, re-sent on every subsequent model call.
[search]
# web_search + web_fetch via Tavily (DEC-73, DEC-116) — one call returns ranked
# results with content, a second opens a specific link; both fetch from Tavily's
# own servers, no SSRF surface. Off here for the "explicitly on" house rule; a
# real deployment sets enabled=true AND exports the key named by api_key_env.
enabled = false
api_key_env = "TAVILY_API_KEY"   # NAMES the env var; the key never lives here (DEC-8)
# url = "https://api.tavily.com/search"
# search_depth = "basic"         # "basic" (1 credit) | "advanced" (2, richer)
# max_results = 5                 # ≤ 20
# content_max_chars = 1500        # per-result snippet clamp (bounds re-sent tokens)
# timeout_seconds = 12.0
# extract_url = "https://api.tavily.com/extract"
# extract_depth = "basic"        # "basic" (1 credit) | "advanced" (2, richer)
# extract_max_chars = 3000        # fetched-page clamp (bounds re-sent tokens)

[social]
# social_fetch (DEC-151) — READ-ONLY X/Instagram reads via the host-side
# OpenCLI bridge (`python -m nora.infra.social`, run as the systemd user
# service in deploy/social-bridge/). KEYLESS, so `enabled` is the whole gate
# (the [preview] shape). Off here for the "explicitly on" house rule; even on,
# the tool can only construct allowlisted reads — the bridge re-enforces the
# read-only (site, command) mapping host-side, so no posting, liking,
# following or deleting is reachable through it.
enabled = false
# Where Nora's container reaches the host-side bridge. The deployment is on
# the private compose `nora` network (NOT host networking) and uses
# `http://host.docker.internal:19826` — the docker0 gateway the bridge also
# binds (see deploy/social-bridge/). The loopback value below is the code
# default / host-networking shape; like `llm.base_url` it is topology, argued
# in tests/test_env_template.py's _MAY_DIFFER when the deployment overrides it.
bridge_url = "http://127.0.0.1:19826"
# timeout_seconds = 90.0                  # > the bridge's ~75s subprocess timeout
# content_max_chars = 4000                # retrieved-text clamp (bounds re-sent tokens)

[preview]
# Sender-generated link previews on Nora's OUTBOUND messages: when a reply
# carries a URL she fetches its OpenGraph tags and attaches a title/description
# (and image) card, the way every Signal client does.
#
# Off here for a sharper reason than the "explicitly on" house rule. This is the
# one capability that makes Nora FETCH a url that came out of a model, from her
# own network — the exposure DEC-73 deleted along with `web_fetch`, on the
# argument that Tavily is never handed a url and searches from ITS servers.
# Turning it on takes a bounded version of that exposure back, so it is a
# decision an operator makes rather than a default they inherit. The bound is in
# `nora/infra/preview.py`: http(s) only, every resolved address must be globally
# routable, redirects followed by hand and re-validated per hop, a byte ceiling
# and a small total timeout. Keyless, so `enabled` is the whole switch.
enabled = false
# timeout_seconds = 3.0     # small: this is on the reply path, human waiting
# max_bytes = 262144        # how much of the document to read (og tags are in <head>)
# image = true              # fetch og:image too — the expensive half
# image_max_bytes = 262144

[weather]
# The `weather` tool (DEC-72) — HK Observatory Open Data, KEYLESS. Off here for
# the "explicitly on" house rule; safe to enable (no key, no cost, no egress).
enabled = false
provider = "hko"           # the WeatherProvider adapter; "hko" is the only one today
# url = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php"
# lang = "tc"              # HKO language: tc | en | sc
# timeout_seconds = 8.0

[speech]
# Voice capability (spec 2026-08-21). STT = Cantonese voice-note transcription
# at ingest via the LOCAL deploy/stt endpoint — audio never leaves the box.
# Ships INERT like [weather]/[heartbeat]: turning it on is an operator
# decision, never something a missing section decides. TTS is deferred
# (present-but-inert; nothing reads it yet).
[speech.stt]
enabled = false
endpoint = "http://stt:8000"   # the deploy/stt service on the private nora network
language = "yue"               # FunASR/SenseVoice's own LID code, not BCP-47
[speech.tts]
enabled = false
# provider = ""

[heartbeat]
# The background tick that fires due reminders — Nora's first unprompted-speech
# path. Ships INERT, like [presence] and [search]: turning it on is an operator
# decision, never something a missing section decides.
enabled = false
tick_seconds = 60          # how often she WAKES. This is the best case for
                           # lateness, not a bound on it: a tick runs its
                           # turn-groups one after another (each up to
                           # timeout_seconds below), and a group whose
                           # conversation is busy with a tag is deferred to a
                           # later tick outright — watch
                           # nora_heartbeat_deferrals_total. The only promise
                           # is "at or after due_at, never before".
# Deliberately its own knob, NOT [llm].timeout_seconds — even though master
# raised that to 120 on 2026-08-08 (Kimi audit, "so a research turn fits") and
# the two now happen to MATCH. They answer different questions: [llm]'s bounds a
# turn a human is waiting on, and moves when a human's patience does; this one
# bounds a turn nobody is waiting on, where cutting short leaves silence in a
# group that asked nothing. Equal today, independent on purpose — if you ever
# lower [llm] back for responsiveness, this must not follow it down.
timeout_seconds = 120

[reminders]
# The anti-runaway caps. They apply whenever a reminder can be CREATED, which is
# independent of whether [heartbeat] is firing them.
max_pending_per_requester = 20
min_lead_seconds = 120     # MUST be > heartbeat.tick_seconds, so a
                           # minimum-lead row cannot land in the tick already
                           # running. Nora refuses to start if it is not.
max_horizon_days = 365
                           # bounded by max_occurrences_per_series instead, and
                           # a rule whose own period is longer than this (a
                           # yearly birthday) is allowed one period of headroom
                           # — otherwise the horizon would forbid the
                           # recurrence rather than bound it (DEC-85).
max_occurrences_per_series = 60   # a recurring reminder is a chain with ONE
                           # pending row at a time, so it costs 1 against
                           # max_pending_per_requester; this is what bounds the
                           # series itself. Every series is bounded — there is
                           # no «forever».
timezone = "Asia/Hong_Kong"   # the wall clock a recurrence KEEPS. An IANA zone
                           # name, never an offset: «08:00 every day» must stay
                           # 08:00 local across a DST boundary, and +08:00
                           # cannot say that.

[language]
# The Dreamer — a background clock (`dream_loop`) that distils the slang a
# room has made its own out of its own message record, and renders a small
# block of it into every tag's/fire turn's prefill.
#
# Ships INERT, like [presence]/[search]/[compute]: a new subsystem does not
# switch itself on, and a config.toml written before this section existed
# keeps loading with the Dreamer off.
enabled = false
# The loop's WAKE interval — the same "best case for lateness, not a bound"
# shape [heartbeat].tick_seconds documents.
tick_seconds = 300
# First fire condition: `lag > safety_lag` fires once this many unconsolidated
# human messages have piled up, independent of how quiet the room has gone —
# the anti-runaway bound for a room that never falls quiet.
safety_lag = 300
# Second fire condition (paired with lag > 0): the room has gone quiet for
# this long, the natural moment to consolidate a finished conversation.
quiet_seconds = 1800
# Third fire condition, and the only one that does NOT require lag > 0 — it
# fires at lag == 0 ON PURPOSE, because rescoring is what lets a lexeme's
# recognition_score DECAY; without this a dormant room's lexicon would never
# fade and would render `live` forever, describing a slang era that ended.
max_age_seconds = 86400
# The ceiling `RecordStore.since` reads per cycle — bounds both the one model
# call's prompt size and the store's single INSERT statement. A scope whose
# lag exceeds this drains over several ticks rather than one.
batch_limit = 400
# The RENDER cap threaded to `build_prefill`'s room-language block — matches
# that call's own default (Task 10's reviewed value) rather than raising it:
# this block sits in the UNCACHED tier, so every extra entry is paid on every
# turn. Deliberately smaller than the STORE limit (15, not configurable here)
# that `TranscriptInjection` reads with — the store fetches wider than what is
# rendered so the renderer has room to drop a few exampleless entries and
# still fill the block; equal numbers make it silently under-fill. Nora
# refuses to start if this is raised to or past the store limit.
max_rendered_lexemes = 6
# The ONE completion LexemeObserver makes per cycle. Defaults to [llm].model's
# own value — the Dreamer is a background job nobody is waiting on, so reusing
# the deployment's already-working tier is reasonable, but this is a SEPARATE
# knob for an operator who wants a cheaper or differently-tuned model for a
# bulk classification task than for a live conversational turn.
# Tagged :0731 (2026-08-30) — same catalog-400 fix as [llm].model: the bare id
# 400s against the live OmniRoute catalog after the re-sync.
model = "ollamacloud/deepseek-v4-flash:0731"
# Bounds _LanguageModelClient.complete (nora.app.composition) — matches
# [llm].timeout_seconds's own value; every other model call in the codebase
# is explicitly bounded and this was the one quiet exception (a hung call
# here gets skipped tick after tick instead of ever raising, so the backoff
# non-negotiable 4 exists for never engages without this).
timeout_seconds = 120.0
# A THIRD gate (alongside this section's own `enabled` and [search]'s), off
# by default even when both of those are on: checks a candidate against
# [search] before recording it, to catch a real-world thing (e.g. an actual
# game) getting flagged as room-coined slang. Costs an extra search credit
# and an extra model completion per candidate, which is why it needs its own
# opt-in rather than riding [search].enabled.
verify_known_entities = false
# Caps how many of one cycle's candidates get the extra (search + classify)
# round trip — bounds worst-case tail latency without touching the common
# case (live traffic sees 0-3 candidates per fired batch). Candidates past
# the cap are kept unverified, not dropped.
verify_max_candidates = 10
# Dreamer Plan 2 (2026-08-20 exchange-patterns design) — gated by the SAME
# `enabled` flag above, not a second one. Classifies recurring interaction
# patterns (e.g. "these two trade insults, back and forth") from a CLOSED
# set of acts only — no free-text gloss field exists for this feature at
# any layer, and no row can describe fewer than two people (DB CHECK) — the
# two structural guarantees behind DEC-120's withhold rule.
#
# Unset (commented) defaults to `model` above.
# exchange_model = "ollamacloud/deepseek-v4-flash"
# The RENDER cap for the room-exchange block — deliberately smaller than
# max_rendered_lexemes: same uncached tier, but a pattern is a claim about
# TWO people rather than one word. Nora refuses to start if this is raised
# to or past the (not configurable) store limit of 10.
max_rendered_exchanges = 4

[facts]
# The knowledge tier's gate (design/dreamer-agent-loop/, decision index
# DEC-144 / R-77 / R-78 / R-79 / R-80). It is a running subsystem behind a
# flag, not a placeholder — the text here said "nothing writes a fact yet"
# long after three adaptors wrote.
#
# `enabled = true` switches on: extraction, adjudication and entity
# resolution on the Dreamer's tick; the embedding sweep after them; the
# <facts> block in every tag's prefill; the correction loop on the REPLY
# PATH, which holds the conversation's slot for up to
# dispute_classify_timeout_seconds; and the search_knowledge verb.
#
# Ships INERT, like every other subsystem's first deployment: a config.toml
# written before this section existed keeps loading with facts off.
enabled = false
# The dense retrieval channel's endpoint — bge-m3 over Ollama (23 §9),
# reached the way [stt] and [llm] reach host services. EMPTY IS A REAL
# DEPLOYMENT rather than a broken one: the tier then runs on the lexical
# channel alone, which loses cross-lingual and paraphrased recall in a way
# that is measured and counted, never silent.
#
# The width is 1024 and the `embedding` column is created at it, so a model
# of another width needs its own column rather than this key alone (24 §7.5).
embedding_url = ""
# embedding_model = "bge-m3"
# embedding_timeout_seconds = 30.0
# One TICK's cost, and one failed call's blast radius. They bound different
# things: a sweep of 200 in batches of 32 that dies on the third batch has
# written 64 correct rows and left 136 stale, which is intended.
# max_embed_rows_per_sweep = 200
# embed_batch_size = 32
# The Phase B cap — one research loop (search + classify) per surviving
# candidate is the expensive step, same shape and same default as
# [language]'s verify_max_candidates.
max_adjudications_per_tick = 10
# The RENDER cap on the <facts> block — same per-turn-cost argument as
# [language]'s max_rendered_lexemes/max_rendered_exchanges: this block sits
# in the same uncached volatile tail, and a fact line additionally carries a
# source URL and an excerpt.
# 19 §6's two render caps, one per slice. ROOM is the working set — more
# than eight and the block competes with the transcript beside it. SENDER
# is the narrowest slice and the most often empty, and four is enough to
# ground "you told us...".
max_room_facts = 8
max_sender_facts = 4

# 31 §3.4: how far back a message may reach when deciding what Nora "just
# rendered". Twenty-four hours because a correction arrives either in the
# same sitting or after somebody looked something up overnight. The render
# ledger is pruned at TWICE this, so a row stays readable for one window
# after it stops being eligible — which is what lets the prune be a
# background sweep rather than a deletion racing the read.
recognition_window_hours = 24
# How long a resolved fact_candidate (a not_covered verdict, or a superseded
# fact) is kept before a future prune sweep drops it — matches the tool-
# recall-log's own retention_days = 180 for the same shape of row.
retention_days = 180

[notes]
# The note tier's gate (docs/superpowers/specs/2026-08-21-note-tier-design.md).
# ON, every tag reads the standing note index for the room's WORKSPACE — not
# its conversation (§3/DEC-105: rooms sharing a workspace are one social unit)
# — and renders it as <notes>. OFF, no store is built, no query runs, and the
# block never appears.
#
# Ships INERT, like [facts] above: a config.toml written before this section
# existed keeps loading with the tier off.
#
# 2026-08-21: the four tools landed, so ON is no longer only a SELECT — she can
# now create and revise notes herself (`note_create`/`note_update`, gated by a
# read-before-write latch and a CAS on the head revision, R-55). What is still
# absent is the CURATOR: nothing merges duplicates, retires an expired anchor,
# or promotes a settled note to an event, because that is a Dreamer adaptor and
# the runtime it needs is not built. So a notebook turned on today grows and is
# never tidied — fine at this scale, and the thing to watch before it is not.
#
# 2026-08-28: the curator's MERGE and RETIRE halves landed — see
# curator_enabled below. Promote-to-event and fact-coherence rewriting are
# still absent (they need the Events and knowledge tiers).
enabled = false

# The CURATOR, on its own gate and behind the tier's. Three flags have to be on
# for a note ever to be merged or retired: [dreamer] (the runtime exists),
# [notes] enabled (the tier is on), and this one.
#
# Three rather than two because this is a DIFFERENT RISK from the other two.
# The tag path only reads and appends; the curator is the one thing in this
# tier that REMOVES something from her index. An operator turning notes on has
# not thereby asked for a background pass that reorganises them.
#
# What it does when on, every [language] tick, per workspace:
#
#   MERGE   — notes sharing an anchor (the same anchor_date AND the same
#             RESOLVED people) are one occasion written twice. The merged body
#             keeps everything both said, disagreements included; the oldest
#             note survives and the rest are retired pointing at it.
#             ELIGIBILITY IS DECIDED IN CODE, never by the model — merge keyed
#             on topical similarity would merge two weddings, and that is
#             unrecoverable.
#
#             **THIS DOES NOTHING YET, and turning the flag on will not change
#             that.** The people half is read from the note_entity registry,
#             which nothing in the system fills in, so every candidate pair is
#             refused and counted. Matching on the words the model typed
#             instead was rejected: it is wrong in both directions — three
#             spellings of one wedding read as three occasions, and two
#             unrelated notes that both say "wedding" read as one and would be
#             combined irreversibly. Watch
#             nora_note_curator_groups_refused_total: it is the case for
#             building the registry writer.
#   RETIRE  — a note whose anchor date has passed, where the model reading the
#             body says the question is answered ("closed") or can no longer be
#             answered ("moot"). "Open" is the common answer and writes nothing.
#
# Nothing is deleted. Retirement is a status change, so a retired note stays
# readable and a lossy step can be re-derived.
curator_enabled = false

# Bodies per tick, as two caps, because the curator's only real cost is reading
# whole note bodies and note_revision.body has no upper bound — ONE long body
# can consume a tick's whole allowance.
#
# Groups is small: a collided anchor needs two notes about the same date AND
# the same people, so three in one tick is already unusual and this is a bound
# on a surprise rather than a throughput knob. Expired is larger because it is
# the common case and arrives in bursts — after a quiet month every note whose
# date has passed becomes eligible at once, and a cap of three would take a
# fortnight of ticks to clear a backlog that appeared in a day.
#
# `nora_note_curator_bodies_read` is the reading. When it sits at the cap, the
# pass is reporting "nothing to do" about notes it never reached.
# max_groups_per_tick = 3
# max_expired_per_tick = 20

# A note body is capped at 8000 characters and the database refuses anything
# over 32000. NEITHER IS CONFIGURABLE, and there is deliberately no knob here:
# the operating cap is enforced in the type that constructs a revision, where a
# refusal is reviewable and names the cap, and a type cannot read this file.
# No render cap here, unlike [facts]' max_rendered_facts, and that is a
# No render cap here, unlike [facts]' two slice caps, and that is a
# decision rather than an omission: §5.1 makes the index uncapped, because a
# note silently missing from it is invisible to her and invisible is
# indistinguishable from absent. The budget is held by the per-entry caps in
# the domain type (title <= 60 chars, description <= 200) and by the curator
# retiring closed notes.

[standing]
# The debrief stage's gate (design/dreamer-agent-loop/26-standing.md). ON, a
# SECOND model reads each finished turn — success, silence, veto and timeout
# alike — and revises one short paragraph: where this conversation currently
# stands. That paragraph is then injected as <standing> at the top of the next
# turn. OFF, no fold runs, nothing is written, and the block never appears.
#
# READ THIS BEFORE TURNING IT ON. Unlike [facts], [notes] and [language], this
# tier is NOT background: it runs INSIDE the conversation's slot, immediately
# after the reply is delivered. Its cost is user-visible — but not to the
# person it just answered, who already has their reply. It lands on the SECOND
# person queued behind a busy conversation. The gate is nora_debrief_seconds
# p95 <= 5s, measured against exactly that case rather than against an average.
enabled = false
# The OPERATING cap on the position, in characters. The database also carries
# an absolute ceiling of 4000 (standing_body_fits_the_ceiling_check) that no
# config can pass — a value above it refuses to START rather than failing at
# the first oversized fold. The two layers do different jobs: a constraint is
# DDL and cannot be a knob, and the right prompt size is a judgement that
# changes.
#
# Why 1200: this block is injected on EVERY turn, so it is a per-turn tax, not
# a storage question. 1200 characters is ~300 tokens in English and approaches
# 1200 tokens in a CJK-heavy room — and this room is mixed by default, so read
# it against the denser case. A fold that will not fit is REFUSED and the model
# is asked to consolidate; nothing is ever truncated, because silently dropping
# the oldest line is how a rolling position quietly becomes a recent summary.
# nora_standing_overflow_refusals_total is the reading: never firing means the
# cap is not binding, constantly firing means it is too small.
max_chars = 1200
# How many transcript rows the debrief sees. 40 is the CEILING, not a
# preference: the debrief folds `ctx.transcript`, which the reply path already
# capped at [store] context_window, so anything above that number is silently
# the same as that number. Startup refuses a larger value rather than accepting
# a knob that cannot do what it says.
#
# It was 12, on the argument that revising a position needs less than composing
# a reply. Operator override 2026-08-27: she is answering with 40 rows in view,
# so a fold reasoning from 12 is judging a turn it can only see a third of.
# Going genuinely past 40 means raising [store] context_window — which widens
# EVERY reply's prompt, a per-turn cost on the live path and not a Standing
# decision.
window = 40
# S2's ceiling: rebuild the position from the window instead of revising it,
# once this many folds have accumulated SINCE THE LAST REBUILD. The other,
# stronger trigger needs no key — it fires when the previous turn's verdict
# says that turn was not grounded.
#
# This is the WEAKER one deliberately. "Time alone re-derives healthy
# conversations for nothing": the ungrounded case catches the turn that
# actually went wrong, and this only bounds how far drift accumulates when
# nothing does. If nora_standing_rederivations_total comes back dominated by
# trigger="ceiling", the trigger has degraded into a clock wearing a condition
# — look at why the ungrounded case is not firing rather than raising this.
#
# 20 is a starting point, not a measured value.
rebuild_after_folds = 20
# The fold's own timeout, and it bounds the MODEL CALL TWICE — the client is
# built with it, and the fold is wrapped in it. The number that matters is the
# SUM, checked at startup by max_slot_hold_seconds below rather than worked out
# here: this + 5 x store_timeout_seconds.
# This comment used to stop at «[llm] timeout_seconds + this», which is how the
# store calls came to be unbounded — they were not in anyone's sum. Raise this
# against nora_debrief_seconds, not against a hunch.
timeout_seconds = 20.0
# The bound on the stage's FIVE STORE CALLS: the trigger's verdict read, the
# prior position, the revised position, the turn verdict, and the note
# proposals. It exists because they had none: the engine sets no
# command_timeout and all of them run while the conversation's slot is HELD, so
# a connection hanging mid-query during the post-reply fold wedged that
# conversation indefinitely, on a turn that had already replied. Small on
# purpose: these are single-row keyed queries, and if one takes seconds the
# honest answer is «unavailable», not a longer wait held in front of the next
# person in the room.
store_timeout_seconds = 5.0
# The WHOLE hold this stage may add to a conversation's slot, checked at
# STARTUP: timeout_seconds + 5 x store_timeout_seconds.
# It is a gate and not a comment because the comment kept being wrong — three
# different arities for this one number have shipped, and the last of them was
# in the validator built to catch exactly that.
#
# THE REAL BOUNDED HOLD IS 45 (20 + 5 x 5), and [llm] timeout_seconds is NOT a
# term in it. That value bounds nothing in this stage: the fold's model call is
# bounded by [standing] timeout_seconds in the client AND by the wait_for around
# the fold, and never by the [llm] figure. Counting it made this read «this
# conversation can be held 165 seconds» when the bound is 45.
#
# **HELD AT 150 FOR ONE DEPLOY, DELIBERATELY, then dropped to 45.** This file is
# BIND-MOUNTED and read at startup; the validator that checks it lives in the
# IMAGE. So between a merge to master and the image that ships with it, the NEW
# config is read by the OLD validator — which still sums [llm] timeout_seconds
# and computes 150. At 45 that combination REFUSES TO START, and the check is
# ungated on `enabled`, so the container survives the merge and dies on its next
# restart naming numbers that appear nowhere in this file.
#
# 150 is accepted by both validators (old: 120 + 20 + 2 x 5 = 150, not over;
# new: 45, not over), which makes the merge safe in ANY order rather than only
# in the intended one. It is a CEILING an operator sets, not a measurement — a
# loose ceiling is true, and this comment is where the real bound is stated.
# `StandingConfig`'s own default is already 45, so a config omitting this key
# gets the tight value; only the shipped files are held.
#
# The follow-up that drops both files to 45 is safe once the image carrying the
# new validator is deployed and read back (cold review, 2026-08-28).
#
# If 45 is too long, the lever is store_timeout_seconds (25s of the total, for
# five single-row keyed queries against a local database) or timeout_seconds,
# not this number.
max_slot_hold_seconds = 150.0
# Empty means [llm] model. A separate name is available because the fold is a
# different job from replying — one structured output, no tools, no audience —
# and may want a cheaper or a more literal model.
model = ""
# The fold's reasoning budget. Empty means inherit [llm] reasoning_effort.
#
# It is DECLARED here rather than inherited silently: the debrief's model
# client never passed this at all, so the fold ran at whatever the provider
# defaults to — an unchosen setting on a call that spends the conversation's
# slot, while the tag path passes its own explicitly.
#
# THE VALUE IS DELIBERATELY NOT CHOSEN. design/dreamer-agent-loop/18-flows.md
# is explicit that the fold's reasoning effort "is a MEASUREMENT, not a
# setting": the fold is integration, not research, so a low budget is
# PLAUSIBLE — and that is exactly the class of claim 09-measurement.md forbids
# asserting. The design names a decidable spike instead: run the same fold at
# several budgets over a fixed set of REAL retained traces and score whether
# the revised position (a) preserves what the prior held and (b) integrates
# what the trace added. Both are checkable by comparison; no judge needed.
# tag_trace is retained precisely so that set exists.
#
# So this key exists to make that spike runnable. Empty is the honest default:
# it says "nobody has measured this yet" rather than inventing a number.
# Legal: none, minimal, low, medium, high, xhigh, max — checked at startup.
# "none" (operator, 2026-08-27). The fold is INTEGRATION — read the prior
# position and the trace, write the revised one — not research, and this is
# the operator choosing the starting point rather than inheriting [llm]'s
# "low" by accident. It remains the thing 18-flows says to MEASURE: the
# spike runs the same fold at several budgets over the retained traces and
# scores whether the revised position preserves what the prior held and
# integrates what the trace added. This is where that measurement starts,
# not where it ended.
reasoning_effort = "none"

[music]
# The Discord music bot's gate (design/discord-music/00-overview.md). ON,
# and with [platforms.discord] enabled, DiscordAdapter registers /music
# play|skip|queue|pause|resume|stop as slash commands — a deterministic
# per-guild player, never LLM-mediated. OFF (default), no MusicPlayerManager
# is built and the commands never get registered.
enabled = false
# Disconnect timer 2 (design/discord-music/03-state-and-persistence.md):
# queue empty and nothing playing -> leave after this many seconds. Timer 1
# (voice channel emptied of humans) has no setting — that one means leave
# immediately, no grace period to size.
idle_timeout_seconds = 300.0
# 0 (default) = hard cut between tracks, today's behaviour. Above 0, blends
# the outgoing/incoming tracks' audio for this many seconds before a
# track's natural end (spike, 2026-08-24) — /music skip stays an instant
# cut regardless.
crossfade_seconds = 0.0
# False (default) = today's behaviour: queue empties, nothing next, leave
# after idle_timeout_seconds. True (design/discord-music/08-autoplay.md)
# seeds a YouTube "Mix" recommendation from whatever just finished instead
# of going idle — an opt-in, not this template's default.
autoplay_enabled = false
# 0 (default) = the next autoplay pick is decided only after the current
# track ends (two fresh network calls — the Mix lookup, then the stream —
# make the gap between tracks audible). Above 0, MusicPlayer resolves the
# next pick while the current track is still playing, so the next track
# starts instantly at track-end. Only meaningful when autoplay_enabled is
# also true. 12.0 is a reasonable starting point: enough lead to cover
# both lookups on a slow network, small enough to never collide with a
# 3-second crossfade.
autoplay_prewarm_seconds = 0.0

[version]
# The startup upgrade note (DEC-97). On the boot after a deploy, if the version
# baked into this image has not been announced in a room yet, Nora relays the
# release note there ONCE — in her own words, through the same fire path a
# reminder uses. Never twice: the claim is a row in `version_announcements`,
# taken before the turn, so a restart (or a crash-loop) stays quiet (R-42).
#
# ON by default, unlike [heartbeat]/[presence]/[search], because it is already
# gated by something stronger: an image with no baked stamp announces nothing at
# all. Only a build made with `scripts/build-image.sh V3` — which stamps
# nora/version.json from git and makes the Dockerfile refuse a mismatch — can
# ever speak here. Set it false if you would rather tell the group yourself.
#
# WHERE she announces is not configured here: it is every conversation
# policy.toml already allows her into. Which rooms she may speak in is a trust
# question, and trust lives in policy.toml (DEC-8).
announce = true

[doctrine]
dir = "nora/doctrine"
reload = "mtime"                      # mtime | startup
strict = true
language_hint = "yue-Hant-HK"         # BCP 47 (RFC 5646): Cantonese, Traditional Han, Hong Kong
canary = "CHANGE-ME-PER-DEPLOYMENT"   # fixed string; R-6 leak sentinel
display_name = "Nora"

[dreamer]
# The Dreamer's own instruction corpus: `doctrine/` (one file — who the Dreamer
# is on every run) and `objectives/` (one per adaptor). Bind-mounted read-only
# into the container, so an operator edit is live on the NEXT TICK with no
# rebuild — which matters more here than for the doctrine, because this is the
# slowest loop in the system and an objective that steers it wants revisions.
# An edit on master is therefore a deploy, exactly as it is for nora/doctrine.
dir = "nora/dreamer"
reload = "mtime"
strict = true
# The Dreamer RUNTIME's own switch, added with the runtime it gates. This
# section shipped with NO `enabled` flag while it described only a corpus
# (DEC-128: "a flag that gates nothing is a flag an operator will eventually
# set expecting it to gate something"); it describes a subsystem now, and a
# new subsystem does not switch itself on — [presence]/[search]/[compute]/
# [language]/[analytics]/[facts] all shipped inert too. Off, no DreamerRuntime
# is constructed and the existing consolidators run exactly as they do today.
enabled = false
# NONE, and it is the fix for the knowledge tier's first production failure.
# Reasoning is billed as COMPLETION on this model family, so the effort is a
# budget spent BEFORE any answer text — and at "low" the extractor spends all
# of it: measured against a real room's transcript, "low" returned HTTP 502
# and "none" returned three candidates in 133 tokens. On a smaller sample
# "low" reasons its way to `{"candidates": []}` on text that plainly contains
# claims — a clean stop, well under the ceiling, and still no answer.
#
# Raising the ceiling is the wrong lever, measured: at 16,000 tokens the model
# spent 7,307 writing the same answer it writes in 933 at 4,000. The cost is
# deliberation, not capacity.
#
# `""` means inherit `[llm] reasoning_effort`. This is the DREAMER's key so a
# background pass can be tuned without changing what her replies can say.
reasoning_effort = "none"

# The same model Nora runs. OPERATOR DECISION (2026-08-21), NOT a measurement
# — and the distinction is stated because the earlier version of this comment
# claimed the opposite while carrying a value nobody had measured.
#
# Plan gate D2 asked "which model should the Dreamer run" and answered
# "measure it against the motivating corpus". That gate is CLOSED as
# unanswerable in its own terms right now: nothing is deployed, the fact tier
# holds zero rows, and a research loop's quality cannot be graded against an
# empty store. Measuring before there is anything to measure produces a number
# that looks like evidence and is not.
#
# Running Nora's own model is also the honest test of the architecture's
# central claim — that the Dreamer does better because it is DIFFERENTLY
# SITUATED (no social pressure, a loop, a fetch) rather than because it is
# smarter. If a flash research loop still cannot tell a source that
# contradicts from one that merely does not cover, the design is wrong and
# swapping the model quietly would hide that.
#
# Reopen with evidence from real runs, not before.
# Tagged :0731 (2026-08-30) — same catalog-400 fix as [llm].model.
model = "ollamacloud/deepseek-v4-flash:0731"

# One budget block per adaptor — NOT one global ceiling: proving a fact is
# worth more calls than glossing a word, and a single number would starve the
# first or overpay for the second. An adaptor with no block here runs under
# DreamBudgetConfig's own field defaults (the same four numbers), never
# unbounded and never a KeyError; a PARTIAL block fills its missing fields from
# those same defaults rather than zeroing them.
#
# All four numbers are UNMEASURED STARTING POINTS, not measurements — the same
# honesty [analytics]'s stay_radius_m carries ("INHERITED, not measured").
# turns/output_tokens are [llm.limits]'s shipped 20/12000 scaled down for a
# background job nobody waits on; total_tokens is that section's 128000/3.
#
# timeout_seconds is NOT OPTIONAL. Unlike a tag turn's timeout a hung Dreamer
# call is QUIET: dream_loop marks the scope `running` and skips it every
# subsequent tick (nora_dream_skipped_total{reason="in_flight"}) without ever
# raising, so the exponential backoff — which only fires on an EXCEPTION —
# never engages and a hung provider is skipped FOREVER rather than backed off.
# 120 matches [llm].timeout_seconds and [language].timeout_seconds rather than
# inventing a third number; it wraps the WHOLE run, not one call.
[dreamer.budgets.room_language]
turns = 6
total_tokens = 40000
output_tokens = 4000
timeout_seconds = 120

[dreamer.budgets.room_exchange]
turns = 6
total_tokens = 40000
output_tokens = 4000
timeout_seconds = 120

# The two adaptors that EXIST today (`nora/language/fact_adaptor.py`). The two
# above are for Phase 3's migration of the room consolidators and name nothing
# yet — `budget_for` falls back to the defaults for an unknown key, silently,
# so a section naming only future adaptors would leave the real ones on
# defaults nobody chose (2026-08-21 review).
#
# UNMEASURED starting points, like their neighbours. The adjudicator's are
# deliberately LARGER: proving a claim against the open web is search, read,
# notice the page does not cover the question, search differently — several
# fetches, each a page of tokens — while the extractor makes ONE tool-free
# call over a message batch and is sized well under the shared default.
[dreamer.budgets.fact-candidates]
turns = 2
total_tokens = 20000
output_tokens = 4000
timeout_seconds = 60

[dreamer.budgets.fact-adjudication]
# 10 -> 20, MEASURED. Five runs of the shipped objective against the shipped
# prompt, with a web_search schema attached and a plausible result returned
# each turn, converged at turns 9, 15, 14, 10 and 13. Against a budget of 10,
# FOUR OF FIVE would have exhausted it — and an exhausted loop hands
# `parse_envelope` whatever text accumulated, which the runtime reports as
# `unavailable` while holding the watermark. That is a batch that WAS read,
# re-read forever, under a counter saying the model could not be reached.
#
# 20 is the observed maximum plus a third. It is not the right long-term
# answer: the objective never tells the model how much research is enough, so
# the loop is bounded by the budget rather than by the question — the same
# shape as extraction having no candidate cap. Raising the ceiling buys
# convergence today and does not make the loop self-limiting.
#
# `total_tokens` and `timeout_seconds` are unchanged and still bound it: 15
# turns at the observed sizes is well inside 120k tokens and 300 seconds.
turns = 20
total_tokens = 120000
output_tokens = 8000
timeout_seconds = 300

# Pass 6, entity-resolution adjudication. Sized like the EXTRACTOR, not like the
# adjudicator: tool-free and single-shot, and its whole input is a short list of
# names against a short list of candidates. Deciding whether two names mean one
# thing is a judgement about the two names, not research.
[dreamer.budgets.fact-entity-resolution]
turns = 2
total_tokens = 20000
output_tokens = 2000
timeout_seconds = 60

[obs.logging]
level = "INFO"
path = "~/workspace/nora/data/nora.log"
format = "json"

[obs.metrics]
port = 9100                           # also serves /health

[obs.tracing]
enabled = true
exporter = "file"                     # console | otlp_http | file
endpoint = ""
headers_env = ""                      # env var NAME holding OTLP auth headers, never the
                                       # value (DEC-8); only read when exporter = "otlp_http"

[evals]
# The model that GRADES the adversarial live run (DEC-75). MUST differ from
# llm.model's exact id — the runner refuses a string match, because a model
# grading itself self-scores. The judge runs once per graded case, pre-deploy
# only.
#
# SUPERSEDED (kept so the wrong turn is not retaken): this read
# `deepseek-v4-pro` on the argument that «a measured run had cheaper flash miss
# fabrications pro caught, so pro is the conservative default».
#
# That run was CONFOUNDED SINGLE-SAMPLE NOISE. A controlled measurement (A4:
# same frozen replies, k=3) showed flash MATCHES pro — 3/3 fabrications caught,
# control PASS, both — once the attribution prompt (A1) and majority-of-3 (A2)
# are in. So flash via a DIFFERENT provider route grades as well as pro here at
# a fraction of the cost. Same base model = weaker independence (Kimi) but
# measured to work for this class; n=4 controlled, revisit with the diversified
# corpus (C1).
#
# SUPERSEDED IN TURN (2026-08-20), and NOT on the merits above — on reachability.
# The `deepseek/` DIRECT route returns HTTP 402 «Insufficient Balance» through
# OmniRoute, so `--suite adversarial` was failing as a BILLING ERROR rather than
# producing a verdict. Operator: "use ollama cloud". Moved to
# `ollamacloud/deepseek-v4-pro:0813`, verified reachable and grading on the same
# gateway the same day; it clears the runner's guard (llm.model is
# `ollamacloud/deepseek-v4-flash`, so the ids do not string-match) and matches
# `evals.judge.JUDGE_MODEL_TIER`'s documented intent ("deep" = deepseek-v4-pro).
# `ollamacloud/kimi-k3` is not a candidate — extra-usage-only on this plan, 402s
# too. The flash-matches-pro measurement above still stands; it simply no longer
# picks the model, because the route it named cannot be reached.
#
# USAGE DISCIPLINE (operator: "do NOT blast it, since the ollama cloud is
# subscription - usage base"). Cold: `--suite adversarial` is 10 replies
# (llm.model) + 30 judge calls (THIS model) = 40, and 0 on an unchanged re-run
# thanks to B1's verdict cache — so `--force`/`--no-cache` is what throws the
# saving away. `--suite journeys` is 8 x 9 = 72 uncached calls but runs on
# llm.model, never on this one. Raising judge_samples multiplies the judge half
# directly.
#
# NOT fixed by this swap, measured the same day: the judge cannot grade R-53 (a
# source that does not mention something has not denied it). That blindness is a
# property of the RUBRIC, not of the judge tier — both flash and pro pass a reply
# that reads a scoped source's silence as a denial, pro at confidence 0.95. See
# `docs/superpowers/specs/2026-08-20-fact-tier-design.md` §9.0.
judge_model = "ollamacloud/deepseek-v4-pro:0813"
# judge_samples: the judge grades each reply k times; the gate binds the majority
# safety verdict (A2, kills single-sample noise). 1 = single sample; 3 = stable.
judge_samples = 1
# journey_samples: --suite journeys runs each journey k times, majority-gated (F8a).
# Routing is stochastic — n=1 flakes a good model and passes a lucky broken one.
journey_samples = 3

[evals.langfuse]
enabled = false                       # opt-in: also requires `--export-langfuse` on the CLI
host = "http://127.0.0.1:3100"
headers_env = ""                      # same shape/var as obs.tracing.headers_env — see
                                       # nora.config.LangfuseEvalConfig's docstring for why
                                       # this reuses that credential rather than adding a
                                       # second one

# The per-modality describers (2026-08-17). `vision_model` above stays the
# IMAGE model's alias, so a config written before this split keeps working.
#
# Audio ships INERT — wired, but off, with no model named. That is not
# timidity: the OmniRoute catalogue advertises `vision` on 215 of its 406 models
# and carries NO `audio` or `video` key at all, so it cannot tell us whether any
# reachable route can hear. Enabling it is a flag and a model name,
# with no code change; until a probe answers that question, a voice note is
# answered `unavailable` («I couldn't check»), never `nothing_found`.
#
# VIDEO shipped inert under the same argument and was ENABLED 2026-08-30 via
# the kimi direct lane — see [media.describe.video] below.
#
# `provider` selects the TRANSPORT (2026-08-30): `"omniroute"` (default) keeps
# the process-wide gateway client; `"kimi"` travels DIRECT to
# `api.kimi.com/coding/v1` using `KIMI_CODE_API_KEY` — required for VIDEO,
# because OmniRoute drops `video_url` content blocks (probe 2026-08-30: router
# prompt tokens 95 vs native 3164 for the same payload). A kimi provider whose
# key is unset answers `unavailable`, never a silent omniroute fallback.
# `api_key_env` (optional, kimi only) NAMES the env var holding the direct
# lane's key (DEC-8 — the value never lands here); empty falls back to
# `KIMI_CODE_API_KEY`.
[media.describe.image]
enabled = true
# ollamacloud/minimax-m3 → ollamacloud/glm-5.3-flash (2026-08-30, benchmark:
# 5-10x faster, accuracy parity; verified through OmniRoute).
model = "ollamacloud/glm-5.3-flash"
provider = "omniroute"

[media.describe.audio]
enabled = false
model = ""
provider = "omniroute"

[media.describe.video]
# ENABLED 2026-08-30 — kimi DIRECT provider, NOT omniroute: OmniRoute drops
# `video_url` content blocks (probe: router prompt 95 tokens vs native 3164
# for the same payload), so a video through it reaches the model as text only
# and it answers about text it did receive. `KIMI_CODE_API_KEY` must be
# injected (docker-compose.yml) or this answers `unavailable` — never a
# silent omniroute fallback. k3-256k over k3 (1M): same video token cost,
# ~2x faster, half the quota (benchmark 2026-08-30).
enabled = true
model = "k3-256k"
provider = "kimi"
# Video bytes are routinely far larger than a still image; the shared
# `vision_max_bytes` (8 MiB, chosen for images) would turn a real clip into
# `too_large`. Set to the SAME 100 MiB as `[media] max_bytes` — the custody
# ceiling, i.e. "whatever Nora can receive, she can describe". A 100 MiB
# clip is a ~133 MiB base64 body to api.kimi.com; the direct lane's per-call
# timeout (derived from llm budgets) must cover that upload+inference. If a
# real clip ever times out at the top of this range, the `ms://file-id`
# upload lane (probed 2026-08-30 for larger videos) is the escape hatch —
# base64 inline works for small clips, file-id for big ones.
max_bytes = 104857600
