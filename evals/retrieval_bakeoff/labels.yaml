# Relevance labels for the retrieval bake-off. Rules: PROTOCOL.md.
version: 2
slice: text_image
blind: Queries were written, and both raw label sets judged, from the images alone; no author or labeller
  saw a reading (PROTOCOL.md, Blind by construction).
query_author:
  who: a fresh agent session given only the image files and their pool ids
  produced: the query texts, its intended targets (author_targets) and proposed near misses with the detail
    each fails
labellers:
  A:
    who: the set's maintainer (the session that built v1, so it had seen the readings then); v2 labels
      judged from the images and query texts only, frozen before B's were opened
    raw_sha256: 5bab5f264d10f7156761ffb738a6a78d439feb5f2b6dcd7b46e5ede0db504b2f
  B:
    who: a fresh agent session, separate from the query author and from A
    given: PROTOCOL.md Relevance section, the images with their pool ids, the query texts
    not_given: readings, Commons titles, media.yaml, anyone's notes or labels; no retrieval tools
    raw_sha256: 47c8700a2d95fddabfdb4d3bb2cdbacc6ce57363bfd5e579cd4bed9a0b278dec
hard_negative_review: 'Proposed by the query author with the failed detail; checked by A against the images.
  Dropped as not real near misses: ti-q44/img-099, ti-q45/img-118, ti-q50/img-084, ti-q69/img-222.'
agreement_before_reconciliation:
  queries: 69
  identical_sets: 67
  mean_jaccard: 0.978
  cohen_kappa_over_query_item_pairs: 0.979
  query_item_pairs: 15456
  relevant_to_both: 72
  relevant_to_A_only: 1
  relevant_to_B_only: 2
withdrawn: []
disagreements:
- query: ti-q09
  item: img-127
  A: not_relevant
  B: relevant
  outcome: relevant
  reason: A excluded it as not clearly in a glass case; the glass shelf edge is visible along the bottom
    of the frame, and it is a tighter shot of the same display as img-137. Every stated detail holds.
- query: ti-q68
  item: img-125
  A: relevant
  B: not_relevant
  outcome: relevant
  reason: B excluded it because the soup is hard to see; the noodles sit in pale broth at the bottom of
    the frame and the bone is plain. Every stated detail holds.
- query: ti-q68
  item: img-194
  A: not_relevant
  B: relevant
  outcome: relevant
  reason: Yellow chopsticks lift a piece of rib meat with the bone edge showing, over noodles in broth,
    in close-up. Every stated detail holds; A missed it.
