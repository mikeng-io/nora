# Relevance labels for the retrieval bake-off. Rules: PROTOCOL.md.
version: 1
slice: text_image
labellers:
  A:
    who: 'the author: the agent session that chose the pool and wrote the queries'
    when: after the queries were written, before B saw anything
    raw_sha256: 2862309c4df3f00aee005f641352f7ce7c6033161f819ac3e116bd0ed275c28b
  B:
    who: a separate agent session, independent of the author
    given: PROTOCOL.md Relevance section, the pool (ids, image files, frozen readings), the query texts
    not_given: the author's notes, labels, hard negatives or reading_gap flags; no retrieval tools
    raw_sha256: f654f8eb973728b0cb683fc45593a5420dd4427d51fea252b725d3ba4a1ae80e
agreement_before_reconciliation:
  queries: 78
  identical_sets: 72
  mean_jaccard: 0.949
  cohen_kappa_over_query_item_pairs: 0.968
  query_item_pairs: 17472
  relevant_to_both: 91
  relevant_to_A_only: 5
  relevant_to_B_only: 1
withdrawn:
- query: ti-q30
  reason: 'Final relevant set is empty: no pool image shows a Singapore carriage. Withdrawn, not loosened
    (PROTOCOL.md, Relevance).'
  raw:
    A:
    - img-074
    B: []
  settled:
  - query: ti-q30
    item: img-074
    A: relevant
    B: not_relevant
    outcome: not_relevant
    reason: The image is a Hong Kong MTR carriage at Kowloon Tong, not Singapore; A labelled it from the
      wrong reading.
- query: ti-q74
  reason: 'Final relevant set is empty: the only candle photo shows two flames. Withdrawn, not loosened
    (PROTOCOL.md, Relevance).'
  raw:
    A:
    - img-152
    B: []
  settled:
  - query: ti-q74
    item: img-152
    A: relevant
    B: not_relevant
    outcome: not_relevant
    reason: A second candle flame is clearly visible at the left edge, so "a lone candle flame" does not
      hold.
disagreements:
- query: ti-q29
  item: img-074
  A: not_relevant
  B: relevant
  outcome: relevant
  reason: The carriage signs read 九龍塘 / Kowloon Tong; the reading calls it Novena, Singapore, and the
    image decides. A had tagged it a hard negative from the reading, so the tag is dropped.
- query: ti-q40
  item: img-082
  A: relevant
  B: not_relevant
  outcome: not_relevant
  reason: Only the horizon is orange; the upper sky is pale blue, so "the whole sky is pink-orange" does
    not hold.
- query: ti-q45
  item: img-042
  A: relevant
  B: not_relevant
  outcome: not_relevant
  reason: The bowl rim reads dark teal-green, not black; ambiguous by sight, so not relevant.
- query: ti-q62
  item: img-125
  A: relevant
  B: not_relevant
  outcome: relevant
  reason: Yellow chopsticks lift the meat and noodles are visible beneath it. The meat is no less identifiable
    as beef than in img-194, which both labellers accepted, so the two are treated alike.
