# Relevance labels for the retrieval bake-off's cantonese and names slices. Rules: PROTOCOL.md.
version: 1
slices:
- cantonese
- names
as_of: '2026-10-15'
blind: 'Three separate fresh agent sessions wrote the pool, wrote the queries, and judged labeller B''s set;
  none was given another''s notes. The query author was given only the pool; B only the pool, the queries and
  the relevance rules (PROTOCOL.md, text slices). This cannot be shown from git: A wrote all three sessions''
  prompts and ran them, and nothing in the repository records what each session read.'
pool_author:
  who: a fresh agent session, 2026-10-15
  given: the setting, the four languages, the confusable kinds to include, the PII rules
  not_given: any query, label, or file of this repository
query_author:
  who: a fresh agent session, separate from the pool author
  given: 'the pool (ids, sent, lang, text) and the query rules: a later paraphrase, another register or language
    or a vague reference; no copying of distinctive words; in names the name itself may appear'
  not_given: any floor or arm result, readings, labels; no instruction to aim at or avoid a technique
  produced: the query texts; separately, its intended targets (author_targets) and proposed near misses with
    the detail each fails
  selection: 'none by score: every query it wrote is in the set except those withdrawn below, each by a rule
    written before the queries and with its reason'
labellers:
  A:
    who: the set's maintainer (the session that built this PR); read the whole pool and the query texts, labelled
      without opening the query author's targets, and froze its raw set before B's output existed
    frozen_at: '2026-10-15T03:18:09Z'
    frozen_at_is: self-reported by A; git does not show that A's set was frozen before B's existed
    raw_sha256: 80c09f781118cb33dcd9b10958a952f0c675f650ac9d357958d15be76f99b3ad
  B:
    who: a fresh agent session, separate from the pool author, the query author and A; for ca-q73..ca-q84 and
      ca-q85..ca-q90 a further fresh session each (second_round, third_round)
    given: PROTOCOL.md's time and relevance rules for text, the pool, the queries with as_of
    not_given: the targets, anyone's notes or labels; no grep, search or retrieval tools
    raw_sha256: 698cc3377363b81a43285c2b9625059a18c0db44d6f7733a40e7ee8bd9fff9fa
hard_negative_review: Proposed by the query author with the failed detail; checked by A against each message
  after A's labels were frozen. Each fails a detail its query states; none dropped. None is in a final relevant
  set.
