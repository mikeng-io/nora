second_round:
  why: The review applied the copied-wording rule to the cantonese slice and withdrew 22 queries, which left
    mixed at 6, below the per-language minimum of 10. A second, fresh query-author session wrote 12 new mixed
    queries (ca-q73..ca-q84).
  author_given: 'the cantonese pool as committed, PROTOCOL.md''s relevance rules for text, a list of message
    ids already targeted (to avoid), and one explicit instruction: no repeated phrasing from the target, in
    any script, transliteration included'
  author_not_given: any earlier or withdrawn query, any label, any arm score
  labellers: A labelled from the pool and the query texts without opening the author's targets and froze before
    B's file existed; B was a further fresh session given the pool, the 12 queries and the relevance rules.
    Their raw sets are part of A's and B's raw sets above.
