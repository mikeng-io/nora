      text: whose dog figured out how to get into the refrigerator
    - id: ca-q30
      lang: roman
      text: sap jyut maau maau jiu zoi heoi zam jat zam
    - id: ca-q31
      lang: yue
      text: 邊個養嗰隻雀識同人打招呼
    - id: ca-q32
      lang: en
      text: the Tsuen Wan line running twenty minutes late in mid September
    - id: ca-q33
      lang: mixed
      text: 東涌綫 late 咗二十分鐘嗰日
    - id: ca-q35
      lang: roman
      text: baat jyut heoi sai kung bik m dou ce, jan taai do
    - id: ca-q36
      lang: en
      text: in June the van to Sai Kung was full so they waited for another
    - id: ca-q37
      lang: yue
      text: 搭計程車俾司機遊車河嗰次好嬲
    - id: ca-q38
      lang: en
      text: last weekend, how often were boats to Lamma running at night
    - id: ca-q39
      lang: mixed
      text: 南丫島 ferry 四十五分鐘一班嗰個
    - id: ca-q40
      lang: en
      text: the first game night at someone's flat, back in June
