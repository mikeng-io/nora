      lang: roman
      text: gau jyut sing kei jat sai kung haang saan, gau dim baa si zaam dang
    - id: ca-q45
      lang: en
      text: this month someone asked about a Sunday Sai Kung hike again
    - id: ca-q46
      lang: yue
      text: 上星期有人提議再上獅子山
    - id: ca-q47
      lang: mixed
      text: 九點半開嗰場 movie，叫人早啲去
    - id: ca-q48
      lang: roman
      text: cat jyut go zoeng hei cat dim bun hoi
    - id: ca-q49
      lang: en
      text: rented a party room big enough for a dozen people
    - id: ca-q50
      lang: roman
      text: zou zo gaan party room sap go jan
    - id: ca-q51
      lang: yue
      text: 買咗兩張演唱會門票嗰個
    - id: ca-q52
      lang: en
      text: who got three tickets for the Sunday concert
    - id: ca-q53
      lang: mixed
      text: 佢生日係星期四嗰次，大家夾份買 cake
    - id: ca-q54
      lang: en
      text: my younger brother's birthday dinner booking
    - id: ca-q55
      lang: yue
      text: 阿媽生日嗰餐訂咗幾點
    - id: ca-q56
      lang: en
      text: my manager turned down my day off on Friday
    - id: ca-q57
      lang: mixed
      text: 老細 OK 咗我星期五請假嗰次
    - id: ca-q58
      lang: yue
      text: 業主今個禮拜又話加租，加幾多
    - id: ca-q59
      lang: roman
      text: luk jyut uk zyu gaa zou baat baak
    - id: ca-q61
      lang: mixed
      text: 今個禮拜又去 cut 頭，今次 OK 啲
    - id: ca-q62
      lang: en
      text: flight to Japan delayed two hours back in September
    - id: ca-q63
      lang: yue
      text: 今個禮拜有人又訂咗去大阪嘅機票，十二月
    - id: ca-q65
      lang: roman
      text: co syun heoi ou mun go ci
    - id: ca-q66
      lang: en
      text: plan to go to Macau next week for pork chop buns
    - id: ca-q67
      lang: yue
      text: 八月約星期六去坪洲，要早啲出發
    - id: ca-q68
      lang: en
      text: who had a fever and took sick leave
    - id: ca-q69
      lang: roman
      text: baat jyut jau jiu bei sun jung kaat, mou cin
    - id: ca-q70
      lang: mixed
      text: 隔籬枱個 auntie 飲醉咗瞓低
