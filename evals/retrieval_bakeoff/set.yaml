    - id: ca-q04
      lang: en
      text: someone shocked we still had a black rainstorm this late in the year, couldn't get to work
    - id: ca-q05
      lang: yue
      text: 十月仲出咗熱到要警告嗰日，幾多度
    - id: ca-q06
      lang: en
      text: the red rainstorm morning when we said just stay home and work
    - id: ca-q07
      lang: roman
      text: gau jyut daa fung, jau jan wa gam nin dai ji ci m sai faan gung
    - id: ca-q08
      lang: mixed
      text: 打風之前大家 panic buying 有人吐槽嗰句
    - id: ca-q10
      lang: en
      text: last Sunday night someone's place had a blackout
    - id: ca-q11
      lang: yue
      text: 上星期六去食火鍋，訂咗五個人位嗰條
    - id: ca-q12
      lang: mixed
      text: hotpot 六個人嗰次，邊個 book 咗枱
    - id: ca-q13
      lang: en
      text: the message saying I needed to pay back 180 dollars after the hotpot
    - id: ca-q14
      lang: roman
      text: luk jyut sik fo wo jau jan wa cin ngo jat baak ng sap man
    - id: ca-q15
      lang: mixed
      text: 十月初又約星期五 hotpot，話去返同一間
    - id: ca-q16
      lang: en
      text: early September, someone asking who's coming to a Friday hotpot
    - id: ca-q17
      lang: yue
      text: 叫外賣薄餅嗰晚叫咗三盒大嘅
    - id: ca-q18
      lang: en
      text: the pizza night in September with two big ones
    - id: ca-q19
      lang: yue
      text: 花紅出咗即刻話去食廚師發辦嗰條
    - id: ca-q20
      lang: en
      text: end of August, got paid and wanted a fancy Japanese dinner
    - id: ca-q21
      lang: roman
      text: sa tin gaan lai min jiu dang jat go zung tau
    - id: ca-q22
      lang: en
      text: the ramen place in Tsuen Wan with the hour-long wait
    - id: ca-q23
      lang: yue
      text: 九月有人問邊個想一齊去大埔食魚蛋
    - id: ca-q24
      lang: mixed
      text: 八月尾約人去大澳食 fishball 嗰個
    - id: ca-q25
      lang: en
      text: whose cat was napping on top of their computer
    - id: ca-q26
      lang: yue
      text: 邊個話佢隻貓一朝早嘔咗兩轉
    - id: ca-q27
      lang: en
      text: the dog that threw up twice one morning
    - id: ca-q28
      lang: mixed
      text: 邊個屋企隻貓自己打開 fridge，嚇死人
    - id: ca-q29
