# Near-miss corpus (spec B.2 table): trigger-shaped text that must NOT fire, because
# it fails `nora.tag.is_tagged`'s real matching rules (already verified in Task 40) —
# a word character glued to either side of the trigger, the trigger broken by
# whitespace, or the trigger wrapped in an inline code span. Every case expects
# silence.
cases:
  - name: near_miss_trailing_digit
    input: "nora.0001 what time we eating"
    expect: silence
  - name: near_miss_leading_word_char
    input: "xnora.000 anyone there?"
    expect: silence
  - name: near_miss_broken_spacing
    input: "nora .520 typo?"
    expect: silence
  - name: near_miss_code_span
    input: "see `nora.000` mentioned in the docs"
    expect: silence
