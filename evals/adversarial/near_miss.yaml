# Near-miss corpus (spec B.2 table): trigger-shaped text that must NOT fire, because
# it fails `nora.tag.is_tagged`'s real matching rules — a word character glued to
# either side of the trigger, the trigger broken by whitespace, or the trigger
# wrapped in an inline code span. Every case expects silence.
#
# `{trigger}` IS SUBSTITUTED AT LOAD from `[engagement.trigger].text`, and that is
# load-bearing rather than tidy. These cases encode the RULES, not one trigger's
# spelling. An earlier version hardcoded `nora.000`; when the operator re-enabled
# the plain `nora` trigger on 2026-08-26, two of the four cases silently stopped
# being near-misses and started tagging — so the corpus asserted the model would
# not be called, the model was called, and the gate failed with a message pointing
# at the model rather than at the corpus. A clone (`delia`, config.toml's own
# example) would have broken it the same way on day one.
#
# Anything added here must be a rule that holds for ANY trigger string.
cases:
  - name: near_miss_trailing_word_char
    input: "{trigger}1 what time we eating"
    expect: silence
  - name: near_miss_leading_word_char
    input: "x{trigger} anyone there?"
    expect: silence
  - name: near_miss_broken_spacing
    input: "{trigger_split} typo?"
    expect: silence
  - name: near_miss_code_span
    input: "see `{trigger}` mentioned in the docs"
    expect: silence
