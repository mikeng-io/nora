# Scenario suite for design/unified-memory/31 §2. All data is generated.
# ToolRouteGrader reads tools, required_tools, not_tools, before and args checks.
# expected_output explains the property; it is not a separate semantic scorer.
# Anchor confirmation must specialise argument checks to shown evidence/ids.
# held_out cases must never be quoted in an instruction.
cases:
- name: c01_arrival_connects_open_note
  entry: dreamer
  category: cognition
  expect: reply
  input: room A has new messages
  expected_output: Propose the visit, read the admitted answer with the open gift handover note, then
    act on that note; never act before proposing.
  metadata:
    scenario: 1
    held_out: false
    tools:
    - memory_propose
    required_tools:
    - note_revise
    not_tools: []
    args_include:
      memory_propose:
      - plans
    before:
      memory_propose:
      - note_revise
  parked:
    reason: 'anchor pending: chosen privately on the deploy host'
    why: No private clone has been inspected for this case. No anchor is asserted.
    returns_when: Privately confirm scenario 1 in the eval clone, add its pseudonymised snapshot and
      anchor-specific argument checks, then remove parked.
