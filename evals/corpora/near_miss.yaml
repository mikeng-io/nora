# Near-miss corpus (spec B.2 table): trigger-shaped text that must NOT fire, because
# it fails `nora.tag.is_tagged`'s real matching rules — a word character glued to
# either side of the trigger, the trigger broken by whitespace, or the trigger
# wrapped in an inline code span. Every case expects silence.
#
# `{trigger}` IS SUBSTITUTED AT LOAD from `[engagement.trigger].text`, and that is
# load-bearing rather than tidy. These cases encode the RULES, not one trigger's
# spelling. An earlier version hardcoded `nora.000`; when the operator re-enabled
# the plain `nora` trigger on 2026-08-26, two of the four cases silently stopped
# being near-misses and started tagging — so the corpus asserted the model would
# not be called, the model was called, and the gate failed with a message pointing
# at the model rather than at the corpus. A clone (`delia`, config.toml's own
# example) would have broken it the same way on day one.
#
# Anything added here must be a rule that holds for ANY trigger string.

# --- RE-HOMED 2026-09-17 (design/evaluation Step 4) -------------------------
#
# These cases were driven by `evals/run.py`'s `_invoke_agent`, whose own
# docstring says what it is:
#
#   **NOT NORA.** [...] What this therefore does NOT have -- every one of these
#   is part of Nora: `build_prefill` and every `ContextBlock`, the framing every
#   block carries in its own opening tag saying what it is and that it is not an
#   instruction, `<standing>` / `<notes>` / `<self_card>` / `<peer_card>`, the
#   real tool registry, `ReplyGuard` / `LeakGuard` / `Deliverer`.
#
# `entry: tag` is `Dispatcher.on_message` -- the call a platform adapter's
# `listen()` loop makes. Every one of those blocks and guards is present,
# because none of them is passed in.
#
# The CASES are unchanged: same names, same inputs, same transcripts, same
# labels. What a number from them MEANS has changed, and that is the move.
#
# TWO SHAPE CHANGES, both argued rather than silent:
#
#   `transcript:` is now `knows.transcript:` -- prior room messages are things
#   she KNOWS, written into the real record store, not a block pasted into a
#   prompt. That is the difference between this layer and the one it replaces.
#
#   `criteria:` is now `expected_output:` -- one name for "what a good answer
#   looks like", so a judge has one field to read instead of two that mean the
#   same thing in different files.
#
# `config:` states the trigger these corpora are built on. It belongs to the
# file and not to any case: `no_trigger.yaml`'s twelve entries are near-misses
# of this exact string, and a different trigger would make every one of them a
# hit while the suite reported a perfect score for a rule it had stopped
# testing.

config:
  engagement.trigger.text: "nora.000"

# --- SEEDED FROM A REAL ROOM 2026-09-21 (empty-room conversion) -------------
#
# Same conversion, same anchor and the same finding as `no_trigger.yaml`
# (read that file's header for the full argument): all four cases here are
# now seeded via `snapshot:` from the same real multi-person room -- a real
# `relevance_gate = true` room measured notes-rich (24 open notes on its
# unit) and standing-rich (311 chars, 11 folds). Identified here only by its
# `snapshot.conversation_id`, never by label or roster. `expect` is
# UNCHANGED, and the `{trigger}`/`{trigger_split}` substitution below is
# untouched -- NOT hardcoded, per this file's own header warning above about
# the 2026-08-26 incident.
#
# The room choice is still functionally inert for `expect: silence` here,
# for the identical reason `no_trigger.yaml` measured: this corpus also
# shares `entry: tag`, whose `EntryPoint` in `evals/rebuilt/entry.py` never
# turns on `[relevance_gate] enabled`, and even granting that flag,
# `ParticipationTrigger.note_message` is a synchronous bookkeeping call that
# spawns nothing `settle()` can observe. Every `expect: silence` below stays
# correct and structurally guaranteed, for the entry point's reason rather
# than the empty room's.

cases:
  - name: near_miss_trailing_word_char
    entry: tag
    expect: silence
    input: '{trigger}1 what time we eating'
    snapshot: &room_a
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789909891000
      culture_key: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      unit: friends

  - name: near_miss_leading_word_char
    entry: tag
    expect: silence
    input: x{trigger} anyone there?
    snapshot: *room_a

  - name: near_miss_broken_spacing
    entry: tag
    expect: silence
    input: '{trigger_split} typo?'
    snapshot: *room_a

  - name: near_miss_code_span
    entry: tag
    expect: silence
    input: see `{trigger}` mentioned in the docs
    snapshot: *room_a
