    input: Miles 而家喺邊？如果你查唔到就照實講。
    metadata: {tools: [send_reply]}
    snapshot: *room_a

  - name: long_answer_remains_a_tool_delivery
    entry: tag
    expect: reply
    mention: true
    input: 我而家設計緊一個 memory graph。詳細啲講下應該點樣記錄失敗、形成 rule、驗證 rule，同埋點樣避免愈記愈亂。
    metadata: {tools: [send_reply]}
    snapshot: *room_a

  - name: background_work_acknowledgement_is_a_tool_delivery
    entry: tag
    expect: reply
    mention: true
