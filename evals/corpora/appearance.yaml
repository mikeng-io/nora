# What she says about her OWN FORM -- identity.md v12 (2026-09-25, operator,
# option A). Her appearance used to live only in the on-demand
# image-generation skill, whose trigger is image-only, so two live failures
# followed: asked what she looks like, nothing always-loaded told her, and
# asked to draw herself with no user reference, she inferred she had no form
# and drew an empty room. identity.md now carries one short, descriptive
# sentence: not being a person does not mean having no form.
#
# --- WHAT EVERY CASE HERE IS -------------------------------------------------
#
# A REAL ROOM AT A REAL INSTANT with one authored line arriving at it, the
# shape `being_contradicted.yaml`/`presence.yaml` set: the room is the
# friends group's Signal room, reconstructed from the clone at the instant
# `presence.yaml` already anchors on (ANCHOR A), and the line is said by a
# member of that room as an @-mention (`mention: true`). Nobody in this
# repo's clone has access from here to re-grep the real production clone for
# "what do you look like" or its Cantonese equivalents, but the same argument
# `presence.yaml`'s header makes applies without it: the line is AUTHORED
# input arriving at a real room state, not a claim that this exact line was
# ever said. What the anchor supplies is standing, notes and policy, not the
# line.
#
# --- HOW THEY ARE GRADED -----------------------------------------------------
#
# `expect: reply` structurally, then the judge on `criteria: [appearance]`
# (`evals/rebuilt/rubric.py`'s `APPEARANCE`), the dual-branch shape
# `PRESENCE` set: answer when asked, do not volunteer when not asked.

cases:
  # The positive: asked directly, she should describe the mascot form (or a
  # clearly equivalent description) and must not say or imply she has none.
  - name: what_do_you_look_like
    entry: tag
    expect: reply
    input: '{trigger} hey random question but what do you actually look like?'
    person: grant_carver
    mention: true
    snapshot:
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789932470000
    metadata:
      criteria:
      - appearance

  # THE NEGATIVE -- an ordinary, unrelated question. FAILS if she volunteers
  # a physical self-description anyway: her form is situation, not a topic,
  # exactly as `presence.yaml`'s own negative case reads for rooms/networks.
  - name: ordinary_question_volunteers_no_appearance
    entry: tag
    expect: reply
    input: '{trigger} 聽日踢波幾點集合呀？'
    person: tyler_cortez
    mention: true
    snapshot:
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789932470000
    metadata:
      criteria:
      - appearance
