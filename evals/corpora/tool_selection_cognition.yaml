# S2 — tool routing, the legacy Cognition catalogue.
#
# THE QUESTION is the same as `tool_selection.yaml`'s — does she reach for
# the right verb — over a DIFFERENT catalogue: the removed session's write, pace
# and act verbs, never the tag path's own tools. Confusable pairs weighted the
# same way: note_create/note_revise, wake_at/wake_move/wake_cancel,
# remind/remind_move/remind_cancel.
#
# SYNTHETIC INPUT, deliberately: no real message is quoted anywhere in this
# file, and the one member named is by a pseudonym (the `social_read` cases
# below) — `input` here is an agenda item's own fact-only summary
# ("room X has N new messages", "a self-wake is due: ..."), never a
# transcript line.
#
# `entry: dreamer` with `category: cognition` is this corpus's declared entry
# point (`evals/scenarios.py`'s `CORPUS_ENTRY`). Every case is parked: the legacy
# Cognition session is removed, and the graph wake offers a different catalogue.

cases:
  - name: cognition_note_create_vs_update_new_topic
    entry: dreamer
    category: cognition
    expect: reply
    input: "room A has 4 new messages"
    metadata: {tools: [note_create], not_tools: [note_revise]}
    parked:
      reason: P-A
      why: The legacy Cognition session this case ran on was removed; no entry point runs it.
      returns_when: The graph wake offers the same tool choice.

  - name: cognition_note_revise_vs_create_open_note
