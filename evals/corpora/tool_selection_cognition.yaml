  # ---- `social_read` (docs/design/cognition/loop.md, the map's `social_items`):
  # a member's recorded stories, posts and reels, against the reads it is
  # confusable with. The input is the sentence a live agenda's `<social>` row
  # carries (`nora.language.cognition_render._social_row`: «<name> posted
  # <describe_read>»), naming the person by their roster name, because
  # `social_read` takes a name and resolves it among the people the room
  # lists. `Miles` is the one name `tool_selection.yaml` uses for a member of
  # room A (`route_where_is_now`), a pseudonym `NORA_EVAL_PSEUDONYM_MAP`
  # resolves; the probe hands the sentence as the item's summary, so what is
  # synthetic is the agenda text, not the person. NOT RUN when written: the
  # eval owner runs them (`--sample 5 --reasons`, master and branch) and the
  # numbers go in the PR.

