# S2 — tool routing, the COGNITION catalogue (design/cognition-loop/
# 30-cognition.md §2, §4: "tool_selection is measured on the cognition
# catalogue, on the runtime model, at step 3"; migration step 3a-ii).
#
# THE QUESTION is the same as `tool_selection.yaml`'s — does she reach for
# the right verb — over a DIFFERENT catalogue: Cognition's write, pace and
# act verbs (`nora.agent.cognition_pace` and the session's write verbs in
# `nora.app.cognition_session`), never the tag path's own tools.
# Confusable pairs weighted the same way: note_create/note_update,
# event_propose/event_revise/event_set_status, wake_at/wake_move/wake_cancel,
# remind/remind_move/remind_cancel.
#
# SYNTHETIC INPUT, deliberately: no real room member is named and no real
# message is quoted anywhere in this file (the migration's own safety rule,
# restated for eval content) — `input` here is an AGENDA ITEM's own summary,
# the fact-only sentence `nora.domain.cognition_session._summary` builds
# ("room X has N new messages", "a self-wake is due: ..."), never a
# transcript line.
#
# `entry: dreamer` with `category: cognition` is this corpus's declared
# entry point (`evals/scenarios.py`'s `CORPUS_ENTRY`). It is driven by
# `evals.rebuilt.entry._cognition_probe`, which hands each case's `input` to
# `CognitionSessionRunner.probe` as ONE agenda item: the same tools, the same
# instruction (`nora/dreamer/objectives/cognition.md`) and the same agent
# runner as a wake's session, on the model `[dreamer] model` names. It needs
# the eval subject to build that runner, so the deployment's config must hold
# `[cognition] enabled = true`; with sessions
# off the case is an ERROR, never a pass (migration step 3a-iii). Every case
# is anchored (no `parked:`) because the anchor itself is real and reused
# (`tool_selection.yaml`'s own ROOM A) — what is synthetic is the AGENDA
# TEXT, not the room.
#
# Run with `--sample 3` at least (eval-numbers-are-not-rates).

cases:
  - name: cognition_note_create_vs_update_new_topic
    entry: dreamer
    category: cognition
    expect: reply
    input: "room A has 4 new messages"
    metadata: {tools: [note_create], not_tools: [note_update]}
    snapshot: &room_a
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789909891000

  - name: cognition_note_update_vs_create_open_note
    entry: dreamer
    category: cognition
    expect: reply
    input: "room A has 2 new messages; note N1 is open on this topic"
    metadata: {tools: [note_update], not_tools: [note_create]}
    snapshot: *room_a

  - name: cognition_event_propose_vs_revise_no_open_event
    entry: dreamer
    category: cognition
    expect: reply
    input: "room A has 3 new messages proposing a time and place"
    metadata: {tools: [event_propose], not_tools: [event_revise, event_set_status]}
    snapshot: *room_a

  - name: cognition_event_revise_vs_propose_open_event
    entry: dreamer
    category: cognition
    expect: reply
    input: "room A has 2 new messages; event E1 is proposed and its place just changed"
    metadata: {tools: [event_revise], not_tools: [event_propose]}
    snapshot: *room_a

  - name: cognition_event_set_status_vs_revise_cancellation
    entry: dreamer
    category: cognition
    expect: reply
    input: "room A has 1 new message saying event E1 is off"
    metadata: {tools: [event_set_status], not_tools: [event_propose]}
    snapshot: *room_a

  - name: cognition_standing_revise_vs_note_create_position_only
    entry: dreamer
    category: cognition
    expect: reply
    input: "room A has 5 new messages narrowing where dinner will be, nothing settled"
    metadata: {tools: [standing_revise], not_tools: [note_create, event_propose]}
    snapshot: *room_a

  - name: cognition_wake_at_vs_wake_move_first_self_wake
    entry: dreamer
    category: cognition
    expect: reply
    input: "event E1 is at 20:00 and its venue is still unconfirmed"
    metadata: {tools: [wake_at], not_tools: [wake_move, wake_cancel]}
    snapshot: *room_a

  - name: cognition_wake_move_vs_wake_at_pending_self_wake_due
    entry: dreamer
    category: cognition
    expect: reply
    input: "a self-wake is due: check event E1's venue; the group just pushed dinner back an hour"
    metadata: {tools: [wake_move], not_tools: [wake_at, wake_cancel]}
    snapshot: *room_a

  - name: cognition_wake_cancel_vs_wake_move_event_resolved
    entry: dreamer
    category: cognition
    expect: reply
    input: "a self-wake is due: check event E1's venue; the venue was confirmed two messages ago"
    metadata: {tools: [wake_cancel], not_tools: [wake_move, wake_at]}
    snapshot: *room_a

  - name: cognition_remind_vs_remind_move_new_brief
    entry: dreamer
    category: cognition
    expect: reply
    input: "note N1's closing condition was just met in room A"
    metadata: {tools: [remind], not_tools: [remind_move, remind_cancel]}
    snapshot: *room_a

  - name: cognition_remind_move_vs_remind_pending_own_reminder
    entry: dreamer
    category: cognition
    expect: reply
    input: "a rollup row changed: event E1's time moved; a reminder this session wrote is pending on it"
    metadata: {tools: [remind_move], not_tools: [remind, remind_cancel]}
    snapshot: *room_a

  - name: cognition_close_vs_note_update_settled_item
    entry: dreamer
    category: cognition
    expect: reply
    input: "room A has 1 new message confirming what note N1 already says, nothing new to add"
    metadata: {tools: [close], not_tools: [note_update, note_create]}
    snapshot: *room_a

  - name: cognition_record_query_vs_rollup_read_history_question
    entry: dreamer
    category: cognition
    expect: reply
    input: "room A has 2 new messages asking what was decided last week"
    metadata: {tools: [record_query], not_tools: [rollup_read]}
    snapshot: *room_a

  # ---- the two new reads (PR B, «what she can read»): `rollup_read` and
  # `standing_read`, each measured against the sibling it is confusable with.
  # SYNTHETIC, like every case above; run with `--sample 5 --reasons` on master
  # and on the branch (nora-tool §7). NOT RUN when written: a model run belongs
  # to the eval owner, and the numbers go in the PR when it has one.

  - name: cognition_rollup_read_vs_record_query_deviation
    entry: dreamer
    category: cognition
