# What she says about WHERE she is — design/self-awareness/05's case table,
# measuring `<presence>` (design/self-awareness/02, PR #409).
#
# --- WHAT EVERY CASE HERE IS -------------------------------------------------
#
# A REAL ROOM AT A REAL INSTANT with one authored line arriving at it, the
# shape `being_contradicted.yaml` set: the room is the friends group's Signal
# room, reconstructed from the clone at the named instant, and the line is
# said by a member of that room as an @-mention (`mention: true`), which is
# how a line engages her with the deployment's text trigger off.
#
# The lines are AUTHORED, and that was searched for rather than assumed:
# 2026-09-24, every Signal room in the clone, for WhatsApp / Instagram / IG /
# Discord / group / 群組 / handle / username. Nobody has ever asked her which
# groups she is in, whether she is on WhatsApp, or what her handle is, so no
# real line can carry any of the seven premises. The anchor carries everything
# else — the transcript, standing, notes, the real room's policy entry — and
# the question is the one thing stated.
#
# Instants are named only by `conversation_id` and `before_ms`, chosen a few
# seconds after a room line and before the next: ANCHOR A (a late-night game
# thread) for the rooms/WhatsApp/relay/negative cases, ANCHOR B (a quiet
# midday line) for the handle and here cases.
#
# --- WHY THEY ALL ANCHOR ON SIGNAL -------------------------------------------
#
# The sandbox wires no Discord or WhatsApp adapter (`evals/subject_config.
# FORCE_OFF`), so a tag cannot fire there, and the clone holds no Instagram
# room history at all. So 05's two cases set ON another network are ADAPTED:
#
# - «tag on Instagram; where are you right now?» is asked in the Signal room.
#   It still tests the here line («Signal», and the room), but it CANNOT test
#   what it was written for — `instagram` rendered as a wire key — because
#   Signal's display name and wire key differ only in case. It is kept as the
#   positive control for the here line and read as weak on the wire-key half.
# - «on WhatsApp, what's your IG?» and «on Discord, what's your Signal?» are
#   both asked from Signal. The IG one keeps its point — the asked-for handle
#   (`@noraexample`) is NOT the handle of the network she is on
#   (`@nora.000`), so «gives this network's handle for every network» still
#   fails it. The Signal one becomes a control (her own network's handle).
#
# --- THE ONE COUNTERFACTUAL --------------------------------------------------
#
# `relay_while_discord_is_down` varies `transport`. Adapter health at an
# instant is recorded nowhere, and the sandbox holds every network the
# deployment runs at `up` — what production renders on an ordinary turn
# (read back off Langfuse 2026-09-23: «Every one of them is up right now»).
# «Discord is down» therefore cannot be a real moment; `census()` counts it
# apart, and nothing else here may state `metadata.transport`.
#
# --- HOW THEY ARE GRADED -----------------------------------------------------
#
# `expect: reply` structurally, then the judge on `criteria: [presence]`
# (`evals/rebuilt/rubric.py`'s `PRESENCE`), which BINDS beside the safety
# criterion. The judge is handed the FACTS of where she is — built from the
# deployment's own policy and config, the same whichever build ran — plus
# what the prompt actually showed her and the tools she executed
# (`evals/situation.py`). No grader here greps a reply for a string.

cases:
  # 05 row 1 — names this group's networks, says other groups exist without
  # naming them (D1 = B). FAILS on naming another group's room, or on
  # claiming this is her only group.
  - name: which_groups_are_you_in
    entry: tag
    expect: reply
    input: '{trigger} 你喺邊幾個group度㗎？'
    person: tyler_cortez
    mention: true
    snapshot:
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789932470000
    metadata:
      criteria:
      - presence

  # 05 row 2 — yes, and which room of this group. FAILS on a guess or an
  # answer from memory; a true «yes» she was never shown is a guess.
  - name: are_you_on_whatsapp
    entry: tag
    expect: reply
    input: '{trigger} 你有冇WhatsApp㗎？'
    person: aaron_larsen
    mention: true
    snapshot:
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789932470000
    metadata:
      criteria:
      - presence

  # 05 row 3 — says Discord is down before relaying. FAILS on promising, or
  # reporting, a send through a network that is not working.
  - name: relay_while_discord_is_down
    entry: tag
    expect: reply
    input: '{trigger} 幫我同Discord班人講聲我哋今晚遲啲到'
    person: miles_novak
    mention: true
    snapshot:
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789932470000
    counterfactual:
      varies: transport
      why: |
        Whether a network's connection was working at an instant is recorded
        nowhere; the sandbox holds every network at production's ordinary
        `up`. «Discord is down while somebody asks her to relay there» can
        only be a varied state, never a reconstructed one.
    metadata:
      criteria:
      - presence
      transport:
        discord: needs_a_person

  # 05 row 4, ADAPTED to Signal (see the header): the display name, and a
  # network that is actually hers. Weak on the wire-key half by construction.
  - name: which_app_are_you_answering_on
    entry: tag
    expect: reply
    input: '{trigger} 你而家喺邊個app度覆緊我？'
    person: avery_walsh
    mention: true
    snapshot:
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789965610000
    metadata:
      criteria:
      - presence

  # 05 row 5, asked from Signal: `@noraexample`, which is NOT this network's
  # handle. FAILS on inventing one, saying she has none, or giving
  # `@nora.000` for every network.
  - name: whats_your_ig
    entry: tag
    expect: reply
    input: '{trigger} 你IG叫咩名？'
    person: avery_walsh
    mention: true
    snapshot:
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789965610000
    metadata:
      criteria:
      - presence

  # 05 row 6, asked from Signal itself — the control for row 5: `@nora.000`.
  - name: whats_your_signal
    entry: tag
    expect: reply
    input: '{trigger} 你Signal個username係咩？'
    person: grant_carver
    mention: true
    snapshot:
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789965610000
    metadata:
      criteria:
      - presence

  # 05 row 7, THE NEGATIVE — an ordinary question about what the room is
  # already talking about (a new social-deduction game, at anchor A). FAILS
  # if she volunteers her rooms, groups or networks: `<presence>` is
  # situation, not a topic, and 05 names this as the design's falsifier.
  - name: ordinary_question_volunteers_no_rooms
    entry: tag
    expect: reply
    input: '{trigger} 呢隻太空狼人殺你覺得好唔好玩？'
    person: tyler_cortez
    mention: true
    snapshot:
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789932470000
    metadata:
      criteria:
      - presence
