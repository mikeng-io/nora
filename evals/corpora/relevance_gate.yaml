- name: closed/settled-time-scrolled-out
  entry: gate
  expect: go
  category: settled_and_forgotten
  sample: 5
  parked:
    reason: P-A
    why: |
      The variable is a time SETTLED earlier and no longer in the window
      when the room asks it again. Every "what time" re-ask production holds
      has the settling line within a few rows of it, or the time was never
      settled in text at all.
    returns_when: |
      A room settles a time in text, more than the gate's window of rows
      pass, and a member asks the same time again without a name.

- name: closed/settled-place-scrolled-out
  entry: gate
  expect: go
  category: settled_and_forgotten
  sample: 5
  parked:
    reason: P-A
    why: |
      Same variable as the time case, for a place. The one "so where are we
      eating" re-ask production holds has the place named three rows above it.
    returns_when: |
      A room settles a place in text, the window scrolls past it, and a
      member asks where again.

- name: closed/settled-decision-scrolled-out
  entry: gate
  expect: go
  category: settled_and_forgotten
  parked:
    reason: P-A
    why: |
      No room has asked which option it had decided on. Decisions in these
      rooms are made and acted on in the same sitting.
    returns_when: |
      A room records a choice between named options and later asks which
      one it picked.

