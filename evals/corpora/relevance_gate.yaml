# The empty room. The case states no transcript because the absence IS the
# input under test — and a real room is never empty: a `before_ms` before a
# room's first row reads as an unknown id, and the sandbox refuses an empty
# reconstruction for exactly that reason. Parked by construction.
- name: bound/empty-room
  entry: gate
  expect: no_go
  category: not_hers
  parked:
    reason: P-A
    why: |
      No real room has ever been in this state, and a reconstruction with no
      rows is refused as indistinguishable from a wrong id.
    returns_when: |
      Never, as a snapshot. It returns only if the harness gains a way to
      state an empty room that is not a refused reconstruction.

# frag/* — a NEED assembled from fragments that are individually not a
# question. Production's one candidate ends in an explicit question mark
# (it anchors `real/weather-sham-shui-po` above); at the fragment before it
# the room has stated only where a member had been and that it was hot,
# which is a complaint, not a need — anchoring there would flip the label.
- name: frag/remembering-a-meal
  entry: gate
  expect: go
  category: whereabouts
  sample: 5
  parked:
    reason: P-A
    why: |
      No room has built a "where/when/how much was that meal" need out of
      non-question fragments. Real meal talk names the place inline.
    returns_when: |
      Two or more consecutive member lines circle a past meal without any
      of them asking, and nobody answers.

- name: frag/remembering-a-meal-with-banter-between
  entry: gate
  expect: go
  category: whereabouts
  parked:
    reason: P-A
    why: As above, with banter interleaved.
    returns_when: As above, with unrelated lines between the fragments.

- name: frag/same-need-as-one-sentence
  entry: gate
  expect: go
  category: whereabouts
  parked:
    reason: P-A
    why: |
      The control for the two above: the same need as one explicit
      sentence. No untagged member line asks where the group ate a few days
      ago; the one line that does is @-mentioned to her.
    returns_when: |
      An untagged member line asks where the group ate recently.

- name: frag/weather-fragmented
  entry: gate
  expect: go
  category: world_fact
  parked:
    reason: P-A
    why: |
      The fragments production holds resolve into an explicit question in
