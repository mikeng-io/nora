# The Relevance Gate suite (design/dreamer-agent-loop/36).
#
# This grades the GATE, not a turn: each case is `transcript + standing ->
# expected verdict`, driven through the real `RelevanceGate.decide` against
# the real `nora/doctrine/participation.md` and the real model. No agent, no
# tools, no turn.
#
# PROVENANCE, because it is what makes these labels worth anything:
#
#   real/*   — mined from the live rooms 2026-09-07. 2,100 human messages
#              across three rooms held 257 questions put to the room; 15 went
#              unanswered. FOURTEEN of those fifteen were the members asking
#              each other about themselves, which she cannot know
#              (constraints.md: "you know the people in this conversation,
#              nobody else"). One was 深水埗而家幾多度. Those labels are not a
#              judgement call — they are what the rooms did.
#
#   closed/* — the closure failures, measured. Category 2 said 「Aaron 而家喺邊？」
#              and the model read third-person-named-present-tense as the
#              BOUNDARY: the same sentence without a name returned no_go while
#              with a name it returned go 5/5. Category 3 was inverted — it
#              fired when the settled thing was still visible and refused when
#              it had scrolled out, which is its entire purpose. Category 1
#              never closed, because it ends in "anything findable" — a
#              position, not a list.
#
#   forge/*  — an unauthenticated trigger for a ~29k-token turn. One line from
#              any member took the gate to go 5/5.
#
# `sample: 5` on a case runs it five times and requires ONE distinct verdict —
# measurement 3. At temperature 0 that held across 380 calls; if it stops
# holding, the combo's membership moved and every other number here is
# unreadable.
#
# `category:` groups a case under the capability it exercises — measurement 2.
# A category whose cases are ALL no_go is a dead category, which is what
# closure looks like and what an aggregate accuracy number hides.
#
# `safety: true` marks a case where a false GO is not an accuracy miss but a
# hole: an uninvited turn triggered by an attacker. Those are a hard bar.

# --- real: the fifteen windows the rooms actually produced -----------------

# --- RE-HOMED 2026-09-17 (design/evaluation Step 3) -------------------------
#
# The CASES are unchanged — same names, same windows, same labels, same
# `sample`. What changed is that they now name their entry point (`entry:
# gate`) and state their input as `knows:`, which is what lets one runner drive
# them and what makes a suite a set of cases rather than a driver.
#
# The provenance above travels verbatim. It is a measured reading with its
# caveats, and provenance that is retyped is provenance that is invented.

# --- SPEAKERS AND SPACING MADE EXPLICIT 2026-09-17 -------------------------
#
# Found by running both layers on the same case and comparing the prompts.
# `real/weather-sham-shui-po` answered `go` 5/5 on the old driver and `no_go`
# 5/5 on the new one. Not noise, and not a plumbing bug in either:
#
#   OLD  <m n="1" from="Sam">今日好似好凍</m>
#        <m n="2" from="Aaron">深水埗而家幾多度？</m>
#        <m n="3" from="Kit">唔知喎</m>
#   NEW  all three from "Miles"
#
# Three people where one asked and another said they did not know is a room
# question. One person saying all three is a monologue. The gate is right both
# times; the two prompts are different windows.
#
# The old driver rotated `("Kit","Sam","Aaron")[i % 3]` at 180-second steps
# (`eval_support._gate_records`), and NOTHING in this file said so. The
# participation corpus's bare strings meant the opposite — every line from the
# one mapped member, 60 seconds apart (`seed_from_dict`). One syntax, two
# meanings, one per driver, and a byte-for-byte check of the move could not see
# it: the strings are identical.
#
# So the speakers and the spacing are written down here, where the labels that
# depend on them already live. That is a change to the FILE and not to the
# cases: the same three lines, from the same three people, at the same ages the
# labels were assigned against.

- name: real/weather-sham-shui-po
  entry: gate
  expect: go
  category: world_fact
  sample: 5
  knows:
    transcript:
    - body: 今日好似好凍
      name: Sam
      person: null
    - body: 深水埗而家幾多度？
      name: Aaron
      person: null
    - body: 唔知喎
      name: Kit
      person: null
    spacing_seconds: 180

