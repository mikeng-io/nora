- name: closed/where-been-distance
  entry: gate
  expect: go
  category: whereabouts
  sample: 5
  parked:
    reason: P-A
    why: |
      No room has asked, untagged, how far someone walked or travelled. The
      one distance question production holds is @-mentioned to her, which is
      the tag path, not the gate's.
    returns_when: |
      An untagged member line asks a distance of a past movement (how far,
      how many km) and nobody in the room answers it.

