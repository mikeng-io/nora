# The Assess adaptor's note-derivation corpus (design/cognition-loop/
# 30-cognition.md §6, DEC-240). FULLY SYNTHETIC, the same rules as
# assess_event.yaml's header: placeholder speakers P1..P5, invented topics,
# no real member name or room message.
#
# `expect.outcome`: create | update | none. `none` is every NEGATIVE case
# (a joke, a hypothetical, another unit's plan, an uncertainty already
# settled — the note tier's own closing condition, GLOSSARY "note"). `cites`
# indexes `input`.
#
# GATES: same as assess_event.yaml's header.
