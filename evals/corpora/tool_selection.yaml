  # --- the room tools (design/self-awareness/07) ----------------------------------
  # A same-domain pair (ADR 0015 §1), and each has a neighbour it could steal
  # from: `room_list` from `group_members` (who is HERE vs which rooms exist),
  # `room_read` from `load_transcript` (another room vs this one). The third
  # case is the negative: a membership question neither room tool answers.
  - name: route_room_list_which_groups
    entry: tag
    expect: reply
    mention: true
    input: 你喺邊幾個group度？
    metadata: {tools: [room_list], not_tools: [group_members]}
