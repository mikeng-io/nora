  # --- what the call carried: the image-generation skill (2026-09-24) ---------
  # Routing alone passes all three of these on the failure they exist for: a
  # «draw yourself» answered with an empty room and no reference was one
  # `generate_image` call, like the right answer. So each also grades the
  # ARGUMENTS (`ToolRouteGrader`'s `args_*`, read off the executed span). The
  # sha is her canonical picture's, exactly as the skill names it; the
  # resolver takes only the full sha, so a prefix would not be her either.
  # `args_date` is resolved against the clock line the turn was SHOWN, so the
  # expected Saturday moves with the day the case runs. If the deployment's
  # `[image_gen]` is enabled, each draw spends one provider call, as
  # `route_generate_image` already does. Run on norty 2026-09-24 at n=5 per
  # arm; the numbers are in design/self-reference/06 §10 and §11.
  #
  # The self case also fails on a prompt that gives her only a blank
  # backdrop (2026-09-24, live on WhatsApp): a prompt restating the
  # reference's own composition (standing, facing the viewer, «plain neutral
  # background») made the provider's edit return the reference itself. A new
  # picture of her has a setting. Each phrase below is a way of writing
  # «no setting» as the background.
  - name: route_generate_image_self_carries_her_reference
    entry: tag
    expect: reply
    mention: true
    input: draw yourself
    metadata:
      tools: [generate_image]
      args_include:
        generate_image: ["535e4da56b933c9c30ea28182ba651246ce9bc65608ebdf92363e6342ab8567c"]
      args_exclude:
        generate_image: ["neutral background", "plain background", "blank background",
                         "white background", "neutral backdrop", "plain backdrop",
                         "studio backdrop", "neutral studio"]
    snapshot: *room_a

  # GUARDS the post-fix behaviour on the closest faithful anchor; it does
  # NOT reproduce the live failure (2026-09-24, WhatsApp, defer_tools=true):
  # asked "draw yourself again" with her standing already saying she had drawn
  # herself four times that day, she called `generate_image` straight from
  # memory (no `reference`, a description written from memory) and never
  # loaded the `image-generation` skill that holds the canonical handle. The
  # fix (this branch) points the tool AT the skill instead of copying its
  # content into the tool (single source of truth, operator decision), so
  # what this grades is that the skill loads BEFORE the call and the call
  # still carries her real reference.
  #
  # Standing CANNOT be seeded with the live line, so the condition that
  # produced the failure (her believing she already knew) is not present
  # here. Standing is REPLAYED from real production folds, never authored
  # (`design/evaluation/11-the-sandbox-rebuild.md`, "standing | replayed";
  # `standing_revision` keyed by conversation and time). Querying
  # `nora_eval`'s `standing_revision` for `draw`/`portrait`/`picture of`
  # (2026-09-25) found no room whose replayed standing says this, and writing
  # one in would be a fabricated production row in a fixture (AGENTS.md
  # "Never paste production rows into a fixture"). So this reuses room_a, the
  # anchor the two cases above already establish, and states the repetition
  # IN THE ASK ("again") instead of in standing, measured on norty at 5/5 PASS
  # on BOTH master and this branch (2026-09-25): the case cannot distinguish
  # the fix from its absence, so it guards the behaviour going forward rather
  # than proving the fix moved anything. The order and argument checks below
  # hold regardless of what standing says, because they are what the tool's
  # own description now controls on every call: `before` fails if
  # `generate_image` executes before the first `skills` call, and
  # `args_include` fails on an empty `skills` call list if the skill is never
  # loaded at all (0015/0016).
  - name: route_generate_image_self_again_loads_the_skill_first
    entry: tag
    expect: reply
    mention: true
    input: draw yourself again
    metadata:
      tools: [generate_image]
      before: {skills: [generate_image]}
      args_include:
        skills: ["image-generation"]
        generate_image: ["535e4da56b933c9c30ea28182ba651246ce9bc65608ebdf92363e6342ab8567c"]
    snapshot: *room_a

  # The live request after #456 deployed (2026-09-24). She left her reference
  # off, as she should, and then wrote her OWN rendering into the prompt
  # («stylized 3D mascot», «collectible-character quality»): her look is not a
  # house style. «mascot» and «collectible» are words only her appearance
  # section supplies; a request for a plain picture of a pet never does.
  - name: route_generate_image_not_her_leaves_the_reference_off
    entry: tag
    expect: reply
    mention: true
    input: draw a cat sleeping on a laptop
    metadata:
      tools: [generate_image]
      args_exclude: {generate_image: ["535e4da5", "mascot", "collectible"]}
    snapshot: *room_a

  # Was «make a poster for this Saturday's dinner» until 2026-09-24. Run on
  # norty at n=5 per arm, it collided with the room's REAL calendar: room A
  # has a dinner planned on another day that week, and 8 of 10 draws on #469
  # wrote that event's date instead of «this Saturday», absolutely and
  # correctly per the event, and were graded FAIL. The case measured which
  # dinner she believed, not whether she writes a date out. A picnic is
  # nothing the room has planned, so «this Saturday» has one reading.
  - name: route_generate_image_poster_writes_the_date_out
    entry: tag
    expect: reply
    mention: true
    input: make a poster for a picnic this Saturday
    metadata:
      tools: [generate_image]
      args_date: {generate_image: saturday}
      args_exclude: {generate_image: ["this saturday", "tomorrow", "today"]}
    snapshot: *room_a

  # A reel or post SHARED into a room (2026-09-24). Live, a shared reel arrived
  # as `[shared reel by @x <link>] [image <handle>]`; asked "what is in this
  # reel", she called only `media_fetch` on the handle, which is the reel's
  # still cover, and told the room she could see one frame and not the clip,
  # with `instagram_read` in the turn and the link in the line. #454 renamed
  # the handle `[cover image …]` and made `media_fetch` say it served only the
  # cover; live again the same day, twice, she still called only `media_fetch`
  # on the cover, got a real one-frame reading with that note, and answered
  # from the frame. The eval had said most runs would route right, because
  # its handle was typed and `media_fetch` on it FAILED, which pushed her to
  # the link; live it succeeds and the turn ends.
  #
  # So the parser now drops the picture from a share whose link validated
  # (design 13, «a linked share carries no picture»), and these inputs are
  # EXACTLY that rendering: the sharer's words, then the shared line with its
  # link, and no handle. The input now matches production, which removes the
  # typed-handle distortion. Two differences from the live turn remain,
  # stated: the line is in the tag message rather than the one before it
  # (this corpus has no path for an authored prior line; R1,
  # `evals/scenarios.py`), and the room is room A, a Signal room (no
  # Instagram room is anchored in any corpus yet).
  #
  # The ORDER criterion (`before`) stays: `media_fetch` before
  # `instagram_read` is a FAIL. With no handle, the one `media_fetch` left is
  # one on the link itself, which now answers at once that the link is an
  # Instagram page and names `instagram_read`; after the read (watching a
  # file the read returned) is the intended chain. See `ToolRouteGrader`.
  # Every handle, code and shortcode here is synthetic.
  - name: route_instagram_read_shared_reel
    entry: tag
    expect: reply
    mention: true
    input: what is in this reel [shared reel by @synth.example https://www.instagram.com/reel/SynthReel02/]
    metadata:
      tools: [instagram_read]
      not_tools: [web_fetch, x_read, instagram_search]
      before: {instagram_read: [media_fetch]}
    snapshot: *room_a

  - name: route_instagram_read_shared_reel_yue
    entry: tag
    expect: reply
    mention: true
    input: 呢條 reel 講咩 [shared reel by @synth.example https://www.instagram.com/reel/SynthReel02/]
