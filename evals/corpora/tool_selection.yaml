  # --- the sub-agent (design/subagent §3, DEC-283) ---------------------------------
  # `subagent_create` against what one reply or one tool call answers. ON ARM ONLY for the
  # positives (`route_subagent_create_*`): the four tools are withheld from every surface
  # unless `[subagent] enabled` (`ToolRegistry._withheld`), so with it off they FAIL by
  # construction. Run them with `--case` on a subject whose config has `[subagent] enabled =
  # true` (which needs `[dreamer]`, `[compute]`, `[computer]` and `[documents]`). The three
  # negatives are valid on BOTH arms: off, nothing can be handed over, so they pass trivially;
  # on, they are the measurement that a short question, a sum or ONE document does not become
  # a background job.
  #
  # NOT COVERED, stated: `subagent_read`, `subagent_list` and `subagent_cancel` need a job in
  # the room, which no sandbox seeds into the clone, so their routing is a live read-back.
  - name: route_subagent_create_archive_conversion
    entry: tag
    expect: reply
    mention: true
    input: >-
      I put a zip with 8 planning sheets in your computer's inbox. Rebuild all 8 as
      separate documents that read well on a phone. It will take a while, so just tell me
      when they are done.
    metadata: {tools: [subagent_create], not_tools: [document_publish, computer_run]}
    parked:
      reason: P-A
      why: |
        The sandbox's computer holds no zip in its inbox, so every draw (5/5) correctly
        inspects the inbox with computer_run and finds nothing: the eval cannot reproduce
        the live input, and a pass or a fail here would measure the empty inbox, not the
        routing.
      returns_when: |
        The sandbox can hold a real archive in the inbox, or the first real archive job
        is read back live and its routing is measured there.

  - name: route_subagent_create_research_then_write
    entry: tag
    expect: reply
    mention: true
    input: >-
