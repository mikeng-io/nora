  # --- what the call carried: the image-generation skill (2026-09-24) ---------
  # Routing alone passes all three of these on the failure they exist for: a
  # «draw yourself» answered with an empty room and no reference was one
  # `generate_image` call, like the right answer. So each also grades the
  # ARGUMENTS (`ToolRouteGrader`'s `args_*`, read off the executed span). The
  # sha is her canonical picture's, exactly as the skill names it; the
  # resolver takes only the full sha, so a prefix would not be her either.
  # `args_date` is resolved against the clock line the turn was SHOWN, so the
  # expected Saturday moves with the day the case runs. If the deployment's
  # `[image_gen]` is enabled, each draw spends one provider call, as
  # `route_generate_image` already does. UNRUN as of 2026-09-24.
  - name: route_generate_image_self_carries_her_reference
    entry: tag
    expect: reply
    mention: true
    input: draw yourself
    metadata:
      tools: [generate_image]
      args_include:
        generate_image: ["535e4da56b933c9c30ea28182ba651246ce9bc65608ebdf92363e6342ab8567c"]
    snapshot: *room_a

  - name: route_generate_image_not_her_leaves_the_reference_off
    entry: tag
    expect: reply
    mention: true
    input: draw a cat on a laptop
    metadata:
      tools: [generate_image]
      args_exclude: {generate_image: ["535e4da5"]}
    snapshot: *room_a

  - name: route_generate_image_poster_writes_the_date_out
    entry: tag
    expect: reply
    mention: true
    input: make a poster for this Saturday's dinner
    metadata:
      tools: [generate_image]
      args_date: {generate_image: saturday}
      args_exclude: {generate_image: ["this saturday", "tomorrow", "today"]}
    snapshot: *room_a

  # A reel or post SHARED into a room (2026-09-24). Live, a shared reel arrived
  # as `[shared reel by @x <link>] [image <handle>]`; asked "what is in this
  # reel", she called only `media_fetch` on the handle, which is the reel's
  # still cover, and told the room she could see one frame and not the clip,
  # with `instagram_read` in the turn and the link in the line. The fix renders
  # the handle as `[cover image …]`, makes `media_fetch` say it served only the
  # cover, and widens `instagram_read`'s when-clause to a shared post or reel.
  #
  # THE SHAPE, and what it cannot carry. The live share was one message and the
  # question the next; this corpus has no path for an authored prior line (R1,
  # `evals/scenarios.py`: a case's history is a real room's, never written by
  # hand). So the share rides IN the tag message, rendered exactly as the
  # Instagram parser renders a share that came with text: the sharer's words,
  # then the shared line, then the cover placeholder. That is a real production
  # shape (a `shared` object with `text` beside it), anchored in room A like
  # every case here. It differs from the live failure in three stated ways:
  # the line is in the tag message rather than the one before it; the room is
  # room A, a Signal room (no Instagram room is anchored in any corpus yet);
  # and the handle was typed, not held, so it names no blob and a
  # `media_fetch` on it answers `nothing_found` or `unavailable`, not the
  # one-frame `ok` that ended the live turn. That difference is why these
  # cases carry an ORDER criterion (`before`): with no blob behind the handle,
  # a `media_fetch` finds nothing and she may then open the link, so
  # "instagram_read ran" would pass the defect. `media_fetch` BEFORE
  # `instagram_read` is a FAIL; after it (watching the video the read
  # returned) is the intended chain. See `ToolRouteGrader`.
  #
  # `route_instagram_read_shared_reel_bare_image` keeps the PRE-FIX rendering
  # (`[image …]`) on purpose. The input is authored, so the label half of the
  # fix cannot move between two arms of the other three; this one isolates the
  # when-clause (run it on master and on the branch). Every handle, code and
  # shortcode here is synthetic.
  - name: route_instagram_read_shared_reel
    entry: tag
    expect: reply
    mention: true
    input: what is in this reel [shared reel by @synth.example https://www.instagram.com/reel/SynthReel02/] [cover image c0de01]
    metadata:
      tools: [instagram_read]
      not_tools: [web_fetch, x_read, instagram_search]
      before: {instagram_read: [media_fetch]}
    snapshot: *room_a

  - name: route_instagram_read_shared_reel_yue
    entry: tag
    expect: reply
    mention: true
    input: 呢條 reel 講咩 [shared reel by @synth.example https://www.instagram.com/reel/SynthReel02/] [cover image c0de01]
    metadata:
      tools: [instagram_read]
      not_tools: [web_fetch, x_read, instagram_search]
      before: {instagram_read: [media_fetch]}
    snapshot: *room_a

  - name: route_instagram_read_shared_post
