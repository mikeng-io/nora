  # file_fetch (design/external-files §3, S3): a shared document, sheet or
  # deck link reaches her as a link handle (`[Google Doc link …]`), so the
  # call is `file_fetch(code=…)`, never `web_fetch` on a sign-in page. The
  # control below keeps a plain web page with `web_fetch`. The file ids are
  # synthetic: the eval subject carries the live `[external_files]` and
  # `[google]` through, so a call reaches Drive and is refused or not found,
  # and a draw may then try a sibling tool. A grade here reads which tool
  # was reached for, not whether the file opened (S4 eval, 2026-10-11).
  - name: route_file_fetch_shared_doc
    entry: tag
    expect: reply
    mention: true
    input: 幫我睇下呢份doc講咩，三句講晒 https://docs.google.com/document/d/1SynthDocRoute00000000000/edit?usp=sharing
    metadata: {tools: [file_fetch], not_tools: [web_fetch, document_read, computer_read]}
    snapshot: *room_a

  - name: route_file_fetch_shared_sheet
    entry: tag
    expect: reply
    mention: true
    input: https://docs.google.com/spreadsheets/d/1SynthSheetRoute000000000/edit 張表總共預咗幾多錢？
    metadata: {tools: [file_fetch], not_tools: [web_fetch, computer_import, web_search]}
    snapshot: *room_a

  # Putting a shared sheet on her computer to compute on is `computer_import`
  # with the link (S4, design/external-files §5): the copy is the import
  # tool's, never `file_fetch` (a read into the reply) and never `web_fetch`.
  # Same synthetic-id caveat as above: a refused copy can be followed by a
  # `file_fetch`, which this case grades as a FAIL.
  - name: route_computer_import_shared_sheet
    entry: tag
    expect: reply
    mention: true
    input: 將呢張表放上你部電腦，計下每個月平均使咗幾多 https://docs.google.com/spreadsheets/d/1SynthSheetCopyIn00000000/edit
    metadata: {tools: [computer_import], not_tools: [file_fetch, web_fetch]}
    snapshot: *room_a

  # A shared PHOTO is looked at, not read: `media_fetch` asks the same
  # external-files source for the file's bytes (design/external-files §2,
  # 2026-10-11), so the call is `media_fetch`, never `file_fetch` (text) or
  # `web_fetch` (a sign-in page). The file id is synthetic, but the eval
  # subject IS wired to Drive: the call is refused or not found, and a draw
  # may then fall back to a sibling. A grade reads routing only.
  - name: route_media_fetch_shared_photo
    entry: tag
    expect: reply
    mention: true
    input: 呢張相影咗咩？ https://drive.google.com/file/d/1SynthPhotoRoute000000000/view
    metadata: {tools: [media_fetch], not_tools: [web_fetch, file_fetch]}
