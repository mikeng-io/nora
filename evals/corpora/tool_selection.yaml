    metadata: {tools: [computer_browse], not_tools: [computer_run]}
    snapshot: *room_a

  - name: route_generate_image_not_the_computer
    entry: tag
    expect: reply
    mention: true
    input: 畫張維港夜景俾我，要有煙花
    metadata: {tools: [generate_image], not_tools: [computer_run]}
    snapshot: *room_a

  # --- S3a: files in and out of the computer, and the computer-use skill -----
  # ON ARM ONLY, like the computer-positive cases above: with `[computer]` off
  # the tools are withheld and these FAIL by construction. No export-to-link
  # case: a document is the document path's (ADR 0020, operator 2026-10-01),
  # not `computer_export`'s.
  #
  # A simulation is code, never a sum: computer_run chosen for it over
  # calculate. This was `route_computer_run_loads_computer_use`, which also
  # required a `computer-use` skill load before the run. Measured 2026-10-01
  # on the eval VM at b2492770, n=5: the route right in every draw, the skill
  # loaded in 1 of 5. Operator decision the same day: the expectation was
  # wrong, not the model. What she must know (files only, no web pages, no
  # internet, import and export) is in the tools' descriptions and results;
  # the skill is guidance for multi-step project work, and a one-shot job
  # does not need it. So the case measures the route only, not a skill load.
  - name: route_computer_run_simulation
    entry: tag
    expect: reply
    mention: true
    input: >-
      write a python script on your computer that simulates rolling two dice
      100000 times and tells me how often the total is 7, then run it
    metadata: {tools: [computer_run], not_tools: [calculate]}
    snapshot: *room_a

  # Import of a sent file. The anchor carries no attachment of this code, so
  # a correct turn calls `computer_import` and gets an honest
  # `nothing_found`: graded on the call, like the other tools here that
  # answer `unavailable` in the sandbox. `media_fetch` is the sibling it
  # could steal from (it reads a picture; it cannot put a file on the
  # computer).
  - name: route_computer_import_attachment
    entry: tag
    expect: reply
    mention: true
    input: >-
      [file 3fa9c2] 呢個CSV放入你部電腦，用python計每個城市嘅平均溫度
    metadata: {tools: [computer_import], not_tools: [media_fetch]}
    snapshot: *room_a

  # --- documents (design/artifact/00-design.md §26, ADR 0020) ----------------------
  # `document_publish` against the tools a written piece could be mistaken for:
  # `note_create` (a private memory, not a page), `generate_image` and the
  # computer (a FILE: CSV, PDF, a script's output). The HTML path it replaced
  # (the artifact tool) was retired in S3b, so it is no longer a `not_tools` entry.
  #
  # ON ARM ONLY for the positives (`route_document_publish_*`), exactly as the
  # computer's: both document tools are withheld from every surface unless
  # `[documents] enabled` (`ToolRegistry._withheld`), so with it off these cases
  # FAIL by construction and measure nothing about routing. Run them with `--case`
  # on a subject whose config has `[documents] enabled = true`. The three
  # negatives (`route_*_not_a_document`) are valid on BOTH arms: off, nothing can
  # be published, so they pass trivially; on, they are the measurement that a
  # quick answer, a picture or a data file does not become a document.
  #
  # The file negative is the computer's: a CSV the user asks to be handed is made
  # with `computer_run` and sent with `computer_export`, never published as a
  # document (operator 2026-10-01: a document is the document path's, a file the
  # computer's). Like the computer positives it needs `[computer] enabled`; with
  # it off the tool is withheld and the case fails by construction.
  - name: route_document_publish_trip_plan
    entry: tag
    expect: reply
    mention: true
    input: >-
      幫我整份12月東京旅行計劃，每日行程同預算都要有，整好之後我想喺網頁開返嚟睇
    metadata: {tools: [document_publish], not_tools: [note_create]}
    snapshot: *room_a

  # Was `route_document_publish_room_summary` («write up what we decided about
  # the trip»). Measured 2026-10-01, n=5, on the room A anchor: 0 of 5, every
  # draw searched memory and the transcript for decisions the room does not hold
  # until the repeat guard stopped it, and none reached a write. The expectation
  # measured the anchor (no recorded decision), not the route, so the input now
  # asks for a written piece that needs nothing recalled.
  - name: route_document_publish_comparison
    entry: tag
    expect: reply
    mention: true
    input: >-
      write a proper document I can open later comparing Tokyo and Osaka for a
      week in December: a section for each, then which one you would pick
    metadata: {tools: [document_publish], not_tools: [note_create]}
    snapshot: *room_a

  - name: route_calculate_not_a_document
    entry: tag
    expect: reply
    mention: true
    input: 12月12號去到19號，一共幾晚？
    metadata: {tools: [calculate], not_tools: [document_publish]}
    snapshot: *room_a

  - name: route_generate_image_not_a_document
    entry: tag
    expect: reply
    mention: true
    input: 畫張東京鐵塔日落俾我
    metadata: {tools: [generate_image], not_tools: [document_publish]}
    snapshot: *room_a

  - name: route_csv_file_not_a_document
    entry: tag
    expect: reply
    mention: true
    input: >-
      make me a CSV file of these and send it to me: Tokyo 5 nights 4200,
      Osaka 3 nights 2100, Kyoto 2 nights 1800 (city, nights, budget)
    metadata: {tools: [computer_export], not_tools: [document_publish]}
    snapshot: *room_a

  # A question the chat answers. Graded like the other negatives, on a tool she
  # MAY reach for (`web_search` or `weather`: this grader needs one acceptable
  # tool, so «answered from memory with no call» grades FAIL here, which is a
  # limit of the instrument and not a defect to tune against). What the case
  # measures is `not_tools`: a short factual question does not become a document.
  - name: route_quick_question_not_a_document
    entry: tag
    expect: reply
    mention: true
    input: 東京十二月冷唔冷？簡單答我就得
    metadata: {tools: [web_search, weather], not_tools: [document_publish, document_read]}
    snapshot: *room_a

  # Changing a document she did not just make. ORDER, not choice: `document_read`
  # must run before any `document_publish`, because a publish that names a
  # `document_id` must carry the revision she read (`base_revision`). The id in
  # the input exists in no sandbox (nothing seeds a document into the clone), so
  # the read honestly answers `not_found`; what passes is reading first and not
  # publishing over an id she could not read. LIMIT, stated: live, the id comes
  # from her own earlier publish result in the window, here it arrives typed in
  # the message, so this measures the order and not whether she finds the id.
  # The `args_include` check is deliberately absent: with `not_found` she has no
  # revision to pass, so a publish here would be the error, not the pass.
  - name: route_document_read_before_edit
    entry: tag
    expect: reply
    mention: true
    input: >-
      add a section on visas to the document you made, id
      3f9c1d52-7a4e-4b8e-9f06-2d1c5a7b8e10
    metadata:
      tools: [document_read]
      before: {document_read: [document_publish]}
    snapshot: *room_a

  # Changing a document from LATER in the room, where she can only know its id from
  # `<documents>`. The document is seeded into the room (`metadata.documents`, so the
  # run needs a subject with `[documents]` on) and is named nowhere in the message or
  # the transcript: the id she must pass to `document_read` is in the block and nowhere
  # else. The fixed id is what `args_include` looks for. ORDER as in
  # `route_document_read_before_edit` (read, then publish with `base_revision`).
  - name: route_document_revise_id_only_in_the_block
    entry: tag
