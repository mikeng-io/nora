  # --- memory_search (DEC-316, operator ruling 2026-10-16) ----------------------
  # `[memory.index] read` selects ONE memory surface: the graph's
  # (`memory_search`) or Honcho's (`ask_memory`, `search_memory`,
  # `search_memory_workspace`, `who_said`, `about`), never both.
  # `load_transcript` and `remember` are on both. These cases measure
  # `memory_search`'s routing against the neighbours on its own surface it
  # could take from, or lose to: `where_been` (where someone's phone has
  # been), `media_search` (pictures by what they show) and `lookup_person` (who
  # a name in this chat is). `about` is a Honcho tool and is not on the graph
  # surface at all (operator ruling 2026-10-17), so no graph case names it: a
  # profile question there is `memory_search` with `person`. The time and kind cases also check the narrowing reaches the
  # call (`args_include`).
  #
  # `memory_surface: graph` runs only under `python -m evals --memory-index`;
  # `memory_surface: honcho` only without it (`evals.scenarios.MEMORY_SURFACES`).
  # On a master checkout, which predates the key, the graph cases run and FAIL
  # by construction (no `memory_search` there). Synthetic inputs; `Miles` is
  # the corpus's one member name.
  # `memory_read` has no case here: its id comes from a `memory_search` result
  # in the same turn, which a one-message tag case cannot put in front of it.
  - name: route_memory_search_discovery_not_node_read
    entry: tag
    expect: reply
    mention: true
    input: What did we discuss about dinner last month?
    metadata: {tools: [memory_search], not_tools: [memory_read], memory_surface: graph}
    snapshot: *room_a

