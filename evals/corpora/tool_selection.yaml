  # --- per-network social reads (design/instagram-adoption/18, P5, P11) -------
  # `instagram_read` takes a PERSON by name; `instagram_search` finds ACCOUNTS
  # from free text (P11); `social_fetch` is X only. The names are synthetic and
  # need not be in the room: an honest `nothing_found` is still a correctly
  # routed call.
  - name: route_instagram_read_story
    entry: tag
    expect: reply
    mention: true
    input: Quinn個IG story而家有咩？
    metadata: {tools: [instagram_read], not_tools: [social_fetch, web_search]}
    snapshot: *room_a

  - name: route_instagram_read_posted
    entry: tag
    expect: reply
    mention: true
    input: Quinn最近喺IG post咗啲咩？
    metadata: {tools: [instagram_read], not_tools: [social_fetch, web_search]}
    snapshot: *room_a

  # Was `route_social_fetch_instagram_search` (P5): the same message, which
  # routes to `instagram_search` since P11 moved the verb off `social_fetch`.
  - name: route_instagram_search_account
    entry: tag
    expect: reply
    mention: true
    input: 幫我喺IG search下有冇香港行山嘅account
    metadata: {tools: [instagram_search], not_tools: [social_fetch, instagram_read]}
