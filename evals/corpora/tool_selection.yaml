# S2 — tool routing (design/tool-catalogue/05-measurement.md §2c).
#
# THE QUESTION: does she reach for the right tool? Asked of the SAME cases on
# both sides of `[llm] defer_tools` — every schema resident vs six resident and
# the rest a one-line catalogue loaded with `load_tools` — because a number
# from one side only is incomparable to the other (the prompt, and with it the
# prefix cache, changes with the switch).
#
# WEIGHTED TOWARD CONFUSABLE PAIRS, because that is where selection errors
# concentrate and where a one-line catalogue entry is thinnest:
# where_is/where_been, find_parking/parking_status, route/transit,
# event_propose/event_revise, weather/web_search. Each such case names the
# sibling in `not_tools`: calling it is the error the pair exists to catch.
# The rest are single cold tools, so a turn that never loads anything is
# visible as a FAIL rather than hidden behind a hot tool.
#
# GRADED ON WHAT EXECUTED (`NORA_TOOLS`, Strands' own `execute_tool` spans),
# never on the reply. Many of these tools answer `unavailable` in the sandbox
# (no presence feed, no route key): that is fine — the question is which one
# she CALLED, and an honest `unavailable` is still a correctly routed call.
# `load_tools` is plumbing and `ToolRouteGrader` drops it before grading.
#
# ANCHOR: ROOM A of `injections.yaml` — a real Signal room at a measured
# instant (its last real message + ~1s). Signal because a case that speaks
# must anchor where the sandbox has an adapter (Discord's is off), which also
# means no music verbs: they are Discord-only and out of this scope.
# `mention: true` because the deployment's text trigger is off; a structural
# mention is how a message engages her.
#
# `input` is the tag message — authored, as every tag corpus's is. What she
# KNOWS is the room's real state at `before_ms`, read from the clone.
#
# Run with `--sample 3` at least: one draw of a stochastic process is not a
# reading of it (eval-numbers-are-not-rates).

