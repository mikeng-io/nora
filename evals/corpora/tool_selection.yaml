    metadata: {tools: [group_members], not_tools: [room_list, room_read]}
    snapshot: *room_a

  # --- hot-set control -----------------------------------------------------------
  # Resident on both sides, so it should NOT move. If it does, the change moved
  # something other than cold-tool reach.
  - name: route_web_search_control
    entry: tag
