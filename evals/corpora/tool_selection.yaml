  # design/social-per-network/30-link-owner-registry.md, "Migration" PR 2:
  # X and LinkedIn register in the link-owner registry, so `web_fetch`/
  # `media_fetch` now REDIRECT a pasted page link instead of fetching it.
  # These two are NOT `route_x_read_link`/`route_linkedin_read_profile_link`
  # again (:321, :341 above): those forbid `web_fetch` outright (`not_tools`),
  # so they grade whether the model already knows the right tool and never
  # touch this PR's mechanism — reverting the whole registry leaves them
  # green, because a model that reaches for `x_read` directly never asks
  # `web_fetch` anything. These two PERMIT `web_fetch` (it is not in
  # `not_tools`) and only require that the owner is called with the right
  # link — no `before:` ordering. A live run (n=5, deployed build) measured
  # this UNSTABLE at 4 PASS / 1 FAIL with `before: {web_fetch: [x_read]}`:
  # the failing draw ran `x_read, x_read, web_fetch` — she read the post with
  # `x_read` FIRST, exactly the right call, then made an unrelated later
  # `web_fetch` call, and the grader failed the whole case on `x_read`
  # running before `web_fetch`. The case's intent is only that she ends up
  # calling the owner with the right link; it never needed to say anything
  # about a LATER, unrelated `web_fetch` call, so the ordering constraint was
  # an anchor defect, not a model one, and is dropped here (and never added
  # to the PR-3 case below). `args_include` is the link WITHOUT its scheme
  # (`x_read`/`linkedin_read` accept either — design 30 "What each owning
  # tool accepts"), so a call that dropped the scheme along the way still
  # matches. The id and handle are synthetic.
  - name: route_x_read_link_owner_registry
    entry: tag
    expect: reply
    mention: true
    input: https://x.com/synth_pr2_user/status/9200000000000000001 what does this say?
    metadata:
      tools: [x_read]
      not_tools: [x_search, instagram_read, instagram_search]
      args_include:
        x_read: ["x.com/synth_pr2_user/status/9200000000000000001"]
    snapshot: *room_a

  - name: route_linkedin_read_link_owner_registry
    entry: tag
    expect: reply
    mention: true
    input: https://www.linkedin.com/in/synth-pr2-person what does this say?
    metadata:
      tools: [linkedin_read]
      not_tools: [linkedin_search, x_read, instagram_read]
