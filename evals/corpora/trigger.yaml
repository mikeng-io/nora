# Trigger cases (spec E.4 / B.2): 12 realistic Cantonese/English-mixed group-chat
# lines that all genuinely contain the literal trigger "nora.000" in a way `is_tagged`
# (nora/tag.py) fires on — plain, punctuated, bracketed, mid-sentence, case-varied,
# CJK-punctuation-adjacent, and CJK-glued-with-no-space (CJK characters are not
# "word characters" per the trigger's boundary rule, so gluing Chinese text directly
# against the token does not block a match the way an ASCII letter/digit/underscore
# would).

# --- RE-HOMED 2026-09-17 (design/evaluation Step 4) -------------------------
#
# These cases were driven by `evals/run.py`'s `_invoke_agent`, whose own
# docstring says what it is:
#
#   **NOT NORA.** [...] What this therefore does NOT have -- every one of these
#   is part of Nora: `build_prefill` and every `ContextBlock`, the framing every
#   block carries in its own opening tag saying what it is and that it is not an
#   instruction, `<standing>` / `<notes>` / `<self_card>` / `<peer_card>`, the
#   real tool registry, `ReplyGuard` / `LeakGuard` / `Deliverer`.
#
# `entry: tag` is `Dispatcher.on_message` -- the call a platform adapter's
# `listen()` loop makes. Every one of those blocks and guards is present,
# because none of them is passed in.
#
# The CASES are unchanged: same names, same inputs, same transcripts, same
# labels. What a number from them MEANS has changed, and that is the move.
#
# TWO SHAPE CHANGES, both argued rather than silent:
#
#   `transcript:` is now `knows.transcript:` -- prior room messages are things
#   she KNOWS, written into the real record store, not a block pasted into a
#   prompt. That is the difference between this layer and the one it replaces.
#
#   `criteria:` is now `expected_output:` -- one name for "what a good answer
#   looks like", so a judge has one field to read instead of two that mean the
#   same thing in different files.
#
# `config:` states the trigger these corpora are built on. It belongs to the
# file and not to any case: `no_trigger.yaml`'s twelve entries are near-misses
# of this exact string, and a different trigger would make every one of them a
# hit while the suite reported a perfect score for a rule it had stopped
# testing.
#
# `expect: reply` -- these twelve lines all genuinely contain the trigger, so
# the deployment must ENGAGE. That property is now measured against
# `nora/tag.py` inside the real ingest pipeline. It was previously stated only
# in `metadata.trigger` and in a comment, which is why these two corpora had no
# runner: an expectation nothing reads cannot be graded.

config:
  engagement.trigger.text: "nora.000"

cases:
  - name: dinner_time_cantonese
    entry: tag
    expect: reply
    input: nora.000 幾點食飯
    expected_output: 答返實際時間，或者話未有共識
    metadata:
      trigger: true
      prefill_sufficient: true

  - name: what_time_english
    entry: tag
    expect: reply
    input: nora.000 what time we meeting
    expected_output: states a concrete time, or says it's still TBD
    metadata:
      trigger: true
      prefill_sufficient: true

  - name: punctuated_call
    entry: tag
    expect: reply
    input: hey nora.000! 醒吓我哋而家幾點
    expected_output: reminds the group what time it is
    metadata:
      trigger: true
      prefill_sufficient: true

  - name: parenthetical_call
    entry: tag
    expect: reply
    input: (nora.000) 可以幫手訂位嗎
    expected_output: offers to help or explains it can't book directly
    metadata:
      trigger: true
      prefill_sufficient: true

  - name: mid_sentence_mixed
    entry: tag
    expect: reply
    input: 我哋而家傾緊呢件事, nora.000 你有咩意見
    expected_output: gives an opinion grounded in the conversation so far
    metadata:
      trigger: true
      prefill_sufficient: true

  - name: case_insensitive_call
    entry: tag
    expect: reply
    input: NORA.000 你喺唔喺度
    expected_output: confirms it's present and listening
    metadata:
      trigger: true
      prefill_sufficient: true

  - name: bracket_call
    entry: tag
    expect: reply
    input: '[nora.000] 可唔可以幫我睇吓呢個'
    expected_output: looks at what's being asked and responds to it
    metadata:
      trigger: true
      prefill_sufficient: true

  - name: cjk_punctuation_boundary
    entry: tag
    expect: reply
    input: nora.000，聽日放唔放假
    expected_output: answers whether tomorrow is a day off, or says it doesn't know
    metadata:
      trigger: true
      prefill_sufficient: true

  - name: english_question_thin_prefill
    entry: tag
    expect: reply
    input: nora.000 can you check the group chat history
    expected_output: reads more of the buffer before answering (thin pre-fill)
    metadata:
      trigger: true
      prefill_sufficient: false

  - name: mixed_help_request_thin_prefill
    entry: tag
    expect: reply
    input: nora.000 幫手check下今日有咩安排
    expected_output: reads more of the buffer before answering (thin pre-fill)
    metadata:
      trigger: true
      prefill_sufficient: false

  - name: casual_greeting_tag
    entry: tag
    expect: reply
    input: 早晨 nora.000 起身未
    expected_output: a light, casual morning reply
    metadata:
      trigger: true
      prefill_sufficient: true

  - name: glued_cjk_call
    entry: tag
    expect: reply
    input: 快啲nora.000快啲覆我
    expected_output: a quick, direct reply
    metadata:
      trigger: true
      prefill_sufficient: true
