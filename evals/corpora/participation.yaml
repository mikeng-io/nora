# --- S3: the commitment follow-up ------------------------------------------
#
# The `-known` half needs the room's STANDING to record a commitment she made
# and has not reported back on. No such moment is recoverable: standing
# history begins 2026-09-20 in one room, and every revision it holds says in
# terms that she committed to nothing. Parked, not deleted — the case is
# right, the room has not produced it.
#
# The `-unknown` half is a real room three days after she had recommended
# venues for a dinner and nobody had booked or asked her to: a member asks
# the room whether it got booked. Nobody addressed her, nothing in the room
# says she owed an answer, so silence is the right call.

- name: commitment-followup-known
  entry: participation
  expect: speak
  sample: 5
  input: so did anyone book the restaurant for Saturday?
  parked:
    reason: P-A
    why: |
      Needs a standing that records a commitment SHE made and has not yet
      reported back on. `standing_revision` begins 2026-09-20 (one room) and
      every revision there states she committed to nothing; before that floor
      no standing is reconstructable at all. No real room has produced the
      moment.
    returns_when: |
      A room's standing history holds a revision, at or after the revision
      floor, whose body records a commitment of hers that is still open at
      that instant.

- name: commitment-followup-unknown
  entry: participation
  expect: silence
  sample: 5
  input: 咁27號嗰餐訂咗位未？
  person: tyler_cortez
  snapshot:
    platform: signal
    conversation_id: "x5hcBMQITtdUfSC0o9AHsqJKU7ywYMrOG5hcBMQITtc="
    before_ms: 1788782000000

