# --- S11: the room's name for her --------------------------------------------
#
# A real room, one evening: a member addressed her by a running joke name and
# she answered to it; six minutes later a second member said the same line.
# The `-known` instant is one millisecond before that second line, said here
# untagged by the member who really said it: the window holds the room using
# the name and her answering to it. The `-unknown` instant is one millisecond
# before the FIRST use — the same line, untagged, at a moment when nothing in
# the room had yet tied that name to her.
#
# Written to be cut on Honcho (issue #210). The room's own transcript carries
# the cut; a replayed peer card would add a second reading of the same fact,
# not a different one.

