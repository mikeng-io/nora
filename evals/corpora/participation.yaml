# --- FIVE PURE-NO CASES CONVERTED TO REAL MOMENTS 2026-09-21 ---------------
#
# `knows:` -> `snapshot:` for the five below. Each names a REAL room's REAL
# instant whose actual trailing rhythm is the same SHAPE the authored `input`
# already was (a link drop, a private aside, a bare ack, a laugh at a meme, a
# service line) — untagged banter with no address to Nora and nothing that
# should pull her in. `input` is UNCHANGED, deliberately: it is not read back
# out of the room (the match report already established none of these
# authored lines exist verbatim in production), it is the thing arriving on
# TOP of the real window, and the real window is what makes silence the
# genuinely right call rather than an assertion about it. `transcript_limit:
# 40` mirrors the window size a real participation turn actually reads
# (`nora.subject.obtain.room_for`'s own docstring cites `recent(limit=40)`).
#
# The ten twin pairs below (S1-S5's `-known`/`-unknown` halves) are NOT
# converted — see the corpus-wide note above this block's own reasoning
# doesn't repeat: a twin pair's whole point is one transcript, only the
# grounding cut between the two halves, and a real room either held a note at
# an instant or it did not. There is no real counterfactual "the same
# instant, minus the note" to anchor the `-unknown` half against, so
# converting only the `-known` half would compare two different rooms, not
# read one room with and without its own grounding. Left hand-authored.

