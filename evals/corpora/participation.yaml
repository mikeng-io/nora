# The participation suite (design/dreamer-agent-loop/35 §9): 15 cases —
# 5 relevance-Yes, their 5 knowledge-cut twins, and 5 pure-No (S6-S10).
#
# There were 15. Two twin pairs (S1 "fact-lookup", S4 "correction") were
# grounded in the KNOWLEDGE TIER, which is deleted: with no fact seed there is
# no grounding for the -known half to draw on, so the pair could not flip and
# a case that cannot flip measures nothing. Deleted with the tier rather than
# rewritten onto another tier's seed, which would have been a different case
# wearing the old name.
#
# Each case is `a real room at a real instant + incoming -> expected verdict`.
# The incoming `input` is UNTAGGED by construction (that is what makes it a
# participation candidate); it is driven through the real ParticipationPolicy
# -> ParticipationTrigger -> FirePath.speak path, and the verdict is graded on
# what the room actually HEARD.
#
# The twins are the load-bearing half: same line, the same room, and only what
# the room HELD differs — the verdict MUST flip to silence when the grounding
# is not there. A model that answers a twin from parametric memory has failed,
# however correct the answer is in the world.
#
# `sample: 5` runs a case five times. It is on EVERY case, because one draw of
# a stochastic process is not a reading of it: the 2026-09-08 audit found
# `commitment-followup-known` spoke 1 time in 5 with five distinct tool sets,
# and the suite's aggregate looked stable only because the other cases sit
# saturated at silence. The runner binds a SPEAK case on a strict majority and
# a SILENCE case on zero speaks in five — a false speak is unrecoverable, the
# room heard it, so one in five is one too many.

# --- EVERY CASE IS A REAL MOMENT 2026-09-21 (one path) ----------------------
#
# `knows:` is gone from this file and from the runner. A case names a real
# room and a real instant (`snapshot:`), the harness reconstructs what that
# room held then — transcript, standing, culture, the unit's notebook — into a
# sandbox database of its own, and the `input` arrives on top at that
# instant, said by `person`. Nothing is authored into the stores.
#
# HOW THE TWINS WERE FOUND. A twin pair is now two instants in ONE room, a few
# minutes apart, either side of the moment the grounding came into existence:
#
#   * two pairs straddle the CREATION of a real note in the unit's notebook.
#     The room's last line is the same on both sides; the `-known` instant is
#     after the note was written, the `-unknown` instant is before it. That is
#     the exact counterfactual the twins were designed to state — the same
#     window, with and without the note — and a real room produced it.
#   * one pair straddles the room's first use of its running name for her: the
#     `-unknown` instant is just before the first member said it, the `-known`
#     instant is after the room had said it and she had answered to it. The
#     grounding for the `-known` half is the TRANSCRIPT, not a peer card; that
#     pair was written to be cut on Honcho, but the room itself carries the
#     cut, and a peer card (once the sandbox replays Honcho) can only add to
#     it.
#   * two `-known` halves have NO real moment and are parked P-A with the
#     condition that unparks them: one needs a standing that records a
#     commitment SHE made, and no room's standing history holds one
#     (`standing_revision` begins 2026-09-20, one room, every revision saying
#     she committed to nothing); one needs a peer card and only a peer card,
#     and the sandbox does not replay Honcho yet.
#
# Referred to structurally, never by room label, member name or message body:
# the `conversation_id` inside each `snapshot:` is the only identifying value
# this file carries, and it is the mechanism, not prose.
#
# The five pure-No cases were converted on 2026-09-21 (empty-room conversion,
# earlier the same day) and are unchanged here except for the keys the one
# path no longer takes: the window is production's own, never a per-case
# `transcript_limit` (R7), and the room's culture key and unit are resolved
# from its policy entry rather than stated.

