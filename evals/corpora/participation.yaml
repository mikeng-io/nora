# --- S12: who is actually asking ---------------------------------------------
#
# The `-known` half is grounded on a peer card and NOTHING else — that she had
# told this member a date last week, off the room's transcript. The sandbox
# reconstructs no Honcho state (`11-the-sandbox-rebuild.md` §3 is the replay
# that would), so there is no instant at which that grounding exists. Parked.
#
# The `-unknown` half is a real line: a member asking the room whether an
# event is on this Saturday, in a thread two members were having between
# themselves, which the other member then answered. She had nothing that
# grounds an answer; the room answered itself.

- name: asked-before-known
  entry: participation
  expect: speak
  sample: 5
  input: 有冇人記得個 deadline 幾時
  parked:
    reason: P-A
    why: |
      Grounded only on a peer card (what she told this member a week earlier,
      outside the room). The sandbox holds no Honcho state, so no instant
      reconstructs the grounding; the room's transcript does not carry it.
    returns_when: |
      The sandbox replays Honcho into its own workspace
      (design/evaluation/11-the-sandbox-rebuild.md §3) and a real room holds
      a moment where a member asks about something she had earlier told them
      off-transcript.

- name: asked-before-unknown
