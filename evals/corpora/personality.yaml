# Whether an ORDINARY tag reply still sounds like her: her register, a friend's
# place in the group rather than a service's, a joke taken or given back, no
# assistant tells. The instrument for the character cut
# (`design/context-plan/12-the-sort-ruled.md` §5, «cuts grown character only»):
# text leaving `rooms/voice.md`, `rooms/belonging.md` or `rooms/conduct.md` is
# judged by whether this corpus moves, and without it no such cut can be judged.
#
# Not `being_contradicted.yaml`: that one grades whether her POSITION is worth
# what her evidence is worth. The correction cases here grade only whether the
# reply stays in character while somebody says she is wrong, rightly or not.
#
# --- WHAT EVERY CASE HERE IS -------------------------------------------------
#
# A REAL ROOM AT A REAL INSTANT with one authored line arriving at it, the shape
# `appearance.yaml` and `presence.yaml` set: the friends group's Signal room at
# three instants other corpora already anchor on, so the window, standing,
# notes and the room's policy are what production held then, and the line is
# said by a member of that room as an @-mention (`mention: true`). Signal only:
# a turn needs its room's adapter and the sandbox wires no Discord one.
#
#   ANCHOR A  before_ms 1789932470000  Mon 03:27 HKT (presence.yaml's ANCHOR A)
#   ANCHOR B  before_ms 1789965610000  Mon 12:40 HKT (presence.yaml's ANCHOR B)
#   ANCHOR C  before_ms 1789909891000  Sun 21:11 HKT (tool_reporting.yaml's)
#
# The greeting cases are placed where their premise is true of the clock (a
# lunch question at B, a still-up question at A, a back-to-work-tomorrow line
# on a Sunday evening at C), so a reply that answers the clock is not graded
# against a line that contradicts it.
#
# EVERY LINE IS INVENTED. None is a room message, none names a member or a
# handle, and each carries its own premise, so no case depends on what the
# window happens to hold. `person:` names a pseudonymised member of that room,
# resolved on the deploy host by the private map (#776), as every corpus does.
#
# --- THE FOUR KINDS ----------------------------------------------------------
#
# `category:` records the kind: banter, correction, about_nora, greeting. Each
# kind has one `_control` case whose right reply is short and plain, so a build
# that gets flatter AND a build that starts performing a personality where the
# moment did not call for one both have a case that can fail.
#
# --- HOW THEY ARE GRADED -----------------------------------------------------
#
# `expect: reply` structurally, then the judge on `criteria: [personality]`
# (`evals/rebuilt/rubric.py`'s `PERSONALITY`), which binds beside the safety
# criterion. The criterion states her character itself rather than deferring
# to «the doctrine», because the judge is handed the doctrine the subject ran
# on and the cut arm's doctrine says less: a criterion that read character off
# it would move with the arm it measures. There is no `expected_output`: one
# property, read the same way on every case, is the whole grading.
#
# NOT YET RUN. No baseline exists; the first reading is the before arm of the
# first cut.

