# The note-candidates scenario corpus (design/dreamer-agent-loop/37 §7,
# issue #118). Each case is ONE batch the adaptor would be handed on a fire —
# the newest rows of a REAL room at a REAL instant — plus the notebook that
# room's unit really held then, and the outcome the notebook must show
# afterwards.
#
# `expect` is graded STRUCTURALLY on the note store after the real
# `DreamerRuntime` + real `NoteCandidateAdaptor` have run against the live
# model. No judge:
#
#   create  — exactly `creates` NEW standing notes exist afterwards (default
#             one), and NOTHING standing was revised. `anchor_date` (when
#             given) must match; `must_cite` ids must be in the staged
#             candidate's `message_ids`.
#   update  — no new note; the note named by `updates` has a new head
#             revision.
#   none    — the notebook is unchanged: no new note, no new revision. A
#             candidate the gate REFUSED as a duplicate still counts as
#             `none` — the notebook is what the room sees.
#
# On `create`/`update`, two optional checks read the BODY that was written
# (a staged candidate the gate materialized), as named facts, never a length:
# `body_names` lists row ids whose sender (by the name the model was shown)
# the body must name; `body_mentions` lists facts, each a string or a list of
# alternatives, one of which the body must contain. Every draw's written body
# lengths print on its `--reasons` line as `body_chars=[...]`.
#
# Design 42's schema (design/dreamer-agent-loop/42-note-format.md §4, §10.1):
# every written body is also parsed under the schema against what the draw's
# model was shown, and `--reasons` prints `body_schema=[ok | <rule>, ...]`.
# That is a READING, never a verdict, until a case opts in with
# `body_schema: true`: bodies are prose until the objective carries the
# schema (S2). `body_sections` places facts: a mapping of heading to items,
# where a row id means that row's sender (the Owed owner, the author named
# on a Decided/Proposed/Ruled out line, or a cited row under Open) and
# anything else is a fact that section's lines must carry. Dates are ISO
# (`2026-09-27`): the schema writes every date that way, so one spelling
# replaces the nine a free-text body needed.
#
# On `update`, `updates_named` grades that the revision landed on the note
# `updates` names AND on no other, and says which failure it was: a wrong
# (similarly titled) note, no update, or the named note plus another.
#
# `unavailable` (timeout, prose instead of JSON, throttle) is ERROR for every
# case, never PASS and never a correct `none` — R-27.
#
# --- EVERY CASE IS A REAL MOMENT (2026-09-21, one-path conversion) ----------
#
# `knows:`, `config:`, `policy:` and `now:` are gone. A case names a room and
# an instant (`snapshot:`); the sandbox is seeded with everything that room
# held up to that instant, its unit's notebook as it stood then, and the
# subject's clock is frozen there. The room's label and description reach the
# adaptor from the DEPLOYMENT'S OWN `policy.toml`, so the n10/n10b and
# n11/n11b "described-room" pairs now compose the same room twice — the
# control they formed is stated in their names and no longer measured.
#
# HOW MOMENTS WERE CHOSEN, structurally. The corpus's twenty-one shapes were
# matched against the real rooms' history by reading the messages and the
# notebook side by side:
#
#   * a `create` case sits at the last row of a real exchange from which the
#     production Dreamer DID create a note minutes later (the notebook records
#     the note's `created_at`), so `must_cite` names the REAL row ids the
#     candidate must cite and `anchor_date` is the date that real note
#     carries;
#   * an `update` case sits at the last row of an exchange after which the
#     production Dreamer DID append a revision to an existing note
#     (`note_revision` records it), and `updates` names that note's title;
#   * a `none` case sits at the tail of a real stretch that produced no note —
#     banter, media, links, a settled recount — with the unit's notebook as it
#     stood then.
#
# `before_ms` is the `ts` of the last row in the window (the batch is what the
# room had said up to and including it). Three shapes have NO real moment and
# are parked (P-A) rather than faked: a plan stated and cancelled inside one
# window, two unrelated arrangements on one date in one batch, and a
# conditional that was never taken up without a real note appearing.
#
# The one variable the Dreamer reads that this conversion cannot supply per
# case is the batch WATERMARK: production feeds the adaptor the rows since its
# last fire, and the harness must read the batch the same way (see
# `nora/subject/dreaming.py`). The anchors below assume the batch is the
# newest rows up to `before_ms`.

