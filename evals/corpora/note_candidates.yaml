  - name: p9_update_between_two_notes_of_one_title
    entry: dreamer
    category: note-candidates
    expect: update
    parked:
      reason: P-A
      why: |
        Design 42 §10.1 asks for update cases where the unit held two open
        notes with similar titles and the production update landed on one.
        p6 is one. The only other real moment (the paired Discord room, the
        evening of 2026-09-12) had two open notes with the IDENTICAL title
        beside a third similar one, and production's revision predates #228:
        it was placed by the anchor-date fallback deleted on 2026-09-13.
        Today's gate resolves the title the model names, and a title two
        open notes share resolves as ambiguous and lands nowhere, so no
        `update` expectation holds at that moment. Stating one would grade
        the model against a gate that no longer exists.
      returns_when: |
        A real note-candidates revision after 2026-09-13 lands on one of two
        open notes whose titles differ but read alike, so a `snapshot:` at
        its last row reproduces the choice today's gate makes.

