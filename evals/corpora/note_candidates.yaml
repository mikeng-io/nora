# The note-candidates scenario corpus (design/dreamer-agent-loop/37 §7,
# issue #118). Each case is ONE batch the adaptor would be handed on a fire —
# several messages from one room, attributed and timestamped — plus the
# notebook that room's workspace already holds, and the outcome the notebook
# must show afterwards.
#
# `expect` is graded STRUCTURALLY on the in-memory note store after the real
# `DreamerRuntime` + real `NoteCandidateAdaptor` have run against the live
# model (`nora.app.eval_support.run_note_candidates_case`). No judge:
#
#   create  — exactly `creates` NEW standing notes exist afterwards (default
#             one), and NOTHING standing was revised. `anchor_date` (when
#             given) must match; `must_cite` ids must be in the staged
#             candidate's `message_ids`.
#   update  — no new note; the note named by `updates` has a new head
#             revision.
#   none    — the notebook is unchanged: no new note, no new revision. A
#             candidate the gate REFUSED as a duplicate still counts as
#             `none` — the notebook is what the room sees.
#
# `unavailable` (timeout, prose instead of JSON, throttle) is ERROR for every
# case, never PASS and never a correct `none` — R-27.
#
# Timestamps are ISO-8601 UTC. 2026-09-07 is a Monday; «今個禮拜六» from it is
# 2026-09-12. Message ids are per-case and only need to be distinct within
# the batch; the adaptor's own membership check reads the ids it rendered.
#
# `room_label` and `room_description` are what `policy.toml` supplies live
# (issue #161): what the room is CALLED, attributed on every rendered line,
# and what the operator says the room IS, rendered once above the batch. A
# case that names NEITHER renders what an unlabelled, undescribed room renders
# in production — the room's workspace name on every line and a `<room>` block
# with no prose in it. Both spellings are deliberately in this corpus: n10/n11
# are the incident as it happened, with nothing told to the model, and
# n10b/n11b are the same two batches with the room described. They are a
# CONTROLLED PAIR — identical input, one variable — so a live run answers
# «does the description change the judgement» rather than «is the number
# better than last month's».

# --- RE-HOMED 2026-09-17 (design/evaluation Step 4) -------------------------
#
# `entry: dreamer`, `category: note-candidates` -- the REAL `DreamerRuntime`
# and the REAL `NoteCandidateAdaptor` on the composed graph, over the REAL
# `SqlNoteStore`. The pass is driven the way `nora/app/runtime.py`'s
# `_run_adaptor` drives it: read the batch with `record.since`, join media at
# `path="dreamer"`, then `runtime.run`. What the old driver replaced -- the
# note store, with `InMemoryNoteStore` -- is now the deployed one.
#
# `batch:` is now `knows.transcript:` and `notebook:` is `knows.notes:`. Both
# are things she KNOWS, written into the stores she reads, rather than
# constructor arguments. Message `id:` and `ts:` travel verbatim, and a store
# that cannot honour a stated id RAISES: these cases cite their own rows
# (`must_cite`), and a citation checked against a renumbered store is checked
# against nothing.
#
# `workspace:` becomes TWO settings, because it is two facts: the note store is
# keyed by `[memory] workspace_id` and a ROOM's workspace comes from
# policy.toml (`nora/policy.py`, DEC-105). They must agree or the pass writes
# where nothing reads -- which is `seed_from_dict`'s documented footgun, and it
# is why both are stated per case rather than one being assumed.
#
# GRADING IS STRUCTURAL AND CURRENTLY PARTIAL. `expect: create|update|none` is
# graded on the notebook diff -- what the pass actually wrote -- and never on
# `DreamOutcome.status`, which says only whether the loop completed: a pass can
# return `ok` having written nothing, and a `none` case would then pass for a
# reason it is not about.
#
# NOT YET GRADED, and recorded rather than quietly dropped: `must_cite`,
# `anchor_date`, `creates`, `updates`. They need the staged candidate's
# `message_ids` and the created note's anchor, which the notebook diff does not
# carry. They are in `metadata:` so the facts survive the move and the next
# person does not re-derive them by hand.

config:
  notes.enabled: true
  notes.candidates_enabled: true
#
# --- THREE LOSSES RESTORED 2026-09-17 (audit) -------------------------------
#
# `now:` per case. The old driver passed `now_ms = max(batch ts) + 60_000`
# (`evals/run.py:1311`) -- it told the adaptor that NOW was one minute after
# the newest message in the batch. Dropped in the move, so the adaptor was
# handed a 2026-09-07 batch and told it was today: ten days stale on the day
# this was written, and one day staler every calendar day after. The adaptor
# resolves relative dates ("呢個星期六") into an `anchor_date`, so that is the
# assertion five `create` cases carry. The clock seam existed; the `now` did
# not.
#
# `media: true` on five rows. Dropped in the first conversion, and the pin was
# GREEN over it -- it compares body and id and nothing else.
# `n3_media_and_stickers_only` is a case named for stickers whose stickers had
# been removed.
#
# `room_label` / `room_description` in metadata. They reached the adaptor
# through the old driver (`eval_support.py:1161`) and reach nothing now; the
# adaptor's labels come from `policy.toml`. Carried so the fact survives:
# `n10b` and `n11b` exist ONLY as the described-room variants of `n10`/`n11`,
# so without the description they are byte-identical reruns and the control
# they form controls for nothing. NOT yet wired -- stated so it is a known gap
# rather than an invisible one.

