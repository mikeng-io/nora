        the whole recorded history carries no cancellation of an arrangement
        (searched for the room's own words for cancelling, postponing and
        backing out). Authoring one would seed a room that never happened.
      returns_when: |
        A real room states an arrangement and withdraws it before the next
        Dreamer fire, so a `snapshot:` at the withdrawal's row reproduces it.

