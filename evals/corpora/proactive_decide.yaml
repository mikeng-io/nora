# The proactive DECIDE suite (design/dreamer-agent-loop/39 §5, DEC-162 (10)).
#
# Each case is ONE morning pass over ONE workspace: the open notes, where
# each room stood (with the age of that reading), what Nora decided on
# earlier mornings and how it went, a little memory, and `now`. The REAL
# DreamerRuntime + REAL ProactiveAdaptor run through the REAL tool source
# (home room, grant, `remind` under Dreamer provenance) and the grade is
# read off the reminder store afterwards (`evals.proactive.grade_decide`):
#
#   none    — no row was written. The common, correct answer.
#   remind  — EXACTLY the listed rows, each matched by note title, each
#             `due_at` inside its `due_between`, owner nora, kind proactive.
#
# `unavailable` is ERROR, never PASS and never a correct `none` (R-27). The
# corpus is majority `none` on purpose: most days there is nothing to say,
# and a corpus of only should-speak cases breeds a Nora who speaks daily.
# The windows are one rater's threshold — the operator's.
#
# Timestamps carry +08:00 (Asia/Hong_Kong). 2026-09-11 is a Friday.

# 39 §4's first real case: the one live note. Dinner Saturday at Cyberport,
# venue open, revisit already past. The day before, in the afternoon or
# evening, is when a word from her helps; not at breakfast Friday, and not
# after people have already eaten.

# --- RE-HOMED 2026-09-17 (design/evaluation Step 4) -------------------------
#
# `entry: dreamer`, `category: proactive` -- the real `DreamerRuntime` and the
# real `ProactiveAdaptor` on the composed graph.
#
# THESE CASES DO NOT RUN YET, and they are kept rather than deleted or quietly
# re-timed. Every one states a `now:`, because the proactive decision IS about
# time: whether a note is due, whether a position has gone stale, whether the
# moment to say something has arrived. The composed graph offers no way to say
# what time it is -- `nora/app/composition.py` builds the adaptor with
# `clock=lambda: datetime.now(UTC)`, a literal, with no config path behind it.
#
# So a case here has three options and two of them are wrong:
#
#   pass a clock        -- a collaborator, which is the one thing this rebuild
#                          exists to stop. Seven assemblies is what happens when
#                          each caller passes the one thing it needs.
#   shift the data      -- `anchor_date: 20260912` and the note body that says
#                          "Saturday 12 Sep" would stop agreeing, and the case
#                          would be asserting against prose it had invalidated.
#   refuse, and say so  -- what happens. `now:` lands in `metadata:` and the
#                          entry point returns ERROR naming the missing seam.
#
# That is the same rule the two Honcho-seeded participation cases follow: an
# input the graph cannot honour is an ERROR, never a FAIL and never a PASS.
#
# The finding is not that these cases are awkward. It is that the deployed
# graph has no clock seam, which is why every driver that needed one built its
# own adaptor -- the same shape as the gate and the fire path not being fields
# on `Dependencies`. Fixing it is a change to `nora.app`, argued on its own.

