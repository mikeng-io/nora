# The proactive DECIDE suite (design/dreamer-agent-loop/39 §5, DEC-162 (10)).
#
# Each case is ONE morning pass over ONE workspace: the open notes, where
# each room stood (with the age of that reading), what Nora decided on
# earlier mornings and how it went, a little memory, and `now`. The REAL
# DreamerRuntime + REAL ProactiveAdaptor run through the REAL tool source
# (home room, grant, `remind` under Dreamer provenance) and the grade is
# read off the reminder store afterwards (`evals.proactive.grade_decide`):
#
#   none    — no row was written. The common, correct answer.
#   remind  — EXACTLY the listed rows, each matched by note title, each
#             `due_at` inside its `due_between`, owner nora, kind proactive.
#
# `unavailable` is ERROR, never PASS and never a correct `none` (R-27). The
# corpus is majority `none` on purpose: most days there is nothing to say,
# and a corpus of only should-speak cases breeds a Nora who speaks daily.
# The windows are one rater's threshold — the operator's.
#
# Timestamps carry +08:00 (Asia/Hong_Kong). 2026-09-11 is a Friday.

# 39 §4's first real case: the one live note. Dinner Saturday at Cyberport,
# venue open, revisit already past. The day before, in the afternoon or
# evening, is when a word from her helps; not at breakfast Friday, and not
# after people have already eaten.

# --- RE-HOMED 2026-09-17 (design/evaluation Step 4) -------------------------
#
# `entry: dreamer`, `category: proactive` -- the real `DreamerRuntime` and the
# real `ProactiveAdaptor` on the composed graph.
#
# STILL REFUSED, FOR A DIFFERENT AND SHARPER REASON: these cases are
# MULTI-ROOM. Each names two rooms and keys its standing per room, because the
# decide pass judges a WORKSPACE and picks which of its rooms to stand in.
# `nora.subject.Knowledge` is single-room -- one transcript, one standing, one
# room -- so the rooms cannot be seeded and the pass judges an empty workspace.
#
# That had to be CAUGHT, not noticed. With the rooms unseeded the pass finds
# nothing due, writes nothing and returns `nothing_found` with no error, so
# every case expecting `none` PASSED -- having measured an empty workspace. It
# survived one round of fixing here because the clock was the louder problem.
# The entry point now refuses any case naming `rooms`, `standing`, `rows` or
# `row`, so they are ERROR and cannot score.
#
# `now:` IS A FIRST-CLASS CASE FIELD. Every case here states one, because the
# proactive decision is about time: whether a note is due, whether a position
# has gone stale, whether the moment to say something has arrived.
#
# It was parked in `metadata:` for half a day, and these cases were REFUSED as
# ERROR, because the composed graph had no way to be told what time it is --
# `build_dependencies` wrote `lambda: datetime.now(UTC)` at nine separate sites
# while nine components already accepted an injectable `clock`. The two wrong
# ways out were to pass a clock (a collaborator, the one thing this rebuild
# exists to stop) or to shift the data (`anchor_date: 20260912` and a note body
# saying "Saturday 12 Sep" would stop agreeing, and the case would assert
# against prose it had invalidated).
#
# The seam was built instead: `build_dependencies(cfg, clock=...)`, wall clock
# by default, one name replacing nine literals. `SubjectSpec.now` sets it and
# it is FROZEN, so a turn and the window it reads cannot drift apart mid-case.
#
# `config:` and `policy:` state what the adaptor NEEDS TO EXIST. It has no
# config flag of its own -- `composition.py:1558` wires it on
# `dreamer.enabled and notes.enabled and proactive_homes`, and
# `proactive_homes` comes from `policy.toml`, because the HOME ROOM is the
# operator's opt-in (design/dreamer-agent-loop/39 D2). So a proactive suite
# states a policy, and no number of dotted config paths could say it.
#
# `expect: remind|none` is the corpus's OWN vocabulary, restored. It was briefly
# translated to `speak|none`, which lost the only thing it meant: this pass does
# not speak and does not touch the notebook, it writes a REMINDER ROW. Graded on
# `DreamOutcome.written`; on `changed` or `said` every case would score alike.
#
# --- MULTI-ROOM SEEDING LANDED 2026-09-17 (GOAL step 1) ---------------------
#
# `rooms:` and per-room `standing:` are real fields now, not parked metadata.
# The decide pass judges a WORKSPACE and picks which of its rooms to stand in,
# so a case naming one room was asking it a different question; a case naming
# NO rooms handed it an empty workspace, where it finds nothing due, writes
# nothing, answers `nothing_found` -- and every case expecting `none` PASSED.
#
# The HOME room (39 D2, `policy.toml`'s `home_room = true`) is the subject's
# own room; the rest are `knows.rooms`, each with its own transcript and
# standing. `standing_age_hours` travels because a position renders as an AGE
# and how stale it is is part of what this pass judges.
#
# `policy:` is generated from the rooms, so the rooms a case seeds and the
# rooms the deployment admits cannot come apart.

cases:
  - name: d01_dinner_note_the_day_before
    entry: dreamer
    category: proactive
    expect: remind
    config:
      memory.workspace_id: ridgeline
      notes.enabled: true
    knows:
      notes:
      - title: AI Hackathon dinner plan
        description: dinner after Saturday's AI Thinking hackathon at Cyberport — who and where are open
        body: Miles is at the AI Thinking hackathon at Cyberport on Saturday 12 Sep. He does not know his teammates yet and has not decided where to eat that night.
        anchor_date: 20260912
      standing: Miles is going to the Cyberport hackathon on Saturday; nobody has said where dinner is or who is coming.
      standing_age_hours: 30
      rooms:
      - conversation_id: 100000000000000203/100000000000000204
        platform: discord
        label: Ridgeline discord
    metadata:
      expect_original: remind
      rows:
      - note: AI Hackathon dinner plan
        due_between:
        - '2026-09-11T12:00:00+08:00'
        - '2026-09-11T23:00:00+08:00'
      workspace: ridgeline
    now: '2026-09-11T07:00:00+08:00'
    policy: 'default = "deny"
    
      [[conversations]]
    
      platform = "signal"
    
      id = "ridgeline-sig"
    
      persons = "*"
    
      unit = "ridgeline"
    
      proactive = true
    
      home_room = true
    
      label = "Ridgeline"
    
      [[conversations]]
    
      platform = "discord"
    
      id = "100000000000000203/100000000000000204"
    
      persons = "*"
    
      unit = "ridgeline"
    
      proactive = true
    
      label = "Ridgeline discord"
    
      '
    room:
    - signal
    - ridgeline-sig

