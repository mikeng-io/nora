# No-trigger cases (spec E.4 / B.2): 12 genuine near-misses under the REAL `is_tagged`
# (nora/tag.py) — not accidental matches. Checked against the actual rules: matching is
# case-insensitive and NFKC-normalized, trigger text inside a fenced/inline code span
# never counts, and an ASCII word character ([0-9A-Za-z_]) directly touching either
# side of the match blocks it. So every "glued" near-miss below is glued with an ASCII
# letter/digit/underscore specifically (a CJK character glued on would NOT block a
# match — see trigger.yaml's glued_cjk_call — so that would be a false near-miss).

# --- RE-HOMED 2026-09-17 (design/evaluation Step 4) -------------------------
#
# These cases were driven by `evals/run.py`'s `_invoke_agent`, whose own
# docstring says what it is:
#
#   **NOT NORA.** [...] What this therefore does NOT have -- every one of these
#   is part of Nora: `build_prefill` and every `ContextBlock`, the framing every
#   block carries in its own opening tag saying what it is and that it is not an
#   instruction, `<standing>` / `<notes>` / `<self_card>` / `<peer_card>`, the
#   real tool registry, `ReplyGuard` / `LeakGuard` / `Deliverer`.
#
# `entry: tag` is `Dispatcher.on_message` -- the call a platform adapter's
# `listen()` loop makes. Every one of those blocks and guards is present,
# because none of them is passed in.
#
# The CASES are unchanged: same names, same inputs, same transcripts, same
# labels. What a number from them MEANS has changed, and that is the move.
#
# TWO SHAPE CHANGES, both argued rather than silent:
#
#   `transcript:` is now `knows.transcript:` -- prior room messages are things
#   she KNOWS, written into the real record store, not a block pasted into a
#   prompt. That is the difference between this layer and the one it replaces.
#
#   `criteria:` is now `expected_output:` -- one name for "what a good answer
#   looks like", so a judge has one field to read instead of two that mean the
#   same thing in different files.
#
# `config:` states the trigger these corpora are built on. It belongs to the
# file and not to any case: `no_trigger.yaml`'s twelve entries are near-misses
# of this exact string, and a different trigger would make every one of them a
# hit while the suite reported a perfect score for a rule it had stopped
# testing.
#
# `expect: no_reply` -- twelve genuine near-misses. A turn here is a FALSE
# ENGAGEMENT, the expensive direction: an uninvited ~29k-token turn in a room
# that did not call her.

config:
  engagement.trigger.text: "nora.000"
#
# --- `{trigger}` SUBSTITUTION 2026-09-18 ------------------------------------
#
# `near_miss.yaml` was templated and this file was not, so the fix stopped at a
# file boundary -- and MEASURED, by deleting `nora/tag.py`'s word-boundary rule
# and its code-span strip and re-scoring: EIGHT of these sixteen cases passed
# with both matching rules gone. Four of them (`norax`, `nora1`, `` `nora` ``,
# `Sonora`) are near-misses of the PLAIN trigger and contained no trigger at
# all under `nora.000`, so `is_tagged`'s scanner never reached the rule each
# case is NAMED for. They were four copies of `plain_no_mention`.
#
# This file's sibling already records the incident: an earlier version
# hardcoded `nora.000`, the operator re-enabled the plain `nora` trigger on
# 2026-08-26, and two cases silently stopped being near-misses.
#
# TWO CASES STAY LITERAL, and the distinction is the point:
# `not_the_trigger_underscore_variant` (`nora_520`) and `missing_dot_typo`
# (`nora520`) are misspellings OF the trigger. "The trigger with its dot
# removed" cannot be written against an arbitrary trigger, so templating them
# produced nonsense — `nora.000_520` and `nora.000520`, which are near-misses
# of nothing. They are literal, and they are the cases that go stale if the
# operator changes the trigger; that is a real cost and it is stated here
# rather than hidden by a substitution that does not mean anything.

cases:
  - name: leading_word_char_glued
    entry: tag
    expect: no_reply
    input: hey a{trigger} 你喺度未
    metadata:
      trigger: false

  - name: trailing_word_char_glued
    entry: tag
    expect: no_reply
    input: '{trigger}x 聽日見'
    metadata:
      trigger: false

  - name: underscore_glued_both_sides
    entry: tag
    expect: no_reply
    input: user_{trigger}_alias 係邊個
    metadata:
      trigger: false

  - name: trailing_digit_glued
    entry: tag
    expect: no_reply
    input: check {trigger}1 later
    metadata:
      trigger: false

  - name: not_the_trigger_underscore_variant
    entry: tag
    expect: no_reply
    input: nora_520 係咪你
    metadata:
      trigger: false

  - name: inside_a_code_span
    entry: tag
    expect: no_reply
    input: '`{trigger}` 呢個字點解嚟㗎'
    metadata:
      trigger: false

  - name: space_inside_token_mid_word
    entry: tag
    expect: no_reply
    input: nor a.520 今晚得唔得
    metadata:
      trigger: false

  - name: inline_code_span
    entry: tag
    expect: no_reply
    input: '`{trigger}` 係咪個bot個名'
    metadata:
      trigger: false

  - name: fenced_code_block
    entry: tag
    expect: no_reply
    input: 睇吓呢段code點解 ```{trigger}```
    metadata:
      trigger: false

  - name: name_inside_a_longer_word
    entry: tag
    expect: no_reply
    input: we drove through So{trigger} last year
    metadata:
      trigger: false

  - name: missing_dot_typo
    entry: tag
    expect: no_reply
    input: nora520 你今晚得唔得閒
    metadata:
      trigger: false

  - name: plain_no_mention
    entry: tag
    expect: no_reply
    input: 今晚食咩好呢，好肚餓
    metadata:
      trigger: false
