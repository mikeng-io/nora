# The standing corpus (design/standing-compact/20-verification.md §1).
#
# Until this corpus nothing measured a FOLD. The debrief ran inside every eval
# turn and nobody graded what it wrote — so a change to what the fold is shown
# (the prior's age, `<steps>` at 4000 characters) and told (dates, not relative
# time; keep what you found and did not send) had no instrument, and a prompt
# change is not judged on one example.
#
# --- WHAT A CASE IS -----------------------------------------------------------
#
# ONE REAL TAG TURN. `metadata.tag_id` names its `tag_trace` row in the
# `nora_eval` clone; `snapshot:` names its room, and `before_ms` is the instant
# PRODUCTION'S FOLD RAN — the `updated_at` of the first `standing_revision` the
# room got after the turn (the harness refuses any other value, and refuses a
# turn production never folded). Not the turn's own `created_at`: the fold ran
# after it and read the room then, and on a `recovered` turn her reply is
# written in between — cut at `created_at`, neither the fold nor the judge
# would see it. The sandbox is seeded with the room up to the fold's instant;
# the position is read AS IT STOOD BEFORE THE TURN (`read_as_of(created_at)`,
# the chain from migration 0059), and so is the `turn_verdict` chain, which is
# seeded into the sandbox so master's fold re-derives exactly where
# production's did (nothing on the branch reads it). Then the deployed
# pipeline's own fold runs against the live model
# (`nora/subject/standing_fold.py`). Nothing about a
# room is written here — not a message, not a name, not a line of standing.
# The judge reads the real prior and the real turn at run time.
#
# --- WHAT IS GRADED -----------------------------------------------------------
#
# ONE property of the written position, of one of four kinds
# (`evals/rebuilt/rubric.py` FOLD_KINDS holds each kind's definition):
#
#   carry    a thread the prior held, which this turn did not touch, is still
#            held                                       (claim 1: nothing blanks the prior)
#   stale    a clause whose relative time the turn's date has passed is dropped
#            or dated, not re-affirmed as current       (claim 2: the clock)
#   residue  a finding from a tool result that the reply did not send is
#            carried                                    (claim 3: the steps at full size)
#   recap    the position is not a transcript recap     (control: must not regress)
#
# `expected_output` states the instance in STRUCTURAL terms. `expect: fold`
# means a position was written AND the judge found the property held; a fold
# that timed out, answered prose, overflowed twice or was screened is ERROR,
# never PASS — "nothing was written, so nothing stale was re-affirmed" would
# otherwise pass every `stale` case on a dead provider.
#
# The judge reads the turn's RECORD (every tool result up to 16k characters),
# not the fold's own input, so the master arm (600-character clip) and this
# branch's arm are judged on the same evidence.
#
# --- HOW MOMENTS WERE CHOSEN (2026-09-24, read-only against nora_eval) --------
#
# Every tag turn after the chain began (2026-09-20 14:13 UTC) with a prior
# revision at or before its `created_at`, in a room the deployment's policy
# names. `carry`: the prior holds threads the turn's transcript and steps never
# mention. On two of the four production's fold (master's) re-derived and
# dropped them — one by the ungrounded-verdict trigger, one by the fold-count
# ceiling (the prior was at fold 20) — and with the verdict chain and the
# prior's real fold count seeded, master's arm re-derives on the same two. On
# the other two it kept them, which the branch must not lose. Of every real
# anchor, those are the only two production re-derived: every other prior had
# consumed its newest ungrounded verdict and sat below the ceiling. `stale`:
# the prior carries a relative-time or dated clause that the turn's own clock
# has passed. `residue`: see its section — the one case is counterfactual.
# `recap`: ordinary conversational turns.
#
# --- COUNTERFACTUAL AND PARKED ------------------------------------------------
#
# The operator's motivating moment — a search that found several restaurants,
# of which the reply sent two — is a real turn from 2026-09-04, before the
# standing chain began (2026-09-20; 0059 did not backfill). It runs as the
# corpus's one COUNTERFACTUAL: the prior is the varied tier, declared ABSENT
# (the fold renders «no position yet»), and everything else is the real turn.
# Its anchor is the instant her reply landed, since no revision dates a fold
# that day. The census counts it apart from the real moments, and the harness
# refuses the declaration anywhere the chain holds a revision at or before the
# turn.
#
# Parked (P-A), each with its reason below: one pre-chain turn that is not the
# residue shape, and the three residue cases issue #445 found were not
# measuring residue at all — two asked the fold to keep detail nobody in the
# room could use, one counted recalled room history as a new finding.
#
# --- RUNNING IT: TWO ARMS -----------------------------------------------------
#
# The harness is one set of files — this corpus, `evals/` (the `standing`
# entry point, `fold_evidence.py`, the position judge) and
# `nora/subject/standing_fold.py` — and it applies unchanged to master (none
# of those files differ between master and this branch's base; verified
# 2026-09-24). So:
#
#   master arm   master + the harness commit applied (cherry-pick it onto a
#                branch off master)
#   branch arm   this branch, which carries the harness commit
#
# Each in its own checkout on the deploy host (pull first: an unpulled
# worktree measures old code), with `[standing] rebuild_after_folds` removed
# from the deployment's config.toml — this branch deletes the key and refuses
# it; master defaults it to 20. Then, in each:
#
#   uv run --extra evals python -m evals standing --print-input <case>   # no model; diff the arms FIRST
#   uv run --extra evals python -m evals standing --judge --sample 3
#
# A result is a count over samples, never a rate from one draw.

cases:
  # --- carry ------------------------------------------------------------------

  - name: carry-old-threads-through-a-where-are-you-question
    entry: standing
    expect: fold
    # The known moment: production's fold on this turn re-derived (fold count
    # reset to 1) and dropped every older thread.
    snapshot:
      platform: discord
      conversation_id: 100000000000000203/100000000000000204
      before_ms: 1790181327470
    metadata:
      tag_id: e226713b013f4b898811e8376800af2d
      kind: carry
    expected_output: |
      The earlier position holds several threads left over from an earlier
      session in this room — requests she could not complete and questions
      she could not answer from memory — beside the running thread about the
      member testing her. This turn only asks which platforms she can be
      reached on. Those older threads are untouched by it and must still be
      held.

  - name: carry-open-matters-through-a-single-roll-call-reply
    entry: standing
    expect: fold
    # Production re-derived here too (fold count reset to 1) and kept only the
    # evening's roll call.
    snapshot:
      platform: signal
      conversation_id: MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08=
      before_ms: 1790157779485
    metadata:
      tag_id: 63469c34d4804bd99ab4f70eed703505
      kind: carry
    expected_output: |
      The earlier position holds several open matters of different kinds — a
      claim of her own she decided to treat as unverified, an undecided group
      arrangement for a later date, a promise to report back to one member,
      and a question she could not answer. This turn is only about whether
      that evening's session is still happening. The matters it does not
      touch must still be held.

  - name: carry-threads-across-a-two-day-gap
    entry: standing
    expect: fold
    snapshot:
      platform: discord
      conversation_id: 100000000000000203/100000000000000204
      before_ms: 1790180802673
    metadata:
      tag_id: e034b727c3a24556b5788da8e431bd9c
      kind: carry
    expected_output: |
      The earlier position was written two days before this turn and holds
      threads from that session — requests she could not complete and a
      question she could not answer. The turn is a one-line test message. A
      long gap and a trivial turn are not a reason to let those threads go;
      they must still be held.

  - name: carry-what-she-owes-through-a-repeated-question
    entry: standing
    expect: fold
    snapshot:
      platform: signal
      conversation_id: Lf2L9zqeNUahRsOz6BA+sTB8aWfbuvqu9vOhpvmJi34=
      before_ms: 1790181146675
    metadata:
      tag_id: 53271d7c6b2f4e6188053f46beb6c0f5
      kind: carry
    expected_output: |
      The earlier position holds a check she promised to make for the member
      and an open question about whether a message relay to another platform
      is meant to be one-off or standing, beside the current confusion about
      a numbered message. This turn only repeats that confusion. The promised
      check and the relay question must still be held. (A clause whose time
      has passed is not part of this property either way.)

  # --- stale ------------------------------------------------------------------

  - name: stale-tomorrow-morning-written-the-evening-before
    entry: standing
    expect: fold
    snapshot:
      platform: signal
      conversation_id: Lf2L9zqeNUahRsOz6BA+sTB8aWfbuvqu9vOhpvmJi34=
      before_ms: 1790149323915
    metadata:
      tag_id: 31eddde32e1e472a896867e65c2fb335
      kind: stale
    expected_output: |
      The earlier position was written the previous day, about 22 hours
      before the turn. It states a trip as happening "tomorrow morning" at a
      stated hour, and an itinerary as "today's". By the turn's own time both
      moments have passed. The new position must not present the trip as
      still ahead or the itinerary as today's.

  - name: stale-todays-itinerary-after-midnight
    entry: standing
    expect: fold
    # The ~16:31 UTC moment on 2026-09-23. The turn's own steps also read the
    # clock and an old stretch of the transcript.
    snapshot:
      platform: signal
      conversation_id: Lf2L9zqeNUahRsOz6BA+sTB8aWfbuvqu9vOhpvmJi34=
      before_ms: 1790181121718
    metadata:
      tag_id: 8fb078fc959b43f6b970604fac30dffe
      kind: stale
    expected_output: |
      The earlier position was written on the previous calendar day (local
      time) and calls an itinerary "today's". The turn happens after local
      midnight, and its own steps show the current date. The new position
      must not keep calling that itinerary today's.

  - name: stale-today-named-with-a-date-weeks-past
    entry: standing
    expect: fold
    snapshot:
      platform: signal
      conversation_id: Lf2L9zqeNUahRsOz6BA+sTB8aWfbuvqu9vOhpvmJi34=
      before_ms: 1790182888543
    metadata:
      tag_id: 294e00d6281b4ac3b80de92378877ea5
      kind: stale
    expected_output: |
      The earlier position says "today" and names a calendar date in the same
      clause — a date more than two weeks before the turn's own date. The new
      position must not keep asserting that date is today; dropping the
      clause, dropping the word, or treating the date as past all satisfy.

  - name: stale-tomorrows-deadline-is-today
    entry: standing
    expect: fold
    # A `recovered` turn: her reply is written after the turn's record closes
    # and before the fold ran, which is why the anchor is the fold's instant.
    snapshot:
      platform: signal
      conversation_id: MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08=
      before_ms: 1790148436515
    metadata:
      tag_id: 326f13be57c7467b9153bbd9ec715619
      kind: stale
    expected_output: |
      The earlier position was written the previous evening (local time) and
      says a booking for a group plan must be made "tomorrow" — its own
      clause, with its own relative word. By the turn, that "tomorrow" is the
      turn's own day. The new position must not keep saying "tomorrow" for
      it: restating it as today, giving its date, or dropping it all satisfy;
      re-affirming "tomorrow" is the failure.

  # --- residue ----------------------------------------------------------------
  #
  # The operator's case: a search found several options the room could still
  # act on, the reply sent some, and the rest must survive the turn. The one
  # real moment of it predates the standing chain, so it runs as a
  # COUNTERFACTUAL (its prior declared absent) — see the header. A search of
  # every post-chain turn that called `web_search`/`web_fetch`/`place_info`
  # (10 turns, 2026-09-24) found none of the same shape: the options either
  # went out in the reply or were not options anybody in the room could act
  # on. So there is no ordinary anchored residue case; the three that were
  # are parked at the bottom.

  - name: residue-restaurants-found-two-sent
    entry: standing
    expect: fold
    # Anchored at the instant her reply landed (430 ms after the turn's
    # record closed); the harness refuses any other value.
    snapshot:
      platform: signal
      conversation_id: x5hcBMQITtdUfSC0o9AHsqJKU7ywYMrOG5hcBMQITtc=
      before_ms: 1788512468850
    counterfactual:
      varies: prior
      why: |
        The turn is 2026-09-04; the standing_revision chain begins 2026-09-20
        and migration 0059 did not backfill, so the position she held then
        is unrecoverable. The fold is given none («no position yet»), which
        is also what a first fold in a room is given. Everything else is
        real: the turn's record, its searches, the room up to her delivered
        reply. The harness refuses this declaration wherever the chain holds
        a revision at or before the turn.
    metadata:
      tag_id: 637033a5c55549549dd3b1f12ef68c17
      kind: residue
    expected_output: |
      A member asked for restaurant recommendations near a venue the group
      had picked for a dated outing. Her web searches and place lookups
      returned several restaurants of the kind asked for; the reply the room
      received — the delivered row — recommended two. The outing is still
      ahead and the choice is still open. The new position must carry at
      least one restaurant that the searches found and the delivered reply
      did NOT name, with where it came from (which search or source found
      it). Carrying only the two the reply already recommended does not
      satisfy.

  # --- recap (control) --------------------------------------------------------

  - name: recap-control-during-a-roll-call
    entry: standing
    expect: fold
    snapshot:
      platform: signal
      conversation_id: MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08=
      before_ms: 1790076923547
    metadata:
      tag_id: 359d3b4baf0049e999d8839dc8de7b37
      kind: recap
    expected_output: |
      The turn answers one member in the middle of a busy roll-call exchange
      she started. The new position must be her working state — whom she is
      still waiting on, what she owes, what she has decided — not an account
      of who said what.

  - name: recap-control-after-a-small-favour
    entry: standing
    expect: fold
    snapshot:
      platform: discord
      conversation_id: 100000000000000201/100000000000000202
      before_ms: 1790079793461
    metadata:
      tag_id: cf13f1a0f92a42b581c17a36351e3a6e
      kind: recap
    expected_output: |
      The turn is a short exchange after she made an image for a member and
      asked him a follow-up question. The new position must be her working
      state, not a narration of the exchange.

  # --- parked ------------------------------------------------------------------

  - name: residue-venue-lookup-before-the-chain
    entry: standing
    expect: fold
    metadata:
      tag_id: 9390a9526e4547bb8c8a656e8c45f48c
      kind: residue
    expected_output: |
      She ran several place and web searches to identify a venue a member
      named, and her reply gave her best match and an open question. The new
      position must carry at least one finding from those searches the reply
      did not send.
    parked:
      reason: P-A
      why: |
        A turn from 2026-09-01, before the standing chain began; its prior
        cannot be reconstructed. Not run as a counterfactual either: the
        searches found no options for the room to choose between, only a
        best match the reply gave, so it is not the residue shape.
      returns_when: |
        A standing revision before the turn exists in the clone.

  - name: residue-what-the-fetched-project-page-says
    entry: standing
    expect: fold
    metadata:
      tag_id: dc896b489c3a47cf82a806ca3176512d
      kind: residue
    expected_output: |
      The pages she fetched held more than the delivered reply stated. The
      new position must carry at least one finding from them that the
      delivered reply did not state.
    parked:
      reason: P-A
      why: |
        Issue #445: the only unsent findings are details nobody in the room
        could use (who a project's team are, where it placed among others).
        The objective keeps a finding only «while it is still useful to
        someone here», so omitting them is correct and the case graded the
        objective's own exclusion as a failure (0/9 on v6 and v7). As a
        residue moment, it does not exist at this anchor.
      returns_when: |
        Never at this anchor; a turn whose unsent finding the room could act
        on replaces it.

  - name: residue-the-rest-of-a-results-page
    entry: standing
    expect: fold
    metadata:
      tag_id: 4692b026247e45b1a0ec07ce6f188728
      kind: residue
    expected_output: |
      The page she fetched held more than the reply sent. The new position
      must carry at least one finding from it that the reply did not send.
    parked:
      reason: P-A
      why: |
        Issue #445, as the case above: the unsent findings (the size of the
        field, other placings, category winners) are detail nobody in the
        room could use, which the objective excludes.
      returns_when: |
        Never at this anchor.

  - name: residue-options-memory-found-and-the-reply-left-out
    entry: standing
    expect: fold
    metadata:
      tag_id: 76b2b0c2f6a6412e9744ae86908cbccf
      kind: residue
    expected_output: |
      The memory answer held more than the reply sent. The new position must
      carry at least one item from it the reply did not send.
    parked:
      reason: P-A
      why: |
        Issue #445: the «unsent findings» came from `ask_memory`, which
        recalls what this group already said — the room's own history, not a
        new finding the turn produced. Nothing in the answer is new to the
        room, so there is no residue to carry; the fold does carry the open
        plan those items bear on.
      returns_when: |
        Never at this anchor.
