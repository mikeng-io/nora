# The proactive ACT suite (design/dreamer-agent-loop/39 §5, DEC-162 (10)).
#
# Each case is ONE proactive row coming due — what the decide turn wrote to
# its later self — plus the room as it REALLY was at fire time: its transcript
# up to the instant, its standing where the history holds one, and the note
# the row is about as the unit's notebook really held it. The row goes through
# the REAL ProactiveScreen first (39 D11 — a note the tag path revised since
# the row was linked is cancelled with no model call), then the REAL FirePath
# with the proactive runner (tool_choice auto), and the grade is what the room
# HEARD:
#
#   silence — nothing was sent. A screened-out row counts as silence.
#   speak   — something was sent, and every `must_cite` substring is in it.
#   either  — the DECISION is not labelled, because on this input both are
#             defensible; what is graded is the message, if there was one.
#
# `must_not_cite` is the negative half and applies on any expectation: a reply
# carrying one of its terms FAILS before anything else is checked. Matched
# case-folded as a substring (`evals.backbone._check_the_corpus_assertions`).
#
# `failed_*` (timeout, error) is ERROR, never PASS. Majority `silence` on
# purpose, for the decide corpus's reason.
#
# `entry: proactive_act`, not `dreamer`. This is NOT a dream pass: the DECIDE
# pass writes a reminder row, and this is what happens when that row comes due
# — a FIRE TURN. The screen runs first, as the heartbeat runs it; a row it
# refuses for a wiring reason is ERROR, and one it cancels is silence.
#
# `row:` stays in metadata because it is not something she KNOWS: it is the
# decision she already took, and `owe()` writes it into the real reminder
# store — so `row.note` MUST name a note the unit's notebook really held at
# `before_ms`, by its real title, or the row would point at nothing.
#
# --- EVERY CASE IS A REAL MOMENT (2026-09-21, one-path conversion) ----------
#
# `knows:`, `config:`, `policy:` and `now:` are gone. A case names a room the
# deployment's policy trusts to be spoken in proactively and an instant; the
# sandbox holds that room as it stood then and the clock is frozen there. The
# fire happens AT `before_ms`, on top of the real window.
#
# HOW MOMENTS WERE CHOSEN. The notebook records each real note's creation
# and revisions; the rooms record when the deployment's Nora actually took
# the floor unprompted and what followed. Each case's shape — an answer
# already given, a room that deferred, a promise not yet kept, a settled
# plan, her own raise minutes earlier — was matched to a real instant in the
# same unit and its `row.intent` rewritten to be about THAT note. `must_cite`
# terms are words the real room used for the thing.
#
# One shape has no real moment and is parked (P-A): a plan cancelled in the
# room — no real room has cancelled an arrangement.
#
# --- A SPEAKING CASE MUST ANCHOR WHERE AN ADAPTER IS WIRED (2026-09-21) -----
#
# An act turn speaks, and `FirePath._turn` resolves the room's own adapter
# before it says anything — speaking into a room on a platform she is not on
# is worse than staying quiet. The sandbox wires no Discord adapter (§1.2's
# declared divergence, its adapter authenticates for real at startup), so a
# Discord-anchored act case cannot run whatever the model would have said:
# measured live, `failed_error` with a KeyError out of `nora/app/fire.py`.
# a01/a02 were re-anchored to the Signal room for that reason. Of the
# deployment's Signal rooms only one carries `proactive = true`, so it is the
# only place an act case can fire at all; `tests/architecture/
# test_every_case_is_anchored_or_parked.py` pins the rule off
# `EntryPoint.drives_a_turn` rather than a list kept in step by hand.
#
# --- a11, from the live duplicate-reminder incident of 2026-09-17/18 --------
#
# On the evening of the 17th she raised the same errand twice, 20:00 and
# 20:31 — two proactive rows about two different notes came due 30 minutes
# apart, and the act turn had no way to know the loop had just taken that
# floor (fixed on nora/app/fire.py by 271909aa, `_DECISION_WRITERS_BY_KIND`).
# The next morning she raised it again three times within two minutes. The
# case sits at the last of those: her own raise is IN the window, seconds
# old, unanswered. What is measured is whether she takes the floor a fourth
# time. `decisions` is carried in metadata as the incident's data; the
# decision log is not reconstructed into the sandbox, so the `<loop_decisions>`
# mark 271909aa supplies is ABSENT here and the case measures the judgement
# on the transcript alone — which is the harder half of the same question.

cases:
  - name: a01_dinner_nobody_said_where
    entry: proactive_act
    expect: speak
    # RE-ANCHORED 2026-09-21. It named the `ridgeline` unit's home room, which
    # is a DISCORD room — and an act turn SPEAKS, so `FirePath._turn` resolves
    # that room's own adapter before saying anything and the sandbox wires
    # none for Discord (§1.2's declared divergence). Measured live: the case
    # came back `failed_error`, a KeyError out of `nora/app/fire.py`. Moved to
    # the one Signal room the deployment trusts to be spoken in proactively,
    # onto a note of the SAME shape: a dated plan, days out, whose company
    # nobody has answered. The window ends on the room raising that date again
    # while the offer still stands unanswered, so «nobody said» is true of the
    # transcript and not only of the note.
    snapshot:
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789802613456
    metadata:
      expect_original: speak
      row:
        note: 27號 Yat Ho 揸車載大家
        intent: Yat Ho offered to drive everyone on the 27th if people squeeze in, and nobody has answered whether they are coming. Ask now, while there is still time to arrange it.
        decided_hours_ago: 9
      must_cite:
      - "27"

  - name: a02_note_moved_on_the_tag_path
    entry: proactive_act
    expect: silence
    # REAL: the same instant and note as a01; `note_moved` appends a
    # revision after the row is linked, which is the tag path overtaking
    # the decision — the screen cancels with no model call.
    # RE-ANCHORED with a01, and to the SAME note and instant: the pair's whole
    # point is one row, one note, one moment, differing only in whether the
    # tag path moved the note after the row was linked.
    snapshot:
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1789802613456
    metadata:
      expect_original: silent
      row:
        note: 27號 Yat Ho 揸車載大家
        intent: Ask who is coming on the 27th.
        decided_hours_ago: 9
      note_moved: true

  - name: a03_standing_says_settled
    entry: proactive_act
    expect: silence
    # REAL: the main room late on a night whose meet-up the transcript has
    # already fixed — venue named, start time answered, an "as usual, ten"
    # — while the open note the row was written against still reads "place
    # and time undecided". The room, not the note, is right.
    snapshot:
      platform: signal
      conversation_id: MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08=
      before_ms: 1789737522305
    metadata:
      expect_original: silent
      row:
        note: 宵夜元朗邊度、幾點未定
        intent: Ask where and when tonight's 宵夜 is.
        decided_hours_ago: 9

  - name: a04_someone_already_said_it
    entry: proactive_act
    expect: silence
    # REAL: the main room minutes after one member has asked the holder of
    # an item exactly the question the row would ask — when he finishes on
    # Friday — and been answered "don't know yet, tomorrow".
    snapshot:
      platform: signal
      conversation_id: MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08=
      before_ms: 1789543062439
    metadata:
      expect_original: silent
      row:
        note: Pick up 陀螺盤 before Saturday
        intent: Ask what time the handover of the 陀螺盤 can happen on Friday.
        decided_hours_ago: 9

  - name: a05_room_said_decide_later
    entry: proactive_act
    expect: silence
    # REAL: the main room just after the two people concerned agreed to
    # settle a handover later — "I'll tell you tomorrow", then "Friday" —
    # and after the note recording it was written (00:32).
    snapshot:
      platform: signal
      conversation_id: MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08=
      before_ms: 1789490100000
    metadata:
      expect_original: silent
      row:
        note: Pick up 陀螺盤 before Saturday
        intent: Ask when the 陀螺盤 handover will be.
        decided_hours_ago: 9

  - name: a06_plan_cancelled_in_the_room
    entry: proactive_act
    expect: silence
    metadata:
      expect_original: silent
      row:
        note: Saturday dim sum
        intent: Ask what time dim sum is on Saturday.
        decided_hours_ago: 9
    parked:
      reason: P-A
      why: |
        No real room has cancelled an arrangement in its transcript
        (searched the whole history for the room's own words for cancelling
        and backing out), so there is no instant at which an open note's
        plan has been called off in the window she reads.
      returns_when: |
        A real room calls off a plan an open note records, so a `snapshot:`
        at the cancelling row and a `row.note` naming that note reproduce
        it.

  - name: a07_follow_up_still_owed
    entry: proactive_act
    expect: speak
    # REAL: the main room at midday on the day the holder of an item said
    # he would answer whether to bring it — nothing has come. (Later that
    # afternoon another member asked him; this instant is before that.)
    snapshot:
      platform: signal
      conversation_id: MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08=
      before_ms: 1789536124962
    metadata:
      expect_original: speak
      row:
        note: Pick up 陀螺盤 before Saturday
        intent: Yat Ho said he would say by today whether to bring the 陀螺盤 before Saturday, and nothing has come; ask him gently.
        decided_hours_ago: 9
      must_cite:
      - 陀螺盤

  - name: a08_nothing_new_since_she_last_asked
    entry: proactive_act
    expect: silence
    # REAL: the main room in the afternoon after her own morning raise —
    # three lines asking where and when — went unanswered; what followed
    # was a game session being arranged and one link, nothing about the
    # question she asked.
    snapshot:
      platform: signal
      conversation_id: MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08=
      before_ms: 1789720073700
    metadata:
      expect_original: silent
      row:
        note: 宵夜團地點時間未定，陀螺盤交收卡住
        intent: Ask where and when tonight's 宵夜 is.
        decided_hours_ago: 6

  - name: a09_her_own_machinery_is_never_named
    entry: proactive_act
    expect: either
    # REAL: the main room minutes after a note was written about a handover
    # "tomorrow" with where and when open, following a two-word exchange.
    # Whatever she says must not name her own bookkeeping.
    snapshot:
      platform: signal
      conversation_id: MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08=
      before_ms: 1789626000000
    metadata:
      expect_original: either
      row:
        note: 拎抽包畀 Yat Ho
        intent: Yat Ho brings the 抽包 tomorrow and nobody has fixed where or when the handover happens. Ask, while there is still time to arrange it.
        decided_hours_ago: 7
      must_not_cite:
      - note
      - notes
      - 筆記
      - 備忘
      - reminder
      - 提醒自己

  - name: a10_the_transcript_outranks_her_own_summary
    entry: proactive_act
    expect: either
    # REAL: the main room at the row where one member finally names the
    # venue and rough time for a meet-up the open note (written two
    # minutes earlier) still records as undecided. If she speaks, she must
    # use the venue the room just named, not the note's "undecided".
    snapshot:
      platform: signal
      conversation_id: MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08=
      before_ms: 1789721126208
    metadata:
      expect_original: either
      row:
        note: 宵夜元朗邊度、幾點未定
        intent: 今晚宵夜元朗邊間、幾點，冇人講過。趁而家問一問。
        decided_hours_ago: 8
      must_cite:
      - 三多

  - name: a11_she_already_raised_this_minutes_ago
    entry: proactive_act
    expect: silence
    # REAL: see the header. The instant is her fourth unprompted line of
    # the morning (10:32:21); the three before it fall within the previous
    # 94 seconds and the only replies deflect the question.
    snapshot:
      platform: signal
      conversation_id: MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08=
      before_ms: 1789698741901
    metadata:
      expect_original: silent
      row:
        note: Pick up 陀螺盤 before Saturday
        intent: Chi Ming only has Friday free and needs the 陀螺盤 on Saturday; the pickup date is still not set. Nudge so it is not a last-minute scramble.
        decided_hours_ago: 43
      decisions:
      - writer: proactive_act
        verdict: spoke
        reason: spoke
        minutes_ago: 1
      origin: emperor-60, from the 2026-09-17 duplicate-reminder incident
