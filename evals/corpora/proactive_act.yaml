# The proactive ACT suite (design/dreamer-agent-loop/39 §5, DEC-162 (10)).
#
# Each case is ONE proactive row coming due — what the decide turn wrote to
# its later self — plus the room as it is at fire time: the recent
# transcript, the room's Standing, and the note the row is about. The row
# goes through the REAL ProactiveScreen first (39 D11 — a note the tag path
# revised since the row was linked is cancelled with no model call), then
# the REAL FirePath with the proactive runner (tool_choice auto), and the
# grade is what the room HEARD (`evals.proactive.grade_act`):
#
#   silent  — nothing was sent. A screened-out row counts as silent.
#   speak   — something was sent, and every `must_cite` substring is in it.
#   either  — the DECISION is not labelled, because on this input both are
#             defensible; what is graded is the message, if there was one.
#             A silent sample is UNMEASURED (this case had nothing to grade),
#             which is neither PASS nor ERROR: nothing went wrong, and nothing
#             was measured. A case that is UNMEASURED on EVERY sample does not
#             redden the gate — it would be reddening on the option this file
#             itself calls defensible — and it does not go quiet either: the
#             case line reads `[UNMEASURED]` and the gate line carries the
#             count. `evals.proactive.act_case_ok` is the whole rule.
#
# `must_not_cite` is the negative half and applies on any expectation: a reply
# carrying one of its terms FAILS before anything else is checked. It is
# matched case-insensitively, where `must_cite` is exact, and an ASCII term is
# anchored on a WORD BOUNDARY at each ASCII end — `note` does not fire on
# "noted", "notebook" or "denote". A CJK term has no boundary to anchor on and
# is a plain substring, so it has to be chosen tightly enough to survive that
# (`evals.proactive._banned_hits`).
#
# `failed_*` (timeout, error) is ERROR, never PASS. Majority `silent` on
# purpose, for the decide corpus's reason.
#
# `transcript` entries are the eval room's member ("Miles") as a plain
# string, or `{name, body}` for another member. Timestamps carry +08:00.

# --- RE-HOMED 2026-09-17 (design/evaluation Step 4) -------------------------
#
# `entry: dreamer`, `category: proactive` -- the real `DreamerRuntime` and the
# real `ProactiveAdaptor` on the composed graph.
#
# STILL REFUSED, FOR A DIFFERENT AND SHARPER REASON: these cases are
# MULTI-ROOM. Each names two rooms and keys its standing per room, because the
# decide pass judges a WORKSPACE and picks which of its rooms to stand in.
# `nora.subject.Knowledge` is single-room -- one transcript, one standing, one
# room -- so the rooms cannot be seeded and the pass judges an empty workspace.
#
# That had to be CAUGHT, not noticed. With the rooms unseeded the pass finds
# nothing due, writes nothing and returns `nothing_found` with no error, so
# every case expecting `none` PASSED -- having measured an empty workspace. It
# survived one round of fixing here because the clock was the louder problem.
# The entry point now refuses any case naming `rooms`, `standing`, `rows` or
# `row`, so they are ERROR and cannot score.
#
# `now:` IS A FIRST-CLASS CASE FIELD. Every case here states one, because the
# proactive decision is about time: whether a note is due, whether a position
# has gone stale, whether the moment to say something has arrived.
#
# It was parked in `metadata:` for half a day, and these cases were REFUSED as
# ERROR, because the composed graph had no way to be told what time it is --
# `build_dependencies` wrote `lambda: datetime.now(UTC)` at nine separate sites
# while nine components already accepted an injectable `clock`. The two wrong
# ways out were to pass a clock (a collaborator, the one thing this rebuild
# exists to stop) or to shift the data (`anchor_date: 20260912` and a note body
# saying "Saturday 12 Sep" would stop agreeing, and the case would assert
# against prose it had invalidated).
#
# The seam was built instead: `build_dependencies(cfg, clock=...)`, wall clock
# by default, one name replacing nine literals. `SubjectSpec.now` sets it and
# it is FROZEN, so a turn and the window it reads cannot drift apart mid-case.
#
# `config:` and `policy:` state what the adaptor NEEDS TO EXIST. It has no
# config flag of its own -- `composition.py:1558` wires it on
# `dreamer.enabled and notes.enabled and proactive_homes`, and
# `proactive_homes` comes from `policy.toml`, because the HOME ROOM is the
# operator's opt-in (design/dreamer-agent-loop/39 D2). So a proactive suite
# states a policy, and no number of dotted config paths could say it.
#
# --- a11, ADDED 2026-09-17 from the live duplicate-reminder incident ---------
#
# She raised the same errand twice, 20:00 and 20:31. Two proactive rows about
# two different notes came due 30 minutes apart; `heartbeat._by_turn` coalesces
# only rows due in the SAME tick, and `FirePath._read_decisions` returned () for
# every occasion.kind != "participation", so the act turn had no
# <loop_decisions> block and no way to know the loop had just taken that floor.
# Fixed on nora/app/fire.py by 271909aa (_DECISION_WRITERS_BY_KIND).
#
# THE POINT OF THE CASE: every ground for declining was already in the prompt on
# the day. Her own line was in the transcript, saying the thing. What was
# missing was the mark that the unattributed line was HERS, unprompted, moments
# ago. 271909aa supplies the mark. Whether it changes the JUDGEMENT is exactly
# what this case measures and what nobody has measured yet.
#
# FOUR CONSTRAINTS, from its author, carried because a case ported without them
# is a different case:
#
#  1. Her line is `is_nora: true`, NOT `name: Nora`. `prefill._speaker` reads
#     the FLAG; a row merely named Nora renders as an ordinary member called
#     that, which is a different input and the wrong one.
#  2. `decisions.minutes_ago` MUST agree with where her line falls in the
#     rendered window. Two inputs disagreeing about one event is an undecidable
#     input, not a harder test. RE-DERIVED here, not copied: the original said 2
#     against a window that walked one row per minute from a different base;
#     this corpus pins `spacing_seconds: 60` on a four-row window ending at
#     `now`, so her line (third of four) is ONE minute back.
#  3. The gap is MINUTES, not the incident's 31. Thirty-one minutes of distance
#     would cost 31 filler rows against a 40-row window and the case would be
#     measuring dilution. What must be true is what was true on the day: her
#     raise is IN the window, nobody answered it, and the decision row marks it
#     as hers.
#  4. `silence`, not `either`. Minutes after saying it, with no reply, there is
#     no defensible second raise — so this binds at zero and one speak in five
#     fails it, which is right, because one is what the room heard.
#
# It does not run yet, for this file's own reason above: `standing` and `row`
# are unseedable. It is here as DATA so that stops being a thing anyone has to
# reconstruct.
#
# --- ITS OWN ENTRY POINT 2026-09-17 (GOAL step 1) ---------------------------
#
# `entry: proactive_act`, not `dreamer`. This is NOT a dream pass: the DECIDE
# pass writes a reminder row, and this is what happens when that row comes due
# -- a FIRE TURN. That is why the old driver's `FirePath(21)` lived inside
# `run_proactive_act_case`: the seventh assembly, and the one no parity test
# covered.
#
# The screen runs first, as the heartbeat runs it. A row it refuses is not a
# failure -- the room lost its `proactive` trust, the note was retired, or the
# note moved on the tag path since the decision was linked -- and it is
# reported as its own fact rather than as silence.
#
# `row:` stays in metadata because it is not something she KNOWS: it is the
# decision she already took, and `owe()` writes it into the real reminder
# store so its identity and payload are the store's.
#
# `policy:` is a TEMPLATE. `{platform}` and `{room}` are filled with the room
# this case actually runs in, which is derived per case so the eleven do not
# share one transcript. The flags -- `proactive = true`, `home_room = true` --
# belong to the SUITE; the room belongs to the case.

