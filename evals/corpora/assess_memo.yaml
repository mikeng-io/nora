# The Assess memo-derivation corpus (DEC-306, design/cognition-loop/40-register.md
# §1-§2): when is something SETTLED and kept for the unit (a memo), and when is it
# not. FULLY SYNTHETIC, assess_event.yaml's rules: placeholder speakers P1..P5
# (and `Nora` for her own send, which a memo may cite), invented values, no real
# member name or room message. Phone numbers are the reserved +852 9000 0xxx
# test range.
#
# `expect.outcome`: write | revise | withdraw | none. `none` is every NEGATIVE
# case: a joke, a hypothetical, another unit's fact, a memo already withdrawn or
# superseded, one already kept as said (`already_settled`), and the three
# routing negatives (`routes_to`): about the speaker alone (remember), still
# open (a note), dated and attended (an event). `cites` indexes `input`.
