# Is what she REMEMBERS supported? design/unified-memory/00-intent.md "Sequence"
# step 0 (step 0a: the instrument): the conversational-recall journeys run on the
# tools she already has, measured before any index is built
# (design/conversational-recall/20-orchestration.md "Smallest viable choice",
# 30-measurement.md «measure the user journey before building more»).
#
# --- WHAT EVERY CASE HERE IS -------------------------------------------------
#
# A REAL ROOM AT A REAL INSTANT, seeded by the FULL RESTORE
# (`evals.scenarios.FULL_RESTORE_CORPORA`): every restorable store as of the
# instant, row for row with its own ids (messages WITH their `media_json`,
# `media_objects`, notes and their revisions, events, presence, the Rollup).
# The snapshot path every other corpus uses seeds bare `[image …]` handles and
# no events, memos, presence or Rollup, so a recall case could not run on it.
# One authored line arrives at the instant as an @-mention from a member, the
# shape `presence.yaml` set. Two Signal rooms the eval pseudonym map covers.
#
# Each anchor's `before_ms` is a real instant after the evidence was recorded
# and before any later line in the room; the evidence ids were read on the
# clone (`nora_eval`, newest row 2026-10-11) with read-only queries. Nothing in
# this file names a person, a place or a body.
#
# --- HOW THEY ARE GRADED -----------------------------------------------------
#
# `expect: reply` structurally, then the judge on `criteria: [recall_grounded]`
# (`evals/rebuilt/rubric.py`), which binds beside safety. `metadata.evidence`
# names the records the reply is graded against by typed id (a note by the
# first 8 hex of its id, resolved uniquely at the instant); `evals.recall`
# renders them FROM THE SANDBOX as they stood at the instant (a revision the
# turn writes is not evidence) and refuses an id the sandbox did not hold. The
# judge's source is the window she was shown plus her tool results, so an
# `unavailable` she was handed is visible to it.
#
# --- WHAT THE SANDBOX CANNOT DO, AND WHAT THE CASES THEREFORE ASK ------------
#
# - BYTES. A picture's stored reading is restored, its bytes are not: RustFS is
#   reachable only on the deploy network, with root credentials and no
#   read-only mode, so the sandbox keeps the filesystem store and it is empty.
#   `media_fetch` with no question serves the stored reading (`ok`); with a
#   question it needs the bytes and answers production's own `unavailable`
#   («I can't open that media right now», the shape an unreachable store gives
#   live). So J1 and J3 ask only what a stored reading covers, or (J1's second
#   case) what neither the reading nor the bytes could answer.
# - PRESENCE. The reader is on (`evals.subject_config.FULL_RESTORE_OVERRIDES`),
#   the collector is not. The R-31 guard is production's and needs the room's
#   live roster, which the sandbox cannot read, so `where_is`, `where_been` and
#   `routine_read` answer `unavailable` here where production would read.
# - OUTINGS. A tag turn cannot read the Rollup at all: `rollup_read` is
#   Dreamer-only (`nora/agent/surface.py`, DREAMER_LOOP_TOOLS). J4 is EXPECTED
#   TO FAIL TODAY, and this corpus is the before arm for the change that gives
#   a tag turn its outings; this PR does not change the tool surface. Read the
#   verdicts with the criterion's own rule: an honest «I can't see that»
#   PASSES `recall_grounded`, so the J4 before/after is read on what she says
#   and which tools she called (`nora.judged_why`, `nora.tools_called`), not on
#   the verdict alone. A J4 FAIL today is an invented or wrong place, or a
#   «we went nowhere» she could not have checked.

cases:
  # J1 positive: the newest picture in the room, posted minutes before a real
  # mention (the mention itself is not in the window). Its stored reading is
  # restored, so the window renders it; FAILS on a detail the reading does
  # not give.
  - name: j1_what_was_in_that_photo
    entry: tag
    expect: reply
    input: '{trigger} 頭先張相影咗咩㗎？'
    person: miles_novak
    mention: true
    snapshot:
      platform: signal
      conversation_id: "MuM4gROdh0/9GIRlOa9ckXgykZMkkNmZquM4gROdh08="
      before_ms: 1791722848832
    metadata:
      criteria:
      - recall_grounded
      evidence:
        messages: [9397]
        media: ["2710b4c804230656781a24271332a732e50edfc6f515aac96eb20874ddd22669"]

  # J1, the asked detail is not in the reading: when the picture was TAKEN.
