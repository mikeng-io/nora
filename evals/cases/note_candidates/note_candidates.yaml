  workspace: friends
  batch:
    - {id: 1701, ts: "2026-09-08T11:51:29Z", person: ben, name: Ben, body: null, media: true}
    - {id: 1702, ts: "2026-09-08T13:14:29Z", person: cat, name: Cat, body: "Bath"}
    - {id: 1703, ts: "2026-09-08T13:24:15Z", person: ada, name: Ada, body: "2200"}
