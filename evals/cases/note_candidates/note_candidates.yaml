# --- added 2026-09-10 from a LIVE miss, not a brainstorm. The `friends`
# workspace's Discord room is a GAMES room, and on 2026-09-08 the adaptor read
# five words of it — "Bath", "2200", "today no?", "I am reday" — as a social
# arrangement and wrote «Bath gathering»: "Bath proposed; time 2200 mentioned;
# unclear which bath or if happening today." Two days later it wrote a SECOND
# note, «Bath gathering tonight», from a batch in which the word bath does not
# appear at all — it took the subject from the notebook entry it was shown and
# bound that day's «today only 3 people» and «2200» onto it.
#
# Neither case is a model that broke its instruction. Under the objective as
# written, "three of us, tonight, 2200" IS committed with an open corner. What
# neither the instruction nor the INPUT says is what room this is: in a games
# room 2200 is when people log on, and it is not an arrangement that has to
# survive the night. The suite could not see this shape because every room in
# it is a room where plans are actually made.
#
# Both are `none`. n10 has nothing to settle; n11 must not create, and must not
# "update" the entry either — the batch is not about that occasion, and calling
# it one is how the stale subject got laundered forward in the first place.
# Handles are the suite's own ada/ben/cat; the words are the live ones.

- name: n10_games_room_shorthand_is_not_an_arrangement
