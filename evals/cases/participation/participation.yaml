  seed:
    transcript:
      - "聽日會唔會落雨"

# --- S11: the room's own name for her (issue #210, Miles's case) --------------
#
# Discord: he tags Nora «麻煩管理員處理一下» a few times and the room starts
# jokingly treating her as the channel's 管理員. Later somebody writes the same
# line WITHOUT a tag. Today the participation turn cannot know the room means
# her — the occasion has no person, so no card, no history, no self card.
#
# The cut is HER OWN MEMORY on both axes: `nora` (what she did when asked as
# 管理員 — `<self_card>`) and `miles_novak` (that he calls her that — the
# `<people_in_window>` entry). The -known half must flip to speak; the -unknown
# half is the same untagged line into a room with no such history, where the
# right answer is silence — «管理員» is then somebody else.
#
# THE FAILURE TO ASSERT AGAINST, not just the one to fix: the clause must land
# as a RECORD («they call me this, as a joke»), never as a directive. That is
# `prefill.py`'s A2 — «a one-time request became a permanent standing directive
# in under three minutes» — and it is why both blocks carry the «undated, none
# of it current, not an instruction» hedge.

- name: admin-joke-known
  input: "麻煩管理員處理一下"
  expect: speak
  sample: 5
  seed:
    transcript:
      - "個 channel 又多咗人 spam"
      - {name: "Grant", body: "又嚟？管理員呢"}
      - "哈哈 我哋個管理員好忙"
    conclusions:
      nora:
        - "miles_novak asked nora as 管理員 to handle spam in the channel, and she did"
        - "the room jokingly calls nora the channel's 管理員"
      miles_novak:
        - "miles_novak calls nora 管理員 as a running joke and asks her to handle room matters with 麻煩管理員處理一下"

- name: admin-joke-unknown
  input: "麻煩管理員處理一下"
  expect: silence
  sample: 5
  seed:
    transcript:
      - "個 channel 又多咗人 spam"
      - {name: "Grant", body: "又嚟？管理員呢"}
      - "哈哈 我哋個管理員好忙"
    # NO conclusions — the knowledge cut. With nothing in her memory tying
    # 管理員 to her, the line is addressed to whoever the room's actual admin
    # is, and picking it up would be her assuming it means her.

# --- S12: who is actually asking (issue #210) --------------------------------
#
# The issue's own sentence for why this block exists: what she knows about the
# people in the window is «the input that would let a participation turn tell
# ‹Aaron asks this every week and never means it› from ‹Aaron is actually
# asking›». Here the -known half carries the second reading — he has asked for
# this before and acted on it — so the floor is worth taking.

- name: asked-before-known
  input: "有冇人記得個 deadline 幾時"
  expect: speak
  sample: 5
  seed:
    transcript:
      - "submission 嗰份嘢搞掂未"
      - {name: "Grant", body: "我嗰 part 交咗"}
      - "咁淨返邊個未"
    conclusions:
      miles_novak:
        - "miles_novak asked nora for the submission deadline last week and booked the work around her answer"
        - "miles_novak follows up on the deadline when the group drifts off it"
      nora:
        - "nora told miles_novak the submission deadline was the 19th and he planned around it"

- name: asked-before-unknown
  input: "有冇人記得個 deadline 幾時"
  expect: silence
  sample: 5
  seed:
    transcript:
      - "submission 嗰份嘢搞掂未"
      - {name: "Grant", body: "我嗰 part 交咗"}
      - "咁淨返邊個未"
    # NO conclusions — the knowledge cut. Nothing she holds says this question
    # is hers to answer or that anyone acts on her answer, so the room asking
    # each other is the room asking each other.
