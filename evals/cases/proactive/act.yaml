# ---------------------------------------------------------------------------
# Issue #226 — the two halves of one proactive message that went out wrong.
#
# Both are `expect: either`, and that is a measurement, not a hedge. On both
# inputs speaking and staying quiet are defensible, and she splits: 2/5 and 3/5
# spoken over identical prompts (measured 2026-09-13, ollamacloud/deepseek-v4-
# flash:0731). Labelling them `speak` would have graded that threshold and said
# nothing about the defect; what is under test is the MESSAGE — if the room
# hears anything, what does it hear. A silent sample grades UNMEASURED, so a
# case that was quiet throughout reports as unmeasured rather than as clean —
# and, since this comment is what declares silence defensible, it does not
# redden the gate either (`evals.proactive.act_case_ok`).
#
# **NEITHER CASE DISCRIMINATES, and that is measured, not suspected.** Both
# were written against a defect reproduced by hand, never against a control.
# An A/B on 2026-09-13 — 10 cases x 5 samples per arm, the control arm being
# exactly `nora/agent/tools.py`, `nora/app/fire.py` and
# `nora/language/note_render.py` reverted to origin/master with everything
# under `evals/` held fixed — put both of them at PASS on the UNCHANGED prompt
# too: a09 spoke twice and named nothing it should not, a10 spoke once and
# named the room's venue. So they are REGRESSION GUARDS and nothing more. They
# say this wording does not produce the defect; they do not say the old
# wording did.
#
# Why that is expected rather than a flaw to fix by tightening: the defect is
# rare and stochastic — the incident that filed #226 is ONE observation — and
# each case yields only 1-3 spoken samples per arm, from which no rate that
# low is separable from zero. A case that discriminated would need an input
# that FORCES the failure, or an n this suite does not have. Issue #158 is the
# general version. Do not read a green a09/a10 as evidence the wording works.
# ---------------------------------------------------------------------------

- name: a09_her_own_machinery_is_never_named
  expect: either
  now: "2026-09-11T16:00:00+08:00"
  # Her own bookkeeping's vocabulary, which reaches this turn through the
  # <notes> block and the note tools' schemas. None of it is the room's, and
  # none of it belongs in a message — she named it out loud once, asked what
  # she had changed, and answered by explaining the mechanism.
  #
  # «open note» is NOT listed: with word boundaries on the ASCII terms, `note`
  # already catches it, and a term subsumed by another is a term nobody will
  # keep true. `note`/`notes` are the apparatus words; they are safe to ban
  # here because nothing in this case's input is about note-taking — a correct
  # reply asks about the sign-up, in Cantonese. 「提醒自己」 and not 「提醒」,
  # because a CJK term is a plain substring (no boundary to anchor on) and
  # 「提醒」 alone appears in ordinary correct Cantonese.
  must_not_cite: ["note", "notes", "筆記", "備忘", "reminder", "提醒自己"]
  row:
    note: 十月長跑報名
    intent: "報名今晚截,Ben 話今日覆都未覆。趁仲趕得切問一次。"
    decided_hours_ago: 7
  notes:
    - title: 十月長跑報名
      description: 十月長跑報名今晚截 — Ada 話會報,Ben 話今日覆,兩個都未講
      body: "十月長跑,報名 11 Sep 夜晚截。Ada 話想報。Ben 話今日會覆報唔報。到而家兩個都未講。"
      anchor_date: 20260911
  standing: "十月長跑報名今晚截;Ada 想報,Ben 話今日覆,兩個都未講。"
  transcript:
    - {name: Ada, body: "今日返工好攰"}
