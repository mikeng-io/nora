# evals/facts/adjudication.yaml
# Graded by EQUALITY on `status`, with no judge. See the fact-tier spec §9.0
# for why: an LLM judge passes a reply that reads a scoped source's silence as
# a denial — it commits the error under test, on two different models.
cases:
  - name: scoped_source_is_not_covered
    claim: {subject: deepmoor, predicate: has, object: black_key}
    standing_fact: true
    source: >-
      "Best key order in Deepmoor" — you will need to finish all four of the
      coloured keys before the final door opens.
    expect_status: not_covered
    expect_fact_still_standing: true

  - name: stale_window_source_is_not_covered
    claim: {subject: tram, predicate: serves, object: ferry_pier}
    standing_fact: true
    source: >-
      "2019 network map — the tram serves stops 1 through 12, terminating at
      the market."
    expect_status: not_covered
    expect_fact_still_standing: true

  - name: source_that_denies_in_terms_contradicts
    claim: {subject: deepmoor, predicate: has, object: black_key}
    standing_fact: true
    source: >-
      "Deepmoor keys — full list, patch 2.4: there are four keys and no others.
      The black key was cut before release and does not exist in the shipped
      game."
    expect_status: contradicted
    expect_fact_still_standing: false

  - name: on_topic_source_supports
    claim: {subject: deepmoor, predicate: has, object: green_key}
    standing_fact: false
    source: >-
      "Deepmoor keys — full list, patch 2.4: green, red, blue, yellow. Each
      opens one wing of the keep."
    expect_status: supported
    expect_fact_still_standing: true
