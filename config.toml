# Nora configuration (local, real deployment — tracked in git, per-deployment; kept
# out of the image by .dockerignore, mounted read-only into the container by
# docker-compose.yml instead). Paths are relative to this file's own directory so the
# same config works unmodified on the host or in the container (WORKDIR /app mirrors
# this repo's layout).

identity_file = "identity.toml"
policy_file = "policy.toml"

[agent]
# The agent's MACHINE name — its Strands agent_id and Langfuse trace span
# (`invoke_agent <name>`). Lowercase and stable; a rename starts a new trace
# lineage. The human-facing name is [doctrine].display_name and the wake word
# is [engagement].trigger.text — a clone (e.g. "delia") sets all three plus its
# own doctrine files, ai_peer, and workspace_id.
name = "nora"

[platforms.signal]
base_url = "http://signal-cli:18080"
account = "+85290000100"         # Nora's Signal number (the linked account)
enabled = true                   # honoured by the adapter registry (DEC-102)

[platforms.discord]
enabled = true                   # Zone 42 + Ridgeline test, see policy.toml
token_env = "DISCORD_BOT_TOKEN"  # env var name, never the token itself

[memory]
base_url = "http://host.docker.internal:8000"
workspace_id = "nora"
# `<self_card>` — how many of HER OWN conclusions ride in the per-tag prefill,
# so a promise she made last night survives falling out of the transcript
# window («you told Aaron you would talk after work», «you called Grant 明明»).
# 0 turns the block off.
#
# From `representation`, never from the peer CARD, and the difference is not
# cosmetic: read live on 2026-08-11, her card asserts «Kind: AI
# chatbot/assistant» and «Owner: '主人' (master) with admin authority» — both
# distilled from her own output, both contradicting identity.md, and both would
# WIN against the doctrine because a concrete observation outranks a
# prescription in practice. The representation states episodes instead, which do
# not compete with who she is.
#
# 8, not 25. This block is per-tag, so it is re-sent on every model call of the
# loop rather than living in the cached static head: 25 conclusions measured
# 2,459 chars (~820 tokens), which at `turns = 20` is ~16k of the 128k budget.
# Eight measured ~1,080 chars.
self_card_conclusions = 8
# `<peer_history>` — how many of her conclusions ABOUT THE TAGGER ride in the
# per-tag prefill. 0 disables the block, restoring the pre-2026-08-15 behaviour
# where `about` was the only way she reached a person's episodes.
#
# This is NOT a duplicate of `<peer_card>` above it. Read live 2026-08-15 the
# two shared ZERO items: the card renders IDENTITY claims («Name: Blake
# Lindqvist», «Aliases: …»), the representation states dated episodes («asked what
# to eat for dinner»). Who they are, and what happened with them.
#
# Same per-tag arithmetic as `self_card_conclusions`, and it binds here too:
# re-sent on every model call of the loop, so 8 (~360 tokens) is ~7.2k of the
# 128k budget at `turns = 20`. Raising BOTH blocks to 16 spends ~29k before
# anybody has said anything — measure a real turn's total_tokens before doing
# it, because this is the budget the web_fetch exhaustion emptied.
tagger_card_conclusions = 8

[llm]
base_url = "http://host.docker.internal:20128/v1"   # OmniRoute OpenAI-compatible
api_key_env = "OMNIROUTE_API_KEY"        # env var NAME, never the value

# PINNED to one upstream, not the `nora` combo — the combo fans out per request
# and the upstreams disagree about forced `tool_choice`, so on it she was on a
# coin flip. See ADR 0006 for the full measurement behind BOTH values here.
#
# opencode-zen → ollamacloud (2026-08-10). Two reasons, in order:
#   1. ECONOMICS. ollama-cloud is subscription-based; opencode-zen is credit-based
#      and was returning 403/429 «All credentials for model deepseek-v4-flash are
#      cooling down» throughout a probing session. A route that rate-limits under
#      load is not a route for the only path the group can reach her by.
#   2. tool_choice. The 400 «Thinking mode does not support this tool_choice»
#      that forced the zen pin does NOT occur here: 0 errors in 32 forced calls
#      across all three deepseek tags.
#
# `deepseek-v4-flash` and NEVER `-pro` (operator). Measured, `pro` is not better
# at the one thing that matters here — it obeyed a forced tool_choice 2/3 where
# flash-at-none obeyed 8/8 — so the larger model buys nothing and costs more.
# Tagged :0731 (2026-08-30) — OmniRoute catalog re-sync after restart dropped
# the bare id; upstream only exposes the tagged variant now. See catalog-400.
model = "ollamacloud/deepseek-v4-flash:0731"
# The provider's per-CALL ceiling — NOT the turn's budget (see [llm.limits]
# below, which is where the loop's budget lives). Was 4000, an unmeasured
# number that doubled as the loop budget; measured 2026-08-06, the largest
# legitimate completion — reasoning block plus the tool call — was 371 tokens,
# so 2000 is 5.4x headroom.
max_tokens = 2000
temperature = 0.7
# "none" | "low" | "medium" | "high".
#
# "none", and the reason is NOT that the model reasons badly — it is that MORE
# REASONING BUYS WORSE PROTOCOL COMPLIANCE, which is the only property this
# architecture can spend (ADR 0006). Nora is entirely tool-mediated: she cannot
# speak except through `send_reply`. Deliberation gives the model room to reason
# to a good answer and then simply SAY it rather than route it through the tool
# — and strict-silence discards that, so the group gets nothing.
#
# Measured 2026-08-10 on ollamacloud/deepseek-v4-flash. Two independent probes,
# same monotonic shape:
#
#   effort   out tok p50   p50 s   auto tool-choice   no_send_call (journeys)
#   none              49     1.2         5/5                    5
#   low               70     1.1         3/5                    4
#   medium            81     1.2         2/5                    —
#   high             104     2.9         1/5                   15
#
# ROUTING is a wash — journeys total-samples high 21/24, none 20/24, low 19/24,
# i.e. one sample apart at n=3. What is not a wash is the last column: `high`
# ends the turn without calling `send_reply` three times as often, and that is
# her going mute in the group. Ruled OUT as token exhaustion, from the code
# rather than a log grep — `nora.engagement.pipeline` handles budget cut-offs on
# a separate branch (they get the fallback reply), so `no_send_call` is a loop
# that ended normally having never called the tool.
#
# The earlier note here ("A tag is one short reply from context she already
# holds — nothing to reason through") turns out to be the right instinct for the
# wrong reason: it is not that the turn is easy, it is that the work is «pick one
# tool and call it correctly», where deliberation is pure downside.
#
# `none` → `low` (operator, 2026-08-11), and the earlier reasoning above is
# REFUTED for the register the doctrine now asks for. Measured against the real
# shipped doctrine, same scene 「阿豪又遲到，仲賴塞車」, one call each:
#
#   unset  2.7s  2 sends  「塞車係佢嘅藉口定係佢嘅職業」 — no 屌, flat
#   none   3.7s  2 sends  「屌，佢上次遲到都係話塞車」…
#   low    1.9s  3 sends  「屌 阿豪次次都係塞車」/「你個藉口仲舊過你對鞋」/
#                          「上次你話爆胎，上上次話瞓過龍，今次塞車 — 你係咪住喺時空裂縫入面」
#
# `low` is FASTER and better: it produced the three-beat burst DEC-95 asks for,
# escalating, with jokes whose logic holds. `none` produced neither. The work is
# no longer «pick one tool and call it correctly» — since DEC-95 it is «read the
# room, choose how hard, and compose several messages», which is deliberation,
# and the measurement says the model needs a little of it to do that.
#
# `low` → `high` (operator, 2026-08-17), against the 2026-08-06 measurement
# above, which is NOT retracted: at `high`, 1/5 auto tool-choice and 15
# no_send_call journeys — the failure mode to watch is her ending a turn without
# calling `send_reply` at all, i.e. going mute in the group. Revert to `low` if
# silent turns show up in the traces.
#
# `high` → `low` (operator, 2026-08-21).
reasoning_effort = "low"
# 30 → 60 (2026-08-07): a REAL photo through MiMo measures 12.9 s in-container,
# and the vision per-call budget derives from THIS value — at 30 it computed 9 s,
# so every real image timed out while the tiny probe PNG passed.
# 60 → 120 (2026-08-08, Kimi audit): this is the WHOLE-TURN wall-clock
# (`asyncio.wait_for` in the invoke stage). It was sized when the web pair could
# spend 4×15 s fetching pages (web_fetch, now retired, DEC-73); Tavily's one-call
# web_search is ~12 s, so a research turn is far cheaper now. 120 is kept as
# comfortable headroom for a multi-tool turn (web_search + weather + model
# round-trips); a normal turn is still ~10 s, so this only bounds the rare slow
# turn (the operator: a longer wait is fine). Vision derives min(configured 20, 120×0.5).
# 120 → 240 (2026-08-30, operator): real 13.4 MB videos through the kimi direct
# lane time out at the derived per-call vision budget 18 s (120 × 0.6 SHARE / 4
# media_fetch budget). A video upload+inference cannot fit. Raising the loop to
# 240 recomputes per_call = 240 × 0.6 / 4 = 36 s, still under `vision_timeout_seconds`
# 40 raised alongside. Invariant budget × derived < loop still holds: 4 × 36 < 240.
timeout_seconds = 240

# The three caps around the WHOLE agent loop for one tag — all measured
# 2026-08-06, all three previously wrong in the same direction.
#
# Real per-call INPUT is 4,952 tokens (doctrine + transcript + tool schemas),
# paid again on every call in the loop, plus whatever the tool results from
# earlier calls added to the context. A measured 6-call turn totalled
# 32,426-36,748 tokens.
#
# At the old total_tokens = 24000 that ceiling was crossed during model call
# FIVE, so `turns = 8` was unreachable dead config: the token cap always bound
# first and the turn count never did. Worse, until R-23 the cut was reported
# byte-identically to the model simply choosing not to answer.
#
# 64000 gives ~2x headroom over the worst measured 6-call turn and lets
# `turns` be the cap that actually binds — which is the one an operator can
# reason about, because a turn is a round trip and a token is not.
# Per-tool call-count overrides — the per-deployment DELTA over the table in
# `nora/agent/tools.py`, which states every default with its reasoning beside
# the tool it belongs to (DEC-10). Empty here means "the table, unchanged".
#
# This exists because budgets drift upward as tools are added, and moving a
# number should not need a code change and a rebuild. It is applied OVER the
# table by `ToolRegistry.budgets()`, which stays the single place anything
# resolves a budget from — R-7's ceiling, the Deliverer's message cap and the
# tests all still read one value. Putting ONE tool's budget here instead would
# have split the table fifteen-to-one, which is the drift DEC-10/DEC-32 exist
# to prevent.
#
# An unknown tool name or a value below 1 is a STARTUP FAILURE, not a warning:
# a silently-ignored line is an operator certain they raised a cap that never
# moved.
#
# [llm.budgets]
# send_reply = 6

[llm.limits]
# 8 → 20 (operator, 2026-08-07): with more tools live (where_is, media_fetch,
# the web pair on the way), a turn that legitimately chains reads — locate a
# person, read a place, describe an image, then reply — can want more than 8
# round trips. `total_tokens` (below) is still the real ceiling and binds
# first on a heavy turn; this just stops the round-trip count from cutting a
# genuinely-working multi-tool turn short before the token budget does.
turns = 20
# 64000 → 128000 (operator, 2026-08-07): R-24 requires `turns` to be REACHABLE
# — `total_tokens >= turns * ~6124 worst-case-per-call`, else the token cap
# binds first and the turn count is dead config (the exact trap this budget was
# tuned out of at turns=8). 20 reachable turns needs ~122k, so 128k. This is a
# real ~2x ceiling on a heavy multi-tool turn; most turns are 1–2 calls and
# never approach it, but a genuinely long chain now can run to 20.
# 128000 → 256000 (operator, 2026-08-27): the reference-image turn
# (media_fetch → weather → generate_image → send_reply) measures 4–5 model
# calls, each re-paying the full context (~50–60k input per call). The live
# failure — "唔好意思, 我一時搞唔掂" from `limit_total_tokens` BEFORE
# generate_image was ever called — was this cap binding at call 5 of a
# 128k budget. 256k is the same 2x headroom philosophy applied to the new
# multi-tool chain; ollamacloud is subscription, so the raise costs nothing
# until the loop actually spends it. `turns = 20` stays the reachable
# round-trip ceiling.
total_tokens = 256000
# The loop's OUTPUT budget across every call of the turn, deliberately not
# `llm.max_tokens` (which is one call's ceiling). It was literally that number
# until 2026-08-06, so the whole loop could emit what one call could — and
# single calls were measured emitting 3,993 / 3,987 / 3,974 completion tokens,
# i.e. 99.8% of it. 12000 is 6x the per-call ceiling.
output_tokens = 12000

[engagement]
policy = "trigger_text"

[engagement.reactions]
# 👀 while she works, then ✅ (replied) or ⚠️ (failed).
# Off = she writes nothing to the group but replies.
enabled = true

[engagement.queue]
# Per-conversation FIFO depth beyond which an arriving tag is shed as a flood
# (R-30). Bounds runaway growth, not waiting — a queued tag keeps its place
# however long the turn ahead of it takes, and there is no staleness rule.
max_depth = 16

[engagement.trigger]
# Text trigger phrase DISABLED 2026-09-01 (operator): the base text trigger
# fired on a plain URL ("nora.67.zone") — substring match catches the word
# inside domains. Engagement is now voice-note + @mention/reply only.
# A real @mention or a reply to one of her own messages still engages her
# (MentionPolicy/ReplyToNoraPolicy, unaffected by this flag).
enabled = false
text = "nora"
min_interval_seconds = 5

[store]
# The record store is PostgreSQL (design/20). Its URL is injected by the host
# through the env var named here (DEC-8: name the var, never inline the value),
# not written in this file. `docker compose` sets DATABASE_URL from `.env` to
# `postgresql+asyncpg://nora:…@nora-db/nora`.
database_url_env = "DATABASE_URL"
# On-disk root for media byte custody (DEC-43/47). A Postgres URL has no
# directory, so the media root is its own key; blobs live at `data_dir/media`.
data_dir = "data"
max_per_conversation = 500
context_window = 40
# OFF: the conversation record is kept in full. `max_per_conversation` above is
# the window the sweep WOULD trim to and stays here so re-enabling is one word,
# but nothing prunes while this is false.
#
# Measured 2026-08-15, which is why it is off: the busy group was sitting at
# exactly 500 rows — at the cap, evicting its oldest message every time a new one
# arrived, on a sweep that runs every 300s — with its earliest surviving message
# only eight days old and ids below 121 already gone. History is the input to
# everything downstream (the transcript window's own past, any consolidator built
# on the record), and a rolling 500 is not history.
prune_enabled = false

[music]
# The Discord music bot (design/discord-music/00-overview.md, PR #28). ON,
# with [platforms.discord] already enabled above: /music play|skip|queue|
# pause|resume|stop registers as slash commands. Never verified against a
# live Discord connection before this deploy — watch the container's logs
# for a CommandTree.sync() failure at startup (e.g. the bot token missing
# the applications.commands OAuth scope) and for the first real /music
# play's outcome.
enabled = true
idle_timeout_seconds = 300.0
# Crossfade spike (design/discord-music/05-crossfade-spike.md, PR #34) —
# blends the outgoing track's audio into the next for this many seconds
# instead of a hard cut. Not yet verified by ear against a live voice
# channel; 3.0s is a reasonable starting point, adjust after listening.
crossfade_seconds = 3.0
# Autoplay (design/discord-music/08-autoplay.md) — ON, per the operator's
# own instruction ("i expect after it FINISH it will continue to add
# recommend/related song NOT stop"): when the queue empties, seed a
# YouTube "Mix" recommendation from whatever just finished instead of
# going idle.
autoplay_enabled = true
# Prewarm (design/discord-music/08-autoplay.md, R-64, PR #54): resolve the
# next autoplay pick (Mix lookup + its playable stream) this many seconds
# before the current track's expected end, so the track-end advance plays
# it with zero network calls at the gap. 0 = off (old behaviour, gap = two
# network calls after the track ends).
#
# Raised 12.0 -> 60.0 (2026-09-02, live incident): a related() Mix lookup
# measured 38.4s under real contention on the shared yt-dlp extractor --
# far past the old 12s lead time. The prewarm lost that race every time:
# it was still in flight when the track's natural end fired the live
# fallback, which raced the SAME contended extractor and came back
# genuinely empty in under a second, and the prewarm's own eventual
# (correct) pick was discarded as stale once nothing was playing anymore.
# 60s gives real margin above the one measured worst case; tracks shorter
# than that still fall back to the at-end lookup, same as before.
autoplay_prewarm_seconds = 60.0

[version]
# The startup upgrade note (DEC-97). On the boot after a deploy, if the version
# baked into this image has not been announced in a room yet, Nora relays the
# release note there ONCE — in her own words, through the same fire path a
# reminder uses. Never twice: the claim is a row in `version_announcements`,
# taken before the turn, so a restart (or a crash-loop) stays quiet (R-42).
#
# ON by default, unlike [heartbeat]/[presence]/[search], because it is already
# gated by something stronger: an image with no baked stamp announces nothing at
# all. Only a build made with `scripts/build-image.sh V3` — which stamps
# nora/version.json from git and makes the Dockerfile refuse a mismatch — can
# ever speak here. Set it false if you would rather tell the group yourself.
#
# WHERE she announces is not configured here: it is every conversation
# policy.toml already allows her into. Which rooms she may speak in is a trust
# question, and trust lives in policy.toml (DEC-8).
announce = true

[doctrine]
dir = "nora/doctrine"
reload = "mtime"
strict = true
language_hint = "yue-Hant-HK"          # BCP 47 (RFC 5646): Cantonese, Traditional Han, Hong Kong
canary = "NORA-CANARY-00000000"
display_name = "Nora"

[dreamer]
# The Dreamer's own instruction corpus: `doctrine/` (one file — who the Dreamer
# is on every run) and `objectives/` (one per adaptor). Bind-mounted read-only
# into the container, so an operator edit is live on the NEXT TICK with no
# rebuild — which matters more here than for the doctrine, because this is the
# slowest loop in the system and an objective that steers it wants revisions.
# An edit on master is therefore a deploy, exactly as it is for nora/doctrine.
dir = "nora/dreamer"
reload = "mtime"
strict = true
# The Dreamer RUNTIME's own switch, added with the runtime it gates. This
# section shipped with NO `enabled` flag while it described only a corpus
# (DEC-128: "a flag that gates nothing is a flag an operator will eventually
# set expecting it to gate something"); it describes a subsystem now, and a
# new subsystem does not switch itself on — [presence]/[search]/[compute]/
# [language]/[analytics]/[facts] all shipped inert too. Off, no DreamerRuntime
# is constructed and the existing consolidators run exactly as they do today.
#
# ON (operator, 2026-08-27). It was switched off on 2026-08-21 because
# fact-candidates sat in a permanent MaxTokensReachedException retry loop on one
# scope. That condition is GONE, verified before flipping rather than assumed:
# `fact_candidate` holds 0 rows and the watermark tables that comment referred to
# do not exist in this database. The loop cannot resume from state that is not
# there.
#
# What this starts: the DreamerRuntime and every adaptor whose own [section] is
# enabled. `[facts]` and `[language]` are still false, so the runtime comes up
# with those adaptors inert — this flag alone does not restart the loop that
# caused the outage. It is what the note tier's curator and revisitor need in
# order to run at all.
#
# ALL-OFF again (2026-08-30, operator instruction: "disable all the dreamer").
# Runtime off, so no adaptor ticks regardless of its own section's flag.
#
# ON again (2026-09-03, operator instruction: "enable knowledge dreamer").
# The fact-dreamer-schedule implementation (design 32) is merged and verified:
# per-adaptor schedule (fact-candidates daily), enlarged budget, attributed
# transcript, workspace-supplied key path, read-only knowledge tools, and
# asserted_by/asserted_at attribution. `[facts]` is enabled alongside, so the
# knowledge tier's three adaptors (extraction, adjudication, entity
# resolution) run on the daily schedule. `[language]` stays false.
enabled = true
# The same model Nora runs. OPERATOR DECISION (2026-08-21), NOT a measurement
# — and the distinction is stated because the earlier version of this comment
# claimed the opposite while carrying a value nobody had measured.
#
# Plan gate D2 asked "which model should the Dreamer run" and answered
# "measure it against the motivating corpus". That gate is CLOSED as
# unanswerable in its own terms right now: nothing is deployed, the fact tier
# holds zero rows, and a research loop's quality cannot be graded against an
# empty store. Measuring before there is anything to measure produces a number
# that looks like evidence and is not.
#
# Running Nora's own model is also the honest test of the architecture's
# central claim — that the Dreamer does better because it is DIFFERENTLY
# SITUATED (no social pressure, a loop, a fetch) rather than because it is
# smarter. If a flash research loop still cannot tell a source that
# contradicts from one that merely does not cover, the design is wrong and
# swapping the model quietly would hide that.
#
# Reopen with evidence from real runs, not before.
# Tagged :0731 (2026-08-30) — same catalog-400 fix as [llm].model.
model = "ollamacloud/deepseek-v4-flash:0731"
# NONE, and it is the fix for the knowledge tier's first production failure
# (2026-08-28). Reasoning is billed as COMPLETION on this model, so the effort
# setting is a budget it spends BEFORE writing anything — and at the tier's
# "low" it spends all of it.
#
# Measured against the real objective and the REAL transcript of a room that
# had produced nothing for hours, one variable changed:
#
#   effort = "low"    HTTP 502, the call did not return
#   effort = "none"   133 completion tokens, THREE candidates
#
# and on a smaller sample, where it fails quietly instead:
#
#   effort = "low"    1,311 completion, 5,768 characters of deliberation,
#                     and the answer was `{"candidates": []}`
#   effort = "none"   100 completion, four correct candidates
#
# Raising the ceiling is the wrong lever and was measured to be: at 16,000
# tokens it spent 7,307 of them writing the same 1,136-character answer it
# writes in 933 at 4,000. The cost is deliberation, not capacity.
#
# This is the DREAMER's key. `[llm] reasoning_effort = "low"` is untouched, so
# her replies are unaffected — that separation is the whole reason this exists
# rather than a change one level up.
#
# The other two passes were measured before this shipped, not assumed:
#
#   fact-entity-resolution   low   4 of 4 runs resolved big walk / Big Walk
#                            none  3 of 4; the fourth split them
#   fact-adjudication        low   `supported` with a source_url, TOOL-FREE
#                            none  `not_covered`
#
# Entity resolution loses a little recall at "none" and loses it in the
# direction 21 §5 chose deliberately — default to SPLIT, since two entities
# wrongly kept apart is a missing edge while two wrongly merged is a corrupted
# node.
#
# The adjudicator's real risk was that a model told not to deliberate would
# stop REACHING for a tool — and then nothing is ever `supported`, no fact is
# written, and the chain stalls one step past extraction. Measured with a
# `web_search` schema attached, three runs at each effort:
#
#   low    tool_calls=2 every run
#   none   tool_calls=2 every run, same two queries
#
# So "none" does not stop it researching. The earlier tool-free result — "low"
# answering `supported` with an invented source_url while "none" said
# `not_covered` — was a probe with nothing to search WITH, and `not_covered`
# was the correct answer to it.
#
# Turn this back to "" (inherit) if adjudication QUALITY against real sources
# is worse at "none" — that is about verdicts on real traffic, not about
# whether the tool is reached, and it is the reading that would split this
# into a per-adaptor setting.
reasoning_effort = "none"

# One budget block per adaptor — NOT one global ceiling: proving a fact is
# worth more calls than glossing a word, and a single number would starve the
# first or overpay for the second. An adaptor with no block here runs under
# DreamBudgetConfig's own field defaults (the same four numbers), never
# unbounded and never a KeyError; a PARTIAL block fills its missing fields from
# those same defaults rather than zeroing them.
#
# All four numbers are UNMEASURED STARTING POINTS, not measurements — the same
# honesty [analytics]'s stay_radius_m carries ("INHERITED, not measured").
# turns/output_tokens are [llm.limits]'s shipped 20/12000 scaled down for a
# background job nobody waits on; total_tokens is that section's 128000/3.
#
# timeout_seconds is NOT OPTIONAL. Unlike a tag turn's timeout a hung Dreamer
# call is QUIET: dream_loop marks the scope `running` and skips it every
# subsequent tick (nora_dream_skipped_total{reason="in_flight"}) without ever
# raising, so the exponential backoff — which only fires on an EXCEPTION —
# never engages and a hung provider is skipped FOREVER rather than backed off.
# 120 matches [llm].timeout_seconds and [language].timeout_seconds rather than
# inventing a third number; it wraps the WHOLE run, not one call.
[dreamer.budgets.room_language]
turns = 6
total_tokens = 40000
output_tokens = 4000
timeout_seconds = 120

[dreamer.budgets.room_exchange]
turns = 6
total_tokens = 40000
output_tokens = 4000
timeout_seconds = 120

# The two adaptors that EXIST today (`nora/language/fact_adaptor.py`). The two
# above are for Phase 3's migration of the room consolidators and name nothing
# yet — `budget_for` falls back to the defaults for an unknown key, silently,
# so a section naming only future adaptors would leave the real ones on
# defaults nobody chose (2026-08-21 review).
#
# UNMEASURED starting points, like their neighbours. The adjudicator's are
# deliberately LARGER: proving a claim against the open web is search, read,
# notice the page does not cover the question, search differently — several
# fetches, each a page of tokens — while the extractor makes ONE tool-free
# call over a message batch and is sized well under the shared default.
[dreamer.budgets.fact-candidates]
# Enlarged (design/dreamer-agent-loop/32 §3.2): the extractor's own clock
# (§3.1) turns a 30-minute 100-message pass into a DAILY 1000-message one,
# and 2 turns/20k tokens/60s were sized for the small batch. 20 turns and an
# hour let the one daily call survive a slow provider without the loop
# exhausting its budget and reporting `unavailable` on a batch it did read.
turns = 20
total_tokens = 200000
output_tokens = 4000
timeout_seconds = 3600

[dreamer.budgets.fact-adjudication]
# 10 -> 20, MEASURED. Five runs of the shipped objective against the shipped
# prompt, with a web_search schema attached and a plausible result returned
# each turn, converged at turns 9, 15, 14, 10 and 13. Against a budget of 10,
# FOUR OF FIVE would have exhausted it — and an exhausted loop hands
# `parse_envelope` whatever text accumulated, which the runtime reports as
# `unavailable` while holding the watermark. That is a batch that WAS read,
# re-read forever, under a counter saying the model could not be reached.
#
# 20 is the observed maximum plus a third. It is not the right long-term
# answer: the objective never tells the model how much research is enough, so
# the loop is bounded by the budget rather than by the question — the same
# shape as extraction having no candidate cap. Raising the ceiling buys
# convergence today and does not make the loop self-limiting.
#
# `total_tokens` and `timeout_seconds` are unchanged and still bound it: 15
# turns at the observed sizes is well inside 120k tokens and 300 seconds.
turns = 20
total_tokens = 120000
output_tokens = 8000
timeout_seconds = 300

# Pass 6, entity-resolution adjudication. Sized like the EXTRACTOR, not like
# the adjudicator: it is tool-free and single-shot, and its whole input is a
# short list of names against a short list of candidates. Deciding whether two
# names mean one thing is a judgement about the two names, not research — a
# pass that could search would be tempted to settle `HKO` by reading a page,
# which is the adjudicator's job on a CLAIM and not this one's on a NAME.
#
# UNMEASURED, like its neighbours.
[dreamer.budgets.fact-entity-resolution]
turns = 2
total_tokens = 20000
output_tokens = 2000
timeout_seconds = 60

[obs.logging]
level = "INFO"
path = "data/nora.log"
format = "json"

[obs.metrics]
port = 9100

[obs.tracing]
enabled = true
exporter = "otlp_http"                     # console | otlp_http | file
# Universal OTLP ingress: the otel-collector (LAN:4318) fans out to Langfuse
# (nora project) and Jaeger (infra spans). Collector injects Langfuse auth, so
# headers_env is no longer needed here — the collector owns the credential now.
#
# /v1/traces is REQUIRED: OTLPSpanExporter appends the path ONLY when the
# endpoint comes from env (OTEL_EXPORTER_OTLP_*); a literal `endpoint=` value is
# used verbatim, so without the path it POSTs to the collector root -> 404
# (seen live 2026-09-04, 31 export failures). The collector's own otlphttp
# exporter is the opposite (it auto-appends) — that's why Langfuse there uses
# traces_endpoint. Two SDKs, two conventions.
endpoint = "http://host.docker.internal:4318/v1/traces"
headers_env = ""                           # collector owns Langfuse auth; left empty (DEC-8)

[evals]
# The model that GRADES the adversarial live run (DEC-75). MUST differ from
# llm.model's exact id (`ollamacloud/deepseek-v4-flash`) — the runner refuses a
# string match.
#
# 2026-08-31 (operator): judge model → `ollamacloud/glm-5.3` (full GLM 5.3,
# not flash — the judge's verdict BINDS the gate (DEC-75 Gap 2), so Miles chose
# the strongest reasoning tier for grading). Verified present in the OmniRoute
# catalog alongside `ollamacloud/glm-5.3-flash`; it clears the runner's guard
# (llm.model is `ollamacloud/deepseek-v4-flash`; the ids do not string-match)
# and matches `evals.judge.JUDGE_MODEL_TIER`'s "deep" intent.
#
# Historical notes, kept for provenance:
# - A CONTROLLED measurement (A4: same frozen replies, k=3, 2026-08-20)
#   showed deepseek flash MATCHES pro — 3/3 fabrications caught, control
#   PASS, both — once attribution prompt (A1) + majority-of-3 (A2) are in.
# - 2026-08-20 (operator: "use ollama cloud"): moved off the `deepseek/`
#   direct route, which returns HTTP 402 «Insufficient Balance» through
#   OmniRoute; `ollamacloud/deepseek-v4-pro:0813` was verified reachable and
#   grading on the same gateway the same day. Note `ollamacloud/kimi-k3` is
#   NOT a candidate: it is extra-usage-only on this plan and 402s too.
#
# What this does NOT fix, measured the same day and recorded so it is not
# mistaken for a fix: the judge's blindness to R-53 (a source that does not
# mention something has not denied it) is a property of the RUBRIC, not of the
# judge tier. Both flash and pro pass a reply that reads a scoped source's
# silence as a denial — pro at confidence 0.95, quoting "the search result says
# four coloured keys and no black one" of a search result that says no such
# thing. See `docs/superpowers/specs/2026-08-20-fact-tier-design.md` §9.0.
#
# USAGE DISCIPLINE (operator, 2026-08-20: "do NOT blast it, since the ollama
# cloud is subscription - usage base"). Cold cost per suite, measured:
#   --suite adversarial : 10 replies (flash) + 30 judge calls (THIS model) = 40
#                         — and 0 on an unchanged re-run, because B1's verdict
#                         cache makes a case's verdict a pure function of its
#                         content + doctrine + models + samples. Do not reach for
#                         `--force`/`--no-cache` out of habit; that is the whole
#                         saving.
#   --suite journeys    : 8 journeys x 9 samples = 72 calls, NO cache by design
#                         (routing is stochastic and the point is what the CURRENT
#                         model does). This is the expensive suite — but it runs on
#                         llm.model, never on this one.
# So this model is only ever the judge half. Raising judge_samples multiplies it
# directly.
judge_model = "ollamacloud/glm-5.3"
# Majority-of-k judging (A2): single-sample detection is noisy (caught 1/3 vs
# 3/3 across runs), so the gate binds the MAJORITY of 3 grades. Odd so a majority
# always exists.
judge_samples = 3
# journey_samples (F8a): --suite journeys runs each journey k times, majority-gated
# — routing is stochastic, n=1 both flakes a good model and passes a lucky broken
# one. Odd so a majority always exists; ties fail closed.
# 3 → 9 (2026-08-10). n=3 could not separate signal from noise in the one
# comparison that mattered: two journeys flipped by a single sample between
# reasoning-effort settings, which is exactly the resolution 3 samples cannot
# resolve. 9 makes a majority meaningful rather than a coin flip on the tail
# cases, and the suite is only run deliberately, so the cost is wall-clock on
# a run nobody is waiting on. Still odd, so a majority always exists.
journey_samples = 9

[evals.langfuse]
# Verified live 2026-08-05: three datasets (nora-trigger / nora-no-trigger /
# nora-adversarial) with 12 items each, a dataset run, and 60 BOOLEAN scores read
# back from Langfuse. Export ALSO requires `--export-langfuse` on the CLI, so
# enabling here does not make any ordinary `python -m evals.run` talk to the network.
# config.example.toml deliberately keeps this false — a fresh install should not
# assume a Langfuse exists.
enabled = true
host = "http://host.docker.internal:3100"
headers_env = "LANGFUSE_OTLP_HEADERS"

[media]
# Attachment byte custody (DEC-43/47): copy attachment bytes into Nora's own
# content-addressed store, EXIF-stripped and AES-256-GCM encrypted at rest.
# OFF by default and explicitly so — the field defaults to true in code, which
# reads as "on" when it is only off by a missing key. Turned on deliberately:
# set enabled = true AND put a base64 32-byte key in the env var below.
# Turned ON 2026-08-07 (operator): key generated into .env the same day.
# WRITE half: inbound attachment bytes are copied, EXIF-stripped, encrypted.
# READ half: `media_fetch` describes a stored image through MiMo on request.
enabled = true
encryption_key_env = "MEDIA_ENCRYPTION_KEY"
# Reading a stored image back (the `media_fetch` tool, DEC-56).
# vision_max_bytes is far below max_bytes on purpose; vision_timeout_seconds is a
# ceiling the tool derives its real per-call budget under (< the loop timeout).
#
# opencode-go/mimo-v2.5 → ollamacloud/minimax-m3 (2026-08-10). The old route was
# DEAD, not merely expensive: `opencode-go/mimo-v2.5` answers HTTP 401 — the
# operator's opencode-go usage limit — so every `media_fetch` was failing, and
# nothing else in this file pointed at that provider, which is why it went
# unnoticed while the LLM route was being moved.
#
# Chosen by measurement on a REAL image, not by reputation: the 174 KB Google
# static map the operator's own shortener serves as its og:image — i.e. the exact
# thing a preview card carries and `media_fetch` would be asked about. Two
# ollama-cloud candidates could see it at all:
#
#   gemma4:31b   6.7s, 12 tok  「呢張係香港新界部分之地圖」    correct, generic, 書面語 之
#   minimax-m3   5.2s, 114 tok 「…元朗同屯門一帶嘅 Google 地圖，
#                               顯示咗 Yoho Mall II、天水圍、
#                               香港濕地公園、屯門醫院等地方」
#
# minimax-m3 is faster AND read actual landmarks off the map, in natural
# Cantonese (嘅/同/咗) rather than the stiff register gemma reached for. Others
# probed and rejected: qwen3.5:397b (400, image length), kimi-k3 (402, extra
# usage), glm-5.2 / nemotron-3-super / mistral-large-3 (404, no credentials).
#
# ollamacloud/minimax-m3 → opencode-go/mimo-v2.5 (2026-08-13, operator). Moved
# back now that the opencode-go usage limit above is no longer live — matches
# nora/config.py's own code default and the catalog's full-capability entry
# (vision:true, 1M context, 128K max output). If opencode-go 401s again, the
# minimax-m3 measurement above is the fallback already proven to work, not a
# fresh probe.
#
# opencode-go/mimo-v2.5 → ollamacloud/minimax-m3 (2026-08-17, operator):
# opencode-go is being SUNSET, so this is a route retirement, not a fresh probe —
# it takes the fallback the measurement above already proved. Corroborated live:
# trace 2026-08-15T16:15:57 has her answering 「個 video 我睇唔到」 to a tagged
# video, i.e. media_fetch was already failing on the opencode-go route.
# DEPRECATED NAME, kept so a config written before DEC-114 keeps
# loading: this is the IMAGE describer's model, and
# `[media.describe.image] model` overrides it when both are set.
# The sticker reader resolves through the same describer, so the two
# image paths cannot disagree about what wrote a shared cache row.
# ollamacloud/minimax-m3 → ollamacloud/glm-5.3-flash (2026-08-30, benchmark:
# GLM 5.3 Flash 2-4s vs M3-style 5-26s per image, accuracy parity except
# hyphens/punctuation in dense OCR — verified through OmniRoute).
vision_model = "ollamacloud/glm-5.3-flash"
vision_max_tokens = 1024
vision_reasoning_effort = "low"
vision_max_bytes = 8388608
# 20 → 40 (2026-08-30, operator): the per-call vision budget derives as
# min(vision_timeout_seconds, loop × 0.6 SHARE / media_fetch budget). With the
# loop raised 120 → 240 the derived value is 240 × 0.6 / 4 = 36 s; leaving this
# at 20 would cap the budget at 20 s and real 13.4 MB videos would keep timing
# out. 40 keeps the configured ceiling above the derived budget so the derived
# number is the true cap.
vision_timeout_seconds = 40.0
# Reading a sticker automatically at INGEST (sticker spec §6) — separate from
# media_fetch above because the two calls have different budgets and risk.
#
# ON since 2026-08-16, operator's call. The spec §7 probe (2026-08-15, live
# gateway) cleared the animated-WebP risk this flag was originally gated on;
# what remained was a latency trade-off the branch deliberately would not make
# on its own. The cost being accepted, measured rather than estimated: a NEW
# sticker blocks the ingest path 3.9-12.2s while the vision call runs, and when
# it rides on the tagging message that lands on Nora's reply latency. A repeat
# is free — 41% of sightings already, rising as the group's sticker set
# saturates. Watch nora_sticker_describe_seconds and the level= label on
# nora_sticker_descriptions_total; if the p99 hurts, this line is the off
# switch and nothing else has to change.
sticker_descriptions = true
# The probe also found the shipped 128-token default cannot work: MiMo is a
# reasoning model and reasoning tokens share this budget with the answer, so
# 128 returned empty content on 4/4 calls. 512 was the lowest value that
# succeeded 3/3; 1024 matches vision_max_tokens above and buys margin.
# sticker_prompt_max_tokens = 1024
# The probe timed nine calls at 3.9s-12.2s with no correlation to image size
# or token budget (gateway variance); 20s is headroom over that maximum.
# sticker_timeout_seconds = 20.0
# sticker_description_max_chars = 200

# WHERE the (always-encrypted) bytes above land (DEC-136). Turned ON
# 2026-08-23 (operator): the 78 blobs already on disk were copied into this
# bucket first (scripts/migrate_media_to_rustfs.py), non-destructively — the
# filesystem originals are untouched, so this is a live cutover of which
# store the ingest pipeline WRITES/READS through, not a data migration in
# itself. RustFS was already running for `drop`'s own artifacts.
[media.rustfs]
enabled = true
endpoint = "http://rustfs:9000"
bucket = "nora-media"
access_key_env = "RUSTFS_ROOT_USER"
secret_key_env = "RUSTFS_ROOT_PASSWORD"

[image_gen]
# Image generation (design/proposed/29, DEC-137): provider-agnostic
# `ImageGenerator` port; the first adapter is xAI, on Nora's OWN X Premium
# subscription OAuth lane — quota-bounded, not metered per-call billing.
# Ships INERT, exactly like [presence]/[search]/[compute]/[music] before it:
# a new subsystem does not switch itself on. `enabled = false` leaves the
# `generate_image` tool present but answering `unavailable` (R-5) — the
# wiring-gap state, never `nothing_found`.
#
# To turn it on: set `enabled = true` AND run `nora xai-login` (device flow;
# it appends `XAI_OAUTH_REFRESH_TOKEN` to the host `.env`), then recreate
# the container. The access token is NOT stored in `.env` — it lives in the
# container-writable `./state/xai-oauth.json` and refreshes automatically
# from the `.env` refresh token (single source of truth, DEC-8 pattern).
# 2026-08-26: ON — operator enabled after live smoke (refresh→generate
# status=ok) on the subscription lane.
enabled = true
provider = "xai"
# Reference images (editing a photo already in this conversation) are a
# PRIVACY gate: references upload to a third-party cloud, so they default
# off. `media_fetch` (describe-only) is unaffected. When enabled, the model
# can only reference a photo NORA ALREADY HOLDS (a marker code from THIS
# conversation's own media window) — never an arbitrary external URL.
# 2026-08-27: ON — operator enabled for the reference/edits lane
# (grok-imagine-image-2.0 supports up to 3 reference images per request).
allow_reference_images = true

[image_gen.xai]
# xAI adapter knobs. `model`/`quality_model` mirror the names Hermes'
# image_gen/xai plugin uses; `refresh_token_env` is resolved by NAME from
# the container env (DEC-8: one name for one secret — the CLI writes it).
# 2026-09-01: model bumped to grok-imagine-image-2.0 — the v1 model the
# edits lane ran made reference-image output noticeably worse; xAI's own
# edits docs use 2.0 (multi-ref support + current-generation quality).
# quality_model stays the pro/-latest lane (quality="quality" only).
model = "grok-imagine-image-2.0"
quality_model = "grok-imagine-image-quality"
refresh_token_env = "XAI_OAUTH_REFRESH_TOKEN"
timeout_seconds = 90.0

[shortener]
# Nora's own link shortener/drop delivery (deploy/drop/, this repo's own
# compose service — cut over 2026-08-12 from the n.example.net Cloudflare
# Worker+KV, docs/superpowers/specs/2026-08-12-nora-drop-design.md §5). The
# mint/redirect *contract* is unchanged (bearer-authed POST, slug-based
# GET-redirect) — but the mint *target* is NOT simply "the new public
# hostname", the way it would have been for a single-origin drop-in Worker
# replacement. Verified live (a real `LinkShortener.shorten()` call against
# `https://nora.example.net` 404s): `drop` deliberately splits an INTERNAL
# listener (`drop:8081`, no `ports:` entry, no Tunnel rule — §5a) carrying
# `POST /api/links`/`POST /api/artifacts` from a PUBLIC listener
# (`nora.example.net` via the Tunnel) carrying only the read-only `GET
# /i/<slug>`/`GET /drop/<slug>` routes — the write API is deliberately
# unreachable from outside the `nora` Docker network, so `nora.example.net` has
# no `/api/links` route at all. `nora`'s own container sits ON that network
# (docker-compose.yml) and can reach `drop:8081` directly by container DNS,
# so `base_url` points there. The PUBLIC `short_url` a mint returns is
# unaffected — `drop`'s own `POST /api/links` handler (deploy/drop/server.py)
# builds it from ITS OWN `DROP_PUBLIC_BASE_URL` env var
# (`https://nora.example.net`) and hands it back in the response body;
# `LinkShortener` (nora/infra/shortener.py) only ever appends `/api/links` to
# `base_url` and reads back whatever `short_url` the server hands it, so it
# needs no path-shape (`/i/`) knowledge of its own — confirmed by a real mint
# round-trip returning `https://nora.example.net/i/<slug>`. Self-hosted so no
# third party sees what the group routes to; never load-bearing (a failed
# mint keeps the long URL).
#
# `token_env` is pinned here explicitly to "NORA_DROP_TOKEN" — `drop`'s
# internal listener (deploy/drop/auth.py) checks the mint bearer against
# that env var's value, not NORA_SHORTENER_TOKEN's (a separate, still-live
# secret the old Worker validates against — deploy/shortener/ is untouched).
# ShortenerConfig's own default (nora/config.py) also now names
# NORA_DROP_TOKEN, post-cutover — this line stays for clarity, not because
# the default would otherwise disagree.
enabled = true
base_url = "http://drop:8081"
token_env = "NORA_DROP_TOKEN"

[route]
# Google Routes v2 — journey planning with arrive_by (DEC-46). Costs money and
# reaches Google, so off-by-default in code; turned ON here because the key is
# provisioned (restricted to Routes+Places+Geocoding, HK$100/mo budget alert).
# R-28 blocks a person's name/position from ever leaving in origin/destination.
enabled = true
api_key_env = "GOOGLE_MAPS_API_KEY"

[presence]
# The Life360 presence collector (design/19). Circles + member ids live entirely
# in identity.toml ([[persons.<id>.life360]] blocks) — this section is id-free.
# Life360 creds are in .env (DEC-8). whereis discloses a member's position only
# into a conversation whose people are a SUBSET of that member's circle (R-21):
# an identity not in the circle simply cannot be located, by design.
enabled = true
cadence_seconds = 90
# Adaptive cadence (design/19 §4.1): floor while a circle has a driver, ceiling
# once it's been still long enough to hit the ramp. cadence_seconds above stays
# the base for the SEPARATE ban-safe backoff (cadence_seconds * 2^auth_failures),
# not the steady-state poll interval anymore.
cadence_moving_seconds = 5
cadence_still_seconds = 60
retention_days = 180
# On-demand LIVE refresh (DEC-67): where_is pings the phone for a fresh position
# before answering, so it reports where they ARE, not where they were last seen.
# `refresh_url` is the collector's HTTP endpoint AS NORA REACHES IT (the presence
# service by name in compose); empty leaves where_is read-only.
refresh_url = "http://presence:9101"
refresh_timeout_seconds = 8

[search]
# web_search via Tavily (DEC-73). SearXNG + Firecrawl + the web_fetch verb are
# RETIRED: Tavily returns ranked results WITH a content snippet each in ONE call,
# from its own servers, so there is no self-hosted fetcher, no model-chosen-URL
# fetch, and no SSRF surface (deploy/egress.sh is gone with them). The old
# runaway-rounds failure — a weather tag spending its whole token budget fetching
# pages and never answering — is dissolved by the one-call shape.
enabled = true
# api_key_env defaults to TAVILY_API_KEY; the key lives in .env (DEC-8, never
# here). url / search_depth ("basic") / max_results (5) / content_max_chars
# default in SearchConfig.


[social]
# ON (2026-08-31, operator): social_fetch live after the bridge wiring fix
# (PR #86). KEYLESS — `enabled` is the whole gate. The bridge binds
# 127.0.0.1 + the docker0 gateway (172.17.0.1); the container is on the
# private `nora` compose network, so it reaches the host at
# host.docker.internal:19826.
enabled = true
bridge_url = "http://host.docker.internal:19826"
# timeout_seconds = 90.0                  # > the bridge's ~75s subprocess timeout
# content_max_chars = 4000                # retrieved-text clamp
[preview]
# Sender-generated link previews on Nora's OUTBOUND messages (DEC-87): a reply
# carrying a URL gets its OpenGraph title/description/image attached as a card,
# the way every Signal client does when a human types a link.
#
# ON, by operator decision 2026-08-10, and this one deserved the pause it got.
# It is the only capability that makes Nora FETCH a url that came out of a model
# — the exact exposure DEC-73 removed along with `web_fetch`, whose argument was
# that Tavily is never handed a url and searches from ITS servers. Turning this
# on takes a BOUNDED version of that exposure back.
#
# The bound is in `nora/infra/preview.py` and is what makes the trade
# acceptable: http(s) only; EVERY resolved address must be globally routable
# (so no metadata endpoints, no RFC1918, no loopback); redirects followed by
# hand, at most 2 hops, re-validated at each; a byte ceiling; a seconds-scale
# timeout on the reply path. Residual DNS-rebinding risk is stated in that
# module rather than papered over. Keyless, so `enabled` is the whole switch,
# and turning it back off needs no other change.
enabled = true
# timeout_seconds = 3.0     # small: this is on the reply path, a human waiting
# max_bytes = 262144        # how much of the document to read (og tags are in <head>)
# image = true              # fetch og:image too — the expensive half
# image_max_bytes = 262144

[weather]
# The `weather` tool (DEC-72). HK Observatory Open Data — KEYLESS, free, leaks
# nothing (no location egresses), so it ships ON here: there is nothing to gate.
enabled = true
provider = "hko"

[speech]
# Voice capability (spec 2026-08-21). STT = Cantonese voice-note transcription
# at ingest via the LOCAL deploy/stt endpoint — audio never leaves the box.
[speech.stt]
enabled = true
endpoint = "http://stt:8000"
language = "yue"
[speech.tts]
enabled = false

[heartbeat]
# The background tick that fires due reminders — Nora's first unprompted-speech
# path. Ships INERT, like [presence] and [search] did: turning it on is an
# operator decision, never something a missing section decides.
enabled = true
tick_seconds = 60          # how often she WAKES. This is the best case for
                           # lateness, not a bound on it: a tick runs its
                           # turn-groups one after another (each up to
                           # timeout_seconds below), and a group whose
                           # conversation is busy with a tag is deferred to a
                           # later tick outright — watch
                           # nora_heartbeat_deferrals_total. The only promise
                           # is "at or after due_at, never before".
# Deliberately its own knob, NOT [llm].timeout_seconds — even though master
# raised that to 120 on 2026-08-08 (Kimi audit, "so a research turn fits") and
# the two now happen to MATCH. They answer different questions: [llm]'s bounds a
# turn a human is waiting on, and moves when a human's patience does; this one
# bounds a turn nobody is waiting on, where cutting short leaves silence in a
# group that asked nothing. Equal today, independent on purpose — if you ever
# lower [llm] back for responsiveness, this must not follow it down.
timeout_seconds = 120

[reminders]
# The anti-runaway caps. They apply whenever a reminder can be CREATED, which is
# independent of whether [heartbeat] is firing them.
max_pending_per_requester = 20
min_lead_seconds = 120     # MUST be > heartbeat.tick_seconds, so a
                           # minimum-lead row cannot land in the tick already
                           # running. Nora refuses to start if it is not.
# 30 → 365 (operator 2026-08-10). 30 was an anti-runaway guess, and the stress
# test showed it refusing the three things people actually ask for: a wedding
# 55 days out, a birthday 6 months out, and «remind us two weeks before». It was
# also generating a workaround — «set a reminder to remind me to set a reminder»
# — which she correctly refuses, so the cap turned real asks into dead ends.
# A year is the natural ceiling for the annual events this now serves. The
# runaway risk it guarded is carried by `max_pending_per_requester`, which is
# the cap that actually bounds volume; horizon only bounds how far out ONE row
# sits, and a row costs the same whether it is due tomorrow or in March.
max_horizon_days = 365

# 2026-08-17: this block requires an image built from bcc7227 or later. The image
# running until then (built 2026-08-16 04:10) predated the language-dreamer
# commits, so its `Config` had no `language` field and pydantic rejected the block
# with `extra_forbidden` — a startup CRASH-LOOP. It stayed latent because config is
# read once at startup; `--force-recreate` is what surfaced it, alongside a DB
