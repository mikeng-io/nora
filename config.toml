[notes]
# ON (operator, 2026-08-21). Every tag renders the standing note index for the
# room's WORKSPACE as <notes>, and the four note tools become reachable.
# Workspace, not conversation: `ridgeline` and `friends` are separate notebooks
# and policy.toml says they are never paired, so a note raised in the group
# never appears in the operator's own rooms (§3/DEC-105).
#
# No curator yet — nothing merges, retires or promotes a note, because that is
# a Dreamer adaptor and the runtime is unbuilt. The notebook only grows for
# now; `nora_note_index_entries` is the tell if it grows faster than it earns.
# That tell is REAL as of 2026-08-27 — labelled by workspace, published per tag
# from the index read, ABSENT when this flag is off and `0` when the notebook is
# wired and empty. Those two were the same reading for the tier's first eight
# days, which is how it sat at zero notes without anyone being able to say
# whether that was a quiet group or a broken create path (design 27 §5.4/§6.1).
enabled = true

# The CURATOR — ON (operator, 2026-08-28). It merges notes about one occasion
# and retires ones whose question is settled or whose moment has passed.
#
# What it does today is RETIRE, and only that. Merge eligibility joins
# `note_entity`, which has no writer until entity resolution exists, so every
# candidate group is refused and counted as `no_entity_anchor` (R-75). That is
# not a bug and not a flag away: a merge keyed on the model's own words is
# wrong in both directions at once — three spellings of one wedding are three
# keys, and two unrelated notes that both say "wedding" are one — so the guard
# refuses rather than guesses. `nora_note_curator_groups_refused_total` is the
# number that sizes the entity writer when someone builds it.
#
# Retirement is not deletion. A retired note stays readable; it stops appearing
# in what Nora is shown.
# OFF (2026-08-30, operator instruction: "disable all the dreamer") — the
# curator is a Dreamer adaptor; [dreamer] enabled = false already stops it,
# this makes the intent readable at the flag itself.
curator_enabled = false

[standing]
# ON (operator, 2026-08-27), and this is the one optional tier whose work runs
# INSIDE the live reply slot rather than on a background clock. After every
# completed turn — success, R-5 silence, veto, timeout alike — a SECOND model
# reads the finished exchange and revises one paragraph: where this
# conversation currently stands. That paragraph is injected as <standing> at
# the top of the next turn.
#
# WHAT THIS COSTS AND WHO PAYS IT. One extra completion per tagged turn, held
# inside the conversation's slot. The cost is NOT paid by the person whose turn
# is being reviewed — they already have their reply — it lands on the SECOND
# person queued behind a busy conversation. `nora_debrief_seconds` is the
# reading, p95 <= 5s, and it is deliberately kept OUT of
# `nora_tag_latency_seconds`: folding it in would move an existing SLO series
# by changing what it measures.
#
# ON (operator, 2026-08-27), after two adversarial review rounds closed the
# defects that took it off. What was wrong and is now fixed: the stage's two
# store calls sat OUTSIDE its own timeout and the engine sets no
# command_timeout, so a hung Postgres wedged a conversation on a turn that had
# already replied; the slot-hold budget was argued in prose against an [llm]
# timeout_seconds of 60 that does not exist (it is 120 here) and omitted those
# store calls entirely. Both are now bounded, and the SUM is asserted at
# startup rather than in a comment.
#
# WHAT TO WATCH, because no test can prove it and zero folds have ever run:
#   nora_debrief_total{outcome}   — a series existing at all is the first
#                                   evidence the stage EXECUTES
#   nora_debrief_seconds          — p95 <= 5s, and it is the second-queued
#                                   person who pays it, never the one just
#                                   answered
#   nora_debrief_prior_total{prior} — a sustained prior="absent" means the
#                                   fold is not reading before it writes
# The fold is NOT traced (raw completion; Strands instruments only the agent
# loop), so these counters are the whole instrument until a span is added.
#
# Rollback is this line.
enabled = true
# The OPERATING cap on the position. The database carries an absolute ceiling
# of 4000 (`standing_body_fits_the_ceiling_check`) that no config may pass — a
# value above it refuses to START. 1200 characters is ~300 tokens in English
# but approaches 1200 tokens in a CJK-heavy room, and this room is mixed, so
# the number is read against the denser case. A fold that will not fit is
# REFUSED and the model asked to consolidate; nothing is ever truncated.
# `nora_standing_overflow_refusals_total` is the tell: never firing means the
# cap is not binding, constantly firing means it is too small.
max_chars = 1200
# How many rows one fold reads AND the event trigger's accumulator threshold —
# ONE number (design/standing-watermark D1). Every fold reads
# `since_including_nora(after_id=watermark, limit=fold_batch)`: the NEXT
# fold_batch rows since the last fold's row-id watermark, capped at 200. It is
# a batch size, not a recency window — the 40-row window is gone entirely (D6),
# so a conversation that passes 40 messages between tags no longer loses the
# middle.
fold_batch = 200
# The EVENT-DRIVEN fold path (design/standing-watermark/10): every message that
# lands in a conversation triggers a standing check off the listener path, and
# the check enqueues an event fold only when the accumulator reaches fold_batch
# (200). Off, only the tag path folds — strictly better than pre-bundle, but a
# conversation that never tags Nora stays folded only when tagged.
event_enabled = true
# How many batch folds ONE spawned event fold may perform before stopping —
# the rollup's bound (design/standing-watermark/30). A cold-start backlog folds
# ceil(history / fold_batch) times across messages; this caps how many of those
# happen per spawn, and the next message's check continues.
rollup_max_folds = 5
# S2's ceiling: rebuild the position from the window instead of revising it,
# once this many folds have accumulated SINCE THE LAST REBUILD. The other,
# stronger trigger needs no key — it fires when the previous turn's verdict
# says that turn was not grounded.
#
# This is the WEAKER one deliberately. "Time alone re-derives healthy
# conversations for nothing": the ungrounded case catches the turn that
# actually went wrong, and this only bounds how far drift accumulates when
# nothing does. If nora_standing_rederivations_total comes back dominated by
# trigger="ceiling", the trigger has degraded into a clock wearing a condition
# — look at why the ungrounded case is not firing rather than raising this.
#
# 20 is a starting point, not a measured value.
rebuild_after_folds = 20
# The fold's own timeout, and it bounds the MODEL CALL TWICE — the client is
# built with it, and the fold is wrapped in it. The number that matters is the
# SUM, checked at startup by max_slot_hold_seconds below rather than worked out
# here: this + 5 x store_timeout_seconds.
# This comment used to stop at «[llm] timeout_seconds + this», which is how the
# store calls came to be unbounded — they were not in anyone's sum.
timeout_seconds = 20.0
# The bound on the stage's FIVE STORE CALLS: the trigger's verdict read, the
# prior position, the revised position, the turn verdict, and the note
# proposals. It exists because they had none: the engine sets no
# command_timeout and all of them run while the conversation's slot is HELD, so
# a connection hanging mid-query during the post-reply fold wedged that
# conversation indefinitely, on a turn that had already replied. Small on
# purpose: these are single-row keyed queries, and if one takes seconds the
# honest answer is «unavailable», not a longer wait held in front of the next
# person in the room.
store_timeout_seconds = 5.0
# The WHOLE hold this stage may add to a conversation's slot, checked at
# STARTUP: timeout_seconds + 5 x store_timeout_seconds.
# It is a gate and not a comment because the comment kept being wrong — three
# different arities for this one number have shipped, and the last of them was
# in the validator built to catch exactly that.
#
# THE REAL BOUNDED HOLD IS 45 (20 + 5 x 5), and [llm] timeout_seconds is NOT a
# term in it. That value bounds nothing in this stage: the fold's model call is
# bounded by [standing] timeout_seconds in the client AND by the wait_for around
# the fold, and never by the [llm] figure. Counting it made this read «this
# conversation can be held 165 seconds» when the bound is 45.
#
# **HELD AT 150 FOR ONE DEPLOY, DELIBERATELY, then dropped to 45.** This file is
# BIND-MOUNTED and read at startup; the validator that checks it lives in the
# IMAGE. So between a merge to master and the image that ships with it, the NEW
# config is read by the OLD validator — which still sums [llm] timeout_seconds
# and computes 150. At 45 that combination REFUSES TO START, and the check is
# ungated on `enabled`, so the container survives the merge and dies on its next
# restart naming numbers that appear nowhere in this file.
#
# 150 is accepted by both validators (old: 120 + 20 + 2 x 5 = 150, not over;
# new: 45, not over), which makes the merge safe in ANY order rather than only
# in the intended one. It is a CEILING an operator sets, not a measurement — a
# loose ceiling is true, and this comment is where the real bound is stated.
# `StandingConfig`'s own default is already 45, so a config omitting this key
# gets the tight value; only the shipped files are held.
#
# The follow-up that drops both files to 45 is safe once the image carrying the
# new validator is deployed and read back (cold review, 2026-08-28).
#
# If 45 is too long, the lever is store_timeout_seconds (25s of the total, for
# five single-row keyed queries against a local database) or timeout_seconds,
# not this number.
max_slot_hold_seconds = 150.0
# Empty means `[llm] model`.
model = ""
# The fold's reasoning budget. Empty means inherit [llm] reasoning_effort.
#
# It is DECLARED here rather than inherited silently: the debrief's model
# client never passed this at all, so the fold ran at whatever the provider
# defaults to — an unchosen setting on a call that spends the conversation's
# slot, while the tag path passes its own explicitly.
#
# THE VALUE IS DELIBERATELY NOT CHOSEN. design/dreamer-agent-loop/18-flows.md
# is explicit that the fold's reasoning effort "is a MEASUREMENT, not a
# setting": the fold is integration, not research, so a low budget is
# PLAUSIBLE — and that is exactly the class of claim 09-measurement.md forbids
# asserting. The design names a decidable spike instead: run the same fold at
# several budgets over a fixed set of REAL retained traces and score whether
# the revised position (a) preserves what the prior held and (b) integrates
# what the trace added. Both are checkable by comparison; no judge needed.
# tag_trace is retained precisely so that set exists.
#
# So this key exists to make that spike runnable. Empty is the honest default:
# it says "nobody has measured this yet" rather than inventing a number.
# Legal: none, minimal, low, medium, high, xhigh, max — checked at startup.
# "none" (operator, 2026-08-27). The fold is INTEGRATION — read the prior
# position and the trace, write the revised one — not research, and this is
# the operator choosing the starting point rather than inheriting [llm]'s
# "low" by accident. It remains the thing 18-flows says to MEASURE: the
# spike runs the same fold at several budgets over the retained traces and
