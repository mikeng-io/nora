# Nora configuration (local, real deployment — tracked in git, per-deployment; kept
# out of the image by .dockerignore, mounted read-only into the container by
# docker-compose.yml instead). Paths are relative to this file's own directory so the
# same config works unmodified on the host or in the container (WORKDIR /app mirrors
# this repo's layout).

identity_file = "identity.toml"
policy_file = "policy.toml"

[platforms.signal]
base_url = "http://signal-cli:18080"
account = "+85290000100"         # Nora's Signal number (the linked account)
nora_sender_id = "nora"          # how Nora's own rows are tagged in the audit
enabled = true                   # NOT YET HONOURED — SignalAdapter starts regardless;
                                  # wiring lands with the Phase 4 adapter registry

[memory]
base_url = "http://host.docker.internal:8000"
workspace_id = "nora"

[llm]
base_url = "http://host.docker.internal:20128/v1"   # OmniRoute OpenAI-compatible
api_key_env = "OMNIROUTE_API_KEY"        # env var NAME, never the value

# PINNED to one upstream, not the `nora` combo. The combo fans out per request
# and only ONE of its three upstreams accepts a forced tool_choice while
# thinking is enabled — measured 4/4 each, not sampled:
#
#   deepseek/deepseek-v4-flash       400 "Thinking mode does not support this
#   opencode-go/deepseek-v4-flash    400  tool_choice" (deepseek-ai/DeepSeek-V3#1376)
#   opencode-zen/deepseek-v4-flash   200, and picks the right tool 4/4
#
# So on the combo she was on a coin flip: routed to zen she chained correctly,
# routed to either other she 400'd mid-turn and went silent — showing the group
# ⚠️, which reads as "gave up" rather than "the provider refused the request".
#
# This gives up the alias's benefit of keeping the upstream name out of her
# process (R-18 still blocks model names from replies, so she cannot say it).
# Determinism is worth more than the indirection.
#
# WATCH THIS: zen is the only one of the three that reports no reasoning_tokens
# in usage, which suggests a different — possibly older — build than the other
# two. If that is why it accepts the forced tool_choice, their next update
# could start 400ing with nothing changing here. The version-independent
# fallback is reasoning_effort = "none", which works on all three.
model = "opencode-zen/deepseek-v4-flash"
# The provider's per-CALL ceiling — NOT the turn's budget (see [llm.limits]
# below, which is where the loop's budget lives). Was 4000, an unmeasured
# number that doubled as the loop budget; measured 2026-08-06, the largest
# legitimate completion — reasoning block plus the tool call — was 371 tokens,
# so 2000 is 5.4x headroom.
max_tokens = 2000
temperature = 0.7
# "none" | "low" | "medium" | "high". A tag is one short reply from context she
# already holds — nothing to reason through. Measured on deepseek-v4-flash:
# "none" 4.7s, "low" 9.5s, unset 16.1s, all producing the tool call.
reasoning_effort = "low"
# 30 → 60 (2026-08-07): a REAL photo through MiMo measures 12.9 s in-container
# (1.15 MB, effort=low), and the vision per-call budget derives from THIS value
# — at 30 it computed 9 s, so every real image timed out while the tiny probe
# PNG passed. 60 derives ~18 s per describe: two image reads plus the text
# turns still fit the loop.
timeout_seconds = 60

# The three caps around the WHOLE agent loop for one tag — all measured
# 2026-08-06, all three previously wrong in the same direction.
#
# Real per-call INPUT is 4,952 tokens (doctrine + transcript + tool schemas),
# paid again on every call in the loop, plus whatever the tool results from
# earlier calls added to the context. A measured 6-call turn totalled
# 32,426-36,748 tokens.
#
# At the old total_tokens = 24000 that ceiling was crossed during model call
# FIVE, so `turns = 8` was unreachable dead config: the token cap always bound
# first and the turn count never did. Worse, until R-23 the cut was reported
# byte-identically to the model simply choosing not to answer.
#
# 64000 gives ~2x headroom over the worst measured 6-call turn and lets
# `turns` be the cap that actually binds — which is the one an operator can
# reason about, because a turn is a round trip and a token is not.
[llm.limits]
turns = 8
total_tokens = 64000
# The loop's OUTPUT budget across every call of the turn, deliberately not
# `llm.max_tokens` (which is one call's ceiling). It was literally that number
# until 2026-08-06, so the whole loop could emit what one call could — and
# single calls were measured emitting 3,993 / 3,987 / 3,974 completion tokens,
# i.e. 99.8% of it. 12000 is 6x the per-call ceiling.
output_tokens = 12000

[engagement]
policy = "trigger_text"

[engagement.reactions]
# 👀 while she works, then ✅ (replied) or ⚠️ (failed).
# Off = she writes nothing to the group but replies.
enabled = true

[engagement.queue]
# Per-conversation FIFO depth beyond which an arriving tag is shed as a flood
# (R-29). Bounds runaway growth, not waiting — a queued tag keeps its place
# however long the turn ahead of it takes, and there is no staleness rule.
max_depth = 16

[engagement.trigger]
text = "nora.000"
min_interval_seconds = 5

[store]
# The record store is PostgreSQL (design/20). Its URL is injected by the host
# through the env var named here (DEC-8: name the var, never inline the value),
# not written in this file. `docker compose` sets DATABASE_URL from `.env` to
# `postgresql+asyncpg://nora:…@nora-db/nora`.
database_url_env = "DATABASE_URL"
# On-disk root for media byte custody (DEC-43/47). A Postgres URL has no
# directory, so the media root is its own key; blobs live at `data_dir/media`.
data_dir = "data"
max_per_conversation = 500
context_window = 40

[doctrine]
dir = "nora/doctrine"
reload = "mtime"
strict = true
language_hint = "yue-Hant-HK"          # BCP 47 (RFC 5646): Cantonese, Traditional Han, Hong Kong
canary = "NORA-CANARY-00000000"
display_name = "Nora"

[obs.logging]
level = "INFO"
path = "data/nora.log"
format = "json"

[obs.metrics]
port = 9100

[obs.tracing]
enabled = true
exporter = "otlp_http"                     # console | otlp_http | file
endpoint = "http://host.docker.internal:3100/api/public/otel/v1/traces"
headers_env = "LANGFUSE_OTLP_HEADERS"                      # env var NAME holding OTLP auth headers, never the
                                       # value (DEC-8); only read when exporter = "otlp_http"

[evals.langfuse]
# Verified live 2026-08-05: three datasets (nora-trigger / nora-no-trigger /
# nora-adversarial) with 12 items each, a dataset run, and 60 BOOLEAN scores read
# back from Langfuse. Export ALSO requires `--export-langfuse` on the CLI, so
# enabling here does not make any ordinary `python -m evals.run` talk to the network.
# config.example.toml deliberately keeps this false — a fresh install should not
# assume a Langfuse exists.
enabled = true
host = "http://host.docker.internal:3100"
headers_env = "LANGFUSE_OTLP_HEADERS"

[media]
# Attachment byte custody (DEC-43/47): copy attachment bytes into Nora's own
# content-addressed store, EXIF-stripped and AES-256-GCM encrypted at rest.
# OFF by default and explicitly so — the field defaults to true in code, which
# reads as "on" when it is only off by a missing key. Turned on deliberately:
# set enabled = true AND put a base64 32-byte key in the env var below.
# Turned ON 2026-08-07 (operator): key generated into .env the same day.
# WRITE half: inbound attachment bytes are copied, EXIF-stripped, encrypted.
# READ half: `media_fetch` describes a stored image through MiMo on request.
enabled = true
encryption_key_env = "MEDIA_ENCRYPTION_KEY"
# Reading a stored image back through MiMo-V2.5 (the `media_fetch` tool, DEC-56).
# Inert while enabled=false above; these are the READ half's knobs, all defaulted.
# vision_max_bytes is far below max_bytes on purpose; vision_timeout_seconds is a
# ceiling the tool derives its real per-call budget under (< the loop timeout).
vision_model = "opencode-go/mimo-v2.5"
vision_max_tokens = 1024
vision_reasoning_effort = "low"
vision_max_bytes = 8388608
vision_timeout_seconds = 20.0

[shortener]
# Nora's own n.example.net link shortener (deploy/shortener/, Worker+KV this repo's
# Terraform owns — 2026-08-07). Self-hosted so no third party sees what the
# group routes to; never load-bearing (a failed mint keeps the long URL). The
# mint bearer lives in .env as NORA_SHORTENER_TOKEN (DEC-8).
enabled = true

[route]
# Google Routes v2 — journey planning with arrive_by (DEC-46). Costs money and
# reaches Google, so off-by-default in code; turned ON here because the key is
# provisioned (restricted to Routes+Places+Geocoding, HK$100/mo budget alert).
# R-28 blocks a person's name/position from ever leaving in origin/destination.
enabled = true
api_key_env = "GOOGLE_MAPS_API_KEY"

[presence]
# The Life360 presence collector (design/19). Circles + member ids live entirely
# in identity.toml ([[persons.<id>.life360]] blocks) — this section is id-free.
# Life360 creds are in .env (DEC-8). whereis discloses a member's position only
# into a conversation whose people are a SUBSET of that member's circle (R-21):
# an identity not in the circle simply cannot be located, by design.
enabled = true
cadence_seconds = 90
retention_days = 180
