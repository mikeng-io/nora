# person_id doubles as the Honcho peer id, so it must match ^[a-zA-Z0-9_-]+$.
# Reload is startup-only in v2 — adding a friend requires a restart (Q4).
#
# One [[persons.<id>.<platform>]] block per ACCOUNT (design/10 §3, §3.1). A
# person may hold several accounts on one platform — a dual-SIM personal/work
# pair, a second Discord, a burner Telegram — and they are all the same human,
# so they resolve to the same person_id and share one Honcho peer card (A2).
#
# Inside a block, list whichever id KINDS you actually have for that account;
# Nora matches on any of them. See design/10-preview-identity.toml for the
# fully worked example, including why `display_name` is never accepted here.

[persons.miles]
name = "Miles"

[[persons.miles.signal]]
phone = "+85212345678"

# If you ever rename a [persons.<id>] block's key (the id itself, not just
# `name`), record the old id(s) here so analytics derived from data recorded
# under the old id still resolves to this person instead of splitting into a
# second, orphaned identity (design/27 §1.2). A former id must not also be a
# live person_id, and no two people may claim the same former id — both are
# refused at startup rather than guessed.
#
# former_person_ids = ["miles_old_id"]

# A second account for the SAME person. Once a platform holds two or more, each
# needs a distinct `label`: it is never matched on, it is what
# `nora persons pending` prints back so you can tell them apart.
#
# [[persons.miles.signal]]
# label = "business"
# phone = "+85287654321"

# WhatsApp (design/whatsapp-adoption/): two matchable kinds, `phone` and `lid`
# (nora/domain/identity.py — the vocabulary entry already exists). `phone` is
# the same "+<digits>" shape Signal uses. `lid` is WhatsApp's Linked Identity
# digits (Baileys surfaces many group senders as <digits>@lid instead of a
# phone JID); list BOTH when you have them — `nora persons pending` prints
# whichever form an unmapped sender arrived as.
#
# [[persons.miles.whatsapp]]
# phone = "+85212345678"
# lid   = "60000000000001"

# Instagram (design/instagram-adoption/02-identity-and-policy.md): two matchable
# kinds, `fbid` and `igid`, and they are NOT interchangeable — getting this
# wrong is silent, not loud.
#
# `fbid` is `interop_messaging_user_fbid`: the MESSAGING identity. It is what
# an inbound message's sender carries and what an @-mention carries, so it is
# the one that decides whether Nora heard this person speak or saw them tag
# her. `igid` is the PUBLIC Instagram numeric id — a different number for the
# same person — and it is what the story/profile reads take. List both when you
# have them; neither can be derived from the other.
#
# NOT the @handle. It is renameable, and on Instagram the freed name can be
# taken by somebody else, so indexing it would unmap this person on a rename
# and resolve a stranger AS them. Write it beside the ids as `username` if you
# want the file to stay legible — it is accepted, read by nobody, and matched
# on never.
#
# Both numbers are recoverable without asking anyone: they arrive together on
# every message from a room Nora is already in, and `nora persons pending`
# prints the fbid of any sender it could not map.
#
# [[persons.miles.instagram]]
# username = "example_handle"   # readable, NEVER matched on
# fbid     = "100000000000001"
# igid     = "10000001"
