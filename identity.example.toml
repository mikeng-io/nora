# Who people are: person_id -> the accounts they hold on each platform. Copy to
# `identity.toml`. Read once at startup: adding a person needs a restart.
# policy.toml refers to people by the person_id defined here.
#
# person_id doubles as the Honcho peer id and must match ^[a-zA-Z0-9_-]+$.
#
# One [[persons.<id>.<platform>]] block per ACCOUNT. A person may hold several
# accounts on a platform (dual-SIM, a second Discord, a burner Telegram); all
# resolve to the same person_id and share one peer card. Inside a block, list
# whichever id kinds you have for the account; Nora matches on any of them.

[persons.miles]
name = "Miles"

[[persons.miles.signal]]
phone = "+85212345678"

# Optional. After renaming a [persons.<id>] key, list the old id(s) here so
# data recorded under them still resolves to this person. A former id may not
# also be a live person_id, and no two people may claim the same one; both are
# refused at startup.
#
# former_person_ids = ["miles_old_id"]

# Optional. The social stream's off switch. Everyone listed in a group room of
# policy.toml is a member whose Instagram story, posts and reels the poller
# ([social.poll] in config.toml) reads; `social = false` takes this person out,
# on every network. Default true. It does not stop instagram_read answering a
# question somebody asks about them.
#
# social = false

# A second account for the same person. Once a platform holds two or more, each
# needs a distinct `label`. It is never matched on; `nora persons pending`
# prints it so you can tell them apart.
#
# [[persons.miles.signal]]
# label = "business"
# phone = "+85287654321"

# WhatsApp: matchable kinds are `phone` ("+<digits>", as Signal) and `lid`
# (WhatsApp Linked Identity digits; many group senders arrive as <digits>@lid
# instead of a phone JID). List both when you have them. `nora persons pending`
# prints whichever form an unmapped sender arrived as.
#
# [[persons.miles.whatsapp]]
# phone = "+85212345678"
# lid   = "60000000000001"

# Instagram: matchable kinds are `fbid` and `igid`. They are different numbers
# for the same person and neither can be derived from the other. List both;
# a swapped or missing id fails silently (no error, the match just never happens).
#
# `fbid` is the messaging identity (interop_messaging_user_fbid): what inbound
# messages and @-mentions carry. `igid` is the public numeric Instagram id, used
# by story and profile reads.
#
# The @handle is never matched: it can be renamed and the freed name taken by
# someone else. `username` is accepted for readability and ignored.
#
# Both ids arrive on every message from a room Nora is already in, and
# `nora persons pending` prints the fbid of any sender it could not map.
#
# [[persons.miles.instagram]]
# username = "example_handle"   # readable, never matched on
# fbid     = "100000000000001"
# igid     = "10000001"

# ─────────────────────────────────────────────────────────────────────────────
# WORKSPACE BINDINGS (DEC-214). Retiring with Honcho. policy.toml's
# [units.<unit>] puts each unit in a Nora workspace; this maps a Nora workspace
# to the Honcho workspace holding its person models.
#
# Optional per workspace: with no table here, the Nora workspace name is used as
# the Honcho workspace id. Startup refuses if two Nora workspaces bind to one
# Honcho workspace, or if a binding exists while policy.toml has no [units]
# (the implicit workspace is bound to config.toml's honcho.workspace_id).
#
# A bound Honcho workspace must be Nora's own (carrying her `nora_owner`
# marker) or absent or empty, which she claims. An unmarked workspace that
# already holds sessions makes startup fail; pick another id (a `nora-` prefix keeps
# them apart). config.toml's honcho.workspace_id is exempt.
#
# [workspaces.home]
# honcho_workspace = "nora"     # keep an existing Honcho workspace and its history
# [workspaces.work]
# honcho_workspace = "nora-work"
