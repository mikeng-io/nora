# WHO AND WHERE NORA ANSWERS. Copy to `policy.toml` (gitignored).
#
# Separate from config.toml (deploy cadence) and identity.toml (changes when a
# human joins) because policy changes when TRUST changes. An allowlist buried
# among port numbers is an allowlist nobody reviews.
#
# People are named by person_id from identity.toml, never by phone number. One
# consequence worth knowing up front: a person_id covers EVERY account that
# person holds, so allowlisting `miles` admits his work number too.

# Deny by default. An empty file means nothing is allowed, and Nora REFUSES TO
# START rather than running mute: under R-5 she is silent when broken, so a
# silently-denied Nora is indistinguishable from a working one.
default = "deny"

# ─────────────────────────────────────────────────────────────────────────────
# 1. DMs — a direct message has no stable conversation id; its identity IS the
#    person, which is why this is its own list.
#
#    FORWARD-LOOKING: the Signal parser still drops every non-group message
#    ("DM — out of scope in v2"), so this section is validated but not yet
#    reachable. Nora warns at startup if it is non-empty.
[dm]
persons = ["miles"]        # [] means Nora accepts no DMs at all.

# ─────────────────────────────────────────────────────────────────────────────
# 2. CONVERSATIONS — which rooms she participates in, and who within them.
#
#    `id` is the canonical conversation_id exactly as it appears in the audit
#    DB. Run `nora groups` to print every group's name beside its id; that is
#    the answer to "I cannot tell which id is which group".
#
#    `nora groups` IS SIGNAL-ONLY. It reads signal-cli's directory, so it
#    cannot name a Discord guild or channel. For Discord, turn on Developer
#    Mode in the client and use Copy Server ID / Copy Channel ID. (A Discord
#    sender you have not mapped yet still shows up in `nora persons pending`
#    once they have spoken — as a bare snowflake, since the name lookup is
#    Signal-only too.)
#
#      signal    groupId, base64
#      telegram  chat.id, stringified int (negative for groups)
#      discord   "<guild_id>/<channel_id>" — the adapter flattens the hierarchy
#      whatsapp  group JID, ...@g.us

#    `workspace` is the SOCIAL UNIT a room belongs to (DEC-105) — the same
#    people reachable in more than one place. It is the boundary `send_to`
#    may never cross: "tell the Signal lot" from Discord resolves to the
#    Signal room of THIS workspace and nothing else. A workspace holds at
#    most one room per platform, which is what makes naming the platform a
#    usable address; two would refuse rather than guess. Defaults to "nora",
#    so a single-group deployment needs nothing here.

[[conversations]]
platform  = "signal"
id        = "Q2hhdEdyb3VwSWRFeGFtcGxlQmFzZTY0PT0="
workspace = "family"         # paired with the Discord room below
label     = "Family"          # for humans reading this file. NEVER matched on —
                             # group names are not unique and are trivially
                             # changed by anyone in the group.
persons  = ["miles", "ada"]   # only these two may trigger Nora here. A new group
                             # member is ignored until you add them.
tools    = []                # MCP servers this room may use, e.g. ["pulse"].
                             # Empty means none, same deny-by-default as everything
                             # else here.
# location = true            # (default false) relax where_is's disclosure gate for
                             # THIS room: normally Nora refuses to say where someone
                             # is unless the room is a subset of their Life360 circle.
                             # Set true when you trust the mapped people here with the
                             # circle's positions even though they aren't all in it.
                             # It is a WHOLE-ROOM switch (DEC-79): accounts you have no
                             # identity.toml entry for stop blocking it too — real groups
                             # keep silent sealed-sender members you cannot map at all.
                             # The one thing it never relaxes: if Nora cannot READ the
                             # roster, she still refuses. Trust overrules what a roster
                             # says, never the absence of one.
# relevance_gate = true        # (default false) opt THIS room into the Relevance Gate
                             # (design/dreamer-agent-loop/36): an untagged message here
                             # may be judged, once per quiet-closed window, on whether it
                             # deserves Nora's attention. Being allowed to answer when
                             # tagged has never implied being allowed to speak unprompted
                             # — the two are separate grants, and this one additionally
                             # requires `[relevance_gate] enabled = true` in config.toml
                             # (shipped off, and shipped in shadow mode even when on).

# Discord: the guild and the channel, flattened into one id. The GUILD IS NOT
# allowlistable on its own — being invited to a server grants technical reach,
# never ambient presence, so every channel is listed explicitly.
[[conversations]]
platform  = "discord"
id        = "100000000000000203/100000000000000204"
workspace = "family"         # the same humans as the Signal group above
label     = "Zone 42 #general"
persons  = ["miles", "ada"]
# location = true            # same switch as Signal, same meaning — see below.

# WhatsApp (design/whatsapp-adoption/): the id is the group JID exactly as the
# bridge reports it, `...@g.us`. Find it in the audit DB or in the bridge's
# logs once the room has spoken. 1:1 chats (`...@s.whatsapp.net`) are
# DENY-BY-DEFAULT this phase — listing one here admits it, and the DM study
# owns whether that becomes supported, so don't until it lands.
# [[conversations]]
# platform  = "whatsapp"
# id        = "176569000000000000@g.us"
# workspace = "family"         # same humans again — the workspace is the unit
# persons  = ["miles", "ada"]
# tools/location stay omitted here: deny-by-default, same as every new room.

[[conversations]]
platform = "telegram"
id       = "-1001234567890"
also_ids = ["-987654321"]    # Telegram CHANGES chat.id when a group becomes a
                             # supergroup, reporting the old id once. Without
                             # this the allowlist silently stops matching and
                             # Nora goes quiet — invisible under R-5.
label    = "Work"
persons  = "*"               # anyone in this chat, including someone Nora
                             # cannot name. The room is the trust boundary you
                             # drew. An unmapped sender is still never fed to
                             # Honcho (D6) — they are answered, not remembered.
                             # An explicit list excludes them instead, since
                             # an unmapped sender matches no person_id.

# ─────────────────────────────────────────────────────────────────────────────
# NOT SUPPORTED, deliberately:
#
#   roles  = ["family"]   -> arbitrary named roles exist only on Discord.
#   admins = true         -> would grant on membership status.
#
# Membership IS normalised in the domain to exactly two values (admin | member),
# but policy does not GRANT on it: "is this sender an admin?" is a per-message
# platform lookup on the path that must not stall the SSE reader, and granting
# by membership hands authorisation to whoever can promote an admin, so this
# file would stop being a complete description of who has access.
