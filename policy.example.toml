# Who and where Nora answers. Copy to `policy.toml` (gitignored). Read once at
# startup: a change needs a restart.
#
# People are named by person_id from identity.toml, never by phone number. A
# person_id covers EVERY account that person holds, so allowlisting `miles`
# admits his work number too.

# Deny by default. An empty file allows nothing, and Nora refuses to start
# rather than run mute.
default = "deny"

# ─────────────────────────────────────────────────────────────────────────────
# 1. DMs. Optional. A direct message has no stable conversation id; its identity
#    is the person, so it has its own list.
#
#    Not yet reachable: the Signal parser drops every non-group message. The
#    section is validated, and Nora warns at startup if it is non-empty.
[dm]
persons = ["miles"]        # person_ids. [] means no DMs.

# ─────────────────────────────────────────────────────────────────────────────
# 2. CONVERSATIONS. Which rooms she participates in, and who within them.
#    Anything not listed is denied.
#
#    `id` is the canonical conversation_id as it appears in the audit DB:
#
#      signal    groupId, base64
#      telegram  chat.id, stringified int (negative for groups)
#      discord   "<guild_id>/<channel_id>"
#      whatsapp  group JID, ...@g.us
#
#    `nora groups` prints each Signal group's name beside its id. It is
#    Signal-only. For Discord, enable Developer Mode and use Copy Server ID /
#    Copy Channel ID. An unmapped Discord sender appears in
#    `nora persons pending` as a bare snowflake once they have spoken.
#
#    `unit` (default "nora") is the social unit a room belongs to: the same
#    people reachable in more than one place (DEC-105). `send_to` never crosses
#    a unit, so "tell the Signal lot" from Discord resolves to the Signal room
#    of the same unit. A unit holds at most one room per platform; two refuse
#    to start (DEC-214). A single-group deployment needs no `unit`. Units map
#    to workspaces, see section 3.

[[conversations]]
platform  = "signal"
id        = "Q2hhdEdyb3VwSWRFeGFtcGxlQmFzZTY0PT0="
unit = "family"         # shared with the Discord room below
label     = "Family"          # For humans reading this file. Never matched on:
                             # group names are not unique and anyone in the
                             # group can change them.
persons  = ["miles", "ada"]   # Only these may trigger Nora here. A new group
                             # member is ignored until added.
tools    = []                # MCP servers this room may use, e.g. ["pulse"].
                             # Empty means none.
# location = true            # (default false) Relax where_is's disclosure gate
                             # for this room. Normally Nora will not say where
                             # someone is unless the room is a subset of their
                             # Life360 circle. Set true when you trust the
                             # mapped people here with the circle's positions.
                             # Applies to the whole room (DEC-79), including
                             # accounts with no identity.toml entry. It never
                             # overrides a roster Nora cannot read: then she
                             # still refuses.
# home_room = true             # (default false) The room Nora acts from when she
                             # acts for the unit unprompted. The proactive
                             # pass's roster-gated reads (`where_is`, `about`,
                             # `ask_memory`, `group_members`) resolve through
                             # it, its `location` flag applies as on a tag, and
                             # proactive rows fire into it. Exactly one per
                             # unit; a second is a startup error. Without a
                             # home room there is no proactive pass.
# proactive = true             # (default false) Allow proactive rows to fire
                             # in this room. Those rows belong to Nora's own
                             # peer id, which is nobody in identity.toml, so
                             # `persons` cannot admit them. Only meaningful on
                             # the home room.
# relevance_gate = true        # (default false) Opt this room into the Relevance
                             # Gate: an untagged message may be judged, once
                             # per quiet-closed window, on whether it deserves
                             # Nora's attention. Separate from answering when
                             # tagged. Also needs `[relevance_gate] enabled =
                             # true` in config.toml (off by default, and shadow
                             # mode even when on).

# Discord: guild and channel flattened into one id. The guild is not
# allowlistable on its own; list every channel explicitly.
[[conversations]]
platform  = "discord"
id        = "100000000000000203/100000000000000204"
unit = "family"         # same people as the Signal group above
label     = "Zone 42 #general"
persons  = ["miles", "ada"]
# voice = true               # (optional, default false) Every voice channel in
                             # this room's guild speaks into this room. 「喂 Nora」
                             # said in any of them is transcribed and recorded
                             # as a message here, under this room's `persons`
                             # gate. Voice is a surface of a room, not a room of
                             # its own: the guild is matched and the channel is
                             # kept as provenance only. At most one room per
                             # guild may set it (a second is a startup error). A
                             # guild with none refuses speech (400).
# music_channel = "1480387369830973999"
                             # (optional, no default) Where this guild's system
                             # music announcements go: 「Now playing:」,
                             # 「Autoplaying:」, the next track after a skip,
                             # connection-lost teardown. A sibling channel in
                             # this room's server, as a bare channel id: 17-20
                             # digits, not 「<guild>/<channel>」 and not a name.
                             # It may not be a channel this file lists (startup
                             # error), and at most one room per server may set
                             # it. A channel from another server falls back and
                             # logs at send time.
                             #
                             # Unset, announcements go to whichever text channel
                             # the session's first play ran in, kept across
                             # restarts, and `/music play` is gated by server,
                             # not room, so that can be an unlisted channel.
                             #
                             # Moves system announcements only. Slash commands
                             # reply where typed; conversational replies land in
                             # the room she was tagged in.
# location = true            # same switch as Signal, same meaning
description = "a games room; 2200 is when people log on, not an appointment"
                             # (optional, no default) What kind of room this is,
                             # in your words. `label` is the name; this is what
                             # the room is for, what its regular shorthand
                             # means, and what a stranger reading a week of it
                             # would misread. Rendered verbatim above the
                             # message batch as context for background passes,
                             # never as an instruction. One or two plain
                             # sentences about the room, not about Nora. Omit
                             # if you have nothing to say. Also reaches the
                             # proactive pass, via the home room's `<presence>`
                             # block.

# WhatsApp: `id` is the group JID as the bridge reports it, `...@g.us`. Find it
# in the audit DB or the bridge logs once the room has spoken. 1:1 chats
# (`...@s.whatsapp.net`) are denied by default; listing one here admits it, so
# do not.
# [[conversations]]
# platform  = "whatsapp"
# id        = "152099000000000000@g.us"
# unit = "family"         # same people again
# persons  = ["miles", "ada"]
# tools and location are omitted: denied by default.

[[conversations]]
platform = "telegram"
id       = "-1001234567890"
also_ids = ["-987654321"]    # Extra ids matched as this room. Telegram changes
                             # chat.id when a group becomes a supergroup;
                             # without the old id the allowlist stops matching
                             # and Nora goes silent.
label    = "Work"
persons  = "*"               # Anyone in this chat, including senders Nora cannot
                             # name. They are answered, never remembered. An
                             # explicit list excludes unmapped senders.

# ─────────────────────────────────────────────────────────────────────────────
# Not supported: granting by role (`roles = [...]`) or by admin status
# (`admins = true`). Policy grants only on person_id, so this file stays a
# complete description of who has access.

# ─────────────────────────────────────────────────────────────────────────────
# 3. UNITS -> WORKSPACES (DEC-214). Optional. Hierarchy: workspace > unit > room.
#    Retiring with Honcho; the unit becomes the only boundary.
#
#    A workspace holds one or more units. Units in one workspace share one
#    person-model, each unit is its own scope inside it, and recall for a unit
#    comes from that unit's rooms. Different workspaces share nothing: use one
#    when a group's people must not share memory with another's.
#
#    With no [units] table, every unit is in one implicit workspace bound to
#    config.toml's `memory.workspace_id`. Once the table exists it must name
#    every unit a room uses, and no unit without a room.
#
#    The Honcho workspace a Nora workspace maps to is set in identity.toml's
#    [workspaces.<name>], not here.
#
# [units.family]
# workspace = "home"
